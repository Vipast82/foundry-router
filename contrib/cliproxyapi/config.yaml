# Minimal CLIProxyAPI config for use behind Foundry. Copy next to the compose
# file. Full reference: config.example.yaml in the CLIProxyAPI repo.
config-version: 8

server:
  host: ""            # all interfaces; restrict with a firewall to Foundry's host
  port: 8317

management:
  # Foundry reads usage windows from the management API with this key (set
  # the same value as the backend's management_key in Foundry). If Foundry
  # runs on another host, set allow-remote: true and firewall port 8317 to
  # Foundry's address only.
  allow-remote: false
  secret-key: "change-me-management-key"

# Keys CLIENTS (Foundry) must send. Put the same value in Foundry's backend
# api_key. These are NOT provider keys.
access:
  api-keys:
    - "change-me-foundry-key"
