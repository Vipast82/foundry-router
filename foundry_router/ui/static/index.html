// Host Admin: one tab, a backend dropdown, and controls that adapt to the
// selected backend's FLAVOR. Ollama flavors get full model CRUD; openai-dialect
// flavors (llama.cpp / Unsloth / vLLM / OpenAI) get read-only diagnostics.
const _FLAVOR_LABEL = {ollama: "Ollama", llamacpp: "llama.cpp", meridian: "Meridian",
                       unsloth: "Unsloth", vllm: "vLLM", openai: "OpenAI",
                       cliproxyapi: "CLIProxyAPI"};
async function tabHostAdmin() {
  clearInterval(window._ollamaPoll);
  const d = await api("host/backends");
  const bes = d.backends || [];
  if (!bes.length) {
    $("#main").innerHTML = `<h2>Host Admin</h2>
      <p class="hint">No manageable backend is configured. Add an Ollama or an
      openai-compatible backend (llama.cpp / Unsloth / vLLM) on the
      <b>Backends → Pool</b> tab — set its <code>flavor</code> — then manage or
      inspect it here.</p>`;
    return;
  }
  if (!window._hostBackend || !bes.find(b => b.name === window._hostBackend))
    window._hostBackend = bes[0].name;
  const be = window._hostBackend;
  const cur = bes.find(b => b.name === be) || bes[0];

  // Shared backend selector row (both panels render it, so the dropdown is
  // always present for the onchange handler bound at the end).
  const selector = hint => {
    const beOpts = bes.map(b =>
      `<option ${b.name === be ? "selected" : ""}>${esc(b.name)}</option>`).join("");
    const flav = _FLAVOR_LABEL[cur.flavor] || cur.flavor;
    return `<div class="row"><label>backend</label><select id="host-be">${beOpts}</select>
      <span class="pill" title="server software behind the wire protocol — drives the admin surface">${esc(flav)}</span>
      ${cur.flavor === "ollama"
          ? (cur.version ? `<span class="pill ok" title="Ollama server version (/api/version)">Ollama v${esc(cur.version)}</span>`
                         : '<span class="pill warn" title="/api/version unreachable">version ?</span>')
          : `<span class="pill ${cur.healthy ? "ok" : "warn"}">${cur.healthy ? "healthy" : "unverified"}</span>${cur.version ? ` <span class="pill ok" title="Server version / build">${esc(cur.version)}</span>` : ""}`}
      <span class="hint">${hint}</span></div>`;
  };

  if (cur.flavor === "ollama") await hostRenderOllama(be, d, selector);
  else await hostRenderDiag(cur, selector);

  $("#host-be").onchange = e => { window._hostBackend = e.target.value; render(); };
}

// -- read-only diagnostics panel (llama.cpp / Unsloth / vLLM / OpenAI) --------
async function hostRenderDiag(cur, selector) {
  const note = {
    llamacpp: "Plain <span class='mono'>llama-server</span> is read-only over HTTP — one model per process. Model add/switch/delete needs the separate <b>llama-swap</b> proxy (auto-detected: its resident models are shown below and on the Live tab).",
    unsloth: "Unsloth serves chat (OpenAI + Anthropic compatible). Loading a model is a host CLI, not a REST call, so there is nothing to add or delete over HTTP.",
    vllm: "vLLM is read-only over HTTP — it serves the model(s) it was launched with. Engine metrics (KV cache, queue, preemptions, TTFT/TPOT) also appear live on Dashboard → Live.",
    openai: "Generic OpenAI-compatible endpoint — read-only model listing.",
    cliproxyapi: "CLIProxyAPI subscription proxy — models from every signed-in account (ChatGPT/Codex, Claude Code, Gemini…). Accounts, sign-ins and quotas are managed in CLIProxyAPI's own panel (<span class='mono'>/management.html</span>).",
    meridian: "Meridian (Claude via the Claude Code SDK) — read-only: its /health (sign-in, plan, version, tool mode) and /metrics (requests, queue, TTFT, upstream latency). Sign-in and re-auth are under Backends → Pool → Meridian.",
  }[cur.flavor] || "";
  $("#main").innerHTML = `
    <h2 style="display:flex;align-items:center">Host Admin — diagnostics ${help(cur.flavor === "vllm" ? "host_vllm" : cur.flavor === "llamacpp" ? "host_llamacpp" : "")}</h2>
    ${selector("Read-only — these servers expose no model CRUD over HTTP.")}
    ${note ? `<p class="hint">${note}</p>` : ""}
    ${cur.flavor === "unsloth" ? `<div class="card">
      <h2 style="margin-top:0">Load a model (host CLI)</h2>
      <p class="hint">There is no REST load endpoint — run this on the Unsloth host:</p>
      <pre class="mono" style="white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px">unsloth run --model &lt;model-name&gt;:&lt;variant&gt;</pre></div>` : ""}
    <div id="host-diag"><p class="hint">probing…</p></div>`;
  try {
    const r = await api("host/diag?backend=" + encodeURIComponent(cur.name));
    $("#host-diag").innerHTML = r.ok ? renderDiagReport(r.report)
      : `<p class="hint"><span class="pill bad">error</span> ${esc(r.error)}</p>`;
  } catch (e) {
    $("#host-diag").innerHTML = `<p class="hint"><span class="pill bad">error</span> ${esc(e.message)}</p>`;
  }
}

function renderDiagReport(rep) {
  const card = (title, inner, tip) => `<div class="card"><h2 style="margin-top:0"${tip ? ` title="${esc(tip)}"` : ""}>${title}</h2>${inner}</div>`;
  const errLine = e => `<p class="hint"><span class="pill bad">unreachable</span> ${esc(e || "no response")}</p>`;
  const gb = b => b ? (b / 1073741824).toFixed(1) + " GB" : "—";
  const bn = n => n ? (n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : (n / 1e6).toFixed(0) + "M") : "—";
  const yes = v => v ? '<span class="pill ok">yes</span>' : '<span class="hint">no</span>';
  let html = "";
  if (rep.health) {
    const h = rep.health;
    html += card("Health", h.ok
      ? `<span class="pill ok">ok</span> <span class="mono">${esc(typeof h.body === "string" ? h.body : JSON.stringify(h.body))}</span>`
      : errLine(h.error || ("HTTP " + h.status_code)), "GET /health — the server is up and the model is loaded");
  }
  if (rep.version) {
    const v = rep.version;
    html += card("Version", v.ok ? `<span class="pill ok">vLLM ${esc(v.version || "?")}</span>` : errLine(v.error), "GET /version");
  }
  if (rep.swap && rep.swap.is_swap) {
    html += card("llama-swap — resident models (/running)", rep.swap.running.length
      ? `<table><tr><th>model</th><th title="llama-swap process state">state</th></tr>${rep.swap.running.map(r =>
          `<tr><td class="mono">${esc(r.model)}</td><td>${esc(r.state || "")}</td></tr>`).join("")}</table>`
      : '<p class="hint">nothing loaded — the next request for a configured model will start it</p>',
      "llama-swap starts/stops llama-server processes per model on demand");
  }
  if (rep.props) {
    const p = rep.props;
    const mods = p.modalities || {}, caps = p.chat_template_caps || {};
    const samp = p.sampling_defaults || {};
    html += card("Loaded model — /props", p.ok
      ? `<table>
          <tr><th>model</th><td class="mono">${esc(p.model_path || "?")}</td></tr>
          <tr><th title="Context per slot — the most one request can use">context (n_ctx / slot)</th><td class="mono">${esc(p.n_ctx ?? "?")}</td></tr>
          <tr><th title="Parallel request slots (-np)">slots</th><td class="mono">${esc(p.total_slots ?? "?")}</td></tr>
          ${p.build_info ? `<tr><th>build</th><td class="mono">${esc(p.build_info)}</td></tr>` : ""}
          <tr><th title="Multimodal projector loaded (--mmproj)">vision / audio</th><td>${yes(mods.vision)} / ${yes(mods.audio)}</td></tr>
          <tr><th title="The chat template declares tool support — needs --jinja">tool calling</th><td>${Object.keys(caps).length ? yes(caps.supports_tools || caps.supports_tool_calls) : '<span class="hint">unknown (older build)</span>'}</td></tr>
          <tr><th>chat template</th><td>${p.chat_template_present ? "present" : "—"}</td></tr>
          ${Object.keys(samp).length ? `<tr><th title="Server-side defaults; per-request values from personas / clients override them">default sampling</th><td class="mono">${Object.entries(samp).map(([k, v]) => `${esc(k)}=${esc(Array.isArray(v) ? v.join(";") : v)}`).join(" · ")}</td></tr>` : ""}
         </table>`
      : errLine(p.error));
  }
  if (rep.slots) {
    const s = rep.slots;
    html += card(`KV slots — /slots${s.ok && s.count ? ` (${s.busy}/${s.count} busy)` : ""}`, s.ok
      ? (s.count ? `<table><tr><th>id</th><th>state</th><th title="Context size of this slot">n_ctx</th><th title="Tokens decoded so far for the current request">decoded</th><th title="Speculative decoding active on this slot">spec</th></tr>${s.slots.map(x =>
          `<tr><td class="mono">${esc(x.id)}</td><td>${x.busy ? '<span class="pill warn">busy</span>' : '<span class="pill ok">idle</span>'}</td>
            <td class="mono">${esc(x.n_ctx || "")}</td><td class="mono">${esc(x.n_decoded || 0)}</td><td>${x.speculative ? "yes" : ""}</td></tr>`).join("")}</table>`
          : `<p class="hint">no slots reported</p>`)
      : errLine((s.error || "") + " — /slots may be disabled (--no-slots)"));
  }
  if (rep.models) {
    const m = rep.models, det = m.details || (m.models || []).map(id => ({id}));
    const hasCtx = det.some(d => d.max_model_len || d.n_ctx_train), hasSize = det.some(d => d.size || d.n_params),
          hasStatus = det.some(d => d.status);
    html += card(`Models — /v1/models${m.ok ? " (" + m.models.length + ")" : ""}`, m.ok
      ? (det.length ? `<table><tr><th>id</th>${hasCtx ? '<th title="vLLM max_model_len, or llama.cpp trained context (n_ctx_train)">context</th>' : ""}${hasSize ? '<th>params</th><th title="Weights file size">size</th>' : ""}${hasStatus ? "<th>status</th>" : ""}</tr>${det.map(x =>
          `<tr><td class="mono">${esc(x.id)}${x.parent ? ` <span class="hint">(LoRA of ${esc(x.parent)})</span>` : ""}</td>
            ${hasCtx ? `<td class="mono">${esc(x.max_model_len || x.n_ctx_train || "—")}</td>` : ""}
            ${hasSize ? `<td class="mono">${bn(x.n_params)}</td><td class="mono">${gb(x.size)}</td>` : ""}
            ${hasStatus ? `<td>${esc(x.status || "")}</td>` : ""}</tr>`).join("")}</table>`
          : `<p class="hint">no models reported</p>`)
      : errLine(m.error));
  }
  if (rep.metrics) {
    const mt = rep.metrics;
    html += card("Metrics — /metrics", mt.ok
      ? `${renderServers([{...(mt.summary || {}), backend: rep.backend, flavor: rep.flavor, metrics_ok: true}])}
         <details><summary>raw engine series (${Object.keys(mt.metrics || {}).length})</summary>
         ${Object.keys(mt.metrics || {}).length ? `<table>${Object.entries(mt.metrics).map(([k, v]) =>
          `<tr><th class="mono">${esc(k)}</th><td class="mono">${esc(v)}</td></tr>`).join("")}</table>` : '<p class="hint">none</p>'}</details>`
      : errLine(mt.error));
  }
  return html || `<p class="hint">no diagnostics available for this flavor</p>`;
}

// -- full Ollama model-management panel (CRUD via the Ollama REST API) --------
async function hostRenderOllama(be, d, selector) {
  let models = [], loaded = [], tagErr = "";
  try {
    const t = await api("ollama/tags?backend=" + encodeURIComponent(be));
    if (t.ok) { models = t.models || []; loaded = t.loaded || []; } else tagErr = t.error;
  } catch (e) { tagErr = e.message; }
  const isLoaded = nm => loaded.includes(nm);

  const gb = n => n ? (n / 1e9).toFixed(2) + " GB" : "";
  const nameOf = m => m.name || m.model || "";
  const modelRows = models.map(m => {
    const nm = nameOf(m), det = m.details || {};
    return `<tr>
      <td class="mono">${esc(nm)}${isLoaded(nm) ? ' <span class="pill ok" title="resident in VRAM now">⚡ loaded</span>' : ""}</td>
      <td class="nw">${gb(m.size)}</td>
      <td class="nw">${esc(det.parameter_size || "")}</td>
      <td class="nw">${esc(det.quantization_level || "")}</td>
      <td class="nw">
        <button class="act" onclick='ollShow(${JSON.stringify(nm)})'>show</button>
        <button class="act" onclick='ollCopy(${JSON.stringify(nm)})'>copy</button>
        <button class="act" onclick='ollRename(${JSON.stringify(nm)})'>rename</button>
        <button class="act" onclick='ollPush(${JSON.stringify(nm)})'>push</button>
        <button class="act" onclick='ollDelete(${JSON.stringify(nm)})'>delete</button>
      </td></tr>`;
  }).join("");

  $("#main").innerHTML = `
    <h2>Host Admin — Ollama model management</h2>
    ${selector("Add / pull / copy / rename / delete models directly on this Ollama host via its REST API.")}
    ${tagErr ? `<p class="hint"><span class="pill bad">unreachable</span> ${esc(tagErr)}</p>` : ""}
    <div id="oll-jobs"></div>
    <h2>Installed models (${models.length})</h2>
    <table><tr><th>model</th><th>size</th><th>params</th><th>quant</th><th></th></tr>${modelRows}</table>
    <pre id="oll-detail" class="mono" style="display:none;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:340px;overflow:auto"></pre>

    <div class="card">
      <h2 style="margin-top:0">Pull a model</h2>
      <div class="row"><label>model name</label>
        <input id="oll-pull" size="30" placeholder="e.g. llama3.1:8b">
        <button class="act primary" id="oll-pull-btn">Pull</button></div>
      <p class="hint">Downloads from the Ollama registry onto this host. Large models take a while — progress shows above.</p>
    </div>

    <div class="card">
      <h2 style="margin-top:0">Create a model (pseudo-model)</h2>
      <div class="row"><label>new name</label><input id="oll-cr-name" size="22" placeholder="my-assistant:latest">
        <label>from (base)</label><input id="oll-cr-from" size="22" placeholder="llama3.1:8b"></div>
      <div class="row"><label>system prompt</label>
        <textarea id="oll-cr-sys" rows="2" placeholder="You are..."></textarea></div>
      <details><summary>advanced: raw Modelfile (overrides the fields above)</summary>
        <textarea id="oll-cr-file" rows="4" placeholder="FROM llama3.1:8b
SYSTEM You are a helpful assistant."></textarea></details>
      <div class="row"><button class="act primary" id="oll-cr-btn">Create</button>
        <span class="hint">Bakes a system prompt/params into a named model. A raw Modelfile is parsed into Ollama's structured create fields (FROM → from, SYSTEM, PARAMETER…). Needs a FROM/base.</span></div>
    </div>`;

  window.ollShow = async name => {
    const el = $("#oll-detail");
    try {
      const r = await api("ollama/show", {method: "POST", body: {backend: be, model: name}});
      if (!r.ok) { toast(r.error, true); return; }
      const i = r.info || {};
      el.style.display = "block";
      el.textContent = name + "\n\n"
        + (i.details ? "details: " + JSON.stringify(i.details, null, 2) + "\n\n" : "")
        + (i.parameters ? "parameters:\n" + i.parameters + "\n\n" : "")
        + (i.template ? "template:\n" + i.template + "\n\n" : "")
        + (i.system ? "system:\n" + i.system + "\n\n" : "")
        + (i.modelfile ? "modelfile:\n" + i.modelfile : "");
      el.scrollIntoView({behavior: "smooth", block: "nearest"});
    } catch (e) { toast(e.message, true); }
  };
  const act = async (path, body, okMsg) => {
    try {
      const r = await api("ollama/" + path, {method: "POST", body});
      if (r.ok) { toast(okMsg); render(); } else toast(r.error, true);
    } catch (e) { toast(e.message, true); }
  };
  window.ollCopy = name => {
    const dst = prompt("Copy '" + name + "' to a new (pseudo) name:", name.replace(/:.*/, "") + "-copy");
    if (dst) act("copy", {backend: be, source: name, destination: dst}, "Copied to " + dst);
  };
  window.ollRename = name => {
    const dst = prompt("Rename '" + name + "' to (copy + delete original):", name);
    if (dst && dst !== name) act("rename", {backend: be, source: name, destination: dst}, "Renamed to " + dst);
  };
  window.ollDelete = name => {
    if (confirm("Permanently DELETE '" + name + "' from " + be + "? This removes the model files from the host."))
      act("delete", {backend: be, model: name}, "Deleted " + name);
  };
  window.ollPush = async name => {
    if (!confirm("Push '" + name + "' to the Ollama registry? Requires the host to be logged in and a namespaced name (user/model).")) return;
    try { await api("ollama/push", {method: "POST", body: {backend: be, model: name}}); toast("Push started"); pollJobs(); }
    catch (e) { toast(e.message, true); }
  };
  $("#oll-pull-btn").onclick = async () => {
    const m = $("#oll-pull").value.trim(); if (!m) { toast("model name required", true); return; }
    try { await api("ollama/pull", {method: "POST", body: {backend: be, model: m}}); toast("Pull started"); pollJobs(); }
    catch (e) { toast(e.message, true); }
  };
  $("#oll-cr-btn").onclick = async () => {
    const name = $("#oll-cr-name").value.trim(); if (!name) { toast("new name required", true); return; }
    try {
      await api("ollama/create", {method: "POST", body: {backend: be, model: name,
        from: $("#oll-cr-from").value.trim(), system: $("#oll-cr-sys").value,
        modelfile: $("#oll-cr-file").value}});
      toast("Create started"); pollJobs();
    } catch (e) { toast(e.message, true); }
  };

  function renderJobs(jobs) {
    const el = $("#oll-jobs"); if (!el) return;
    jobs = (jobs || []).filter(j => j.backend === be);
    if (!jobs.length) { el.innerHTML = ""; return; }
    el.innerHTML = `<div class="card"><h2 style="margin-top:0">Tasks</h2>` + jobs.map(j => {
      const cls = j.state === "error" ? "bad" : j.state === "done" ? "ok" : "warn";
      const txt = j.state === "running"
        ? esc(j.status_text || "working") + " · " + (j.percent || 0) + "%"
        : esc(j.state) + (j.error ? " — " + esc(j.error) : "");
      return `<div class="row"><span class="pill ${cls}">${esc(j.op)}</span>
        <span class="mono">${esc(j.model)}</span><span class="hint">${txt}</span></div>`;
    }).join("") + `</div>`;
  }
  function pollJobs() {
    clearInterval(window._ollamaPoll);
    window._ollamaPoll = setInterval(async () => {
      if (current !== "Host Admin") { clearInterval(window._ollamaPoll); return; }
      try {
        const j = await api("ollama/jobs");
        renderJobs(j.jobs);
        if (!(j.jobs || []).some(x => x.state === "running")) clearInterval(window._ollamaPoll);
      } catch (e) { /* transient */ }
    }, 1500);
  }
  renderJobs(d.jobs);
  if ((d.jobs || []).some(j => j.state === "running")) pollJobs();
}

const _ENGINES = ["google", "bing", "startpage", "duckduckgo", "brave", "wikipedia", "qwant", "mojeek"];
async function tabResearch() {
  const [cfg, mcp, md] = await Promise.all([api("config"), api("mcp_servers"), api("models")]);
  const r = ((cfg.registry || {}).research) || {};
  const search = r.search || {}, fetch = r.fetch || {};
  // Research/extraction model picker: any reachable chat model, or the routing
  // brain (empty). A stronger, larger-context model extracts benchmarks far
  // better than the small brain — the #1 lever on research quality. A bad pick
  // can't stall the sweep (the agent falls back to the brain on failure).
  const modelOpts = ['<option value="">— use routing brain (default) —</option>']
    .concat((md.models || []).filter(m => m.reachable && !m.embedding)
      .map(m => `<option ${m.id === r.model ? "selected" : ""}>${esc(m.id)}</option>`)).join("");
  const srvOpts = sel => ['<option value=""></option>'].concat(
    (mcp.servers || []).map(s => `<option ${s.name === sel ? "selected" : ""}>${esc(s.name)}</option>`)).join("");
  const active = new Set(((r.search_prefix || "").match(/!(\w+)/g) || []).map(b => b.slice(1).toLowerCase()));
  const engineBoxes = _ENGINES.map(e => `<label class="mcp-item" style="min-width:118px">
      <input type="checkbox" class="eng" value="${e}" ${active.has(e) ? "checked" : ""}>
      <span class="mono">${e}</span>${(e === "brave" || e === "duckduckgo")
        ? ' <span class="pill warn" title="walls automated scraping — Brave 429s, DuckDuckGo CAPTCHAs">risky</span>' : ""}
    </label>`).join("");
  const numField = (id, val, min, step) =>
    `<input id="${id}" type="number" min="${min}" ${step ? `step="${step}"` : ""} value="${val}" size="8">`;
  $("#main").innerHTML = `
    <h2>Research settings</h2>
    <p class="hint">The background Research Agent that fills model benchmarks / tags / good-for.
      Changes apply live — no restart. Use <b>Test search+fetch</b> to confirm your
      SearXNG + Crawl4AI path works end-to-end.</p>
    <div class="card">
      <div class="row"><label>enabled</label><input type="checkbox" id="re-enabled" ${r.enabled ? "checked" : ""}></div>
      <div class="row"><label title="Model that reads the fetched pages and extracts benchmarks/tags. The routing brain is small; pointing this at a larger, longer-context reachable model markedly improves extraction quality (and lets you raise corpus_chars). A failure/timeout on the picked model falls back to the brain automatically — it can't stall the sweep.">research model</label>
        <select id="re-model" style="min-width:280px">${modelOpts}</select>
        <span class="hint">the extractor — bigger = better research; falls back to brain on failure</span></div>
      <div class="row"><label title="Prepended to every research search. Checking engines here restricts SearXNG to them via bang syntax and excludes the rest.">search engines</label>
        <div class="mcp-checklist" style="flex-direction:row;flex-wrap:wrap;max-height:none;min-width:0">${engineBoxes}</div></div>
      <div class="row"><label title="What actually gets prepended. The checkboxes write this; you can also type your own bangs.">search_prefix (raw)</label>
        <input id="re-prefix" size="46" value="${esc(r.search_prefix || "")}" placeholder="!google !bing !startpage">
        <span class="hint">checkboxes edit this — or type directly</span></div>
      <div class="row">
        <label>sweep_hours</label>${numField("re-sweep", r.sweep_hours ?? 24, 1)}
        <label>stale_days</label>${numField("re-stale", r.stale_days ?? 14, 1)}
        <label title="Fetch attempts per model (ranked best-first)">max_pages</label>${numField("re-pages", r.max_pages_per_model ?? 8, 1)}
        <label title="Chars of corpus fed to the extractor LLM">corpus_chars</label>${numField("re-corpus", r.corpus_char_limit ?? 24000, 1000, 1000)}
        <label title="num_ctx the research model is LOADED with (Ollama). 0 = auto: just enough to fit corpus_chars + the reply. Set it to match a persona's context_window when this model is SHARED with a worker persona, so the sweep doesn't reload it smaller and thrash. Capped at the model's trained max.">context_window</label>${numField("re-ctx", r.context_window ?? 0, 0, 1024)}
        <span class="hint">0 = auto (fit corpus)</span></div>
      <div class="row">
        <label title="Chars kept from EACH fetched page. Long HuggingFace model cards carry benchmark tables past the default 8000 — raise this (with corpus_chars) when scores are visibly on a page but not extracted.">page_chars</label>${numField("re-pagecap", r.page_char_cap ?? 8000, 1000, 1000)}
        <label title="Chars kept from EACH search-result blob. Pages carry the real tables, so keep this smaller than page_chars.">snippet_chars</label>${numField("re-snip", r.search_snippet_chars ?? 2500, 500, 500)}
        <span class="hint">deeper fetch = raise corpus_chars + max_pages together</span></div>
      <div class="row" style="align-items:flex-start">
        <label title="Extra search queries appended to the 7 built-ins. One per line. Use {name} for the model. More/targeted queries surface more candidate pages before ranking spends the fetch budget.">extra queries</label>
        <textarea id="re-xq" rows="3" style="min-width:340px;font-family:var(--mono)" placeholder="{name} specs hardware requirements&#10;{name} LiveCodeBench AIME GPQA results&#10;{name} site:huggingface.co">${esc((r.extra_queries || []).join("\n"))}</textarea>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">

          <button type="button" class="act" style="padding:1px 7px;font-size:11px" title="Append a freshness set for brand-new model drops: release announcement, technical report, official card, comparisons, fast aggregators, LocalLLaMA." onclick="fillQueries('newdrop')">⊕ New drop</button>
          <button type="button" class="act" style="padding:1px 7px;font-size:11px" title="Clear the extra queries." onclick="fillQueries('clear')">✕</button>
        </div>
        <span class="hint">one per line · {name} = model<br>presets append (deduped)</span></div>
      <details style="margin:2px 0 6px"><summary class="hint" style="cursor:pointer">tips for deeper research ▾</summary>

          <li><b>Get the tables:</b> raise <span class="mono">page_chars</span> so long model cards aren't truncated before their benchmark section.</li>
          <li><b>Widen sources:</b> add targeted <b>extra queries</b> (spec pages, specific benchmark names, <span class="mono">site:huggingface.co</span>). Known benchmark hosts (HuggingFace, aireleasetracker, yottalabs, livecodebench, swebench, artificialanalysis…) are fetched first automatically.</li>
          <li><b>Search engines:</b> the checkboxes above restrict SearXNG to reliable engines (google/bing/startpage) and exclude scraping-walled ones (Brave/DDG). More engines = more candidate URLs.</li>
          <li><b>Tools:</b> research uses your <b>search</b> + <b>fetch</b> MCP tools (SearXNG + Crawl4AI). Crawl4AI's <span class="mono">md</span> tool gives the cleanest tables; confirm the tool names below with <b>Test search+fetch</b>.</li>
        </ul></details>
      <div class="row"><label>search tool</label>
        <select id="re-s-srv">${srvOpts(search.server)}</select>
        <input id="re-s-tool" size="20" placeholder="tool (searxng_web_search)" value="${esc(search.tool || "")}">
        <input id="re-s-qp" size="10" placeholder="query param" value="${esc(search.query_param || "query")}"></div>
      <div class="row"><label>fetch tool</label>
        <select id="re-f-srv">${srvOpts(fetch.server)}</select>
        <input id="re-f-tool" size="20" placeholder="tool (md)" value="${esc(fetch.tool || "")}">
        <input id="re-f-up" size="10" placeholder="url param" value="${esc(fetch.url_param || "url")}"></div>
      <div class="row">
        <button class="act primary" id="re-save">Save research settings</button>
        <button class="act" id="re-test">Test search+fetch ▶</button>
        <span id="re-test-out" class="hint"></span></div>
    </div>`;
  const syncPrefix = () => {
    $("#re-prefix").value = [...document.querySelectorAll(".eng:checked")].map(b => "!" + b.value).join(" ");
  };
  document.querySelectorAll(".eng").forEach(b => b.onchange = syncPrefix);
  $("#re-save").onclick = () => run(api("config/research", {method: "POST", body: {
    enabled: $("#re-enabled").checked,
    model: $("#re-model").value,
    search_prefix: $("#re-prefix").value,
    sweep_hours: +$("#re-sweep").value, stale_days: +$("#re-stale").value,
    max_pages_per_model: +$("#re-pages").value, corpus_char_limit: +$("#re-corpus").value,
    context_window: +$("#re-ctx").value,
    page_char_cap: +$("#re-pagecap").value, search_snippet_chars: +$("#re-snip").value,
    extra_queries: $("#re-xq").value,
    search: {server: $("#re-s-srv").value, tool: $("#re-s-tool").value, query_param: $("#re-s-qp").value || "query"},
    fetch: {server: $("#re-f-srv").value, tool: $("#re-f-tool").value, url_param: $("#re-f-up").value || "url"}}}));
  $("#re-test").onclick = async () => {
    const out = $("#re-test-out"); out.textContent = "testing… (up to 60s)";
    try {
      const t = await api("research/test", {method: "POST"});
      const parts = [t.search_ok ? `✓ search — ${t.urls_found} URL(s)` : `✗ search: ${t.search_error}`];
      if (t.search_ok) parts.push(t.fetch_ok ? "✓ fetch" : (t.urls_found ? `✗ fetch: ${t.fetch_error}` : "— no URLs to fetch"));
      out.innerHTML = `<span class="pill ${t.ok ? "ok" : "bad"}">${t.ok ? "ok" : "issue"}</span> ${esc(parts.join(" · "))}`;
      out.title = t.sample || "";
    } catch (e) { out.innerHTML = `<span class="pill bad">error</span> ${esc(e.message)}`; }
  };
}

/* ----------------------------------------------------------------- usage -- */
function quotaCard(q) {
  const pill = k => {
    if (k.fable_scoped)
      return k.used >= q.thresholds.conserve_fable_at
        ? '<span class="pill bad">Fable conserved — use Opus</span>' : "";
    if (k.used >= q.thresholds.conserve_strong_at)
      return '<span class="pill bad">Haiku/local only</span>';
    if (k.used >= q.thresholds.conserve_premium_at)
      return '<span class="pill warn">Opus+ conserved</span>';
    return "";
  };
  // sources.oauth null is NOT an auth failure — Meridian skips the usage fetch
  // for non-Max plans. The real fix is to pull Anthropic's /api/oauth/usage
  // directly (works on Pro) by setting a usage profile, NOT re-login.
  const alerts = q.backends.filter(b => b.oauth_ok === false).map(b =>
    `<div class="row"><span class="pill warn">usage unavailable</span>
     <span>${esc(b.backend)}: Meridian isn't reporting the Anthropic usage window
     (it skips this for non-Max plans). Claude still works — this is not an auth
     problem. To get the real 5h/weekly window (Pro included), set a
     <b>usage profile</b> under Backends → Meridian re-authentication → Auth
     companion service; Foundry then reads Anthropic's usage directly.</span></div>`);
  const credits = q.backends.filter(b => b.credits_used_usd !== null && b.credits_used_usd !== undefined)
    .map(b => `<div class="row"><label>${esc(b.backend)} · purchased credits</label>
     <b>$${b.credits_used_usd.toFixed(2)} used</b>
     <span class="hint">extra usage beyond the plan windows (last-resort policy)</span></div>`);
  const lines = q.backends.flatMap(b => {
    const when = k => { try { return k.resets_at ? new Date(k.resets_at).toLocaleString(undefined, {weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit"}) : ""; } catch (e) { return k.resets_hhmm || ""; } };
    const out = (b.buckets || []).filter(k => k.used !== null && k.used !== undefined).map(k =>
      `<div class="row"><label>${esc(b.backend)} · ${esc(k.label)} window</label>
       <b${k.contradicted ? ' style="text-decoration:line-through"' : ""}>${Math.round(k.used * 100)}% used</b>
       ${k.rolled_over ? `<span class="hint" title="The last usage report is from before this window reset; it refreshes on the next Claude call.">reset ${esc(when(k))} — fresh window</span>`
         : k.resets_at ? `<span class="hint" title="${esc(k.resets_at)}">resets ${esc(when(k))}</span>` : ""}
       ${k.contradicted ? '<span class="pill warn" title="The usage source says this window is exhausted, but a Claude call just succeeded — Foundry ignores this reading until the source reports a new value.">stale — ignored</span>' : pill(k)}
       ${k.source ? `<span class="hint" title="legacy = Anthropic's per-window fields; limits = the newer limits list the Claude app shows">${esc(k.source)}</span>` : ""}
      </div>`);
    if (b.raw) out.push(`<details class="row"><summary class="hint">raw usage payload — ${esc(b.raw.source)} · ${esc(_tsLabel(b.raw.at))}</summary>
      <pre class="mono" style="max-height:260px;overflow:auto;font-size:11px">${esc(JSON.stringify(b.raw.data, null, 2))}</pre></details>`);
    // Observed-exhaustion / hard-unavailable state must be visible even when
    // the quota endpoint reports no buckets (the blind-sources case).
    if (b.available === false) {
      out.push(`<div class="row"><label>${esc(b.backend)}</label>
        <span class="pill bad">window unavailable</span>
        <span class="hint">${esc(b.note || "")}</span></div>`);
    }
    return out;
  });
  const o5 = q.observed.last_5h || {}, o7 = q.observed.last_7d || {};
  return `<div class="card">
    <h2 style="margin-top:0">Claude usage window (live from Meridian)</h2>
    ${alerts.join("")}${credits.join("")}
    ${lines.join("") || `<p class="hint">${q.backends.length
      ? "no usage signal yet (fresh window, or quota endpoint returned no buckets)"
      : "no Claude/subscription backend configured"}</p>`}
    <p class="hint">Observed through this router: ${o5.calls ?? 0} Claude calls /
    ${(o5.prompt_tokens ?? 0) + (o5.completion_tokens ?? 0)} tokens in the last 5h ·
    ${o7.calls ?? 0} calls / ${(o7.prompt_tokens ?? 0) + (o7.completion_tokens ?? 0)} tokens in 7d.
    Above ${Math.round(q.thresholds.conserve_premium_at * 100)}% the router conserves the premium tier;
    above ${Math.round(q.thresholds.conserve_strong_at * 100)}% only the cheapest Claude tier or local.</p>
  </div>`;
}

function subUsageCard(su) {
  const bes = (su && su.backends) || [];
  if (!bes.length) return "";
  const left = s => s == null ? "" : s >= 86400 ? `resets in ${Math.floor(s / 86400)}d ${Math.floor(s % 86400 / 3600)}h`
    : s >= 3600 ? `resets in ${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m` : `resets in ${Math.max(0, Math.floor(s / 60))}m`;
  const rows = bes.flatMap(b => {
    if (!b.ok) return [`<div class="row"><label>${esc(b.backend)}</label>
      <span class="pill warn">${b.configured ? "usage unavailable" : "not configured"}</span>
      <span class="hint">${esc(b.error || "")}${b.configured ? "" : " — add management_key (CLIProxyAPI's management.secret-key) to this backend"}</span></div>`];
    if (!b.accounts.length) return [`<div class="row"><label>${esc(b.backend)}</label><span class="hint">no signed-in accounts</span></div>`];
    return b.accounts.flatMap(a => {
      const who = `${esc(b.backend)} · ${a.provider === "codex" ? "ChatGPT" : "Claude"}${a.plan ? " " + esc(a.plan) : ""}${a.label ? " · " + esc(a.label) : ""}`;
      if (a.disabled) return [`<div class="row"><label>${who}</label><span class="pill">disabled</span></div>`];
      if (!a.windows.length) return [`<div class="row"><label>${who}</label>
        ${a.unavailable ? '<span class="pill bad">unavailable (cooling down)</span>' : ""}
        <span class="hint">no usage reading yet — it arrives with the next request through CLIProxyAPI</span></div>`];
      return a.windows.map(w => `<div class="row"><label>${who} · ${esc(w.name)}</label>
        <b>${Math.round(w.used)}% used</b>
        ${w.used >= b.limit_pct ? `<span class="pill bad">at limit — not used</span>` : w.used >= b.limit_pct - 15 ? '<span class="pill warn">near limit</span>' : ""}
        <span class="hint">${esc(left(w.resets_in_s))}${a.age_s != null ? ` · reading ${fmtDur(a.age_s * 1000)} old` : ""}${w.used !== w.reported ? " · window reset since the reading" : ""}</span></div>`);
    });
  });
  return `<div class="card">
    <h2 style="margin-top:0">Subscription usage (CLIProxyAPI)</h2>
    ${rows.join("")}
    <div class="row"><label title="A ChatGPT/Claude model behind CLIProxyAPI is not used once any usage window covering it reaches this %, so persona cascades move on (e.g. GPT → Claude → local) before the plan runs out. Per-backend override: usage_limit_pct.">stop using at</label>
      <input id="su-limit" type="number" min="1" max="100" style="width:70px" value="${su.limit_pct}"> %
      <button id="su-save">Save</button> <button id="su-refresh" title="Re-read CLIProxyAPI's management API now">Refresh</button></div>
    <p class="hint">Readings are the usage headers ChatGPT / Claude sent with the last request through CLIProxyAPI, so they refresh as requests flow; a window past its reset time counts as reset.</p>
  </div>`;
}

function bindSubUsageCard() {

// Budget ledger monitor (budget.py): what every client used, where each
// figure comes from, the shared rules and pause switches.
function budgetCard(b) {
  if (!b) return "";
  const n = v => v == null ? '<span class="hint">unknown</span>' : Number(v).toLocaleString();
  const calls = c => c === 1 ? "call" : "calls";
  const tok = a => `${n(a.input_tokens)} in / ${n(a.output_tokens)} out`;
  const paused = new Set((b.pauses || []).map(p => p.scope + "|" + p.value));
  const pauseBtn = (scope, value) => {
    const on = paused.has(scope + "|" + value);
    return `<button class="act" title="${on ? "Resume" : "Pause"} every model call for this ${scope}. Paused calls are refused (never sent elsewhere)." onclick='budgetPause(${JSON.stringify(scope)}, ${JSON.stringify(value)}, ${!on})'>${on ? "resume" : "pause"}</button>${on ? ' <span class="pill bad">paused</span>' : ""}`;
  };
  const left = s => s == null ? "" : s >= 86400 ? `${Math.floor(s / 86400)}d ${Math.floor(s % 86400 / 3600)}h` : s >= 3600 ? `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m` : `${Math.max(0, Math.floor(s / 60))}m`;
  const win = w => {
    const cls = w.used_pct >= 85 ? "bad" : w.used_pct >= 70 ? "warn" : "";
    const reset = w.resets_in_s != null ? ` · resets in ${left(w.resets_in_s)}` : w.resets_at ? ` · resets ${esc(String(w.resets_at).slice(5, 16).replace("T", " "))}` : "";
    return `<div class="nw"><span class="meter ${cls}"><span style="width:${Math.min(100, w.used_pct)}%"></span></span> ${esc(w.name)} <b>${w.used_pct}%</b><span class="hint" style="margin:0">${reset}</span></div>`;
  };
  const acctRows = (b.accounts || []).map(a => `<tr>
    <td class="nw mono">${esc(a.account)}${a.plan ? ` <span class="pill">${esc(a.plan)}</span>` : ""}</td>
    <td class="nw">${esc(a.kind)}</td>
    <td>${a.provider_windows ? a.provider_windows.map(win).join("") + `<div class="hint" style="margin:0">${esc(a.provider_source || "")}${a.provider_age_s != null ? " · " + fmtDur(a.provider_age_s * 1000) + " old" : ""}</div>`
          : a.kind === "local" ? '<span class="hint">—</span>' : `<span class="hint">unknown${a.provider_error ? " — " + esc(a.provider_error) : ""}</span>`}</td>
    <td class="nw">${n(a.measured_5h.calls)} ${calls(a.measured_5h.calls)}<div class="hint" style="margin:0">${tok(a.measured_5h)}</div></td>
    <td class="nw">${n(a.measured_7d.calls)} ${calls(a.measured_7d.calls)}<div class="hint" style="margin:0">${tok(a.measured_7d)}${a.measured_7d.quota_errors ? ` · <span style="color:var(--bad)">${a.measured_7d.quota_errors} quota errors</span>` : ""}</div></td>
    <td class="nw">${a.image_jobs_5h == null ? '<span class="hint">—</span>' : `${a.image_jobs_5h} (5 h) · ${a.image_jobs_24h} (24 h)`}</td>
    <td class="nw">${Object.entries(a.foundry_caps || {}).map(([k, v]) => `${esc(k.replace("call_budget_", ""))}: ${v}`).join(" · ") || '<span class="hint">—</span>'}</td>
    <td class="nw">${a.kind === "local" ? pauseBtn("backend", a.backend) : pauseBtn("account", a.account)}</td></tr>`).join("");
  const active = (b.active || []).map(c => `<span class="pill warn" title="${esc(c.client_id)} · ${esc(c.task_id || c.session_id || "")}">${esc(c.persona || c.model)} · ${esc(c.backend)} · ${c.seconds}s</span>`).join(" ");
  const ruleRows = (b.rules || []).map(r => {
    const lim = [r.max_calls ? `${r.max_calls} calls` : "", r.max_tokens ? `${Number(r.max_tokens).toLocaleString()} tokens` : "",
                 r.max_concurrent ? `${r.max_concurrent} in flight` : "", r.max_active ? `${r.max_active} active ${r.active_by} (idle ${r.idle_seconds}s)` : ""].filter(Boolean).join(" · ");
    const span = (r.max_calls || r.max_tokens) ? (r.window_minutes ? ` per ${r.window_minutes >= 60 ? (r.window_minutes / 60) + " h" : r.window_minutes + " min"}` : " in total") : "";
    const use = r.usage.groups.slice(0, 4).map(g => `${esc(g.group)}: ${g.calls}${r.max_calls ? "/" + r.max_calls : ""} ${calls(r.max_calls || g.calls)}${r.max_tokens ? ", " + g.tokens.toLocaleString() + " tok" : ""}`).join("<br>") || '<span class="hint">no calls yet</span>';
    return `<tr><td class="nw"><b>${esc(r.name)}</b>${r.enabled ? "" : ' <span class="pill">off</span>'}${r.mode === "observe" ? ' <span class="pill warn" title="logs what it would deny, denies nothing">observe</span>' : ""}</td>
      <td class="mono bw-wide" style="white-space:normal">${esc(JSON.stringify(r.match))}${r.per ? ` · per ${esc(r.per)}` : " · shared"}</td>
      <td class="bw-mid">${esc(lim + span)}</td>
      <td class="bw-mid">${use}${r.usage.in_flight ? `<div class="hint" style="margin:0">${r.usage.in_flight} in flight</div>` : ""}${r.max_active && r.usage.active_helpers.length ? `<div class="hint" style="margin:0">active: ${esc(r.usage.active_helpers.join(", "))}</div>` : ""}</td></tr>`;
  }).join("");
  const breakdown = (rows, scope) => rows.length ? `<table><tr><th>${scope}</th><th>calls 24 h</th><th>5 h</th><th>paid</th><th>tokens</th><th>errors</th><th></th></tr>${rows.map(r => `<tr>
      <td class="nw">${esc(r.name)}</td><td>${r.calls}</td><td>${r.calls_5h}</td><td>${r.paid_calls}</td>
      <td class="nw">${tok(r)}</td><td>${r.errors}${r.quota_errors ? ` <span class="hint" style="margin:0">(${r.quota_errors} quota)</span>` : ""}</td>
      <td class="nw">${r.name === "(none)" ? "" : pauseBtn(scope, r.name)}</td></tr>`).join("")}</table>` : '<p class="hint">No calls in the last 24 h.</p>';
  const denials = (b.denials || []).map(d => `<tr><td class="mono nw">${esc(new Date(d.ts * 1000).toISOString().slice(11, 19))}</td>
    <td class="nw">${d.status === "observed" ? '<span class="pill warn">would deny</span>' : '<span class="pill bad">denied</span>'} ${esc(d.rule || "")}</td>
    <td class="nw">${esc(d.client || "")} · ${esc(d.persona || d.model || "")}</td><td class="bw-wide" style="white-space:normal">${esc(d.detail || "")}</td></tr>`).join("");
  const otherPauses = (b.pauses || []).filter(p => p.scope !== "account" && p.scope !== "backend");
  const t = b.totals;
  return `<div class="card">
    <h2 style="margin-top:0">Budgets &amp; usage <span class="hint" style="font-weight:normal">every client, every call</span> ${b.enabled ? "" : '<span class="pill bad">enforcement off</span>'}</h2>
    <div class="row"><span class="stat" style="margin-left:0">last 5 h <b>${n(t["5h"].calls)} ${calls(t["5h"].calls)}</b></span>
      <span class="stat">${tok(t["5h"])}</span>
      <span class="stat">24 h <b>${n(t["24h"].calls)} ${calls(t["24h"].calls)}</b></span>
      <span class="stat">retries <b>${t.retries_24h}</b></span>
      <span class="stat">errors <b>${t["24h"].errors}</b>${t["24h"].quota_errors ? ` (${t["24h"].quota_errors} quota)` : ""}</span>
      <span class="stat">denied <b>${t.denied_24h}</b></span>
      ${t.observed_24h ? `<span class="stat">would deny <b>${t.observed_24h}</b></span>` : ""}</div>
    <div class="row"><label>in flight now</label>${active || '<span class="hint">nothing</span>'}</div>
    <h3>Accounts</h3>
    <table><tr><th>account</th><th>kind</th><th title="${esc(b.sources.provider)}">plan usage (provider-reported)</th><th title="${esc(b.sources.measured)}">measured 5 h</th><th>measured 7 d</th><th>image jobs</th><th title="call_budget_5h / call_budget_daily on the backend">Foundry caps</th><th></th></tr>${acctRows}</table>
    <p class="hint">Measured = ${esc(b.sources.measured)}. Provider-reported = ${esc(b.sources.provider)}. ${esc(b.sources.estimate)}.</p>
    <h3>Rules</h3>
    <table><tr><th>rule</th><th>covers</th><th>limit</th><th>current use</th></tr>${ruleRows || '<tr><td colspan="4" class="hint">no rules</td></tr>'}</table>
    <details><summary style="cursor:pointer">Edit rules (JSON)</summary>
      <p class="hint">Each rule: name, match {backend, persona, client, account, model: glob or list; paid: true/false}, per (client | persona | session | task | request | backend | account), window_minutes (0 = no window), max_calls, max_tokens, max_concurrent, max_active + active_by + idle_seconds, wait_seconds, mode (enforce | observe), enabled. See docs/BUDGETS.md.</p>
      <textarea id="bg-rules" rows="10" style="width:100%" class="mono">${esc(JSON.stringify((b.rules || []).map(r => { const {usage, ...rest} = r; return rest; }), null, 2))}</textarea>
      <div class="row"><input type="checkbox" id="bg-enabled" ${b.enabled ? "checked" : ""}><label for="bg-enabled">enforce budgets</label>
        <button class="act primary" onclick="saveBudgetRules()">Save rules</button></div>
    </details>
    <h3>By client (24 h)</h3>${breakdown(b.by_client || [], "client")}
    <h3>By persona (24 h)</h3>${breakdown(b.by_persona || [], "persona")}
    ${otherPauses.length ? `<h3>Paused</h3>${otherPauses.map(p => `<div class="row"><span class="pill bad">${esc(p.scope)} ${esc(p.value)}</span> <span class="hint">since ${esc((p.paused_at || "").slice(0, 16))}</span> <button class="act" onclick='budgetPause(${JSON.stringify(p.scope)}, ${JSON.stringify(p.value)}, false)'>resume</button></div>`).join("")}` : ""}
    <h3>Denials (24 h)</h3>
    ${denials ? `<table><tr><th>time (UTC)</th><th>rule</th><th>who</th><th>detail</th></tr>${denials}</table>` : '<p class="hint">None.</p>'}
  </div>`;
}

function bindMediaCard() {
  const save = $("#md-save");
  if (!save) return;
  save.onclick = async () => {
    try {
      await api("config/media", {method: "POST", body: {
        enabled: $("#md-enabled").checked, mcp_tools: $("#md-mcp").checked,
        backend: $("#md-backend").value, default_model: $("#md-final").value.trim(),
        draft_model: $("#md-draft").value.trim(), models: $("#md-models").value,
        jobs_per_5h: +$("#md-5h").value, jobs_per_day: +$("#md-day").value,
        client_jobs_per_day: +$("#md-client").value, max_concurrent: +$("#md-conc").value}});
      toast("Image settings saved"); render();
    } catch (e) { toast(e.message, true); }
  };
  // Thumbnails go through fetch (it carries the admin key); <img src> can't.
  document.querySelectorAll("img.media-thumb[data-src]").forEach(async img => {
    try {
      const k = _adminKey();
      const r = await fetch("/admin/api/" + img.dataset.src, {headers: k ? {Authorization: "Bearer " + k} : {}});
      if (!r.ok) return;
      const url = URL.createObjectURL(await r.blob());
      img.src = url; img.removeAttribute("data-src");
      img.onclick = () => window.open(url, "_blank");
    } catch (e) {}
  });
}

async function cancelMediaJob(id) {

// ms -> compact human string (244478 ms reads awful; "4m 4s" doesn't).
function fmtDur(ms) {
  if (ms == null) return "";
  if (ms >= 60000) return `${Math.floor(ms / 60000)}m ${Math.round((ms % 60000) / 1000)}s`;
  if (ms >= 1000) return `${(ms / 1000).toFixed(1)}s`;
  return `${ms} ms`;
}

// A request's mode, made legible. "direct"/"passthrough" both mean Foundry did
// NOT run its brain or its own MCP tools, so they're flagged, not left cryptic.
function modeBadge(m) {
  if (m === "direct")
    return `<span class="pill warn" title="The client (e.g. AnythingLLM @agent) sent its own tools. Foundry forwarded them to one model and did NOT use its own MCP servers, tool loop, or routing brain.">direct · client tools</span>`;
  if (m === "passthrough")
    return `<span class="pill warn" title="A raw backend model was requested by name — no Foundry routing.">passthrough</span>`;
  return `<span class="nw">${esc(m || "")}</span>`;
}

    <td class="nw">${pct(r.shape_pass_rate)}${delta(r.shape_delta == null ? null : Math.round(r.shape_delta * 100))}</td>
    <td class="nw">${r.avg_judge_score == null ? "—" : r.avg_judge_score.toFixed(1) + "/10"}${delta(r.judge_delta)}</td>
    <td><span class="pill ${r.status === "done" ? "ok" : r.status === "failed" ? "bad" : "warn"}">${esc(r.status)}</span></td>
    <td><button class="act" onclick="showEvalResults(${r.id})">details</button></td>
    </tr>`).join("");
  const promptRows = ed.prompts.map(p => `<tr>
    <td class="nw">${esc(p.category)} ${p.enabled ? "" : '<span class="pill warn">off</span>'}</td>
    <td>${esc(p.prompt)}</td>
    <td class="mono">${esc(p.checks || "[]")}</td>
    <td class="nw"><button class="act" onclick="editEvalPrompt(${p.id})">edit</button>
      <button class="act" onclick='run(api("eval/prompts/delete",{method:"POST",body:{id:${p.id}}}))'>delete</button></td>
    </tr>`).join("");
  $("#main").innerHTML = `
    <h2>Eval harness — score a persona's real routing output</h2>
    <p class="hint">Runs the category's test prompts through the persona's actual routing path.
      Shape checks are deterministic pass/fail (code block present, source cited, valid JSON,
      no refusal, length bounds — never exact match); the optional judge model scores 0-10.
      <b>Convention:</b> run this after any persona/prompt change and report the Δ with the change
      (see docs/CONVENTIONS.md). Paid judges pass the normal guardrail ladder.</p>
    <div class="card">
      <div class="row">
        <label>persona</label><select id="ev-persona">${personaOpts}</select>
        <label>judge_model</label><select id="ev-judge">${judgeOpts}</select>
        <button class="act primary" id="ev-run">Run eval</button>
        <span class="hint">runs in the background — the table below updates as it finishes</span>
      </div>
    </div>
    <h2>Run history — trend per persona, newest first</h2>
    <table><tr><th>time (UTC)</th><th>persona</th><th>judge</th><th>prompts</th>
      <th>shape pass (Δ pts)</th><th>judge score (Δ)</th><th>status</th><th></th></tr>
      ${runRows || '<tr><td colspan="8" class="hint">no runs yet</td></tr>'}</table>
    <div id="ev-detail"></div>
    <h2>Test prompts — fixed set, freely editable</h2>
    <table><tr><th>category</th><th>prompt</th><th>checks</th><th></th></tr>${promptRows}</table>
    <div class="card">
      <h2 style="margin-top:0" id="ep-title">Add / edit test prompt</h2>
      <input type="hidden" id="ep-id" value="">
      <div class="row"><label>category</label>
        <select id="ep-cat"><option>coding</option><option>chat</option>
          <option>research</option><option>rag</option></select>
        <label>enabled</label><input type="checkbox" id="ep-on" checked></div>
      <div class="row"><label>prompt</label><input id="ep-prompt" size="90"></div>
      <div class="row"><label title="JSON list. Available: code_block, cites_source, valid_json, no_refusal, min_length:N, max_length:N, mentions:word">checks</label>
        <input id="ep-checks" data-multi="json" data-options="evalChecks" value='["no_refusal"]' placeholder="pick checks; min_length:N etc. can be typed"></div>
      <div class="row"><button class="act primary" id="ep-save">Save prompt</button></div>
    </div>`;
  window._evalPrompts = Object.fromEntries(ed.prompts.map(p => [p.id, p]));
  $("#ev-run").onclick = () => run(api("eval/run", {method: "POST", body: {
    persona: $("#ev-persona").value, judge_model: $("#ev-judge").value}}));
  $("#ep-save").onclick = () => run(api("eval/prompts", {method: "POST", body: {
    id: $("#ep-id").value ? +$("#ep-id").value : null,
    category: $("#ep-cat").value,
    prompt: $("#ep-prompt").value,
    checks: JSON.parse($("#ep-checks").value || "[]"),
    enabled: $("#ep-on").checked ? 1 : 0}}));
  window.editEvalPrompt = id => {
    const p = window._evalPrompts[id]; if (!p) return;
    $("#ep-title").textContent = "Edit prompt #" + id;
    $("#ep-id").value = id;
    $("#ep-cat").value = p.category;
    $("#ep-on").checked = !!p.enabled;
    $("#ep-prompt").value = p.prompt;
    $("#ep-checks").value = p.checks || "[]";
  };
  window.showEvalResults = async id => {
    const d = await api("eval/results?run_id=" + id);
    $("#ev-detail").innerHTML = `<div class="card">
      <h2 style="margin-top:0">Run #${id} — per-prompt results</h2>
      <table><tr><th>prompt</th><th>chars</th><th>shape</th><th>checks</th>
        <th>judge</th><th>notes</th><th>time</th></tr>
      ${d.results.map(r => `<tr>
        <td>${esc(r.prompt)}</td><td>${r.response_chars}</td>
        <td><span class="pill ${r.shape_pass ? "ok" : "bad"}">${r.shape_pass ? "pass" : "fail"}</span></td>
        <td class="mono">${esc(r.shape_detail || "")}</td>
        <td>${r.judge_score == null ? "—" : r.judge_score.toFixed(1)}</td>
        <td>${esc(r.judge_notes || "")}</td>
        <td class="nw">${fmtDur(r.duration_ms)}</td></tr>`).join("")}</table></div>`;
  };
  // Live-ish: while a run is in flight, refresh so scores appear as they land.
  if (rd.runs.some(r => r.status === "running"))
    setTimeout(() => { if (current === "Evals") render(); }, 4000);
}

async function tabUsage() {
  const [d, q, ce, su, md, bg] = await Promise.all([
    api("usage?limit=100"), api("quota"), api("tool_calls?executed_code=1&limit=50"),
    api("subscription-usage").catch(() => null), api("media?limit=20").catch(() => null),
    api("budgets").catch(() => null)]);
  const reqs = d.requests || [];

  // ---- Code-execution audit (the sandbox's strongest audit trail) ---------------
  const codeCalls = ce.tool_calls || [];
  const codeCard = codeCalls.length ? `<div class="card" style="border-left:3px solid var(--bad, #a43)">
    <h2 style="margin-top:0">⚠ Code-execution audit — last ${codeCalls.length} sandbox call(s)</h2>
    <p class="hint">Every code execution is captured here with the exact submitted code. This is the
      highest-risk tool in the stack; treat this log as the record of what actually ran.</p>
    <table><tr><th>time (UTC)</th><th>persona</th><th>caller</th><th>server/tool</th>
      <th>result</th><th>code</th></tr>
    ${codeCalls.map(c => {
      let code = "";
      try { const a = JSON.parse(c.arguments || "{}");
            code = a.code || a.source || a.script || c.arguments || ""; }
      catch (e) { code = c.arguments || ""; }
      return `<tr>
        <td class="mono nw">${esc((c.ts || "").slice(0, 19))}</td>
        <td class="nw">${esc(c.persona || "")}</td>
        <td class="mono nw">${esc(c.caller || "")}</td>
        <td class="mono nw">${esc(c.server)}/${esc(c.tool)}</td>
        <td><span class="pill ${c.ok ? "ok" : "bad"}">${c.ok ? "ok" : "fail"}</span>
          ${c.error ? `<span class="err" title="${esc(c.error)}">✗</span>` : ""}
          <span class="mono" style="color:var(--dim)">${fmtDur(c.duration_ms || 0)}</span></td>
        <td><details><summary>view</summary><pre class="mono" style="white-space:pre-wrap;max-width:640px">${esc(code)}</pre></details></td>
      </tr>`;
    }).join("")}</table></div>` : "";

  // ---- MCP usage, aggregated separately from "which model answered" -------------
  // This card answers "is the TrueNAS worker actually using Foundry's MCP servers,
  // and separately from which model it picked?" A request in `direct` mode never
  // touches these servers (the client brought its own tools), which is exactly why
  // an AnythingLLM @agent session shows nothing here.
  const agg = {};            // server -> {n, ok, fail, ms, lastErr, tools:{}}
  let mcpReqs = 0;
  for (const r of reqs) {
    const calls = Array.isArray(r.tool_calls) ? r.tool_calls : [];
    if (calls.length) mcpReqs++;
    for (const t of calls) {
      const s = agg[t.server] || (agg[t.server] = { n: 0, ok: 0, fail: 0, ms: 0, lastErr: "", tools: {} });
      s.n++; s.ms += t.duration_ms || 0;
      s.tools[t.tool] = (s.tools[t.tool] || 0) + 1;
      if (t.ok) s.ok++; else { s.fail++; if (t.error) s.lastErr = t.error; }
    }
  }
  const servers = Object.keys(agg).sort();
  const mcpRows = servers.map(name => {
    const s = agg[name];
    const tools = Object.entries(s.tools).map(([t, c]) => `${esc(t)}×${c}`).join(", ");
    return `<tr>
      <td class="nw"><b>${esc(name)}</b></td>
      <td class="mono">${tools}</td>
      <td class="nw">${s.n}</td>
      <td class="nw"><span class="pill ok">${s.ok} ok</span>${s.fail ? ` <span class="pill bad">${s.fail} fail</span>` : ""}</td>
      <td class="nw">${fmtDur(Math.round(s.ms / s.n))} avg</td>
      <td class="trail" style="border:0"><span class="call ${s.lastErr ? "err" : ""}">${esc(s.lastErr || "—")}</span></td>
    </tr>`;
  }).join("");
  const mcpCard = `<div class="card">
    <h2 style="margin-top:0">MCP tool usage — Foundry's own servers (last ${reqs.length} requests)</h2>
    ${servers.length
      ? `<table><tr><th>server</th><th>tools used</th><th>calls</th><th>result</th><th>latency</th><th>last error</th></tr>${mcpRows}</table>
         <p class="hint"><b>${mcpReqs}</b> of ${reqs.length} request(s) used a Foundry MCP server.
         <b>direct · client tools</b> requests are not counted here — the client brought its own tools, so
         Foundry's MCP servers (searxng / crawl4ai / …) were bypassed.</p>`
      : `<p class="hint">No Foundry MCP tool calls in the last ${reqs.length} requests. If your client is
         <b>AnythingLLM in @agent mode</b>, it runs its own web tools (DuckDuckGo) and hits Foundry in
         <b>direct</b> mode, which bypasses Foundry's MCP servers. To let the worker use Foundry's
         searxng / crawl4ai tools, send a <b>normal chat</b> (turn @agent off).</p>`}
  </div>`;

  // ---- per-request trail --------------------------------------------------------
  const toolCell = r => {
    const calls = Array.isArray(r.tool_calls) ? r.tool_calls : [];
    if (!calls.length) return `<span class="hint">—</span>`;
    const ok = calls.every(t => t.ok);
    const byServer = {};
    for (const t of calls) byServer[t.server] = (byServer[t.server] || 0) + 1;
    const chips = Object.entries(byServer).map(([s, c]) => `${esc(s)}×${c}`).join(" · ");
    return `<details><summary><span class="pill ${ok ? "ok" : "bad"}">${calls.length}</span>
        <span class="mono" style="color:var(--dim)"> ${chips}</span></summary>
      <div class="trail">${calls.map(t => `<div class="call">${t.ok ? "✓" : "✗"}
        ${esc(t.server)}/${esc(t.tool)} · ${fmtDur(t.duration_ms || 0)}${
        t.error ? ` <span class="err">— ${esc(t.error)}</span>` : ""}</div>`).join("")}</div>
      </details>`;
  };
  // Thumbs feedback (quality tracking Phase 1): rate any routed request from
  // the router itself, regardless of which client served the conversation.
  const fbCell = r => `<span class="nw">
    <button class="act" style="padding:2px 6px${r.feedback === 1 ? ";outline:2px solid var(--ok, #3a4)" : ""}"
      title="thumbs up" onclick="sendFeedback(${r.id}, 1)">👍</button>
    <button class="act" style="padding:2px 6px${r.feedback === -1 ? ";outline:2px solid var(--bad, #a43)" : ""}"
      title="thumbs down" onclick="sendFeedback(${r.id}, -1)">👎</button></span>`;
  const statusCell = r => {
    const cls = r.status === "ok" ? "ok" : r.status === "error" ? "bad" : "warn";
    const pill = `<span class="pill ${cls}"${r.error ? ' title="' + esc(r.error) + '"' : ""}>${esc(r.status)}</span>`;
    // Show the actual error inline so a failed request explains itself (e.g.
    // "ReadTimeout" / "all backends failed …") without digging the Events log.
    return r.error
      ? `${pill}<div class="hint" style="max-width:320px;white-space:normal;color:var(--bad)">${esc(r.error)}</div>`
      : pill;
  };
  const rows = reqs.map(r => `<tr>
    <td class="mono nw">${esc((r.ts || "").slice(0, 19))}</td>
    <td class="nw">${esc(r.persona || r.client_model)}</td>
    <td>${modeBadge(r.mode)}</td>
    <td>${esc(r.summary)}</td>
    <td class="mono">${(r.models_used || []).map(m => esc(m.model)).join(" → ") || '<span class="hint">—</span>'}</td>
    <td>${toolCell(r)}</td>
    <td>${r.steps ?? ""}</td>
    <td class="nw">${fmtDur(r.duration_ms)}</td>
    <td>${r.est_cost_usd ? "$" + r.est_cost_usd.toFixed(4) : ""}</td>
    <td>${(r.guardrail_events || []).length ? '<span class="pill warn">' + (r.guardrail_events || []).length + "</span>" : ""}</td>
    <td>${statusCell(r)}</td>
    <td>${fbCell(r)}</td>
    </tr>`).join("");
  $("#main").innerHTML = `
    ${budgetCard(bg)}
    ${quotaCard(q)}
    ${subUsageCard(su)}
    ${mediaCard(md)}
    ${codeCard}
    ${mcpCard}
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h2 style="margin-bottom:0">Usage log — every routed request</h2>
      <button class="act" onclick="clearLog('usage','usage log entries')"
        ${reqs.length ? "" : "disabled"}>Clear usage log</button>
    </div>
    <p class="hint">The <b>model(s)</b> column is who answered; the <b>tools (MCP)</b> column is which of
      Foundry's own MCP servers that request exercised — expand a badge for the per-call trail. A
      <b>direct · client tools</b> row bypassed Foundry's tools entirely.</p>
    <table><tr><th>time (UTC)</th><th>persona</th><th>mode</th><th>request</th>
    <th>model(s)</th><th>tools (MCP)</th><th>steps</th><th>time</th><th>cost</th><th>guard</th><th>status</th><th title="Rate this response — feeds the insight digest and per-persona quality trends">rate</th></tr>${rows}</table>`;
  bindSubUsageCard();
  bindMediaCard();
}

// Thumbs feedback from the Usage tab (quality tracking Phase 1). Re-render so
// the highlighted state reflects what the server now has on record.
async function sendFeedback(requestLogId, rating) {
  try {
    await api("feedback", {method: "POST", body: {request_log_id: requestLogId, rating}});
    toast(rating > 0 ? "Recorded 👍" : "Recorded 👎");
    render();
  } catch (e) { toast(e.message, true); }
}

/* ---------------------------------------------------------------- events -- */
async function tabEvents() {
  const d = await api("events?limit=200");
  const rows = d.events.map(e => `<tr>
    <td class="mono nw">${esc((e.ts || "").slice(0, 19))}</td>
    <td><span class="pill ${e.level === "error" ? "bad" : e.level === "warning" ? "warn" : "ok"}">${esc(e.level)}</span></td>
    <td class="nw">${esc(e.source)}</td><td>${esc(e.message)}</td>
    <td><details><summary>detail</summary><span class="mono">${esc(e.detail || "")}</span></details></td>
    </tr>`).join("");
  $("#main").innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h2 style="margin-bottom:0">Troubleshooting log — “why did it route weirdly” (§4.9 item 7)</h2>
      <button class="act" onclick="clearLog('events','event log entries')"
        ${d.events.length ? "" : "disabled"}>Clear event log</button>
    </div>
    <table><tr><th>time (UTC)</th><th>level</th><th>source</th><th>message</th><th></th></tr>${rows}</table>`;
}

/* ------------------------------------------------------- theme + branding -- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;          // "light" | "dark"
  localStorage.setItem("fr-theme", t);
  const b = $("#theme-btn");
  if (b) b.textContent = t === "light" ? "🌙 Dark" : "☀ Light";
}
function initTheme() {
  // Dark is the default; honor a remembered choice, else the OS preference.
  const saved = localStorage.getItem("fr-theme");
  const osLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  applyTheme(saved || (osLight ? "light" : "dark"));
  $("#theme-btn").onclick = () =>
    applyTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
}

function setLogo(dataUri) {
  const img = $("#brand-logo"), clear = $("#logo-clear");
  if (dataUri) { img.src = dataUri; img.hidden = false; clear.hidden = false; }
  else { img.removeAttribute("src"); img.hidden = true; clear.hidden = true; }
}
async function initBranding() {
  try { const b = await api("branding"); setLogo(b.logo); } catch (e) { /* non-fatal */ }
  $("#logo-btn").onclick = () => $("#logo-file").click();
  $("#logo-file").onchange = e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    if (f.size > 512 * 1024) { toast("Logo must be under 512 KB", true); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        await api("branding/logo", {method: "POST", body: {logo: reader.result}});
        setLogo(reader.result); toast("Logo updated");
      } catch (err) { toast(err.message, true); }
    };
    reader.readAsDataURL(f);
  };
  $("#logo-clear").onclick = async () => {
    try { await api("branding/logo", {method: "POST", body: {logo: null}}); setLogo(null); toast("Logo cleared"); }
    catch (e) { toast(e.message, true); }
  };
}

/* ----------------------------------------------------------------- devlog -- */
async function tabDevLog() {
  clearInterval(window._devTimer);
  $("#main").innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <h2 style="margin-top:0;margin-bottom:0">Insight digest — quality & reliability patterns</h2>
        <span class="row" style="gap:6px">
          <select id="ins-days"><option value="1">last 24h</option>
            <option value="7" selected>last 7 days</option>
            <option value="30">last 30 days</option></select>
          <button class="act primary" id="ins-run">Generate</button>
        </span>
      </div>
      <p class="hint">Statistical summary per persona: feedback trends, recurring guardrail/error
        types, tool-call reliability by caller model, review-pass outcomes. Numbers only —
        you decide what to act on; low-sample figures are flagged.</p>
      <pre id="ins-report" class="mono" style="white-space:pre-wrap;display:none"></pre>
    </div>
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <h2 style="margin-bottom:0">Dev log — application logs & tracebacks</h2>
      <button class="act" id="dev-clear">Clear</button>
    </div>
    <p class="hint">Captured live from the app's logging (last ~800 records, in memory —
      resets on restart). Errors include full tracebacks. Persistent routing/MCP history
      is in the <b>Events</b> tab.</p>
    <div class="row">
      <label>min level</label>
      <select id="dev-level"><option value="">all</option><option>INFO</option>
        <option>WARNING</option><option>ERROR</option></select>
      <input id="dev-q" size="30" placeholder="search message / logger / traceback…">
      <label title="Auto-refresh every 2s, newest on top">live tail</label>
      <input type="checkbox" id="dev-live">
      <span id="dev-count" class="hint"></span>
    </div>
    <div id="dev-list"></div>`;
  let after = 0;
  const seen = new Map();                       // id -> record (accumulate + dedupe)
  const list = $("#dev-list");
  const levelCls = l => (l === "ERROR" || l === "CRITICAL") ? "bad" : l === "WARNING" ? "warn" : "ok";
  const renderAll = () => {
    const recs = [...seen.values()].sort((a, b) => b.id - a.id);   // newest first
    list.innerHTML = recs.map(e => `<div class="dev-rec">
      <span class="mono nw" style="color:var(--dim)">${esc(e.ts)}</span>
      <span class="pill ${levelCls(e.level)}">${esc(e.level)}</span>
      <span class="mono nw" style="color:var(--dim)">${esc(e.logger)}</span>
      <span>${esc(e.message)}</span>
      ${e.traceback ? `<details><summary>traceback</summary><pre class="mono">${esc(e.traceback)}</pre></details>` : ""}
    </div>`).join("") || '<p class="hint">no matching log records</p>';
    $("#dev-count").textContent = recs.length + " shown";
  };
  const poll = async reset => {
    if (reset) { seen.clear(); after = 0; }
    const level = $("#dev-level").value, q = $("#dev-q").value.trim();
    const d = await api(`devlog?after=${after}&level=${encodeURIComponent(level)}&q=${encodeURIComponent(q)}`);
    for (const e of d.records) seen.set(e.id, e);
    after = Math.max(after, d.max_id || after);
    renderAll();
  };
  $("#ins-run").onclick = async () => {
    const pre = $("#ins-report");
    pre.style.display = "block"; pre.textContent = "generating…";
    try {
      const d = await api(`insights?days=${$("#ins-days").value}`);
      pre.textContent = d.report;
    } catch (e) { pre.textContent = "digest failed: " + e.message; }
  };
  $("#dev-level").onchange = () => poll(true).catch(e => toast(e.message, true));
  $("#dev-q").oninput = debounce(() => poll(true).catch(() => {}), 300);
  $("#dev-clear").onclick = async () => {
    try { await api("devlog/clear", {method: "POST"}); poll(true); } catch (e) { toast(e.message, true); }
  };
  $("#dev-live").onchange = () => {
    clearInterval(window._devTimer);
    if ($("#dev-live").checked)
      window._devTimer = setInterval(() => {
        if (current !== "Dev Log") { clearInterval(window._devTimer); return; }
        poll(false).catch(() => {});
      }, 2000);
  };
  await poll(true);
}

initTheme();
initBranding();
render();
fetch("/admin/api/status", {headers: _adminKey() ? {Authorization: "Bearer " + _adminKey()} : {}})
  .then(r => r.ok ? r.json() : null).then(st => { if (st) renderHeaderInfo(st); }).catch(() => {});
