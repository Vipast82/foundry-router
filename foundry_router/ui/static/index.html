<!doctype html>
<!--
  Foundry Router admin panel.
  Stack choice: one static HTML file, vanilla JS, zero build toolchain — the
  best maintainability-per-dependency for a small internal admin surface.
  Served by the same FastAPI app at /ui; talks to /admin/api/*.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry Router</title>
<style>
  /* Molten-metal palette (matches the Foundry Enterprises logo). Dark is the
     default; [data-theme="light"] (set by the header toggle, remembered in
     localStorage) swaps to the logo's white-field look. Pill backgrounds are
     variables too, so status chips read correctly in both themes. */
  :root {
    color-scheme: dark;
    --bg:#15120e; --panel:#201b15; --line:#33291f; --fg:#e8e3da; --dim:#9a8f80;
    --accent:#ff8a1e; --accent-2:#ffb347;
    --ok:#66c06f; --bad:#e0574f; --warn:#e0a441;
    --ok-bg:#1b3320; --bad-bg:#3a1e1c; --warn-bg:#38301a;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#f6f2ec; --panel:#ffffff; --line:#e4ddd1; --fg:#2a2622; --dim:#6f675b;
    --accent:#d9741a; --accent-2:#e8912f;
    --ok:#2f8f43; --bad:#c23b32; --warn:#b07817;
    --ok-bg:#e3f2e5; --bad-bg:#fbe4e2; --warn-bg:#faefd8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 system-ui, "Segoe UI", sans-serif;
         transition:background .15s ease, color .15s ease; }
  /* Header/nav/main share fluid side padding that grows with the viewport, so
     content fills an ultrawide screen instead of being capped at a fixed width. */
  header { display:flex; align-items:center; gap:14px;
           padding:9px clamp(12px, 1.8vw, 44px);
           background:var(--panel); border-bottom:1px solid var(--line); }
  header .brand { display:flex; flex-direction:column; min-width:0; }
  header h1 { font-size:16px; margin:0; color:var(--accent); font-weight:600; }
  header .sub { color:var(--dim); font-size:12px; }
  #brand-logo { height:36px; width:auto; max-width:180px; border-radius:5px; }
  .hdr-tools { margin-left:auto; display:flex; gap:6px; align-items:center;
               flex-wrap:wrap; justify-content:flex-end; }
  nav { display:flex; flex-direction:column; padding:0 clamp(6px, 1.8vw, 40px);
        background:var(--panel); border-bottom:1px solid var(--line); }
  nav .navgroups { display:flex; gap:2px; flex-wrap:wrap; }
  nav .navsubs { display:flex; gap:2px; flex-wrap:wrap; padding:3px 0 1px;
                 border-top:1px solid var(--line); }
  nav button { background:none; border:none; color:var(--dim); padding:9px 13px;
               cursor:pointer; font-size:13px; border-bottom:2px solid transparent; }
  nav button:hover { color:var(--fg); }
  nav button.active { color:var(--fg); border-bottom-color:var(--accent); }
  nav .navsubs button { font-size:12px; padding:6px 11px; }
  nav .navsubs button.active { color:var(--accent); border-bottom-color:var(--accent); }
  main { padding:18px clamp(12px, 1.8vw, 44px); width:100%; }
  h2 { font-size:14px; margin:18px 0 8px; color:var(--accent); }
  .hint { color:var(--dim); font-size:12px; margin:4px 0 10px; }
  table { border-collapse:collapse; width:100%; margin:6px 0 14px; font-size:13px; }
  th,td { text-align:left; padding:6px 9px; border-bottom:1px solid var(--line);
          vertical-align:top; }
  /* Long model ids/URLs may break anywhere, but headers must never split
     mid-word ("person/a", "ste/ps") — headers stay on one line and the
     table scrolls horizontally inside <main> if it gets too wide. */
  td { word-break:break-word; }
  th { color:var(--dim); font-weight:500; white-space:nowrap; }
  .nw { white-space:nowrap; word-break:normal; }
  .pill { display:inline-block; padding:1px 8px; border-radius:9px; font-size:11px;
          white-space:nowrap; }
  .ok  { background:var(--ok-bg); color:var(--ok); }
  .bad { background:var(--bad-bg); color:var(--bad); }
  .warn{ background:var(--warn-bg); color:var(--warn); }
  button.act { background:var(--panel); color:var(--fg); border:1px solid var(--line);
               border-radius:5px; padding:5px 11px; cursor:pointer; font-size:12px;
               white-space:nowrap; }
  button.act:hover { border-color:var(--accent); }
  button.act:disabled { opacity:.35; cursor:not-allowed; }
  button.act:disabled:hover { border-color:var(--line); }
  button.primary { border-color:var(--accent); color:var(--accent); }
  input, select, textarea { background:var(--bg); color:var(--fg);
    border:1px solid var(--line); border-radius:5px; padding:5px 8px; font-size:13px; }
  textarea { width:100%; font-family:ui-monospace, monospace; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .row label { color:var(--dim); font-size:12px; min-width:170px; }
  /* Compact multi-field rows: label hugs its OWN input, groups are spaced apart.
     (Drops the 170px column-label width that spreads label text from its input.) */
  .row.tight { gap:6px; }
  .row.tight label { min-width:0; margin-left:16px; }
  .row.tight > label:first-child { margin-left:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:12px 14px; margin:10px 0; }
  code, .mono { font-family:ui-monospace, Consolas, monospace; font-size:12px; }
  #toast { position:fixed; bottom:16px; right:16px; background:var(--panel);
           border:1px solid var(--accent); padding:9px 14px; border-radius:6px;
           display:none; z-index:9; }
  details summary { cursor:pointer; color:var(--dim); }
  /* Per-request MCP tool trail. The old rendering forced every call onto one
     nowrap line, so a long line (e.g. a 429 URL) was clipped no matter the
     window size. This wraps and indents each call under the row instead. */
  .trail { margin:4px 0 2px; padding-left:2px; border-left:2px solid var(--line);
           display:flex; flex-direction:column; gap:2px; }
  .trail .call { font-family:ui-monospace, Consolas, monospace; font-size:11.5px;
           white-space:normal; word-break:break-word; padding-left:7px; color:var(--fg); }
  .trail .call .err { color:var(--bad); }
  /* Persona MCP-tool selector: a live checklist replacing the old raw-JSON
     input, populated from the same discovered set the Tools tab shows. */
  .mcp-checklist { display:flex; flex-direction:column; gap:1px; flex:1;
    min-width:280px; max-height:180px; overflow-y:auto; padding:6px 8px;
    border:1px solid var(--line); border-radius:5px; background:var(--bg); }
  .mcp-item { display:flex; align-items:center; gap:7px; color:var(--fg);
    padding:2px 0; min-width:0; }
  .mcp-item.disabled { opacity:.5; }
  .mcp-item input { flex:none; }
  .mcp-item .hint { white-space:nowrap; }
  /* Wide tables scroll inside their own box (added by wrapTables) so the page
     body never scrolls sideways. */
  .tscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:6px 0 14px;
             max-width:100%; }
  .tscroll table { margin:0; }
  /* Numeric steppers: every number input is wrapped (enhanceSteppers) into a
     [-][value][+] control with hold-to-repeat, and still typeable. */
  .stepper { display:inline-flex; align-items:stretch; border:1px solid var(--line);
             border-radius:5px; overflow:hidden; background:var(--bg); vertical-align:middle; }
  .stepper input[type="number"] { border:0; border-radius:0; text-align:center;
             width:5.5em; background:transparent; -moz-appearance:textfield; margin:0; }
  .stepper input[type="number"]::-webkit-outer-spin-button,
  .stepper input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .step-btn { border:0; background:var(--panel); color:var(--fg); cursor:pointer;
             padding:0 11px; font-size:16px; line-height:1; user-select:none;
             -webkit-user-select:none; touch-action:none; }
  .step-btn:hover { background:var(--accent); color:#1a1206; }
  .step-btn:active { filter:brightness(.9); }
  /* Dev-log rows: time / level / logger / message on one wrapping line, with an
     expandable traceback spanning the full width below. */
  .dev-rec { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline;
             padding:5px 2px; border-bottom:1px solid var(--line); font-size:13px; }
  .dev-rec details, .dev-rec pre { flex-basis:100%; }
  .dev-rec pre { background:var(--bg); border:1px solid var(--line); border-radius:5px;
                 padding:8px; overflow:auto; max-height:340px; white-space:pre-wrap;
                 word-break:break-word; margin:4px 0 2px; }
  /* -- Tooltips + help ------------------------------------------------------------
     Every title="" in the app is upgraded on hover into a styled, wrapping
     tooltip (#tip) — readable multi-line help instead of the tiny native one.
     Anything carrying help gets a dotted underline + help cursor so it's
     discoverable. The small round "?" buttons open a longer explanation. */
  #tip { position:fixed; z-index:30; max-width:min(380px, 92vw); display:none;
         background:var(--panel); color:var(--fg); border:1px solid var(--accent);
         border-radius:6px; padding:7px 10px; font-size:12px; line-height:1.45;
         box-shadow:0 6px 22px rgba(0,0,0,.35); pointer-events:none;
         white-space:pre-line; }
  th[title], th[data-tip], .tile[title] .t-lbl, .tile[data-tip] .t-lbl, .has-tip {
         text-decoration:underline dotted var(--dim); text-underline-offset:3px;
         cursor:help; }
  button.help { display:inline-flex; align-items:center; justify-content:center;
         width:17px; height:17px; padding:0; margin-left:5px; border-radius:50%;
         border:1px solid var(--dim); background:transparent; color:var(--dim);
         font-size:11px; font-weight:700; line-height:1; cursor:pointer;
         vertical-align:middle; flex:none; }
  button.help:hover { border-color:var(--accent); color:var(--accent); }
  .modal { position:fixed; inset:0; z-index:25; background:rgba(0,0,0,.55);
         display:flex; align-items:flex-start; justify-content:center;
         padding:6vh 14px; overflow-y:auto; }
  .modal[hidden] { display:none; }
  .modal-box { background:var(--panel); border:1px solid var(--line);
         border-radius:9px; padding:16px 18px; width:min(640px, 100%);
         position:relative; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  .modal-box h3 { margin:0 26px 10px 0; color:var(--accent); font-size:15px; }
  .modal-box .modal-x { position:absolute; top:10px; right:10px; }
  .modal-body p { margin:6px 0; }
  .modal-body dt { font-weight:600; margin-top:8px; }
  .modal-body dd { margin:2px 0 0 14px; color:var(--dim); }
  .modal-body code { background:var(--bg); padding:0 4px; border-radius:3px; }
  /* Headline stat tiles (Performance / Live) */
  .tiles { display:flex; gap:10px; flex-wrap:wrap; }
  .tile { min-width:118px; flex:1 1 118px; background:var(--bg);
          border:1px solid var(--line); border-radius:7px; padding:7px 10px; }
  .tile .t-lbl { color:var(--dim); font-size:11.5px; }
  .tile .t-val { font-size:19px; font-weight:600; }
  .tile .t-sub { color:var(--dim); font-size:11px; }
  .card-h { display:flex; align-items:center; gap:6px; font-weight:600;
            margin-bottom:6px; flex-wrap:wrap; }
  .card-h .hint { font-weight:normal; margin:0; }
  .card-h .grow { flex:1; }
  /* Horizontal meter (KV-cache fill, slot occupancy) */
  .meter { display:inline-block; width:110px; height:9px; border-radius:5px;
           background:var(--line); overflow:hidden; vertical-align:middle; }
  .meter > span { display:block; height:100%; background:var(--ok); }
  .meter.warn > span { background:var(--warn); }
  .meter.bad > span { background:var(--bad); }
  .srv { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
         gap:8px 18px; margin-top:4px; }
  .srv .k { color:var(--dim); font-size:11.5px; }
  .srv .v { font-weight:600; }
  .est { color:var(--warn); font-weight:700; margin-left:2px; }
  /* -- Responsive: PC / tablet / phone ---------------------------------------- */
  @media (max-width: 900px) {
    header { flex-wrap:wrap; gap:4px 12px; padding:9px 12px; }
    main { padding:14px 12px; }
    .row label { min-width:0; }        /* 170px labels would force overflow */
    .card { padding:10px 11px; }
    th, td { padding:5px 7px; }
    table { font-size:12px; }
  }
  @media (max-width: 560px) {
    header h1 { font-size:15px; }
    header .sub { width:100%; }         /* version/pool/brain drop to their own line */
    nav { padding:0 6px; }
    nav button { padding:8px 9px; font-size:12px; }
    main { padding:12px 9px; }
    .row { gap:6px; }
    .row input, .row select { flex:1; min-width:120px; }
    table { font-size:11.5px; }
    th, td { padding:5px 6px; }
  }
</style>
</head>
<body>
<header>
  <img id="brand-logo" alt="" hidden>
  <div class="brand">
    <h1>Foundry Router</h1>
    <span class="sub" id="hdr-info">loading…</span>
  </div>
  <div class="hdr-tools">
    <button class="act" id="logo-btn" title="Upload or change the header logo (PNG/SVG, under 512 KB)">Logo…</button>
    <button class="act" id="logo-clear" title="Remove the custom logo" hidden>✕</button>
    <button class="act" id="theme-btn" title="Toggle light / dark theme">🌙 Dark</button>
  </div>
  <input type="file" id="logo-file" accept="image/*" hidden>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, opts={}) {
  const r = await fetch("/admin/api/" + path, {
    headers: {"Content-Type": "application/json"}, ...opts,
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}
function toast(msg, isErr=false) {
  const t = $("#toast");
  t.textContent = msg; t.style.borderColor = isErr ? "var(--bad)" : "var(--accent)";
  t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3500);
}
const formatCtx = n => n >= 1000 ? Math.round(n / 1000) + 'K' : String(n);
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const run = p => p.then(d => { toast("Saved"); render(); return d; })
                  .catch(e => toast(e.message, true));

// Clear a log table (usage/events) after confirmation, then re-render the tab.
function clearLog(kind, label) {
  if (!confirm(`Permanently delete all ${label}? This cannot be undone.`)) return;
  api(kind + "/clear", { method: "POST" })
    .then(r => { toast(`Cleared ${r.removed} row(s)`); render(); })
    .catch(e => toast(e.message, true));
}

/* ------------------------------------------------------------ tooltips -- */
// One global handler upgrades every title="" into the styled #tip tooltip on
// hover (the attribute moves to data-tip so the tiny native one never doubles
// up). Works for markup rendered later too — no per-tab wiring.
const _tip = document.createElement("div");
_tip.id = "tip";
document.body.appendChild(_tip);
let _tipEl = null;
function _placeTip(el) {
  const r = el.getBoundingClientRect(), tw = _tip.offsetWidth, th = _tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left), window.innerWidth - tw - 8);
  let y = r.bottom + 6;
  if (y + th > window.innerHeight - 8) y = Math.max(8, r.top - th - 6);
  _tip.style.left = x + "px"; _tip.style.top = y + "px";
}
document.addEventListener("mouseover", e => {
  const el = e.target.closest && e.target.closest("[title],[data-tip]");
  if (!el || el === _tipEl) return;
  if (el.hasAttribute("title")) {
    const t = el.getAttribute("title");
    el.removeAttribute("title");
    if (t) el.setAttribute("data-tip", t);
  }
  const txt = el.getAttribute("data-tip");
  if (!txt) return;
  _tipEl = el;
  _tip.textContent = txt;
  _tip.style.display = "block";
  _placeTip(el);
});
document.addEventListener("mouseout", e => {
  if (_tipEl && !_tipEl.contains(e.relatedTarget)) { _tip.style.display = "none"; _tipEl = null; }
});
["scroll", "mousedown", "keydown"].forEach(ev => document.addEventListener(ev, () => {
  _tip.style.display = "none"; _tipEl = null; }, true));

/* --------------------------------------------------------------- modal -- */
const _modal = document.createElement("div");
_modal.className = "modal"; _modal.hidden = true;
_modal.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true">
  <button class="act modal-x" title="Close (Esc)">✕</button><h3></h3><div class="modal-body"></div></div>`;
document.body.appendChild(_modal);
function closeModal() { _modal.hidden = true; $(".modal-body", _modal).innerHTML = ""; }
function openModal(title, html) {
  $("h3", _modal).textContent = title;
  $(".modal-body", _modal).innerHTML = html;
  _modal.hidden = false;
  return $(".modal-body", _modal);
}
$(".modal-x", _modal).onclick = closeModal;
_modal.addEventListener("click", e => { if (e.target === _modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !_modal.hidden) closeModal(); });

/* ---------------------------------------------------------------- help -- */
// Longer explanations behind the small "?" buttons. Short hover text lives in
// title="" on the element itself; this is the "what does this mean and what
// should I do about it" layer.
const HELP = {
  live: ["Live activity", `
    <p>A 2-second heartbeat of the router: which models are generating right now, how fast
    they've been running, what's loaded on each GPU host, and what just finished.</p>
    <p>Rates marked <b>avg · last</b> show the rolling average over every recorded call and the most
    recent single call. Hover any column header or pill for a one-line definition.</p>
    <p>Starting fresh (e.g. after a GPU swap)? Use <b>Clear stats…</b> — and set a
    <b>run label</b> on the Performance tab so old and new numbers stay separable.</p>`],
  generating: ["Models generating now", `
    <p>Every model with a call in flight at this instant, how long it has been running, and
    <b>×N</b> when several requests share it. The ~tok/s is that model's average decode speed.</p>
    <p>A model sitting here far longer than usual usually means a cold load (weights being read
    into VRAM) or a very large prompt being prefilled.</p>`],
  perfstrip: ["Recent performance", `
    <dl>
    <dt>effective tok/s</dt><dd>Output tokens ÷ total wall time over the last N requests — includes
      prefill, queueing and tool time. This is the speed you actually feel.</dd>
    <dt>decode tok/s</dt><dd>Pure generation speed once the model is producing tokens. Always ≥ effective;
      a big gap means prefill/queue/tool time dominates.</dd>
    <dt>Ø s / req</dt><dd>Average end-to-end time per finished request.</dd>
    <dt>truncations</dt><dd>Replies cut off because they hit the output-token cap
      (<code>worker_max_tokens</code>). Each one is a turn where Cline/Kilo has to say “continue”.
      A rising count means the cap is too low or the model is looping — try a repeat/DRY penalty.</dd>
    </dl>`],
  servers: ["Inference servers (engine metrics)", `
    <p>Numbers reported by the inference <b>engine itself</b> — not per request, but server-wide.
    They answer “is the box saturated?” rather than “how fast was that call?”.</p>
    <dl>
    <dt>KV cache</dt><dd>How full the key/value cache is. Near 100% the server must queue, evict or
      (vLLM) preempt requests. More VRAM (e.g. 22 GB cards) or a smaller context / quantized
      cache (<code>-ctk q8_0 -ctv q8_0</code> on llama.cpp) buys headroom.</dd>
    <dt>running / queued</dt><dd>Requests being processed vs waiting for a free slot.
      A persistent queue means more parallel slots (<code>-np</code>) or a second GPU host would help.</dd>
    <dt>slots busy</dt><dd>llama.cpp parallel slots in use (from <code>/slots</code>).</dd>
    <dt>engine prefill / decode tok/s</dt><dd>The engine's own throughput averages (lifetime of the
      server process) — a cross-check for the per-call numbers below.</dd>
    <dt>mean TTFT / TPOT / queue</dt><dd>vLLM histogram means: time to first token, time per output
      token (1000 ÷ TPOT = decode tok/s), and time spent queued.</dd>
    <dt>prefix cache</dt><dd>Share of prompt tokens served from cache (vLLM automatic prefix caching).</dd>
    <dt>preemptions</dt><dd>vLLM paused a request because the KV cache ran out. Any non-zero, growing
      value = VRAM pressure; lower <code>--max-num-seqs</code> or <code>--max-model-len</code>.</dd>
    <dt>Meridian</dt><dd>Sign-in status and plan from <code>/health</code>, plus request counts and
      queue / time-to-first-token / upstream / total latency from its <code>/metrics</code> —
      covering every client using that Meridian, not just Foundry.</dd>
    </dl>
    <p><b>Enable it:</b> llama.cpp needs <code>--metrics</code> (and <code>/slots</code> not disabled);
    vLLM and Meridian expose <code>/metrics</code> by default.</p>`],
  loaded: ["Loaded models — per-model performance", `
    <p>One row per model resident on a backend, with everything the router has measured for it.
    <b>avg</b> = rolling average across all recorded calls; <b>last</b> = the most recent call.</p>
    <dl>
    <dt>VRAM · ctx</dt><dd>GPU memory held (Ollama reports it; llama.cpp/vLLM don't over HTTP, so “—”)
      and the serving context window below it.</dd>
    <dt>TTFT</dt><dd>Time to first token — how long you wait before anything appears. Dominated by prefill on
      big prompts; much higher than “prefill time” means the request was queued.</dd>
    <dt>decode tok/s · decode time</dt><dd>Generation speed and how long generation took.</dd>
    <dt>prefill tok/s · prefill time</dt><dd>Prompt-processing speed and duration. Only tokens actually
      processed count — prompt tokens served from the KV cache are excluded, so a cache hit doesn't
      inflate the rate.</dd>
    <dt>eff tok/s</dt><dd>Output ÷ total wall time of each call (incl. prefill + queue).</dd>
    <dt>spec accept</dt><dd>Speculative decoding: share of draft-model tokens the main model kept.
      ≥60% is healthy; low means the draft model is mismatched or <code>--draft-max</code> is too deep.</dd>
    <dt>cache hit</dt><dd>Share of the prompt reused from the KV prefix cache. High on multi-turn chats is
      good; a sudden drop points at a chat-template change breaking the cache.</dd>
    <dt>load</dt><dd>Typical cold-load time (reading weights into VRAM); “warm” if never observed.</dd>
    <dt>trunc</dt><dd>Replies cut off at the output-token cap.</dd>
    <dt><span class="est">≈</span> marker</dt><dd>Timing <b>estimated</b> by the router from the stream
      (vLLM/OpenRouter report no per-request timings). Decode is accurate; prefill includes network +
      queue time.</dd>
    </dl>`],
  toolstats: ["Tool activity", `<p>MCP tool calls in the recent request window, grouped by tool: how
    often each ran, its average duration and failures. A tool with many failures is usually a
    misconfigured or rate-limited MCP server (see the MCP Servers tab).</p>`],

// A "?" button opening HELP[key] in the modal. Use inside headings/cards.
function help(key) {
  const h = HELP[key];
  return h ? `<button type="button" class="help" data-help="${key}" title="What is this? — ${esc(h[0])}">?</button>` : "";
}
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button.help[data-help]");
  if (!b) return;
  const h = HELP[b.getAttribute("data-help")];
  if (h) openModal(h[0], h[1]);
});

// Shared by the Live and Performance tabs. `pre` preselects {model, backend,
// run_label} from the current filters.
async function openClearDialog(pre) {
  pre = pre || {};
  let hist = {models: [], backends: [], run_labels: []};
  try { hist = await api("perf-history?hours=720"); } catch (e) {}
  const opt = (v, l, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(l)}</option>`;
  const body = openModal("Clear performance data", `
    <p class="hint" style="margin-top:0">Start with clean numbers — e.g. after changing GPUs, a
      model, or launch flags.</p>
    <details style="margin:0 0 8px"><summary>What does each option clear?</summary>${HELP.clear[1]}</details>
    <div class="row"><label title="Everything, or just one model">Scope</label>
      <select id="clr-model">${opt("", "All models", !pre.model)}${(hist.models || []).map(m =>
        opt(m.model, m.model + " (" + m.n + " calls)", m.model === pre.model)).join("")}</select></div>
    <div class="row"><label title="History samples only: limit to one backend">Backend (history)</label>
      <select id="clr-backend">${opt("", "any", !pre.backend)}${(hist.backends || []).map(b =>
        opt(b.backend, (b.backend || "(none)") + " (" + b.n + ")", b.backend === pre.backend)).join("")}</select></div>
    <div class="row"><label title="History samples only: limit to one run label">Run (history)</label>
      <select id="clr-run">${opt("__all__", "any run", pre.run_label == null)}${(hist.run_labels || []).map(r =>
        opt(r.run_label, (r.run_label || "(unlabelled)") + " (" + r.n + ")", r.run_label === pre.run_label)).join("")}</select></div>
    <div style="margin:10px 0 4px;font-weight:600">What to clear</div>
    <label class="row" style="margin:3px 0"><input type="checkbox" id="clr-samples" checked>
      Performance history samples <span class="hint" style="margin:0">(charts + tables on the Performance tab)</span></label>
    <label class="row" style="margin:3px 0"><input type="checkbox" id="clr-live" checked>
      Live averages <span class="hint" style="margin:0">(tok/s, TTFT, prefill, load, spec, cache)</span></label>
    <label class="row" style="margin:3px 0"><input type="checkbox" id="clr-trunc" checked>
      Truncation counters <span class="hint" style="margin:0">(+ their Events warnings)</span></label>
    <label class="row" style="margin:3px 0"><input type="checkbox" id="clr-bench">
      Observed latency scores <span class="hint" style="margin:0">(routing re-learns speed)</span></label>
    <label class="row" style="margin:3px 0"><input type="checkbox" id="clr-req">
      Usage Log <span class="hint" style="margin:0">(request history — all models only)</span></label>
    <div class="row" style="margin-top:12px">
      <button class="act primary" id="clr-go">Clear selected</button>
      <button class="act" id="clr-cancel">Cancel</button>
      <span class="hint" id="clr-note"></span></div>`);
  const sync = () => {
    const all = !$("#clr-model", body).value;
    const req = $("#clr-req", body);
    req.disabled = !all; if (!all) req.checked = false;
    $("#clr-note", body).textContent = all ? "" : "Usage Log can only be cleared for all models.";
  };
  $("#clr-model", body).onchange = sync; sync();
  $("#clr-cancel", body).onclick = closeModal;
  $("#clr-go", body).onclick = async () => {
    const model = $("#clr-model", body).value, run = $("#clr-run", body).value;
    const payload = {model, backend: $("#clr-backend", body).value,
      samples: $("#clr-samples", body).checked, live: $("#clr-live", body).checked,
      truncations: $("#clr-trunc", body).checked, benchmarks: $("#clr-bench", body).checked,
      requests: $("#clr-req", body).checked};
    if (run !== "__all__") payload.run_label = run;
    if (!Object.keys(payload).some(k => payload[k] === true)) return toast("Nothing selected", true);
    if (!confirm(`Permanently clear the selected data for ${model || "ALL models"}? This cannot be undone.`)) return;
    try {
      const r = await api("perf/clear", {method: "POST", body: payload});
      const bits = [];
      if (r.samples != null) bits.push(`${r.samples} samples`);
      if (r.models_reset != null) bits.push(`${r.models_reset} model stat rows reset`);
      if (r.requests != null) bits.push(`${r.requests} requests`);
      toast("Cleared: " + (bits.join(", ") || "done"));
      closeModal(); render();
    } catch (e) { toast(e.message, true); }
  };
}

// Leaf tab label -> render function. The label is what `current` holds and what
// self-cleaning timers compare against, so keep these stable.
const TABS = {
  "Live":           tabLive,
  "Performance":    tabPerformance,
  "Cost":           tabCost,
  "Pool":           tabBackends,
  "Model Registry": tabModels,
  "Host Admin":     tabHostAdmin,
  "Personas":       tabPersonas,
  "Guardrails":     tabGuardrails,
  "Tools":          tabTools,
  "MCP Servers":    tabMCP,
  "MCP Metrics":    tabMcpMetrics,
  "Agents":         tabAgents,
  "Research":       tabResearch,
  "Evals":          tabEvals,
  "Usage Log":      tabUsage,
  "Events":         tabEvents,
  "Dev Log":        tabDevLog,
};
// Primary nav groups -> their leaf tabs (the secondary row). Reorganizes the
// former flat bar into logical sections without dropping anything.
const GROUPS = [
  ["Dashboard",   ["Live", "Performance", "Cost"]],
  ["Backends",    ["Pool", "Model Registry", "Host Admin"]],
  ["Routing",     ["Personas", "Guardrails"]],
  ["Tools & MCP", ["Tools", "MCP Servers", "MCP Metrics", "Agents"]],
  ["Labs",        ["Research", "Evals"]],
  ["Logs",        ["Usage Log", "Events", "Dev Log"]],
];
const _groupOf = leaf => (GROUPS.find(g => g[1].includes(leaf)) || GROUPS[1])[0];
const _lastLeaf = {};        // group name -> last leaf visited (remembered on switch)
let current = "Pool";
function render() {
  const nav = $("#nav"); nav.innerHTML = "";
  const activeGroup = _groupOf(current);
  _lastLeaf[activeGroup] = current;
  // primary group row
  const groupRow = document.createElement("div");
  groupRow.className = "navgroups";
  for (const [gname, leaves] of GROUPS) {
    const b = document.createElement("button");
    b.textContent = gname;
    b.className = gname === activeGroup ? "active" : "";
    b.onclick = () => { current = _lastLeaf[gname] || leaves[0]; render(); };
    groupRow.appendChild(b);
  }
  nav.appendChild(groupRow);
  // secondary sub-tab row (shown only when the active group has >1 leaf)
  const leaves = (GROUPS.find(g => g[0] === activeGroup) || GROUPS[0])[1];
  if (leaves.length > 1) {
    const subRow = document.createElement("div");
    subRow.className = "navsubs";
    for (const leaf of leaves) {
      const b = document.createElement("button");
      b.textContent = leaf;
      b.className = leaf === current ? "active" : "";
      b.onclick = () => { current = leaf; render(); };
      subRow.appendChild(b);
    }
    nav.appendChild(subRow);
  }
  $("#main").innerHTML = "<p class='hint'>loading…</p>";
  TABS[current]().then(postRender).catch(e => $("#main").innerHTML =
    `<p class="hint">failed to load: ${esc(e.message)}</p>`);
}

// Wrap every rendered table in a horizontal-scroll box so a wide table scrolls
// inside its own container on narrow screens instead of forcing the whole page
// to scroll sideways. One place, so no tab has to remember to do it.
function wrapTables() {
  for (const t of $("#main").querySelectorAll("table")) {
    if (t.parentElement && t.parentElement.classList.contains("tscroll")) continue;
    const w = document.createElement("div");
    w.className = "tscroll";
    t.replaceWith(w);
    w.appendChild(t);
  }
}

// Nudge a number input by one step within its min/max, firing input/change so
// any live handler (e.g. a Save that reads .value) sees it.
function stepValue(inp, dir) {
  const step = parseFloat(inp.step) || 1;
  const min = inp.min !== "" ? parseFloat(inp.min) : -Infinity;
  const max = inp.max !== "" ? parseFloat(inp.max) : Infinity;
  let v = parseFloat(inp.value);
  if (isNaN(v)) v = 0;
  v = Math.min(max, Math.max(min, +(v + dir * step).toFixed(6)));
  inp.value = v;
  inp.dispatchEvent(new Event("input", {bubbles: true}));
  inp.dispatchEvent(new Event("change", {bubbles: true}));
}
// Press = one step; hold = ramp (after 400ms, every 80ms). Mouse + touch.
function bindHold(btn, fn) {
  let delay, repeat;
  const start = e => {
    e.preventDefault();
    fn();
    delay = setTimeout(() => { repeat = setInterval(fn, 80); }, 400);
  };
  const stop = () => { clearTimeout(delay); clearInterval(repeat); };
  btn.addEventListener("mousedown", start);
  btn.addEventListener("touchstart", start, {passive: false});
  ["mouseup", "mouseleave", "touchend", "touchcancel"].forEach(ev => btn.addEventListener(ev, stop));
}
// One place, like wrapTables: turn every number input into a [-][value][+]
// stepper. The input element (and its id) is preserved, so every existing
// read-by-id save handler keeps working.
function enhanceSteppers() {
  for (const inp of $("#main").querySelectorAll('input[type="number"]')) {
    if (inp.closest(".stepper")) continue;
    const wrap = document.createElement("span");
    wrap.className = "stepper";
    inp.replaceWith(wrap);
    const mk = (txt, dir) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "step-btn"; b.textContent = txt; b.tabIndex = -1;
      bindHold(b, () => stepValue(inp, dir));
      return b;
    };
    wrap.append(mk("−", -1), inp, mk("+", +1));
  }
}
function postRender() { wrapTables(); enhanceSteppers(); }

// --- inline SVG sparklines (no external chart lib — the admin UI stays a single
// self-contained file that works offline). `vals` is oldest→newest numbers. ---
function sparkline(vals, color, unit, w = 150, h = 34) {
  vals = (vals || []).filter(v => typeof v === "number" && isFinite(v));
  if (vals.length < 2) return '<span class="hint">— not enough data —</span>';
  const pad = 3, lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const x = i => pad + i * (w - 2 * pad) / (vals.length - 1);
  const y = v => h - pad - (v - lo) / span * (h - 2 * pad);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const last = vals[vals.length - 1];
  const lastX = x(vals.length - 1), lastY = y(last);

function lineChart(rows, seriesDefs, opts) {
  opts = opts || {};

  if (!rows || rows.length < 2)
    return '<div class="hint" style="padding:18px 0">Not enough data in this window yet.</div>';

  seriesDefs.forEach(s => rows.forEach(r => { if (r[s.key] != null) vals.push(r[s.key]); }));
  if (!vals.length) return '<div class="hint" style="padding:18px 0">No data for this metric.</div>';
  let lo = opts.yMin != null ? opts.yMin : Math.min(0, ...vals);
  let hi = opts.yMax != null ? opts.yMax : Math.max(...vals);
  if (hi <= lo) hi = lo + 1;

  // horizontal gridlines + y labels

          <th title="Average decode speed">avg decode</th>

            <td class="nw">${esc(g.backend || "—")}</td>
            <td class="nw">${g.run_label ? `<span class="pill">${esc(g.run_label)}</span>` : '<span class="hint">(unlabelled)</span>'}</td>
            <td class="nw">${g.n}</td>
            <td class="nw"><b>${cell(g.p50_decode_tps)}</b>${g.estimated ? ` <span class="est" title="${g.estimated} call(s) with router-estimated timing">≈</span>` : ""}</td>
            <td class="nw">${cell(g.decode_tps)}</td>
            <td class="nw">${cell(g.prefill_tps)}</td>
            <td class="nw">${cell(g.ttft_ms, "ms")}</td>
            <td class="nw">${cell(g.p95_ttft_ms, "ms")}</td>
            <td class="nw">${cell(g.eff_tps)}</td>
            <td class="nw">${cell(g.cache_hit_pct, "%")}</td>
            <td class="nw">${cell(g.spec_accept_pct, "%")}</td>
            <td class="nw">${cell(g.prompt_tokens, "k")}</td>
            <td class="nw">${cell(g.max_prompt_tokens, "k")}</td>
            <td class="nw">${cell(g.load_ms, "ms")}</td>
            <td class="nw">${g.truncations ? `<span class="pill warn">${g.truncations}</span>` : '<span class="hint">0</span>'}</td>
            <td class="nw">${_tsLabel(g.last_ts)}</td></tr>`).join("") + `</table>`
      : '<span class="hint">No calls recorded in this view yet.</span>';
    const cDec = _css("--ok", "#3fb950"), cEff = _css("--accent", "#e8833a"),
          cSpec = _css("--accent-2", "#ffb347"), cCache = _css("--ok", "#3fb950"),
          cCtx = _css("--accent", "#e8833a"), cPre = _css("--accent-2", "#ffb347"),
          cTt = _css("--warn", "#e0a441");
    $("#perf-c-tps").innerHTML = lineChart(rows,
      [{ key: "decode_tps", color: cDec, label: "decode tok/s" },

    $("#perf-c-ttft").innerHTML = lineChart(rows, [{ key: "ttft_ms", color: cTt, label: "TTFT" }], { yUnit: "ms" });
    $("#perf-c-pct").innerHTML = lineChart(rows,
      [{ key: "spec_accept_pct", color: cSpec, label: "spec accept %" },
       { key: "cache_hit_pct", color: cCache, label: "cache hit %" }], { yMin: 0, yMax: 100, yUnit: "%" });
    $("#perf-c-ctx").innerHTML = lineChart(rows, [{ key: "prompt_tokens", color: cCtx, label: "prompt tokens" }], { yUnit: "k" });
    $("#perf-c-scatter1").innerHTML = scatterChart(rows, "prompt_tokens", "decode_tps",
      { xUnit: "k", color: cDec, xlabel: "context (prompt tokens)", ylabel: "decode tok/s" });
    $("#perf-c-scatter2").innerHTML = scatterChart(rows, "prompt_tokens", "spec_accept_pct",
      { xUnit: "k", yUnit: "%", yMin: 0, yMax: 100, color: cSpec, xlabel: "context (prompt tokens)", ylabel: "spec accept %" });
    $("#perf-c-scatter3").innerHTML = scatterChart(rows, "prompt_tokens", "cache_hit_pct",
      { xUnit: "k", yUnit: "%", yMin: 0, yMax: 100, color: cCache, xlabel: "context (prompt tokens)", ylabel: "cache hit %" });
    // rich recent table (newest first)
    const rev = rows.slice().reverse().slice(0, 60);
    const est = r => r.timing_src === "estimated" ? ' <span class="est" title="Estimated by the router from the stream — the backend reports no timings">≈</span>' : "";
    $("#perf-table").innerHTML = rev.length
      ? `<table><tr><th>time</th><th>model</th><th title="Backend that served the call">backend</th>

          <th title="Prompt tokens (context fill)">ctx</th><th title="Output tokens (reasoning tokens in brackets when reported)">out</th>
          <th title="Share of the prompt served from the KV prefix cache">cache hit</th><th title="Speculative-decoding acceptance">spec</th>
          <th title="Generation speed">decode tok/s</th><th title="Prompt-processing speed">prefill tok/s</th><th title="Time to first token">TTFT</th>
          <th title="Output ÷ total call time">eff tok/s</th><th title="End-to-end wall time">wall</th>
          <th title="Cold model-load time (blank = model was already warm)">load</th><th title="Why generation stopped — 'length' = cut off at the token cap">finish</th></tr>`
        + rev.map(r => `<tr>

            <td class="nw">${esc(r.backend || "")}</td>
            <td class="nw hint">${esc(r.mode || "")}</td>
            <td class="nw">${_num(r.prompt_tokens, "k")}</td>
            <td class="nw">${r.completion_tokens ?? "—"}${r.reasoning_tokens ? ` <span class="hint" title="of which reasoning">(${r.reasoning_tokens})</span>` : ""}</td>
            <td class="nw">${cell(r.cache_hit_pct, "%")}</td>
            <td class="nw">${cell(r.spec_accept_pct, "%")}</td>
            <td class="nw">${cell(r.decode_tps)}${r.decode_tps != null ? est(r) : ""}</td>
            <td class="nw">${cell(r.prefill_tps)}${r.prefill_tps != null ? est(r) : ""}</td>
            <td class="nw">${cell(r.ttft_ms, "ms")}</td>
            <td class="nw">${cell(r.eff_tps)}</td>
            <td class="nw">${cell(r.wall_ms, "ms")}</td>
            <td class="nw">${r.load_ms == null ? '<span class="hint">warm</span>' : _num(r.load_ms, "ms")}</td>
            <td class="nw">${r.finish_reason === "length" ? '<span class="pill warn" title="Cut off at the output-token cap">length</span>' : '<span class="hint">' + esc(r.finish_reason || "stop") + '</span>'}</td>
          </tr>`).join("") + `</table>`
      : '<span class="hint">No calls recorded in this view yet.</span>';
    wrapTables();
  };
  ["#perf-win", "#perf-model", "#perf-backend", "#perf-run"].forEach(id => $(id).onchange = load);
  $("#perf-refresh").onclick = load;
  $("#perf-clear").onclick = () => openClearDialog({
    model: _PERF.model || "", backend: _PERF.backend || "",
    run_label: (!_PERF.run || _PERF.run === "__all__") ? null : (_PERF.run === "__none__" ? "" : _PERF.run)});
  $("#perf-label-set").onclick = async () => {
    try {
      const r = await api("perf/run-label", {method: "POST", body: {run_label: $("#perf-label").value}});
      toast(r.run_label ? `Recording new samples as “${r.run_label}”` : "Run label cleared");
      await load();
    } catch (e) { toast(e.message, true); }
  };
  $("#perf-label").onkeydown = e => { if (e.key === "Enter") $("#perf-label-set").click(); };
  $("#perf-csv").onclick = () => {
    const rows = last.series || []; if (!rows.length) return toast("No data to export");
    const cols = ["ts", "model", "backend", "persona", "mode", "run_label", "prompt_tokens",
      "prefill_tokens", "completion_tokens", "reasoning_tokens", "cached_tokens", "draft_n",
      "draft_n_accepted", "decode_tps", "prefill_tps", "decode_ms", "prefill_ms", "ttft_ms",
      "eff_tps", "wall_ms", "load_ms", "cache_hit_pct", "spec_accept_pct", "finish_reason",
      "timing_src"];
    const csv = [cols.join(",")].concat(rows.map(r => cols.map(c => {
      const v = r[c]; return v == null ? "" : (/[",\n]/.test("" + v) ? `"${("" + v).replace(/"/g, '""')}"` : v);
    }).join(","))).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = `foundry-perf-${_PERF.hours}h${_PERF.model ? "-" + _PERF.model.replace(/[^\w.-]+/g, "_") : ""}.csv`; a.click();
  };
  $("#perf-win").value = _PERF.hours;
  // Restore persisted filters before the first fetch (the dropdowns only hold
  // their default option until data arrives).
  [["#perf-model", _PERF.model], ["#perf-backend", _PERF.backend], ["#perf-run", _PERF.run]].forEach(([id, v]) => {
    if (!v || v === "__all__") return;
    $(id).insertAdjacentHTML("beforeend", `<option value="${esc(v)}">${esc(v === "__none__" ? "(unlabelled)" : v)}</option>`);
    $(id).value = v;
  });
  await load();
}

const _MCPM = { hours: 24, source: "", server: "", ctx: 262144 };

async function tabMcpMetrics() {
  const winOpts = [[1, "1h"], [6, "6h"], [24, "24h"], [72, "3d"], [168, "7d"], [720, "30d"]];

    <p class="hint">Every MCP tool call that passes through Foundry — from the routing brain, worker tool loops,

      <label>Window <select id="mcpm-win">${winOpts.map(([h, l]) => `<option value="${h}"${h === _MCPM.hours ? " selected" : ""}>${l}</option>`).join("")}</select></label>

      <label title="Your backend's context window, to show tool-definition cost as a % of it">context window
        <input id="mcpm-ctx" type="number" min="1024" step="1024" style="width:90px" value="${_MCPM.ctx}"></label>
      <button class="act" id="mcpm-refresh">Refresh</button>
      <button class="act" id="mcpm-clear" title="Delete the recorded MCP call metrics (all, or the selected server)">Clear metrics…</button>
    </div>
    <div id="mcpm-tiles"></div>
    <div class="card">${ch("Context budget — tool definitions", "mcpcontext", "tokens every request pays just to list the tools")}<div id="mcpm-ctxt"></div></div>
    <div class="card">${ch("Per tool", "mcptools", "slowest / most-failing tools stand out here")}<div id="mcpm-tools"></div></div>

  const dash = '<span class="hint">—</span>';
  const n = (v, u) => v == null ? dash : _num(v, u);
  const K = v => v == null ? dash : (v >= 1000 ? (v / 1000).toFixed(1) + "k" : "" + v);
  const srcPill = s => `<span class="pill" title="${esc({brain: "The routing brain called it while routing", worker: "A worker model's own tool loop", direct: "Persona tools merged into a client's direct-mode request (Cline/OpenCode)", aggregator: "An external client through the Foundry-MCP endpoint (e.g. AnythingLLM)", research: "The background Research Agent", gateway: "Gateway admin (Host → MCP)", other: "Other"}[s] || s)}">${esc(s)}</span>`;
  const load = async () => {

            <td>${x.ok ? '<span class="pill ok">ok</span>' : `<span class="pill bad" title="${esc(x.error || "")}">${x.timed_out ? "timeout" : "error"}</span> <span class="hint">${esc((x.error || "").slice(0, 90))}</span>`}${x.attempts > 1 ? ` <span class="hint" title="429 retries">×${x.attempts}</span>` : ""}</td>
            <td class="nw">${_num(x.duration_ms, "ms")}</td>
            <td class="nw hint">${x.connect_ms ? _num(x.connect_ms, "ms") : "0"} · ${x.pace_ms ? _num(x.pace_ms, "ms") : "0"}</td>
            <td class="nw hint">${esc(x.session || "")}</td><td class="nw">${K(x.result_tokens)}</td><td class="nw hint">${esc(x.content_types || "")}</td></tr>`).join("") + `</table>`
      : '<span class="hint">No calls.</span>';
    wrapTables();
  };
  ["#mcpm-win", "#mcpm-src", "#mcpm-srv", "#mcpm-ctx", "#mcpm-errs"].forEach(id => $(id).onchange = load);
  $("#mcpm-refresh").onclick = load;
  $("#mcpm-clear").onclick = async () => {
    const srv = $("#mcpm-srv").value;
    if (!confirm(`Delete recorded MCP call metrics for ${srv || "ALL servers"}?`)) return;
    try { const r = await api("mcp-metrics/clear", {method: "POST", body: {server: srv}}); toast(`Cleared ${r.removed} call(s)`); load(); }
    catch (e) { toast(e.message, true); }
  };
  await load();
}

// Agents tab — external agents (Hermes) as tools and as persona backends

async function tabAgents() {
  const [d, runs] = await Promise.all([api("agents"), api("agent-runs?hours=168&limit=60")]);
  const dash = '<span class="hint">—</span>';
  const n = (v, u) => v == null ? dash : _num(v, u);
  const list = d.agents || [];
  const healthPill = h => !h || h.healthy == null ? '<span class="hint">not probed</span>'
    : h.healthy ? `<span class="pill ok" title="${esc(JSON.stringify(h.health || {}))}">up${h.latency_ms != null ? " · " + h.latency_ms + "ms" : ""}</span>`
    : `<span class="pill bad" title="${esc(h.error || "")}">down</span> <span class="hint">${esc((h.error || "").slice(0, 60))}</span>`;
  const names = v => Array.isArray(v) ? v.map(x => typeof x === "string" ? x : (x.name || x.id || "")).filter(Boolean) : [];
  const rows = list.map(a => {

      <td class="nw"><b>${esc(a.name)}</b> <span class="hint">${esc(a.kind)}</span></td>

      <td>${(a.personas || []).map(p => `<span class="pill">${esc(p)}</span>`).join(" ") || '<span class="hint">no persona</span>'}</td>
      <td class="hint" title="${esc(skills.join(", "))}">${skills.length ? skills.length + " skills" : ""}${toolsets.length ? " · " + toolsets.length + " toolsets" : ""}</td>
      <td class="nw">${a.caller_token ? '<span class="pill ok" title="Loop protection armed">caller token</span>' : '<span class="pill warn" title="No caller token: if this agent uses Foundry as its model provider, set one so its requests are never routed back into an agent">no caller token</span>'}</td>
      <td class="nw"><button class="act" onclick='probeAgent(${JSON.stringify(a.name)})'>test</button>
        <button class="act" onclick='editAgent(${JSON.stringify(a.name)})'>edit</button>
        <button class="act" onclick='if(confirm("Remove agent ${esc(a.name)}?"))run(api("agents/delete",{method:"POST",body:{name:${JSON.stringify(a.name)}}}))'>remove</button></td></tr>`;
  }).join("");
  const g = runs.groups || [];
  const active = runs.active || d.active || [];
  const rc = runs.recent || [];
  const stPill = s => `<span class="pill ${s === "completed" ? "ok" : s === "running" || s === "handed_off" ? "" : "bad"}">${esc(s)}</span>`;
  $("#main").innerHTML = `
    <h2 style="margin-top:0;display:flex;align-items:center">Agents ${help("agents")}</h2>
    <p class="hint">External agents Foundry can hand work to — as a <b>tool</b> (grant <code>agent-&lt;name&gt;</code> to a persona or load it from the MCP aggregator in Cline / AnythingLLM) or as a persona <b>backend</b> (Personas → <i>served by agent</i>).</p>
    <div class="card"><div class="card-h">Configured agents</div>
      ${list.length ? `<table><tr><th>agent</th><th>url</th><th>health</th><th title="The model name the agent advertises">model</th><th>as tool</th><th title="Personas served by this agent">personas</th><th>skills</th><th title="Loop protection">loops</th><th></th></tr>${rows}</table>`
        : '<p class="hint">No agents yet. Enable Hermes\' API server (<code>API_SERVER_ENABLED=true</code>, <code>API_SERVER_KEY=…</code> in <code>~/.hermes/.env</code>, then <code>hermes gateway</code>) and add it below.</p>'}
    </div>
    <div class="card"><div class="card-h">Add / edit agent</div>
      <div class="row"><label>name</label><input id="ag-name" size="14" placeholder="hermes">
        <label title="Hermes API server base URL (default port 8642). For a multi-profile Hermes, include the /p/<profile> prefix.">url</label><input id="ag-url" size="26" value="http://localhost:8642">
        <label title="Hermes API_SERVER_KEY (sent as Bearer). Leave blank to keep the stored one; '-' clears it.">api key</label><input id="ag-key" type="password" size="16" placeholder="(unchanged)">
        <label title="Model name sent to the agent. Blank = what its /v1/models lists (usually the profile name, e.g. hermes-agent).">model</label><input id="ag-model" size="14" placeholder="auto"></div>
      <div class="row"><label title="Offer <name>_run/_status/_stop as tools (MCP server agent-<name>)">expose as tool</label><input type="checkbox" id="ag-tool" checked>
        <label title="One agent session per client conversation, so the agent remembers earlier turns of that chat">session continuity</label><input type="checkbox" id="ag-sess" checked>
        <label title="Budget for one agent task">timeout s</label><input id="ag-timeout" type="number" min="30" style="width:80px" value="1800">
        <label title="How long <name>_run waits for the answer before returning a run_id to poll with <name>_status. Keep it under your MCP client's own tool timeout.">tool wait s</label><input id="ag-wait" type="number" min="5" style="width:70px" value="600">
        <label title="The API key the agent uses when IT calls Foundry (as its model provider / MCP server). Requests carrying it are never routed back into an agent. Blank = keep; '-' clears.">caller token</label><input id="ag-caller" type="password" size="14" placeholder="(unchanged)">
        <label>enabled</label><input type="checkbox" id="ag-enabled" checked></div>
      <div class="row"><button class="act primary" id="ag-save">Save agent</button></div>

    <div class="card"><div class="card-h">Agent runs ${help("agentruns")}<span class="hint">— last 7 days</span>
        <button class="act" style="margin-left:auto" id="ag-clear">Clear runs…</button></div>
      ${active.length ? `<p><b>Running now:</b> ${active.map(x => `${esc(x.agent)} <span class="mono">${esc(x.run_id)}</span> ${x.seconds}s ${esc((x.tools || []).join(", "))}`).join(" · ")}</p>` : ""}
      ${g.length ? `<table><tr><th>agent</th><th>mode</th><th>runs</th><th>completed</th><th>failed</th><th>cancelled</th><th title="Tool calls handed off / still running">running</th><th>p50</th><th>p95</th><th title="Tools the agent ran per task, on average">avg agent tools</th><th>tokens in / out</th><th>top agent tools</th></tr>`
        + g.map(x => `<tr><td class="nw"><b>${esc(x.agent)}</b></td><td class="nw">${esc(x.mode)}</td><td>${x.runs}</td><td>${x.completed}</td>
          <td>${x.failed ? `<span class="pill bad">${x.failed}</span>` : "0"}</td><td>${x.cancelled}</td><td>${x.running}</td>
          <td class="nw">${n(x.p50_ms, "ms")}</td><td class="nw">${n(x.p95_ms, "ms")}</td><td>${x.avg_tool_calls}</td>
          <td class="nw">${x.prompt_tokens} / ${x.completion_tokens}</td>
          <td class="hint">${(x.top_tools || []).map(([t, c]) => `${esc(t)} ×${c}`).join(", ")}</td></tr>`).join("") + `</table>`
        : '<p class="hint">No agent runs yet.</p>'}
      ${rc.length ? `<div class="card-h" style="margin-top:12px">Recent</div><table><tr><th>time</th><th>agent</th><th>mode</th><th>caller</th><th>status</th><th>duration</th><th title="time to first output">first output</th><th>agent tools</th><th>tokens</th><th title="The model the agent itself ran on">agent model</th><th>run / session</th></tr>`
        + rc.map(x => `<tr><td class="nw">${_tsLabel(x.ts)}</td><td class="nw">${esc(x.agent)}</td><td class="nw">${esc(x.mode)}</td>
          <td class="nw hint">${esc(x.caller || "")}</td><td class="nw">${stPill(x.status)}${x.error ? ` <span class="hint" title="${esc(x.error)}">${esc(x.error.slice(0, 60))}</span>` : ""}</td>
          <td class="nw">${n(x.duration_ms, "ms")}</td><td class="nw">${n(x.ttft_ms, "ms")}</td>
          <td class="hint" title="${esc(x.tools_used || "")}">${x.tool_calls || 0}${x.tools_used ? " · " + esc(x.tools_used.split(",").slice(0, 4).join(", ")) : ""}</td>
          <td class="nw">${x.prompt_tokens ?? "—"} / ${x.completion_tokens ?? "—"}</td><td class="nw">${esc(x.model || "")}</td>
          <td class="mono hint">${esc(x.run_id || "")}${x.session_id ? " · " + esc(x.session_id.slice(0, 24)) : ""}</td></tr>`).join("") + `</table>` : ""}
    </div>`;
  window._agents = Object.fromEntries(list.map(a => [a.name, a]));
  window.editAgent = name => {
    const a = window._agents[name]; if (!a) return;
    $("#ag-name").value = a.name; $("#ag-url").value = a.url; $("#ag-model").value = a.model || "";
    $("#ag-tool").checked = !!a.expose_as_tool; $("#ag-sess").checked = !!a.session_continuity;
    $("#ag-timeout").value = a.timeout_seconds; $("#ag-wait").value = a.tool_wait_seconds;
    $("#ag-enabled").checked = !!a.enabled;
    $("#ag-key").placeholder = a.api_key ? "(set — blank keeps it)" : "(none)";
    $("#ag-caller").placeholder = a.caller_token ? "(set — blank keeps it)" : "(none)";
    $("#ag-name").scrollIntoView({behavior: "smooth", block: "center"});
  };
  window.probeAgent = async name => {
    try {
      const r = await api("agents/probe", {method: "POST", body: {name}});
      const h = (r.agents || [])[0] || {};
      toast(h.healthy ? `${name}: up (${h.latency_ms}ms)${h.model ? " · " + h.model : ""}` : `${name}: down — ${h.error || "?"}`, !h.healthy);
      render();
    } catch (e) { toast(e.message, true); }
  };
  $("#ag-save").onclick = () => run(api("agents", {method: "POST", body: {
    name: $("#ag-name").value.trim(), url: $("#ag-url").value.trim(),
    api_key: $("#ag-key").value, caller_token: $("#ag-caller").value,
    model: $("#ag-model").value.trim(), expose_as_tool: $("#ag-tool").checked,
    session_continuity: $("#ag-sess").checked, enabled: $("#ag-enabled").checked,
    timeout_seconds: +$("#ag-timeout").value || 1800, tool_wait_seconds: +$("#ag-wait").value || 600}}));
  $("#ag-clear").onclick = async () => {
    if (!confirm("Delete all recorded agent runs?")) return;
    try { const r = await api("agent-runs/clear", {method: "POST", body: {}}); toast(`Cleared ${r.deleted} run(s)`); render(); }
    catch (e) { toast(e.message, true); }
  };
  wrapTables();
}

// =========================================================================
// Cost tab — what this run's tokens would have cost on paid APIs vs self-host
