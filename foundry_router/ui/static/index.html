};
window.doResearch = async id => {
  try {
    const r = await api("models/research", {method: "POST", body: {model_id: id}});
    toast(r.queued ? "Research queued for " + id : (r.note || "Not queued"));
    render();
  } catch (e) { toast(e.message, true); }
};
window.editModel = id => {
  const m = window._models[id] || {};
  const panel = $("#model-editor");
  panel.style.display = "block";
  $("#me-id").textContent = id;
  $("#me-tier").value = m.relative_cost_tier || "";
  $("#me-policy").value = m.content_policy || "";
  $("#me-tags").value = parseTags(m.tags).join(", ");
  $("#me-good").value = m.good_for || "";
  $("#me-style").value = m.reasoning_style || "";
  $("#me-refine").checked = !!m.benefits_from_explicit_prompting;
  const ok = m.tool_calls_ok || 0, fail = m.tool_calls_failed || 0;
  $("#me-reliability").textContent = (ok + fail) >= 3
    ? `${Math.round(100 * ok / (ok + fail))}% ok over ${ok + fail} observed calls (empirical, from live traffic)`
    : `not enough observed calls yet (${ok + fail}/3 minimum)`;
  // Live benchmark rows, with cross-category score-collision flagging (the
  // corruption signature: two categories sharing one exact score).
  const renderBench = rows => {
    if (!rows || !rows.length) { $("#me-benchmarks").textContent = "none"; return; }
    const byScore = {};
    rows.forEach(b => { (byScore[b.score] = byScore[b.score] || []).push(b.category); });
    $("#me-benchmarks").innerHTML = rows.map(b => {
      const sharing = (byScore[b.score] || []).filter(c => c !== b.category);
      const dup = sharing.length > 0;
      // seed = reference-seed ESTIMATE, not a measured/researched number: shown
      // muted + tagged so it's never mistaken for observed data (spec #1).
      const seed = b.score_source === "seed";
      let tip = `source: ${b.score_source || b.source_type} · ${b.source_type} · ${b.score_type} · conf ${b.confidence}`;
      if (b.last_updated) tip += " · " + String(b.last_updated).slice(0, 19);
      if (seed) tip += " — reference-seed ESTIMATE (knowledge-based placeholder, not a measured/researched score; run research to replace)";
      if (dup) tip += " — COLLISION with " + sharing.join(", ")
                      + "; same score across categories, demoted as synthetic";
      const cls = dup ? " bad" : (seed ? " warn" : "");
      const style = seed ? "border:1px dashed var(--line);opacity:.75" : "border:1px solid var(--line)";
      const shown = b.score == null ? "?" : +(+b.score).toFixed(1);   // no 99.153092… floats
      return `<span class="pill${cls}" style="${style}" title="${esc(tip)}">${esc(b.category)} ${shown}${seed ? " ~seed" : ""}${dup ? " ⚠" : ""}</span>`;
    }).join(" ");
  };
  let crossFlags = {};   // benchmark_name -> [unrelated model ids] (set on load)
  const renderNamed = rows => {
    if (!rows || !rows.length) { $("#me-named").textContent = "none"; return; }
    $("#me-named").innerHTML = rows.map(b => {
      const off = b.scale !== "percent";   // elo/count/score: shown, not tiebroken
      const manual = b.source === "manual";
      // cross-model duplicate: this exact (benchmark, score) also sits on an
      // unrelated model — the mis-attribution signature (spec #2). Red ⚠ for
      // review, NOT auto-removed.
      const dupOn = crossFlags[b.benchmark_name];
      const dup = Array.isArray(dupOn) && dupOn.length > 0;
      let tip = `${b.category} · ${b.scale}${off ? " (not used in tiebreak — non-percent scale)" : ""}${manual ? " · manual (never auto-overwritten)" : ""}${b.source_url ? " · " + b.source_url : ""}`;
      if (dup) tip += ` — ⚠ SAME value on unrelated model(s): ${dupOn.join(", ")}. Likely a leaderboard number scraped onto the wrong model — verify or remove.`;
      const shown = b.score == null ? "?" : +(+b.score).toFixed(1);
      return `<span class="pill${dup ? " bad" : off ? " warn" : ""}" style="border:1px solid var(--line)" title="${esc(tip)}">${esc(b.benchmark_name)} ${shown}${off ? " " + esc(b.scale) : ""}${manual ? " ✎" : ""}${dup ? " ⚠" : ""} <a href="#" data-nb="${esc(b.benchmark_name)}" title="remove" style="text-decoration:none">✕</a></span>`;
    }).join(" ");
    $("#me-named").querySelectorAll("a[data-nb]").forEach(a => {
      a.onclick = async ev => {
        ev.preventDefault();
        try {
          const r = await api("models/named_benchmark/delete",
                              {method: "POST", body: {model_id: id, benchmark_name: a.dataset.nb}});
          renderNamed(r.named);
        } catch (e) { toast(e.message, true); }
      };
    });
  };
  $("#nb-add").onclick = async () => {
    const name = $("#nb-name").value.trim(), score = $("#nb-score").value.trim();
    if (!name || score === "") { toast("name and score required", true); return; }
    try {
      const r = await api("models/named_benchmark/add", {method: "POST", body: {
        model_id: id, benchmark_name: name, category: $("#nb-cat").value,
        score: score, scale: $("#nb-scale").value, source_url: $("#nb-url").value.trim()}});
      toast("Added " + name);
      $("#nb-name").value = ""; $("#nb-score").value = ""; $("#nb-url").value = "";
      renderNamed(r.named);
    } catch (e) { toast(e.message, true); }
  };
  $("#me-benchmarks").textContent = "…";
  $("#me-named").textContent = "…";
  api("models/benchmarks?model_id=" + encodeURIComponent(id))
    .then(r => { crossFlags = r.cross_model_flags || {}; renderBench(r.benchmarks); renderNamed(r.named); })
    .catch(() => { $("#me-benchmarks").textContent = "—"; $("#me-named").textContent = "—"; });
  $("#me-reset-bench").onclick = async () => {
    if (!confirm("Reset " + id + "'s automatic benchmark rows to reference-seed "
                 + "defaults? (manual overrides are kept)")) return;
    try {
      const r = await api("models/reset_benchmarks", {method: "POST", body: {model_id: id}});
      toast("Removed " + r.removed + ", reseeded " + r.reseeded);
      renderBench(r.benchmarks);
    } catch (e) { toast(e.message, true); }
  };
  // The panel lives below a potentially very long table — without this,
  // clicking "edit" appears to do nothing (confirmed deployment bug).
  panel.scrollIntoView({behavior: "smooth", block: "start"});
  $("#me-save").onclick = () => {
    const tags = $("#me-tags").value.split(",").map(s => s.trim()).filter(Boolean);
    run(api("models/update", {method: "POST", body: {
      id, relative_cost_tier: $("#me-tier").value || null,
      content_policy: $("#me-policy").value || null,
      tags: tags.length ? JSON.stringify(tags) : null,
      good_for: $("#me-good").value || null,
      reasoning_style: $("#me-style").value || null,
      benefits_from_explicit_prompting: $("#me-refine").checked ? 1 : 0}}));
  };
};

/* -------------------------------------------------------------- personas -- */
function validationPill(p) {
  let v = {};
  try { v = JSON.parse(p.validation || "{}") || {}; } catch (e) {}
  if (!v.status) return p.routing === "strict" ? '<span class="pill" title="never validated end to end">not validated</span>' : "";
  const cls = v.status === "passed" ? "ok" : v.status === "failed" ? "bad" : "warn";
  const tip = (v.checks || []).map(c => `${c.name}: ${c.status} — ${c.detail}`).join("\n");
  return `<span class="pill ${cls}" title="${esc((v.at || "").slice(0, 16) + "\n" + tip)}">${esc(v.status)}</span>`;
}

function limitsHint(m) {
  if (!m || (!m.context_length && !m.max_output_tokens)) return "";
  const parts = [m.context_length ? formatCtx(m.context_length) + " ctx" : "",
                 m.max_output_tokens ? formatCtx(m.max_output_tokens) + " out" : "",
                 m.capabilities.includes("vision") ? "images" : ""].filter(Boolean);
  return `<span class="hint" style="margin:0 0 0 4px" title="What clients are told (/v1/models, /api/show): effective context and output cap${m.served_model ? " of " + esc(m.served_model) : ""}">${esc(parts.join(" · "))}</span>`;
}

function profileCard(pr) {
  const act = {create: ["will be created", "warn"], update: ["will update", "warn"], unchanged: ["up to date", "ok"],
               kept: ["your edits kept", ""], conflict: ["name taken, untouched", "bad"],
               fill: ["will set backend", "warn"]};
  const c = pr.counts || {};
  const pending = (c.create || 0) + (c.update || 0) + (c.fill || 0);
  const rows = pr.personas.map(e => `<tr><td class="nw mono">${esc(e.persona)}</td>
    <td class="nw mono">${esc(e.model)}</td><td class="nw">${e.backend ? esc(e.backend) : '<span class="hint">' + esc(e.backend_kind) + '</span>'}</td>
    <td class="nw">${e.kind === "media" ? "image" : "chat"}</td>
    <td class="nw">${e.enabled === undefined ? (e.enabled_default ? "on" : "off (default)") : (e.enabled ? "on" : "off")}</td>
    <td class="nw"><span class="pill ${act[e.action][1]}">${act[e.action][0]}</span></td>
    <td>${esc(e.warning || e.note || "")}</td></tr>`).join("");
  return `<div class="card">
    <h2 style="margin-top:0">Default personas: ${esc(pr.title)} <span class="pill">v${pr.version}</span></h2>
    <p class="hint">${esc(pr.description)} Updates never overwrite a persona you've edited, a persona with the same name that the profile didn't create, or the enabled switch.</p>
    <div class="row"><button class="act primary" onclick='applyProfile(${JSON.stringify(pr.id)})' ${pending ? "" : "disabled"}>${pr.installed ? "Update" : "Install"} (${pending} change${pending === 1 ? "" : "s"})</button>
      <button class="act" onclick="showKiloConfig()" title="A Kilo / OpenCode provider block with each persona's real context/output limits and modalities">Kilo provider config</button></div>
    <details${pr.installed ? "" : " open"}><summary style="cursor:pointer">${pr.personas.length} personas</summary>
    <table><tr><th>persona</th><th>model</th><th>backend</th><th>kind</th><th>enabled</th><th>status</th><th></th></tr>${rows}</table></details>
    <pre id="kilo-config" class="mono" style="display:none;max-height:360px;overflow:auto;white-space:pre"></pre>
  </div>`;
}

window.applyProfile = async id => {
  try {
    const r = await api(`profiles/${id}/apply`, {method: "POST"});
    toast("Profile applied: " + Object.entries(r.counts).map(([k, v]) => `${v} ${k}`).join(", "));
    render();
  } catch (e) { toast(e.message, true); }
};

window.showKiloConfig = async () => {
  const el = $("#kilo-config");
  if (el.style.display !== "none") { el.style.display = "none"; return; }
  const r = await api("personas/kilo-config?explain=1&base_url=" + encodeURIComponent(location.origin));
  const notes = Object.entries(r.limits || {}).map(([n, l]) =>
    `//   ${n}: context ${l.context ?? "unset"} (${l.context_source}), output ${l.output ?? "unset"}`
    + (l.unknown_windows.length ? `; window unknown for ${l.unknown_windows.join(", ")}` : "")
    + (l.unreachable_pins.length ? `; NOT REACHABLE now: ${l.unreachable_pins.join(", ")} (strict routing refuses)` : "")
    + `; ${l.validation}`).join("\n");
  el.textContent = "// kilo.jsonc: merge into \"provider\" (set FOUNDRY_KEY_KILO to Kilo's Foundry client key)\n"
    + "// Limits: " + (r.policy || "") + "\n" + notes + "\n"
    + JSON.stringify(r.config, null, 2);
  el.style.display = "block";
};

window.validatePersona = async name => {
  const p = (window._personas || {})[name] || {};
  const b = (window._backends || []).find(x => x.name === p.backend);
  const paid = p.kind === "media" || (b && (b.subscription || b.flavor === "openai"));
  if (paid && !confirm(`Validate ${name}? This sends about 5 real requests${p.kind === "media" ? " (one image job)" : ""} to ${p.backend || "its backend"}, which uses subscription quota.`)) return;
  const out = $("#pv-result");
  out.innerHTML = `<div class="card"><b>Validating ${esc(name)}…</b> <span class="hint">real requests through Foundry's own route; frontier models can take a minute</span></div>`;
  out.scrollIntoView({behavior: "smooth", block: "start"});
  try {
    const r = await api("personas/validate", {method: "POST", body: {virtual_name: name}});
    const cls = s => s === "ok" ? "ok" : s === "fail" ? "bad" : s === "warn" ? "warn" : "";
    window._pvKeep = `<div class="card"><button class="act" style="float:right" onclick="window._pvKeep='';this.closest('.card').remove()">close</button><h2 style="margin-top:0">Validation: ${esc(name)}
      <span class="pill ${r.status === "passed" ? "ok" : r.status === "failed" ? "bad" : "warn"}">${esc(r.status)}</span></h2>
      <p class="hint">served by ${esc((r.served_models || []).join(", ") || "—")} on ${esc((r.backends || []).join(", ") || "—")}</p>
      <table><tr><th>check</th><th>result</th><th>detail</th><th>time</th></tr>${r.checks.map(c =>
        `<tr><td class="nw">${esc(c.name)}</td><td><span class="pill ${cls(c.status)}">${esc(c.status)}</span></td>
         <td style="white-space:normal">${esc(c.detail)}</td><td class="nw">${c.ms != null ? fmtDur(c.ms) : ""}</td></tr>`).join("")}</table></div>`;
    render();          // refresh the list's pills; the result card re-renders from _pvKeep
  } catch (e) {
    out.innerHTML = `<div class="card"><span class="pill bad">error</span> ${esc(e.message)}</div>`;
  }
};

async function tabPersonas() {
  const [d, td, md, sd, pf, pm, st] = await Promise.all([
    api("personas"), api("tools"), api("models"), api("mcp_servers"),
    api("profiles").catch(() => ({profiles: []})), api("personas/meta").catch(() => ({personas: {}})),
    api("status").catch(() => ({backends: []}))]);
  window._backends = (st.backends || []);
  const meta = pm.personas || {};
  // Servers that execute code — a persona preferring any of them is
  // code-execution-enabled and gets flagged distinctly from read-only personas.
  const codeExecServers = new Set(
    (sd.servers || []).filter(s => s.executes_code).map(s => s.name));
  const personaExecutesCode = p => {
    let pref = [];
    try { pref = JSON.parse(p.preferred_mcp_tools || "[]"); } catch (e) {}
    // entries are bare server strings OR {server, tools} objects — check both
    return pref.some(x => codeExecServers.has(typeof x === "string" ? x : (x && x.server)));
  };
  // Review-model choices: any reachable chat-capable model, local or paid —
  // same selection pattern as elsewhere, never hardcoded to a specific model.
  const reviewChoices = (md.models || [])
    .filter(m => m.reachable && !m.embedding)
    .map(m => m.id).sort();
  const reviewOpts = ['<option value="">— choose a model —</option>']
    .concat(reviewChoices.map(id => `<option>${esc(id)}</option>`)).join("");
  // model_allowlist datalist: every known model id (paid ones included even if
  // momentarily unreachable, so Claude ids are always pickable). Just typing
  // suggestions — the field stays a free JSON list.
  window._pickerOptions.models = (md.models || []).slice()
    .sort((a, b) => (b.reachable ? 1 : 0) - (a.reachable ? 1 : 0) || a.id.localeCompare(b.id))
    .map(m => ({value: m.id, label: m.id, group: m.reachable ? "available now" : "known, not reachable now",
                hint: m.cost_tier || ""}));
  window._pickerOptions.tags = [...new Set((md.models || []).flatMap(m => parseTags(m.tags)))].sort();
  // Allow-list picker: backends by name (enabled first), then that backend's
  // advertised models — so a persona can be limited to e.g. cliproxyapi's GPT ids.
  const allowBackendOpts = ['<option value="">— backend —</option>'].concat(
    (window._backends || []).slice()
      .sort((a, b) => (b.enabled - a.enabled) || a.name.localeCompare(b.name))
      .map(b => `<option value="${esc(b.name)}">${esc(b.name)} · ${(b.models || []).length} models${b.enabled ? "" : " · disabled"}${b.enabled && b.healthy === false ? " · down" : ""}</option>`)
  ).join("");
  // Same discovered set the Tools tab reads — no second source, no drift.
  // Grouped by SERVER, now with each server's individual tools so a persona can
  // grant a whole server (one click) OR scope to hand-picked tools within it.
  const servers = {};
  for (const t of (td.tools || []).filter(x => x.kind === "mcp")) {
    // Gateway root-admin tools (mcp-add/mcp-remove/…) are never a selectable
    // grant — they reconfigure the whole gateway. Managed on MCP > Gateway
    // Servers instead, and excluded from persona resolution in the backend too.
    if (t.is_admin) continue;
    const s = t.server || t.name;
    // tool-name-prefix (server__bare, or server:bare on future builds) groups
    // tools by originating server behind a gateway connection; keep the FULL
    // name for grants, show the bare name.
    const full = t.mcp_tool || t.name;
    let prefix = "", bare = full;
    for (const sep of ["__", ":"]) {
      const idx = full.indexOf(sep);
      if (idx > 0 && idx + sep.length < full.length) {
        prefix = full.slice(0, idx); bare = full.slice(idx + sep.length); break;
      }
    }
    (servers[s] ||= {tools: [], disabled: 0}).tools.push(
      {tool: full, prefix, bare, is_write: !!t.is_write,
       is_destructive: !!t.is_destructive, write_kind: t.write_kind,
       badge_source: t.badge_source, disabled: !!t.disabled});
    if (t.disabled) servers[s].disabled++;
  }
  // Per-tool access badge: real when it comes from the server's MCP annotation
  // (readOnlyHint/destructiveHint), a dashed guess when only the name heuristic
  // is available (structured-inspect spec Part 1).
  const toolAccessBadge = t => t.is_destructive
    ? '<span class="pill bad" title="destructiveHint: true (tool annotation)">destructive</span>'
    : (t.write_kind === "write" && t.badge_source === "annotation")
      ? '<span class="pill warn" title="readOnlyHint: false (tool annotation)">write</span>'
    : t.is_write
      ? '<span class="pill warn" style="border:1px dashed;opacity:.8" title="guessed from the tool name — no read/write annotation from this server">write?</span>'
      : "";
  // total tool count per server — used by the Personas table's scoped badge.
  window._mcpServerToolCounts = Object.fromEntries(
    Object.entries(servers).map(([s, i]) => [s, i.tools.length]));
  const serverNames = Object.keys(servers).sort();
  const checklist = serverNames.length
    ? serverNames.map(s => {
        const info = servers[s];
        const allDisabled = info.disabled === info.tools.length;
        const toolBox = t => `
          <label class="mcp-tool-item${t.disabled ? " disabled" : ""}" style="display:block;margin-left:22px">
            <input type="checkbox" class="mcp-tool" data-server="${esc(s)}" data-tool="${esc(t.tool)}"
              data-write="${t.is_write ? 1 : 0}">
            <span class="mono">${esc(t.bare)}</span>
            ${toolAccessBadge(t)}
            ${t.disabled ? '<span class="pill warn">disabled on Tools tab</span>' : ""}
          </label>`;
        // Sub-group by the tool-name-prefix (originating server behind a gateway
        // connection). Prefixed groups become collapsible sections; un-prefixed
        // tools (standalone connections) stay flat.
        const byPrefix = {};
        for (const t of info.tools) (byPrefix[t.prefix] ||= []).push(t);
        const prefixes = Object.keys(byPrefix).sort();
        const toolBoxes = (prefixes.length === 1 && prefixes[0] === "")
          ? info.tools.map(toolBox).join("")
          : prefixes.map(pfx => pfx === ""
              ? byPrefix[pfx].map(toolBox).join("")
              : `<details style="margin-left:22px" open><summary style="cursor:pointer">
                   <b class="mono">${esc(pfx)}</b> <span class="hint">${byPrefix[pfx].length} tool${byPrefix[pfx].length === 1 ? "" : "s"}</span></summary>
                 ${byPrefix[pfx].map(toolBox).join("")}</details>`).join("");
        return `<div class="mcp-item" data-server="${esc(s)}"${allDisabled
            ? ' title="Every tool on this server is disabled on the Tools tab"' : ""}>
          <label>
            <input type="checkbox" class="mcp-srv" value="${esc(s)}"
              data-tools="${esc(info.tools.map(t => t.tool).join(","))}">
            <span class="mono">${esc(s)}</span>
            <span class="hint">mcp · ${info.tools.length} tool${info.tools.length === 1 ? "" : "s"} — select whole server${info.disabled ? ", " + info.disabled + " disabled" : ""}</span>
            ${allDisabled ? '<span class="pill bad">disabled</span>' : ""}
          </label>
          <a href="#" class="mcp-expand" data-server="${esc(s)}" style="margin-left:22px;font-size:12px">customize tools ▸</a>
          <div class="mcp-tools" data-server="${esc(s)}" style="display:none">
            <div class="hint" style="margin-left:22px">Check individual tools to scope this persona to just those; leave the whole-server box for all current & future tools.
              ${info.tools.some(t => t.is_write) ? '<a href="#" class="mcp-readonly" data-server="' + esc(s) + '">select read-only only</a>' : ""}</div>
            ${toolBoxes}
          </div>
        </div>`;
      }).join("")
    : `<span class="hint">No MCP servers discovered yet — add one on the MCP tab.
       Any existing entries on a persona are preserved.</span>`;
  // Client-compat badges (Phase 5): documentation metadata — which clients a
  // persona is tuned for, and how each experiences it (hover for the note).
  const compatCell = p => {
    let compat = {};
    try { compat = JSON.parse(p.client_compat || "{}") || {}; } catch (e) {}
    const pills = Object.entries(compat).map(([c, note]) =>
      `<span class="pill ok" title="${esc(String(note))}">${esc(c)}</span>`).join(" ");
    const style = p.output_style === "plain_text"
      ? ' <span class="pill warn" title="output steered to plain text/markdown — for messaging bridges that cannot render HTML">plain-text</span>' : "";
    return (pills || '<span class="hint">—</span>') + style;
  };
  // MCP-grant badges: a bare server shows plain; a scoped grant shows
  // "server (k/N tools)" so partial access is visible from the table alone.
  const counts = window._mcpServerToolCounts || {};
  const mcpGrantCell = p => {
    let entries = [];
    try { entries = JSON.parse(p.preferred_mcp_tools || "[]"); } catch (e) {}
    if (!Array.isArray(entries) || !entries.length) return '<span class="hint">—</span>';
    return entries.map(e => {
      if (typeof e === "string")
        return `<span class="pill ok" title="whole server — all current & future tools">${esc(e)}</span>`;
      if (e && e.server) {
        const total = counts[e.server];
        const k = (e.tools || []).length;
        return `<span class="pill warn" title="scoped — only ${esc((e.tools || []).join(", "))}">${esc(e.server)} (${k}${total ? "/" + total : ""} tools)</span>`;
      }
      return "";
    }).join(" ");
  };
  const rows = d.personas.map(p => `<tr>
    <td class="pname"><b class="nw">${esc(p.virtual_name)}</b><div class="pills">${p.enabled ? "" : '<span class="pill warn">disabled</span>'}
      ${p.context_window ? '<span class="pill ok" title="admin-set context override">ctx: ' + esc(formatCtx(p.context_window)) + '</span>' : ''}
      ${p.routing === "strict" ? (p.backend && p.backend.startsWith("<")
        ? '<span class="pill bad" title="installed by a profile but no ' + esc(p.backend.slice(1, -1)) + ' backend exists yet: requests are refused (never served by another backend). Re-apply the profile once the backend is added.">strict · no ' + esc(p.backend.slice(1, -1)) + ' backend</span>'
        : '<span class="pill warn" title="strict routing: only its allowlisted models' + (p.backend ? ' on backend ' + esc(p.backend) : '') + ', fails closed with a clear refusal">strict' + (p.backend ? ' · ' + esc(p.backend) : '') + '</span>') : ''}
      ${p.kind === "media" ? '<span class="pill" title="image policy: used by generate_image / edit_image, never as a chat model">image</span>' : ''}
      ${validationPill(p)}
      ${p.profile ? '<span class="pill" title="installed by the default profile ' + esc(p.profile) + '">' + esc(p.profile.split("@")[1] ? "profile v" + p.profile.split("@")[1] : p.profile) + '</span>' : ''}
      ${p.kind === "media" ? "" : limitsHint(meta[p.virtual_name])}
      ${p.review_enabled ? '<span class="pill ' + (p.review_model ? 'ok' : 'warn') + '" title="tiered review pass: ' + esc(p.review_model || 'NO MODEL SELECTED — review will be skipped') + '">🔎 review</span>' : ''}
      ${personaExecutesCode(p) ? '<span class="pill bad" title="This persona can EXECUTE CODE — it prefers a code-sandbox MCP server. Every execution is audited in tool_call_log.">⚠ code exec</span>' : ''}</div></td>
    <td class="nw">${esc(p.benchmark_category)}</td><td class="nw">${esc(p.local_bias_strength)}</td>
    <td>${mcpGrantCell(p)}</td>
    <td>${compatCell(p)}</td>
    <td class="pdesc">${esc(p.description || "")}</td>
    <td class="nw"><button class="act" onclick='editPersona(${JSON.stringify(p.virtual_name)})'>edit</button>
        <button class="act" title="Real round trips through Foundry's own route: text, streaming, a tool call with a boolean argument, image input, length cut-off (one image job for image personas). Works on disabled personas." onclick='validatePersona(${JSON.stringify(p.virtual_name)})'>validate</button>
        <button class="act" onclick='clonePersona(${JSON.stringify(p.virtual_name)})'>clone</button>
        <button class="act" onclick='run(api("personas/delete",{method:"POST",body:{virtual_name:${JSON.stringify(p.virtual_name)}}}))'>delete</button></td>
    </tr>`).join("");
  $("#main").innerHTML = `
    <h2>Personas — virtual models advertised via /api/tags</h2>
    <p class="hint">Each row is a routing policy. Adding a workload type (e.g. Foundry-Creative)
    is adding a row here — never a code change (§4.8).</p>
    ${(pf.profiles || []).map(profileCard).join("")}
    <div id="pv-result">${window._pvKeep || ""}</div>
    <table><tr><th>name</th><th>category</th><th>local bias</th><th>MCP tools</th><th title="Which clients this persona is tuned for — hover a badge for the note. Documentation metadata: one persona serves multiple clients; only fork a client-specific persona when an existing one genuinely doesn't serve that client well.">clients</th><th>description</th><th></th></tr>${rows}</table>
    <div class="card">
      <h2 style="margin-top:0" id="pe-title">Add / edit persona</h2>
      <div class="row"><label>virtual_name</label><input id="pe-name" size="28"></div>
      <div class="row"><label>description</label><input id="pe-desc" size="70"></div>
      <div class="row">
        <label title="THE source of truth for this persona's context. Two effects: (1) reported to clients (AnythingLLM, Open WebUI) via /api/show so they know how much they can send; (2) sent to an OLLAMA worker as num_ctx so the model is LOADED with this much context instead of the backend default — capped at the model's trained max, and a too-big request is rejected (rerouted) rather than silently truncated. llama.cpp/OpenAI set context at their own launch (-c); Claude is fixed. 0 = auto (advertise the max worker window; inject nothing → Ollama's own default).">context_window (tokens)</label>
        <input id="pe-ctx" type="number" min="0" step="1024" size="14" value="0" placeholder="e.g. 131072">
        <span class="hint">(0 = auto-discover from backends)</span>
      </div>
      <div class="row"><label>benchmark_category</label>
        <select id="pe-cat"><option>coding</option><option>reasoning</option>
        <option>general_chat</option><option>tool_calling</option><option>agentic</option></select>
        <label>local_bias_strength</label>
        <select id="pe-bias" title="strong = stay local unless a trigger applies; cost_aware_default = weigh quality vs cost; moderate = between; prefer_paid = start in the PAID tier (for a Claude-first persona like Cline plan)"><option>strong</option><option>moderate</option>
        <option>cost_aware_default</option><option>prefer_paid</option></select>
        <label>enabled</label><input type="checkbox" id="pe-enabled" checked></div>
      <div class="row"><label>escalation_triggers</label>
        <input id="pe-trig" data-multi="json" value="[]" placeholder="type a trigger, Enter to add"></div>
      <div class="row"><label title="MCP servers preferentially loaded for this persona's sessions (writes to preferred_mcp_tools). Checking a server prefers ALL of its tools. Populated live from the Tools tab's discovered set. Model (ask_*) tools are always available and not listed here. Not auto-attached — checking is a deliberate per-persona context-cost choice.">preferred MCP servers</label>
        <div id="pe-mcp" class="mcp-checklist">${checklist}</div></div>

/* Read the MCP checklist back into a preferred_mcp_tools list (per-tool-grant
   spec — mixed shapes). Per listed server: all tools checked => bare server
   string (whole server, incl. future tools); some checked => {server, tools:[…]}
   scoped grant; none => omitted. Prior entries for servers NOT currently shown
   (offline) are preserved verbatim so editing never drops config the UI can't
   display. */
function readPreferredMcp(prevList) {
  const items = [...document.querySelectorAll("#pe-mcp .mcp-item")];
  const listedServers = new Set(items.map(i => i.dataset.server));
  const listedTools = new Set();
  const out = [];
  for (const item of items) {
    const s = item.dataset.server;
    const boxes = [...item.querySelectorAll(".mcp-tool")];
    boxes.forEach(b => listedTools.add(b.dataset.tool));
    const checked = boxes.filter(b => b.checked).map(b => b.dataset.tool);
    if (!checked.length) continue;
    if (checked.length === boxes.length) out.push(s);              // whole server
    else out.push({server: s, tools: checked});                   // scoped
  }
  // Preserve entries whose server isn't shown right now (offline server, etc.).
  for (const e of (prevList || [])) {
    if (typeof e === "string") {
      if (!listedServers.has(e) && !listedTools.has(e)) out.push(e);
    } else if (e && e.server && !listedServers.has(e.server)) {
      out.push(e);
    }
  }
  return out;
}

/* Parse a stored preferred_mcp_tools value into grant sets (mirror of the
   backend parse_preferred_mcp): {whole, bare, scoped{server->Set}}. */
function parsePreferredMcp(raw) {
  let entries = [];
  try { entries = JSON.parse(raw || "[]"); } catch (e) {}
  if (!Array.isArray(entries)) entries = [];
  const whole = new Set(), bare = new Set(), scoped = {};
  for (const e of entries) {
    if (typeof e === "string") bare.add(e);
    else if (e && e.server) {
      if (e.tools == null) whole.add(e.server);
      else (scoped[e.server] ||= new Set(), (e.tools || []).forEach(t => scoped[e.server].add(t)));
    }
  }
  return {whole, bare, scoped};
}

/* Recompute a server-level checkbox from its individual tool boxes: all =>
   checked, none => unchecked, some => indeterminate (the "mixed"/scoped look). */
function refreshServerBox(item) {
  const srv = item.querySelector(".mcp-srv");
  const boxes = [...item.querySelectorAll(".mcp-tool")];
  const n = boxes.filter(b => b.checked).length;
  srv.indeterminate = n > 0 && n < boxes.length;
  srv.checked = boxes.length > 0 && n === boxes.length;
}

/* Wire the checklist interactions once the form is rendered. */
function wireMcpChecklist() {
  document.querySelectorAll("#pe-mcp .mcp-item").forEach(item => {
    const srv = item.querySelector(".mcp-srv");
    const toolBoxes = [...item.querySelectorAll(".mcp-tool")];
    // whole-server box drives all tool boxes (and collapses to the summary).
    srv.addEventListener("change", () => {
      toolBoxes.forEach(b => { b.checked = srv.checked; });
      srv.indeterminate = false;
    });
    // any tool box flips the server box to checked / mixed / unchecked.
    toolBoxes.forEach(b => b.addEventListener("change", () => refreshServerBox(item)));
    const expand = item.querySelector(".mcp-expand");
    const tools = item.querySelector(".mcp-tools");
    if (expand) expand.onclick = ev => {
      ev.preventDefault();
      const open = tools.style.display === "none";
      tools.style.display = open ? "" : "none";
      expand.textContent = open ? "customize tools ▾" : "customize tools ▸";
    };
    const ro = item.querySelector(".mcp-readonly");
    if (ro) ro.onclick = ev => {
      ev.preventDefault();
      toolBoxes.forEach(b => { b.checked = b.dataset.write !== "1"; });
      refreshServerBox(item);
      tools.style.display = "";
      if (expand) expand.textContent = "customize tools ▾";
    };
  });
}

// "MCP tools with client tools" (v0.142.0), on personas and client keys:
// null = inherit (persona: all; client: follow the persona) | "off" | "all" |
// "dedupe" | a list of MCP server/tool names
function _mcpPolicyHTML(id, v, inheritLabel) {
  let mode = "", names = "";
  let list = Array.isArray(v) ? v : null;
  if (!list && typeof v === "string" && v.trim().startsWith("[")) {
    try { list = JSON.parse(v); } catch (e) { list = null; }
  }
  if (list && list.length) {
    mode = "list";
    names = list.every(x => typeof x === "string") ? list.join(", ") : JSON.stringify(list);
  } else if (["off", "all", "dedupe"].includes(v)) mode = v;
  else if (list) mode = "off";
  const opt = (val, label) => `<option value="${val}" ${mode === val ? "selected" : ""}>${label}</option>`;
  return `<select id="${id}" class="mcp-pol">${opt("", esc(inheritLabel))}${opt("off", "off")}${opt("all", "all")}` +
    `${opt("dedupe", "auto-dedupe")}${opt("list", "only these…")}</select>` +
    `<input id="${id}-list" value="${esc(names)}" placeholder="e.g. acestep-music, stable-audio, kokoro-tts, chatterbox-tts, searxng" ` +
    `style="width:260px;${mode === "list" ? "" : "display:none"}">`;
}
function _mcpPolicyRead(id, root) {
  const r = root || document, sel = r.querySelector("#" + id), inp = r.querySelector("#" + id + "-list");
  if (!sel) return undefined;
  if (sel.value === "list") return ((inp && inp.value) || "").trim() || null;
  return sel.value || null;
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t && t.classList && t.classList.contains("mcp-pol")) {
    const inp = document.getElementById(t.id + "-list");
    if (inp) inp.style.display = t.value === "list" ? "" : "none";
  }
});
function _setAgentSelect(v) {
  const sel = $("#pe-agent");
  if (!sel) return;
  sel.dataset.want = v;
  if (v && ![...sel.options].some(o => o.value === v)) sel.add(new Option(v + " (not configured)", v));
  sel.value = v;
}

    <p class="hint">Everything Foundry records, per table. Retention prunes log tables older than N days (0 = keep forever) every ${d.retention.prune_interval_minutes} min. Exports are attachments; the "all" zip includes manifest.json (tables, columns, time column). The kv table (auth tokens) is never exported.</p>
    <div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <label>Format <select id="dx-fmt">${fmts}</select></label>
      <label title="Only rows newer than this (0 = all)">Last <input id="dx-hours" type="number" min="0" value="0" style="width:70px"> hours</label>
      <button class="act primary" id="dx-all">Export all (zip)</button>
      <label>Prune every <input id="dx-int" type="number" min="5" value="${d.retention.prune_interval_minutes}" style="width:60px"> min</label>

      <button class="act" id="dx-prune">Prune now</button>
    </div>

    <div class="card"><table><tr><th>table</th><th>rows</th><th>oldest</th><th>newest</th><th>keep days</th><th></th></tr>${
      d.tables.map(t => `<tr><td>${esc(t.table)}${t.log ? "" : ' <span class="hint">state</span>'}</td><td>${t.rows.toLocaleString()}</td>
        <td>${esc(_tsText(t.oldest))}</td><td>${esc(_tsText(t.newest))}</td>
        <td>${t.log ? `<input class="dx-days" data-t="${esc(t.table)}" type="number" min="0" style="width:60px" value="${days[t.table] || 0}">` : "—"}</td>
        <td><button class="act dx-exp" data-t="${esc(t.table)}">Export</button>
            ${t.log ? `<button class="act dx-clear" data-t="${esc(t.table)}" title="Delete rows (older than N days, or all)">Clear…</button>` : ""}</td></tr>`).join("")}</table></div>`;
  const q = () => `format=${$("#dx-fmt").value}&hours=${+$("#dx-hours").value || 0}`;
  $("#dx-all").onclick = () => { location.href = `/admin/api/data/export-all?${q()}`; };
  document.querySelectorAll(".dx-exp").forEach(b => b.onclick = () => {
    location.href = `/admin/api/data/export?table=${encodeURIComponent(b.dataset.t)}&${q()}`; });
  document.querySelectorAll(".dx-clear").forEach(b => b.onclick = async () => {
    const ans = prompt(`Clear ${b.dataset.t}: delete rows older than how many days? (0 = ALL rows)`, "30");
    if (ans === null) return;
    try {
      const r = await api("data/clear", {method: "POST", body: {table: b.dataset.t, older_than_days: +ans || 0}});
      toast(`Deleted ${r.deleted} row(s)`); render();
    } catch (e) { toast(e.message, true); }
  });
  $("#dx-save").onclick = () => {
    const nd = {...days};
    document.querySelectorAll(".dx-days").forEach(i => { nd[i.dataset.t] = +i.value || 0; });
    run(api("config/data_retention", {method: "POST",
      body: {days: nd, prune_interval_minutes: +$("#dx-int").value || 60}}));
  };
  bindOpsCards();
  $("#dx-prune").onclick = async () => {
    try { const r = await api("data/prune", {method: "POST", body: {}});
          toast("Pruned: " + (Object.entries(r.pruned).map(([t, n]) => `${t} ${n}`).join(", ") || "nothing"));
          render(); } catch (e) { toast(e.message, true); }
  };
}

// Configuration operations (configops.py): history + rollback, snapshots,
// export / import, diagnostics.
function opsCards(cv, sn) {
  const vrows = (cv.versions || []).map((v, i) => `<tr>
    <td class="mono nw">#${v.id}</td><td class="mono nw">${esc((v.ts || "").slice(0, 19).replace("T", " "))}</td>
    <td class="nw">${esc(v.source)}</td><td>${(v.sections || []).map(x => `<span class="pill">${esc(x)}</span>`).join(" ") || '<span class="hint">—</span>'}</td>
    <td class="nw"><button class="act" onclick="showConfigVersion(${v.id})">${i === 0 ? "view" : "diff"}</button>
      ${i === 0 ? '<span class="pill ok">current</span>' : `<button class="act" onclick="restoreConfigVersion(${v.id})">restore</button>`}</td></tr>`).join("");
  const srows = (sn.snapshots || []).map(x => `<tr><td class="mono nw">#${x.id}</td><td class="mono nw">${esc((x.ts || "").slice(0, 19).replace("T", " "))}</td>
    <td>${esc(x.reason)}</td><td class="nw">${x.personas} personas · ${x.pauses} pauses</td>
    <td><button class="act" onclick="restoreSnapshot(${x.id})">restore</button></td></tr>`).join("");
  return `<div class="card">
    <h2 style="margin-top:0">Configuration history <span class="hint" style="font-weight:normal">config format v${esc(String(cv.config_version || 1))}</span></h2>
    <p class="hint">Every save of config.yaml is a version (from the UI, an import, a restore, or an edit of the file itself, noticed at start-up). Restore applies what can change live and lists what needs a restart; a restore is itself a version, so it can be undone. Shown with secrets redacted.</p>
    <div class="tscroll"><table><tr><th>version</th><th>saved (UTC)</th><th>by</th><th>sections changed</th><th></th></tr>${vrows || '<tr><td colspan="5" class="hint">no versions yet</td></tr>'}</table></div>
    <pre id="cv-view" class="mono" style="display:none;max-height:420px;overflow:auto;white-space:pre"></pre>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Export, import &amp; snapshots</h2>
    <div class="row"><button class="act primary" id="ex-btn">Export configuration</button>
      <label for="ex-secrets" title="Include API keys and tokens written literally in config.yaml (\${VAR} references are always kept as references). Off: they are exported as <redacted> and an import keeps the values already configured.">include secrets</label><input type="checkbox" id="ex-secrets"
        onchange="document.querySelector('#ex-secrets-note').style.display=this.checked?'inline':'none'">
      <span id="ex-secrets-note" class="pill bad" style="display:none">the file will contain secrets</span></div>
    <p class="hint">The bundle holds config.yaml (secrets redacted by default), personas, pause switches, tool and model overrides.</p>
    <div class="row"><label>import</label><input type="file" id="im-file" accept=".json,application/json">
      <label for="im-config">config</label><input type="checkbox" id="im-config" checked>
      <label for="im-personas">personas</label><input type="checkbox" id="im-personas" checked>
      <select id="im-mode" title="merge = add new personas and update existing ones; add = only add personas that don't exist yet"><option value="merge">merge personas</option><option value="add">only add new personas</option></select>
      <label for="im-other">pauses &amp; overrides</label><input type="checkbox" id="im-other" checked>
      <button class="act" id="im-go">Import</button></div>
    <p class="hint">Before an import (and before a default-profile apply) the personas, pauses and overrides are snapshotted; the config change is a version above. Redacted values in a bundle never overwrite the real ones configured here.</p>
    <div class="tscroll"><table><tr><th>snapshot</th><th>taken (UTC)</th><th>why</th><th>contents</th><th></th></tr>${srows || '<tr><td colspan="5" class="hint">no snapshots yet</td></tr>'}</table></div>
    <div class="row"><button class="act" onclick="takeSnapshot()">Take a snapshot now</button></div>
  </div>
  <div class="card">
    <h2 style="margin-top:0">Diagnostics</h2>
    <p class="hint">A zip for troubleshooting: versions, redacted config, backend status, health, queues and breakers, personas, budgets, recent events, request metadata and timing, warnings. Secrets are removed by name and by value; prompts, replies, request summaries and images are not included.</p>
    <div class="row"><button class="act primary" onclick="location.href='/admin/api/diagnostics'">Download diagnostic bundle</button></div>
  </div>`;
}

function bindOpsCards() {
  const exp = $("#ex-btn");
  if (exp) exp.onclick = () => { location.href = "/admin/api/export" + ($("#ex-secrets").checked ? "?secrets=1" : ""); };
  const go = $("#im-go");
  if (!go) return;
  go.onclick = async () => {
    const f = $("#im-file").files[0];
    if (!f) { toast("Choose an export file first", true); return; }
    let bundle;
    try { bundle = JSON.parse(await f.text()); } catch (e) { toast("Not a JSON file", true); return; }
    const sections = [];
    if ($("#im-config").checked) sections.push("config");
    if ($("#im-personas").checked) sections.push("personas");
    if ($("#im-other").checked) sections.push("budget_pauses", "tool_overrides", "model_overrides");
    if (!confirm(`Import ${sections.join(", ")} from ${f.name}? A snapshot and a config version are kept so this can be undone.`)) return;
    try {
      const r = await api("import", {method: "POST", body: {bundle, sections, persona_mode: $("#im-mode").value}});
      const c = r.config || {};
      toast(`Imported. ${r.personas ? `Personas: ${r.personas.added} added, ${r.personas.updated} updated. ` : ""}${(c.restart_needed || []).length ? "Restart to apply: " + c.restart_needed.join(", ") : ""}`);
      render();
    } catch (e) { toast(e.message, true); }
  };
}

window.showConfigVersion = async id => {
  const el = $("#cv-view");
  const r = await api(`config/versions/${id}`);
  el.textContent = r.diff_to_current ? `# changes from version ${id} to the current config\n${r.diff_to_current}` : r.yaml;
  el.style.display = "block";
  el.scrollIntoView({behavior: "smooth", block: "nearest"});
};

window.restoreConfigVersion = async id => {
  if (!confirm(`Restore config version #${id}? The current config stays in the history, so this can be undone.`)) return;
  try {
    const r = await api(`config/versions/${id}/restore`, {method: "POST"});
    toast(`Restored #${id}. Applied: ${r.applied.join(", ") || "—"}${r.restart_needed.length ? ". Restart to apply: " + r.restart_needed.join(", ") : ""}`, !!r.restart_needed.length);
    render();
  } catch (e) { toast(e.message, true); }
};

window.restoreSnapshot = async id => {
  if (!confirm(`Restore personas and pause switches from snapshot #${id}? Personas created since then are removed. (A snapshot of the current state is taken first.)`)) return;
  try {
    const r = await api(`snapshots/${id}/restore`, {method: "POST"});
    toast(`Restored: ${r.personas.added} added, ${r.personas.updated} updated, ${r.personas.removed} removed`);
    render();
  } catch (e) { toast(e.message, true); }
};

window.takeSnapshot = async () => {
  try { await api("snapshots", {method: "POST", body: {reason: "manual snapshot"}}); toast("Snapshot taken"); render(); }
  catch (e) { toast(e.message, true); }
};

// Live per-server MCP activity (all callers incl. background research). This is
// what makes research's searxng/crawl4ai use visible — the Usage-tab card only
// sees per-request tool calls, so a background sweep showed nothing there.
function mcpActivityCell(u) {
  if (!u || !u.calls) return '<span class="hint">idle</span>';
  const tools = Object.entries(u.tools || {}).map(([t, c]) => `${esc(t)}×${c}`).join(", ");
  const rl = u.rate_limited ? ` <span class="pill warn" title="429 rate-limited responses">${u.rate_limited}×429</span>` : "";
  return `<details><summary><span class="pill ${u.fail ? "warn" : "ok"}">${u.calls} calls</span>
      <span class="mono" style="color:var(--dim)"> ${u.ok}✓ ${u.fail ? u.fail + "✗" : ""}</span>${rl}</summary>
    <div class="trail">
      <div class="call">${tools || "—"}</div>
      <div class="call">last used ${esc((u.last_ts || "").slice(0, 19))} UTC</div>
      ${u.last_error ? `<div class="call err">last error — ${esc(u.last_error)}</div>` : ""}
    </div></details>`;
}

/* MCP > Gateway Servers (gateway-server admin spec): browse the Docker MCP
   Catalog and attach/detach servers on a live Docker MCP Gateway, no SSH.
   Every action here is a BACKEND-initiated MCP call (operator control panel) —
   never routed through a persona or model tool-loop. */
function gatewaySection(gw) {
  if (!gw || !(gw.gateways || []).length)
    return `<div class="card"><h2 style="margin-top:0">Gateway Servers</h2>
      <p class="hint">No Docker MCP Gateway connection detected. Add an MCP connection
      whose server exposes the gateway management tools (mcp-find / mcp-add) above,
      and this panel appears for browsing & attaching catalog servers.</p></div>`;
  const attached = (gw.attached || []).map(a => {
    const groups = (a.groups || []).map(g => `<tr>
      <td class="mono nw">${esc(g.name)}</td>
      <td class="mono">${(g.tools || []).map(esc).join(", ")}</td>
      <td class="nw">${g.removable
        ? `<button class="act" onclick='gwRemove(${JSON.stringify(g.name)}, ${JSON.stringify(a.gateway)})'>Remove</button>`
        : '<span class="hint">base / ungrouped</span>'}</td></tr>`).join("");
    return `<div style="margin-bottom:10px">
      <b class="mono">${esc(a.gateway)}</b> — <b>${a.tool_count}</b> attached tool(s)
      <table><tr><th>server (namespace)</th><th>tools</th><th></th></tr>
        ${groups || '<tr><td colspan="3" class="hint">no downstream tools attached</td></tr>'}</table>
      <div class="row"><label>remove by ref</label>
        <input class="gw-ref" data-gw="${esc(a.gateway)}" size="24" placeholder="exact server ref">
        <button class="act" onclick='gwRemoveByRef(${JSON.stringify(a.gateway)})'>Remove server</button></div>
    </div>`;
  }).join("");
  return `<div class="card">
    <h2 style="margin-top:0">Gateway Servers — Docker MCP Catalog <span class="pill warn" title="Operator-only. These are backend admin calls (mcp-add/mcp-remove) over the whole gateway — never exposed to any persona or model.">operator-only</span></h2>
    <p class="hint">Browse the catalog and attach/detach servers on the live gateway without SSH.
      Adding/removing runs the gateway's own management tools from Foundry's backend, then re-runs
      Tool Sync so the change shows up. Servers that need <b>secrets</b> can't be added here yet
      (no remote path to the gateway's secrets.env — see docs/GATEWAY_SERVERS.md).
      To read full descriptions of everything available, browse the
      <a href="https://hub.docker.com/mcp" target="_blank" rel="noopener noreferrer">Docker MCP Catalog ↗</a>
      (the same catalog the search below queries).</p>
    <div class="row">
      <input id="gw-q" size="30" placeholder="search the catalog, e.g. playwright">
      <button class="act primary" id="gw-search">Search catalog ▶</button>
      <button class="act" id="gw-listall"
        title="List everything in the catalog (empty search). Large — some gateways cap the result set.">List all ▼</button>
      <span id="gw-status" class="hint"></span>
    </div>
    <div id="gw-results"></div>
    <details style="margin-top:8px">
      <summary class="hint" style="cursor:pointer">Inspect companion service ${(gw.inspect && gw.inspect.url)
        ? '<span class="pill ok">configured</span>' : '<span class="pill warn">not set</span>'}</summary>
      <p class="hint">mcp-find is a summary (name/description only — no tool count or publisher). The richer
        per-server detail comes from <span class="mono">docker mcp catalog server inspect</span>, a host CLI with no
        MCP tool. Run <span class="mono">contrib/gateway-admin-service/gateway_inspect_service.py</span> on the gateway
        host and point Foundry at it to enable a per-row <b>Inspect</b> button. See docs/GATEWAY_SERVERS.md.</p>
      <div class="row">
        <label>inspect URL</label>
        <input id="gw-insp-url" size="30" value="${esc((gw.inspect && gw.inspect.url) || "")}" placeholder="http://192.168.0.114:8899">
        <label title="Bearer token if the companion service sets GATEWAY_INSPECT_TOKEN. Write-only — leave blank to keep the existing one.">token</label>
        <input id="gw-insp-token" type="password" size="18" placeholder="${(gw.inspect && gw.inspect.has_token) ? "set — blank keeps it" : "optional"}">
        <button class="act" id="gw-insp-save">Save</button>
      </div>
    </details>
    <h2 style="font-size:15px">Currently attached (from Tool Sync)</h2>
    ${attached || '<p class="hint">nothing attached</p>'}
  </div>`;
}

function wireGateway(gw) {
  if (!gw || !(gw.gateways || []).length) return;
  const primary = gw.gateways[0];
  const inspectOn = !!(gw.inspect && gw.inspect.url);
  const run = async (fn) => { try { await fn(); } catch (e) { toast(e.message, true); } };
  const saveBtn = $("#gw-insp-save");
  if (saveBtn) saveBtn.onclick = () => run(async () => {
    const body = {url: $("#gw-insp-url").value.trim()};
    const tok = $("#gw-insp-token").value.trim();
    if (tok) body.token = tok;
    await api("gateway/inspect_config", {method: "POST", body});
    toast("Inspect service saved"); render();
  });
  const gwFind = (q) => run(async () => {
    const status = $("#gw-status"), out = $("#gw-results");
    status.textContent = q ? "searching…" : "listing catalog…"; out.innerHTML = "";
    const r = await api("gateway/find", {method: "POST", body: {gateway: primary, query: q}});
    status.textContent = `${(r.results || []).length} result(s)`;
    if (!(r.results || []).length) {
      out.innerHTML = `<p class="hint">No parsed results. Raw gateway output:</p>
        <pre class="mono" style="white-space:pre-wrap;max-height:220px;overflow:auto">${esc(r.raw || "")}</pre>`;
      return;
    }
    // config badge is tri-state and SEPARATE from secrets: a server can need
    // non-secret config yet no secrets (the case that failed silently on add).
    const cfgBadge = s => s.config_required === true
      ? '<span class="pill warn" title="Needs non-secret config values set (via docker mcp config-set / SSH) before it will work">config needed</span>'
      : s.config_required === false ? '<span class="pill ok">none</span>'
      : '<span class="hint" title="mcp-find did not report config info for this server — expand raw to check, or docker mcp catalog server inspect on the host">—</span>';
    out.innerHTML = `<table><tr><th>server</th><th>publisher</th><th>description</th>
        <th title="tools this server exposes, per mcp-find">tools</th>
        <th title="non-secret required config, separate from secrets">config</th>
        <th>secrets</th><th></th></tr>
      ${r.results.map(s => `<tr>
        <td class="mono nw">${esc(s.name)}${s.ref !== s.name ? `<br><span class="hint">${esc(s.ref)}</span>` : ""}</td>
        <td class="nw">${esc(s.publisher || "—")}</td>
        <td>${esc(s.description || "")}
          ${inspectOn ? `<button class="act gw-insp-btn" data-ref="${esc(s.ref)}" style="padding:1px 6px;font-size:11px" onclick='gwInspect(${JSON.stringify(s.ref)})'>inspect ▾</button>` : ""}
          <details><summary style="cursor:pointer;font-size:11px;color:var(--dim)">raw find</summary><pre class="mono" style="white-space:pre-wrap;max-width:560px">${esc(JSON.stringify(s.raw, null, 2))}</pre></details>
          <div class="gw-insp" data-ref="${esc(s.ref)}" style="max-width:640px;display:none"></div>
          ${(s.config_required === true && (s.config_schema || []).length) ? `
          <details class="gw-cfg" data-ref="${esc(s.ref)}"><summary style="cursor:pointer;font-size:11px;color:var(--warn,#c93)">set config ▾</summary>
            <div style="margin:4px 0">
              ${s.config_schema.flatMap(b => Object.entries(b.properties || {}).map(([prop, sch]) => `
                <div class="row"><label title="${esc((b.description || "") + " · type " + ((sch && sch.type) || "string"))}">${esc(prop)}</label>
                  <input class="gw-cfg-in" data-cfg-ref="${esc(s.ref)}" data-cfg-prop="${esc(prop)}" size="26"
                    type="${(sch && (sch.type === "number" || sch.type === "integer")) ? "number" : (sch && sch.type === "boolean") ? "checkbox" : "text"}"></div>`)).join("")}
              <button class="act" onclick='gwConfigSet(${JSON.stringify(s.ref)}, ${JSON.stringify(primary)})'>Save config</button>
              <span class="gw-cfg-status hint" data-ref="${esc(s.ref)}"></span>
            </div></details>` : ""}</td>
        <td class="nw">${s.tools == null ? '<span class="hint" title="mcp-find did not report a tool count — Inspect (if configured) or expand raw">?</span>' : s.tools}</td>
        <td class="nw">${cfgBadge(s)}</td>
        <td class="nw">${s.requires_secrets ? '<span class="pill bad">requires secrets</span>' : '<span class="pill ok">none</span>'}</td>
        <td class="nw">${s.requires_secrets
          ? '<button class="act" disabled title="This server needs secrets. Adding it requires a companion service on the gateway host to write secrets.env — not available yet. Attach it manually via SSH for now.">Add</button>'
          : `<button class="act primary" onclick='gwAdd(${JSON.stringify(s.ref)}, ${JSON.stringify(primary)})'>Add</button>`}</td>
      </tr>`).join("")}</table>
      <details style="margin-top:6px"><summary class="hint" style="cursor:pointer">show raw mcp-find response (the untouched payload — use this to confirm which fields exist before we tune the parser)</summary>
        <pre class="mono" style="white-space:pre-wrap;max-height:320px;overflow:auto">${esc(r.raw || "")}</pre></details>`;
  });
  $("#gw-search").onclick = () => gwFind($("#gw-q").value.trim());
  const listAll = $("#gw-listall");
  if (listAll) listAll.onclick = () => gwFind("");
}

window.gwAdd = async (ref, gateway) => {
  try {
    $("#gw-status") && ($("#gw-status").textContent = `adding ${ref}…`);
    const r = await api("gateway/add", {method: "POST", body: {gateway, ref}});
    const added = (r.sync && r.sync.added || []).length;
    toast(`Added ${ref} — Tool Sync picked up ${added} new tool(s)`);
    render();
  } catch (e) { toast(e.message, true); }
};
window.gwRemove = async (ref, gateway) => {
  if (!confirm(`Remove "${ref}" from the gateway?\n\nAny persona granted its tools loses them, and it disappears from Tool Sync.`)) return;
  try {
    const r = await api("gateway/remove", {method: "POST", body: {gateway, ref}});
    const removed = (r.sync && r.sync.removed || []).length;
    toast(`Removed ${ref} — Tool Sync dropped ${removed} tool(s)`);
    render();
  } catch (e) { toast(e.message, true); }
};
window.gwRemoveByRef = (gateway) => {
  const inp = [...document.querySelectorAll(".gw-ref")].find(i => i.dataset.gw === gateway);
  const ref = inp && inp.value.trim();
  if (!ref) { toast("enter a server ref", true); return; }
  window.gwRemove(ref, gateway);
};
// Structured render of an inspect response: title/image/publisher + a tool
// table whose badges come from real readOnlyHint/destructiveHint annotations
// (name-heuristic guesses are shown dashed + "?"), above the raw output.
function gwInspectBadge(t) {
  if (t.kind === "destructive")
    return '<span class="pill bad" title="destructiveHint: true (tool annotation)">destructive</span>';
  if (t.kind === "write")
    return t.source === "annotation"
      ? '<span class="pill warn" title="readOnlyHint: false (tool annotation)">write</span>'
      : '<span class="pill warn" style="border:1px dashed;opacity:.8" title="guessed from the tool name — this tool has no read/write annotation">write?</span>';
  if (t.kind === "read-only" && t.source === "annotation")
    return '<span class="pill ok" title="readOnlyHint: true">read-only</span>';
  return "";
}
function gwRenderInspect(r) {
  const p = r.parsed || {};
  const head = [];
  if (p.title) head.push("<b>" + esc(p.title) + "</b>");
  if (p.image) head.push('<span class="mono">' + esc(p.image) + "</span>");
  if (p.publisher) head.push("publisher: <b>" + esc(p.publisher) + "</b>");
  if (p.tool_count != null) head.push(p.tool_count + " tool(s)");
  const toolRows = (p.tools || []).map(t => `<tr>
    <td class="mono nw">${esc(t.name)}</td><td>${esc(t.description || "")}</td>
    <td class="nw">${gwInspectBadge(t)}</td></tr>`).join("");
  const table = (p.tools || []).length
    ? `<table style="margin:6px 0"><tr><th>tool</th><th>description</th><th>access</th></tr>${toolRows}</table>`
    : "";
  const err = r.ok === false ? '<span class="pill bad">inspect exited non-zero</span> ' : "";
  return `<div style="margin:6px 0">${err}${head.join(" · ") || '<span class="hint">(no structured summary parsed — see raw)</span>'}${table}</div>
    <details><summary style="cursor:pointer;font-size:11px;color:var(--dim)">raw inspect output</summary>
      <pre class="mono" style="white-space:pre-wrap;max-width:640px;max-height:360px;overflow:auto">${esc(r.raw || "")}</pre></details>`;
}
window.gwInspect = async (ref) => {
  const box = [...document.querySelectorAll(".gw-insp")].find(b => b.dataset.ref === ref);
  const btn = [...document.querySelectorAll(".gw-insp-btn")].find(b => b.dataset.ref === ref);
  if (!box) return;
  if (box.dataset.open === "1") {                 // collapse (Part 2 toggle fix)
    box.style.display = "none"; box.dataset.open = "0";
    if (btn) btn.textContent = "inspect ▾";
    return;
  }
  box.style.display = ""; box.dataset.open = "1";
  if (btn) btn.textContent = "inspect ▲";
  if (box.dataset.loaded === "1") return;         // cached — just re-show
  box.innerHTML = '<span class="hint">inspecting…</span>';
  try {
    const r = await api("gateway/inspect", {method: "POST", body: {server: ref}});
    box.innerHTML = gwRenderInspect(r);
    box.dataset.loaded = "1";
  } catch (e) { box.innerHTML = '<span class="pill bad">inspect failed</span> ' + esc(e.message); }
};
window.gwConfigSet = async (ref, gateway) => {
  const values = {};
  for (const i of [...document.querySelectorAll(".gw-cfg-in")].filter(i => i.dataset.cfgRef === ref)) {
    let v = i.type === "checkbox" ? i.checked
      : i.type === "number" ? (i.value === "" ? null : +i.value) : i.value.trim();
    if (v !== "" && v !== null) values[i.dataset.cfgProp] = v;
  }
  const status = [...document.querySelectorAll(".gw-cfg-status")].find(s => s.dataset.ref === ref);
  if (!Object.keys(values).length) { if (status) status.textContent = "enter at least one value"; return; }
  if (status) status.textContent = "saving…";
  try {
    const r = await api("gateway/config_set", {method: "POST", body: {gateway, server: ref, values}});
    if (status) status.innerHTML = '<span class="pill ok">config-set ok</span> <span class="mono">'
      + esc((r.raw || "").slice(0, 300)) + "</span>";
    toast(`Config saved for ${ref} — try Add now`);
  } catch (e) { if (status) status.innerHTML = '<span class="pill bad">failed</span> ' + esc(e.message); }
};

async function tabMCP() {
  const [d, gw] = await Promise.all([api("mcp_servers"), api("gateway/servers")]);
  const rows = d.servers.map(s => {
    const on = s.enabled !== false;
    return `<tr${on ? "" : ' style="opacity:.5"'}>
    <td>${esc(s.name)}${on ? "" : ' <span class="pill bad" title="Disabled — kept configured but its tools are dropped everywhere (workers, brain, aggregator). Click enable to restore.">off</span>'}${s.executes_code
      ? ' <span class="pill bad" title="This server EXECUTES CODE — full-code audit trail, network/limits enforced by config, per-persona opt-in only">⚠ code exec</span>' : ""}</td>
    <td class="mono">${esc(s.url)}</td><td>${esc(s.transport)}</td>
    <td class="nw">${s.timeout_seconds ?? 300}s${(s.pace_seconds ?? 0) > 0 ? ` · ${s.pace_seconds}s gap` : ""}</td>
    <td class="nw">${s.has_token
        ? '<span class="pill ok" title="' + esc(s.token_header) + '">token set</span> <a href="#" data-cleartoken="' + esc(s.name) + '">clear</a>'
        : '<span class="hint">none</span>'}</td>
    <td class="nw"><span class="mcp-status" data-mcp="${esc(s.name)}">${!on
        ? '<span class="hint">disabled</span>'
        : (s.tool_count
            ? '<span class="pill ok">' + s.tool_count + ' tools</span>'
            : '<span class="hint">no tools synced</span>')}</span></td>
    <td>${mcpActivityCell(s.usage)}</td>
    <td class="nw"><button class="act${on ? "" : " primary"}" title="${on ? "Disable this server — drop all its tools everywhere, keep the connection" : "Enable this server — rediscover and expose its tools"}" onclick='run(api("mcp_servers/toggle",{method:"POST",body:{name:${JSON.stringify(s.name)},enabled:${!on}}}))'>${on ? "disable" : "enable"}</button>
      <button class="act" onclick='testMcp(${JSON.stringify(s.name)})'>test</button>
      <button class="act" onclick='editMcp(${JSON.stringify(s.name)})'>edit</button>
      <button class="act" onclick='run(api("mcp_servers/delete",{method:"POST",body:{name:${JSON.stringify(s.name)}}}))'>remove</button></td>
    </tr>`;
  }).join("");
  window._mcpServers = Object.fromEntries(d.servers.map(s => [s.name, s]));
  window.testMcp = async name => {
    const el = [...document.querySelectorAll(".mcp-status")].find(x => x.dataset.mcp === name);
    if (el) el.textContent = "probing…";
    try {
      const r = await api("mcp_servers/test", {method: "POST", body: {name}});
      if (!el) return;
      el.innerHTML = r.ok
        ? '<span class="pill ok" title="' + esc((r.tools || []).join(", ")) + '">reachable · ' + r.tool_count + ' tools</span>'
        : '<span class="pill bad" title="' + esc(r.error) + '">unreachable</span>';
      if (!r.ok) toast(name + ": " + r.error, true);
    } catch (e) { if (el) el.innerHTML = '<span class="pill bad">error</span>'; toast(e.message, true); }
  };
  $("#main").innerHTML = `
    <h2>MCP server connections (§4.9 item 8)</h2>
    <p class="hint">A connection list, not a tool list — tools are discovered automatically
    per server by Tool Sync once a connection exists.</p>
    <table><tr><th>name</th><th>url</th><th>transport</th><th>timeout / pace</th><th>auth token</th><th>status</th><th>activity</th><th></th></tr>${rows}</table>
    <div class="card">
      <div class="row"><label>name</label><input id="mcp-name" size="16">
      <label>url</label><input id="mcp-url" size="38" placeholder="http://host:port/mcp">
      <label>transport</label><select id="mcp-tr"><option>streamable-http</option><option>sse</option></select>
      <label title="Per-server tool-call budget. Media generation (ComfyUI/TTS/music) can need 600-1800s; search tools should fail fast.">timeout (s)</label>
      <input id="mcp-to" type="number" size="6" value="300">
      <label title="Minimum gap between calls to this server, applied to EVERY caller (research sweep, worker tool loop, brain). SearXNG 429s a burst of queries — set 2-5s here to space them. 0 = off.">pace (s)</label>
      <input id="mcp-pace" type="number" step="0.5" size="5" value="0" title="min seconds between calls (SearXNG: try 3)">
      <label title="On a 429, how many extra attempts before giving up (default 3).">429 retries</label>
      <input id="mcp-retries" type="number" size="4" value="3">
      <label title="Base seconds to wait between 429 retries; escalates each attempt (attempt×base). Default 30.">429 backoff (s)</label>
      <input id="mcp-backoff" type="number" step="1" size="5" value="30"></div>
      <div class="row">
      <label title="Auth token stored in the DB (NOT config.yaml — stored in plaintext, same as config). Sent as 'Authorization: Bearer <token>' by default, or as the raw value of the header you name. Leave blank when editing a server to keep its existing token.">auth token</label>
      <input id="mcp-token" type="password" size="38" placeholder="secret — saved to DB, leave blank to keep">
      <label title="Header the token is sent in. 'Authorization' (default) sends 'Bearer <token>'; any other name (e.g. x-api-key) sends the raw token.">header</label>
      <input id="mcp-hdr" size="16" value="Authorization"></div>
      <div class="row" style="border-top:1px solid var(--border, #333);padding-top:8px">
        <label title="Mark this server as one that EXECUTES CODE (e.g. a code sandbox). Enables the full-code audit trail, the per-persona ⚠ badge, and the sandbox controls below. Nothing is special-cased by name — this is the only switch.">⚠ executes code</label>
        <input type="checkbox" id="mcp-exec">
        <span class="hint">enables sandbox controls + full-code audit trail</span></div>
      <div class="row">
        <label title="One call can take minutes (ComfyUI, Stable Audio). In chat, a call runs as a background job: the reply waits up to media.tool_inline_wait_seconds, then the model gets a job id it checks with tool_job_status — client timeouts can't kill the generation.">⏳ long-running</label>
        <input type="checkbox" id="mcp-long">
        <span class="hint">chat calls become jobs the model checks with tool_job_status</span></div>
      <div id="mcp-sandbox" class="row" style="display:none">
        <label title="CPU cores passed to the sandbox as a call default (config wins over the model). Real enforcement is the sandbox container's cgroup limit — set it there too; a container restart may be needed.">CPU cores</label>
        <input id="mcp-cpus" type="number" step="0.5" min="0" size="5" value="1">
        <label title="Memory cap (MB) passed as a call default. Hard enforcement is the container's --memory limit on the sandbox host.">memory (MB)</label>
        <input id="mcp-mem" type="number" step="128" min="0" size="7" value="512">
        <label title="Network access. OFF (default) is force-applied over the model's request, so a model cannot enable network itself. The real block is the container's --network none — keep both aligned.">network access</label>
        <input type="checkbox" id="mcp-net"></div>
      <div id="mcp-sandbox2" class="row" style="display:none">
        <label title="Advanced: extra call defaults as JSON, force-merged over the model's arguments (config wins). Use this to match the exact argument names YOUR sandbox expects — nothing is hardcoded. The CPU/memory/network fields above write into cpus/memory_mb/network keys; anything here is merged alongside.">extra call_defaults (JSON)</label>
        <input id="mcp-defaults" size="60" value="{}" placeholder='{"language": "python"}'></div>
      <div class="row">
      <button class="act primary" id="mcp-add">Save server</button>
      <button class="act" id="mcp-clear" title="Clear the form to add a new server">new</button></div>
    </div>
    ${gatewaySection(gw)}`;
  wireGateway(gw);
  const syncSandboxVis = () => {
    const on = $("#mcp-exec").checked;
    $("#mcp-sandbox").style.display = on ? "" : "none";
    $("#mcp-sandbox2").style.display = on ? "" : "none";
  };
  $("#mcp-exec").onchange = syncSandboxVis;
  window.editMcp = name => {
    const s = (window._mcpServers || {})[name]; if (!s) return;
    $("#mcp-name").value = s.name;
    $("#mcp-url").value = s.url;
    $("#mcp-tr").value = s.transport;
    $("#mcp-to").value = s.timeout_seconds ?? 300;
    $("#mcp-pace").value = s.pace_seconds ?? 0;
    $("#mcp-retries").value = s.rate_limit_retries ?? 3;
    $("#mcp-backoff").value = s.rate_limit_backoff_seconds ?? 30;
    $("#mcp-hdr").value = s.token_header || "Authorization";
    $("#mcp-token").value = "";   // write-only — blank keeps the existing token
    $("#mcp-token").placeholder = s.has_token
      ? "token is set — leave blank to keep, or type to replace"
      : "secret — saved to DB, leave blank to keep";
    // Sandbox controls: the CPU/mem/network steppers read the conventional
    // keys out of call_defaults; anything else stays in the raw JSON field.
    $("#mcp-exec").checked = !!s.executes_code;
    $("#mcp-long").checked = !!s.long_running;
    const cd = {...(s.call_defaults || {})};
    $("#mcp-cpus").value = cd.cpus ?? 1;
    $("#mcp-mem").value = cd.memory_mb ?? 512;
    $("#mcp-net").checked = !!cd.network;
    delete cd.cpus; delete cd.memory_mb; delete cd.network;
    $("#mcp-defaults").value = JSON.stringify(cd);
    syncSandboxVis();
    document.querySelector("#mcp-name").closest(".card")
      .scrollIntoView({behavior: "smooth", block: "nearest"});
  };
  $("#mcp-clear").onclick = () => {
    for (const id of ["mcp-name", "mcp-url", "mcp-token"]) $("#" + id).value = "";
    $("#mcp-to").value = 300; $("#mcp-pace").value = 0; $("#mcp-hdr").value = "Authorization";
    $("#mcp-retries").value = 3; $("#mcp-backoff").value = 30;
    $("#mcp-tr").value = "streamable-http";
    $("#mcp-exec").checked = false; $("#mcp-long").checked = false;
    $("#mcp-cpus").value = 1; $("#mcp-mem").value = 512;
    $("#mcp-net").checked = false; $("#mcp-defaults").value = "{}"; syncSandboxVis();
  };
  $("#mcp-add").onclick = async () => {
    const name = $("#mcp-name").value.trim(), url = $("#mcp-url").value.trim();
    if (!name || !url) { toast("name and url required", true); return; }
    // Assemble call_defaults: extra JSON first, then the typed sandbox keys on
    // top (so the steppers are authoritative for cpus/memory_mb/network).
    let callDefaults = {};
    if ($("#mcp-exec").checked) {
      try { callDefaults = JSON.parse($("#mcp-defaults").value || "{}"); }
      catch (e) { toast("extra call_defaults is not valid JSON", true); return; }
      callDefaults.cpus = +$("#mcp-cpus").value || 0;
      callDefaults.memory_mb = +$("#mcp-mem").value || 0;
      callDefaults.network = $("#mcp-net").checked;
    }
    try {
      await api("mcp_servers", {method: "POST", body: {
        name, url, transport: $("#mcp-tr").value,
        timeout_seconds: +$("#mcp-to").value || 300,
        pace_seconds: +$("#mcp-pace").value || 0,
        rate_limit_retries: +$("#mcp-retries").value || 3,
        rate_limit_backoff_seconds: +$("#mcp-backoff").value || 30,
        executes_code: $("#mcp-exec").checked,
        long_running: $("#mcp-long").checked,
        call_defaults: callDefaults}});
      const tok = $("#mcp-token").value.trim();
      if (tok) await api("mcp_servers/token", {method: "POST", body: {
        server: name, token: tok, header: $("#mcp-hdr").value.trim() || "Authorization"}});
      toast("Saved"); render();
    } catch (e) { toast(e.message, true); }
  };
  $("#main").querySelectorAll("a[data-cleartoken]").forEach(a => a.onclick = async ev => {
    ev.preventDefault();
    try {
      await api("mcp_servers/token", {method: "POST", body: {server: a.dataset.cleartoken, token: ""}});
      render();
    } catch (e) { toast(e.message, true); }
  });
}
