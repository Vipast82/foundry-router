<!doctype html>
<!--
  Foundry Router admin panel.
  Stack choice: one static HTML file, vanilla JS, zero build toolchain — the
  best maintainability-per-dependency for a small internal admin surface.
  Served by the same FastAPI app at /ui; talks to /admin/api/*.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry Router</title>
<style>
  /* Foundry palette, shared with the control center (/ui/control): "cast iron"
     dark, a cool "mill scale" light (not cream), molten orange from the logo as
     the accent and steel blue for information. Dark is the default; the header
     toggle (remembered in localStorage) or the OS preference picks light. Pill
     backgrounds are variables too, so status chips read in both themes. */
  :root {
    color-scheme: dark;
    --bg:#14110e; --panel:#1c1814; --panel-2:#26201a; --line:#352c23; --fg:#ebe5db; --dim:#a39684;
    --accent:#ff8a1e; --accent-2:#ffb347; --on-accent:#1a1206; --info:#7db4d8;
    --ok:#6cc47c; --bad:#ef5d50; --warn:#e8aa3c;
    --ok-bg:#183020; --bad-bg:#3c1a17; --warn-bg:#382c14; --info-bg:#172a37;
    --ui-font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    /* numbers, headings and navigation: Bahnschrift ships with Windows (DIN
       lineage, like stamped plate); the fallbacks keep the same narrow feel */
    --num-font: Bahnschrift, "DIN Alternate", "Barlow Semi Condensed", "Arial Narrow", var(--ui-font);
    --shadow: 0 1px 0 rgba(0,0,0,.25);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#eef0ed; --panel:#ffffff; --panel-2:#e4e7e3; --line:#d3d7d1; --fg:#1d211e; --dim:#5a625b;
    --accent:#b8560a; --accent-2:#d4761f; --on-accent:#ffffff; --info:#2b6890;
    --ok:#25803d; --bad:#bf3328; --warn:#946200;
    --ok-bg:#e1f1e4; --bad-bg:#fbe3e0; --warn-bg:#f8edd2; --info-bg:#e1edf5;
    --shadow: 0 1px 2px rgba(30,40,30,.08);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.45 var(--ui-font); font-variant-numeric:tabular-nums;
         transition:background .15s ease, color .15s ease; }
  /* Header/nav/main share fluid side padding that grows with the viewport, so
     content fills an ultrawide screen instead of being capped at a fixed width. */
  header { display:flex; align-items:center; gap:14px;
           padding:9px clamp(12px, 1.8vw, 44px);
           background:var(--panel); border-bottom:1px solid var(--line); }
  header .brand { display:flex; flex-direction:column; min-width:0; }
  header h1 { font:600 18px/1.1 var(--num-font); margin:0; color:var(--accent); letter-spacing:.01em; }
  header .sub { color:var(--dim); font-size:12px; }
  #brand-logo { height:36px; width:auto; max-width:180px; border-radius:5px; }
  .hdr-tools { margin-left:auto; display:flex; gap:6px; align-items:center;
               flex-wrap:wrap; justify-content:flex-end; }
  nav { display:flex; flex-direction:column; padding:0 clamp(6px, 1.8vw, 40px);
        background:var(--panel); border-bottom:1px solid var(--line);
        position:sticky; top:0; z-index:8; box-shadow:var(--shadow); }
  nav .navgroups, nav .navsubs { display:flex; gap:2px; overflow-x:auto; scrollbar-width:thin; }
  nav .navsubs { padding:2px 0 0; border-top:1px solid var(--line); }
  nav button { background:none; border:none; color:var(--dim); padding:9px 14px 8px;
               cursor:pointer; font:500 14px/1.2 var(--num-font); letter-spacing:.02em;
               border-bottom:3px solid transparent; white-space:nowrap; flex:none; }
  nav button:hover { color:var(--fg); }
  nav button.active { color:var(--fg); border-bottom-color:var(--accent); }
  nav .navsubs button { font:13px/1.2 var(--ui-font); padding:7px 12px 6px; border-bottom-width:2px; }
  nav .navsubs button.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  main { padding:18px clamp(12px, 1.8vw, 44px); width:100%; }
  h2 { font:600 17px/1.25 var(--num-font); margin:20px 0 8px; color:var(--fg); letter-spacing:.01em; }
  .hint { color:var(--dim); font-size:12px; margin:4px 0 10px; }
  table { border-collapse:collapse; width:100%; margin:6px 0 14px; font-size:13px; }
  th,td { text-align:left; padding:6px 9px; border-bottom:1px solid var(--line);
          vertical-align:top; }
  /* Long model ids/URLs may break anywhere, but headers must never split
     mid-word ("person/a", "ste/ps") — headers stay on one line and the
     table scrolls horizontally inside <main> if it gets too wide. */
  td { word-break:break-word; }
  th { color:var(--dim); font-weight:500; white-space:nowrap; }
  .nw { white-space:nowrap; word-break:normal; }
  .pill { display:inline-block; padding:1px 8px; border-radius:9px; font-size:11px;
          white-space:nowrap; }
  .ok  { background:var(--ok-bg); color:var(--ok); }
  .bad { background:var(--bad-bg); color:var(--bad); }
  .warn{ background:var(--warn-bg); color:var(--warn); }
  button.act { background:var(--panel); color:var(--fg); border:1px solid var(--line);
               border-radius:5px; padding:5px 11px; cursor:pointer; font-size:12px;
               white-space:nowrap; }
  button.act:hover { border-color:var(--accent); }
  a.act { display:inline-block; text-decoration:none; color:var(--fg); background:var(--panel);
          border:1px solid var(--accent); border-radius:5px; padding:5px 11px; font-size:12px; white-space:nowrap; }
  a.act:hover { background:var(--accent); color:var(--on-accent); }
  button.act:disabled { opacity:.35; cursor:not-allowed; }
  button.act:disabled:hover { border-color:var(--line); }
  button.primary { border-color:var(--accent); background:var(--accent); color:var(--on-accent); font-weight:600; }
  button.primary:hover { filter:brightness(1.08); }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  input, select, textarea { background:var(--bg); color:var(--fg);
    border:1px solid var(--line); border-radius:5px; padding:5px 8px; font-size:13px; }
  textarea { width:100%; font-family:ui-monospace, monospace; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .row label { color:var(--dim); font-size:12px; min-width:170px; }
  /* Compact multi-field rows: label hugs its OWN input, groups are spaced apart.
     (Drops the 170px column-label width that spreads label text from its input.) */
  .row.tight { gap:6px; }
  .row.tight label { min-width:0; margin-left:16px; }
  .row.tight > label:first-child { margin-left:0; }
  /* A checkbox/radio and its text, enclosed together (groupControls). */
  .ctl { display:inline-flex; align-items:center; gap:7px; padding:3px 10px 3px 8px;
         border:1px solid var(--line); border-radius:6px; background:var(--bg);
         line-height:1.3; }
  td.pname { min-width: 210px; max-width: 360px; }
  td.pdesc { min-width: 260px; }
  td.bw-wide { min-width: 240px; }
  .routes-svg { display:block; font: 12px system-ui, sans-serif; }
  .routes-svg .rhead { fill: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .routes-svg .rnode-box { fill: var(--panel); stroke: var(--line); }
  .routes-svg .rnode-box.has-err { stroke: var(--bad); }
  .routes-svg .rname { fill: var(--fg); font-weight: 600; }
  .routes-svg .rsub { fill: var(--dim); font-size: 11px; }
  .routes-svg .rgate { fill: var(--warn); font-size: 11px; font-weight: 600; }
  .routes-svg .rlbl { fill: var(--fg); font-size: 11px; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .routes-svg .rdot.ok { fill: var(--ok, #3a4); } .routes-svg .rdot.bad { fill: var(--bad); } .routes-svg .rdot.warn { fill: var(--warn); }
  .routes-svg .redge.click { cursor: pointer; }
  .routes-svg .redge.click:hover path:first-of-type { opacity: 1; filter: brightness(1.2); }
  td.bw-mid { min-width: 150px; }
  td.pname .pills { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; align-items: center; }
  td.pname .pills .pill { margin: 0; }
  .stat { margin-left: 18px; color: var(--dim); white-space: nowrap; }
  .stat b { color: var(--fg); margin-left: 4px; }
  .media-thumb { width: 48px; height: 48px; object-fit: contain; border: 1px solid var(--line); border-radius: 4px; margin-right: 4px; cursor: zoom-in; background: repeating-conic-gradient(#8883 0 25%, transparent 0 50%) 0 0 / 12px 12px; vertical-align: middle; }
.ctl:hover { border-color:var(--accent); }
  /* Same enclosed look when the checkbox is written INSIDE its label. */
  .row > label:has(> input[type=checkbox]), .row > label:has(> input[type=radio]) {
         display:inline-flex; align-items:center; gap:7px; padding:3px 10px 3px 8px;
         min-width:0; border:1px solid var(--line); border-radius:6px; background:var(--bg);
         color:var(--fg); cursor:pointer; font-size:12px; }
  .row > label:has(> input[type=checkbox]):hover,
  .row > label:has(> input[type=radio]):hover { border-color:var(--accent); }
  .row > label > input[type=checkbox], .row > label > input[type=radio] { margin:0; accent-color:var(--accent); }
  .ctl input { margin:0; flex:none; accent-color:var(--accent); cursor:pointer; }
  .row .ctl label, .ctl label { min-width:0; color:var(--fg); cursor:pointer; }
  /* A mid-row label kept next to its own field (groupControls). */
  .fld { display:inline-flex; align-items:center; gap:6px; }
  .row .fld > label { min-width:0; margin-left:0; }
  .row.tight .fld { margin-left:12px; }   /* compact rows: label+field never split by a wrap */
  .row > .fld:first-child { margin-left:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px;
          padding:12px 14px; margin:10px 0; box-shadow:var(--shadow); }
  code, .mono { font-family:ui-monospace, Consolas, monospace; font-size:12px; }
  #toast { position:fixed; bottom:16px; right:16px; background:var(--panel);
           border:1px solid var(--accent); padding:9px 14px; border-radius:6px;
           display:none; z-index:9; }
  details summary { cursor:pointer; color:var(--dim); }
  /* Per-request MCP tool trail. The old rendering forced every call onto one
     nowrap line, so a long line (e.g. a 429 URL) was clipped no matter the
     window size. This wraps and indents each call under the row instead. */
  .trail { margin:4px 0 2px; padding-left:2px; border-left:2px solid var(--line);
           display:flex; flex-direction:column; gap:2px; }
  .trail .call { font-family:ui-monospace, Consolas, monospace; font-size:11.5px;
           white-space:normal; word-break:break-word; padding-left:7px; color:var(--fg); }
  .trail .call .err { color:var(--bad); }
  /* Persona MCP-tool selector: a live checklist replacing the old raw-JSON
     input, populated from the same discovered set the Tools tab shows. */
  .mcp-checklist { display:flex; flex-direction:column; gap:1px; flex:1;
    min-width:280px; max-height:180px; overflow-y:auto; padding:6px 8px;
    border:1px solid var(--line); border-radius:5px; background:var(--bg); }
  .mcp-item { display:flex; align-items:center; gap:7px; color:var(--fg);
    padding:2px 0; min-width:0; }
  .mcp-item.disabled { opacity:.5; }
  .mcp-item input { flex:none; }
  .mcp-item .hint { white-space:nowrap; }
  /* Client tab install guide (rendered server-side from docs/CLIENT_MANAGER.md) */
  .guide-toc { display:flex; flex-wrap:wrap; gap:4px 14px; list-style:none; padding:8px 10px;
               margin:0 0 10px; background:var(--panel-2); border:1px solid var(--line); border-radius:6px; }
  .guide-toc li { margin:0; }
  #cl-guide h3 { margin:18px 0 6px; }
  #cl-guide pre { overflow-x:auto; background:var(--bg); border:1px solid var(--line);
                  border-radius:5px; padding:8px 10px; }
  /* Wide tables scroll inside their own box (added by wrapTables) so the page
     body never scrolls sideways. */
  .tscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:6px 0 14px;
             max-width:100%; }
  .tscroll table { margin:0; }
  /* Numeric steppers: every number input is wrapped (enhanceSteppers) into a
     [-][value][+] control with hold-to-repeat, and still typeable. */
  .stepper { display:inline-flex; align-items:stretch; border:1px solid var(--line);
             border-radius:5px; overflow:hidden; background:var(--bg); vertical-align:middle; }
  .stepper input[type="number"] { border:0; border-radius:0; text-align:center;
             width:5.5em; background:transparent; -moz-appearance:textfield; margin:0; }
  .stepper input[type="number"]::-webkit-outer-spin-button,
  .stepper input[type="number"]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .step-btn { border:0; background:var(--panel); color:var(--fg); cursor:pointer;
             padding:0 11px; font-size:16px; line-height:1; user-select:none;
             -webkit-user-select:none; touch-action:none; }
  .step-btn:hover { background:var(--accent); color:#1a1206; }
  .step-btn:active { filter:brightness(.9); }
  /* Dev-log rows: time / level / logger / message on one wrapping line, with an
     expandable traceback spanning the full width below. */
  .dev-rec { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline;
             padding:5px 2px; border-bottom:1px solid var(--line); font-size:13px; }
  .dev-rec details, .dev-rec pre { flex-basis:100%; }
  .dev-rec pre { background:var(--bg); border:1px solid var(--line); border-radius:5px;
                 padding:8px; overflow:auto; max-height:340px; white-space:pre-wrap;
                 word-break:break-word; margin:4px 0 2px; }
  /* -- Tooltips + help ------------------------------------------------------------
     Every title="" in the app is upgraded on hover into a styled, wrapping
     tooltip (#tip) — readable multi-line help instead of the tiny native one.
     Anything carrying help gets a dotted underline + help cursor so it's
     discoverable. The small round "?" buttons open a longer explanation. */
  #tip { position:fixed; z-index:30; max-width:min(380px, 92vw); display:none;
         background:var(--panel); color:var(--fg); border:1px solid var(--accent);
         border-radius:6px; padding:7px 10px; font-size:12px; line-height:1.45;
         box-shadow:0 6px 22px rgba(0,0,0,.35); pointer-events:none;
         white-space:pre-line; }
  th[title], th[data-tip], .tile[title] .t-lbl, .tile[data-tip] .t-lbl, .has-tip {
         text-decoration:underline dotted var(--dim); text-underline-offset:3px;
         cursor:help; }
  button.help { display:inline-flex; align-items:center; justify-content:center;
         width:17px; height:17px; padding:0; margin-left:5px; border-radius:50%;
         border:1px solid var(--dim); background:transparent; color:var(--dim);
         font-size:11px; font-weight:700; line-height:1; cursor:pointer;
         vertical-align:middle; flex:none; }
  button.help:hover { border-color:var(--accent); color:var(--accent); }
  .mpick { display:flex; flex-wrap:wrap; gap:4px; align-items:center; flex:1; min-width:240px;
    background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:3px 5px; cursor:text; }
  .mpick:focus-within { border-color:var(--accent); }
  .mpick-chip { display:inline-flex; align-items:center; gap:3px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:1px 4px 1px 8px; font-size:12px; max-width:100%; }
  .mpick-chip span { overflow-wrap:anywhere; }
  .mpick-chip button { border:0; background:none; color:var(--dim); cursor:pointer; padding:0 3px; font-size:13px; line-height:1; }
  .mpick-chip button:hover { color:var(--accent); }
  .mpick-n { color:var(--accent); font-size:10px; margin-right:2px; }
  input.mpick-type { border:0; background:none; flex:1; min-width:120px; padding:3px 2px; outline:none; }
  .mpick-menu { position:fixed; z-index:40; background:var(--panel); border:1px solid var(--line);
    border-radius:6px; max-height:260px; overflow:auto; box-shadow:0 6px 20px rgba(0,0,0,.35);
    max-width:min(520px, calc(100vw - 16px)); font-size:13px; }
  .mpick-opt { padding:5px 10px; cursor:pointer; overflow-wrap:anywhere; }
  .mpick-opt:hover { background:var(--bg); color:var(--accent); }
  .mpick-all { color:var(--accent); border-bottom:1px solid var(--line); }
  .mpick-free { color:var(--dim); border-top:1px solid var(--line); font-style:italic; }
  .mpick-group { padding:5px 10px 2px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .modal { position:fixed; inset:0; z-index:25; background:rgba(0,0,0,.55);
         display:flex; align-items:flex-start; justify-content:center;
         padding:6vh 14px; overflow-y:auto; }
  .modal[hidden] { display:none; }
  .modal-box { background:var(--panel); border:1px solid var(--line);
         border-radius:9px; padding:16px 18px; width:min(640px, 100%);
         position:relative; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  .modal-box h3 { margin:0 26px 10px 0; color:var(--accent); font-size:15px; }
  .modal-box .modal-x { position:absolute; top:10px; right:10px; }
  .modal-body p { margin:6px 0; }
  .modal-body dt { font-weight:600; margin-top:8px; }
  .modal-body dd { margin:2px 0 0 14px; color:var(--dim); }
  .modal-body code { background:var(--bg); padding:0 4px; border-radius:3px; }
  /* Headline stat tiles (Performance / Live) */
  .tiles { display:flex; gap:10px; flex-wrap:wrap; }
  .tile { min-width:118px; flex:1 1 118px; background:var(--bg);
          border:1px solid var(--line); border-radius:7px; padding:7px 10px; }
  .tile .t-lbl { color:var(--dim); font-size:11.5px; }
  .tile .t-val { font:600 22px/1.15 var(--num-font); letter-spacing:.01em; }
  .tile .t-sub { color:var(--dim); font-size:11px; }
  .card-h { display:flex; align-items:center; gap:6px; font:600 15px/1.3 var(--num-font);
            letter-spacing:.01em; margin-bottom:8px; flex-wrap:wrap; }
  .card-h .hint { font:12px/1.4 var(--ui-font); margin:0; }
  .card-h .grow { flex:1; }
  /* Horizontal meter (KV-cache fill, slot occupancy) */
  .meter { display:inline-block; width:110px; height:9px; border-radius:5px;
           background:var(--line); overflow:hidden; vertical-align:middle; }
  .meter > span { display:block; height:100%; background:var(--ok); }
  .meter.warn > span { background:var(--warn); }
  .meter.bad > span { background:var(--bad); }
  .srv { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
         gap:8px 18px; margin-top:4px; }
  .srv .k { color:var(--dim); font-size:11.5px; }
  .srv .v { font-weight:600; }
  .est { color:var(--warn); font-weight:700; margin-left:2px; }
  .est-v { color:var(--dim); font-style:italic; }
  /* -- Overview (landing page) ---------------------------------------------------
     One sentence says whether things are fine; the list under it says what
     isn't; the tiles give the headline numbers with a 24-hour trend; the cards
     below are summaries that link to the tab with the detail. */
  .ov-hero { display:flex; align-items:flex-start; gap:12px 20px; flex-wrap:wrap; margin:4px 0 12px; }
  .ov-verdict { flex:1 1 420px; display:flex; gap:12px; align-items:flex-start;
                font:500 clamp(18px, 1.6vw, 24px)/1.3 var(--num-font); letter-spacing:.005em; max-width:62ch; }
  .ov-verdict b { font-weight:600; color:var(--warn); }
  .ov-verdict.is-bad b { color:var(--bad); }
  .ov-dot { flex:none; width:14px; height:14px; margin-top:.3em; border-radius:50%; background:var(--dim); }
  .ov-verdict.is-ok .ov-dot { background:var(--ok); box-shadow:0 0 0 4px var(--ok-bg); }
  .ov-verdict.is-warn .ov-dot { background:var(--warn); box-shadow:0 0 0 4px var(--warn-bg); }
  .ov-verdict.is-bad .ov-dot { background:var(--bad); box-shadow:0 0 0 4px var(--bad-bg); }
  .ov-meta { display:flex; gap:10px; align-items:center; }
  .ov-attn { list-style:none; margin:0 0 14px; padding:0; display:grid; gap:4px; max-width:980px; }
  .ov-attn li a { display:flex; gap:4px 12px; flex-wrap:wrap; align-items:baseline; padding:7px 12px;
                  color:var(--fg); text-decoration:none; border:1px solid var(--line); border-left-width:4px;
                  border-radius:5px; background:var(--panel); }
  .ov-attn li.is-bad a { border-left-color:var(--bad); }
  .ov-attn li.is-warn a { border-left-color:var(--warn); }
  .ov-attn li a:hover { border-color:var(--accent); }
  .ov-attn .hint { margin:0; }
  .ov-kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(175px, 1fr)); gap:10px; margin:0 0 6px; }
  .kpi { display:flex; flex-direction:column; gap:1px; padding:10px 12px 8px; border:1px solid var(--line);
         border-radius:6px; background:var(--panel); color:var(--fg); text-decoration:none; min-width:0;
         box-shadow:var(--shadow); }
  .kpi:hover { border-color:var(--accent); }
  .kpi-l { color:var(--dim); font-size:12.5px; }
  .kpi-v { font:600 30px/1.1 var(--num-font); letter-spacing:.005em; white-space:nowrap; }
  .kpi-v small { font:500 13px var(--num-font); color:var(--dim); margin-left:5px; letter-spacing:.02em; }
  .kpi-s { color:var(--dim); font-size:12px; min-height:1.4em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spark { display:block; width:100%; height:30px; margin-top:4px; }
  .spark-empty { height:30px; margin-top:4px; font-size:11px; color:var(--dim); display:flex; align-items:flex-end;
                 border-bottom:1px dashed var(--line); }
  .ov-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap:0 12px; }
  .ov-grid .card-h .grow { flex:1; }
  .ov-more { font:13px var(--ui-font); color:var(--accent); text-decoration:none; }
  .ov-more:hover { text-decoration:underline; }
  .ov-backs, .ov-list, .ov-bars { list-style:none; margin:0; padding:0; display:grid; gap:4px; }
  .ov-backs li, .ov-list li { display:flex; align-items:center; gap:8px; min-width:0; padding:3px 0;
                              border-bottom:1px solid var(--line); }
  .ov-backs li:last-child, .ov-list li:last-child { border-bottom:0; }
  .ov-backs li .hint, .ov-list li .hint { margin:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ov-led { flex:none; width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .ov-led.is-ok { background:var(--ok); } .ov-led.is-bad { background:var(--bad); } .ov-led.is-warn { background:var(--warn); }
  .ov-led.live { animation:ovpulse 1.6s ease-in-out infinite; }
  @keyframes ovpulse { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { .ov-led.live { animation:none; } }
  .ov-acct { padding:4px 0 8px; border-bottom:1px solid var(--line); margin-bottom:6px; }
  .ov-acct:last-child { border-bottom:0; margin-bottom:0; }
  .ov-win { display:grid; grid-template-columns:minmax(70px, 140px) minmax(0, 1fr) 3.2em; gap:10px; align-items:center; margin:4px 0; }
  .ov-win .meter { width:100%; }
  .ov-win b { font-family:var(--num-font); text-align:right; }
  .ov-bars li { display:grid; grid-template-columns:minmax(0, 1.3fr) minmax(60px, 1fr) 3em; gap:10px; align-items:center; }
  .ov-bl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ov-bl .hint { margin:0; }
  .ov-bt { height:8px; border-radius:4px; background:var(--panel-2); overflow:hidden; }
  .ov-bt i { display:block; height:100%; background:var(--accent); border-radius:4px; }
  .ov-bars b { font-family:var(--num-font); text-align:right; }
  @media (max-width: 560px) {
    .ov-kpis { grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px; }
    .kpi { padding:8px 10px 6px; }
    .kpi-v { font-size:24px; }
    .kpi-s { white-space:normal; font-size:11.5px; }
    .ov-verdict { font-size:18px; }
  }
  /* -- Charts: hover a column for its values (styled tooltip) */
  .lc .hit { fill:transparent; }
  .lc .hit:hover { fill:var(--accent); fill-opacity:.10; }
  .jump { font-size:12.5px; color:var(--dim); margin:2px 0 6px; }
  .jump a { color:var(--accent); }
  h2[id] { scroll-margin-top:96px; }
  .chart-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap:0 12px; }
  /* -- Responsive: PC / tablet / phone ---------------------------------------- */
  @media (max-width: 900px) {
    header { flex-wrap:wrap; gap:4px 12px; padding:9px 12px; }
    main { padding:14px 12px; }
    .row label { min-width:0; }        /* 170px labels would force overflow */
    .card { padding:10px 11px; }
    th, td { padding:5px 7px; }
    table { font-size:12px; }
  }
  @media (max-width: 560px) {
    header h1 { font-size:15px; }
    header .sub { width:100%; }         /* version/pool/brain drop to their own line */
    nav { padding:0 6px; }
    nav button { padding:8px 9px; font-size:12px; }
    main { padding:12px 9px; }
    .row { gap:6px; }
    .row input, .row select { flex:1; min-width:120px; }
    /* ...but never stretch a checkbox/radio away from its text */
    .row input[type=checkbox], .row input[type=radio] { flex:none; min-width:0; }
    .ctl, .row > label:has(> input[type=checkbox]) { max-width:100%; }
    .fld { flex:1 1 100%; min-width:0; }
    .fld > input, .fld > select { flex:1; min-width:0; width:auto; }
    table { font-size:11.5px; }
    th, td { padding:5px 6px; }
  }
</style>
</head>
<body>
<header>
  <img id="brand-logo" alt="" hidden>
  <div class="brand">
    <h1>Foundry Router</h1>
    <span class="sub" id="hdr-info">loading…</span>
  </div>
  <div class="hdr-tools">
    <a class="act cc-link" href="/ui/control" title="Open the coordinator control center: live sprint progress, sessions and operator actions">Control center</a>
    <button class="act" id="logo-btn" title="Upload or change the header logo (PNG/SVG, under 512 KB)">Logo…</button>
    <button class="act" id="logo-clear" title="Remove the custom logo" hidden>✕</button>
    <button class="act" id="theme-btn" title="Toggle light / dark theme">🌙 Dark</button>
  </div>
  <input type="file" id="logo-file" accept="image/*" hidden>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>

<script>
"use strict";
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Each tab render gets a sequence number. A data request (GET) started for one
// render that finishes after the user moved to another tab is dropped, so a
// slow tab (e.g. Host Admin waiting on an unreachable backend) can never paint
// over the tab the user is now looking at.
let _renderSeq = 0;
function _adminKey() { try { return localStorage.getItem("foundryAdminKey") || ""; } catch (e) { return ""; } }
async function api(path, opts={}) {
  const seq = _renderSeq;
  const headers = {"Content-Type": "application/json"};
  const k = _adminKey();
  if (k) headers["Authorization"] = "Bearer " + k;
  const r = await fetch("/admin/api/" + path, {
    headers, ...opts,
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!opts.method && seq !== _renderSeq) {
    const stale = new Error("stale render"); stale.stale = true; throw stale;
  }
  if (r.status === 401 || (r.status === 403 && (data.error || {}).code === "admin_key_required")) {
    // client_auth.protect_admin is on: ask once for an admin-scoped client key.
    const entered = prompt("This Foundry's admin UI needs an admin client key (clients[] with the 'admin' scope):");
    if (entered) {
      try { localStorage.setItem("foundryAdminKey", entered.trim()); } catch (e) {}
      return api(path, opts);
    }
  }
  if (!r.ok) {
    const e = data.error;
    throw new Error((e && e.message) || e || r.statusText);
  }
  return data;
}
function toast(msg, isErr=false) {
  const t = $("#toast");
  t.textContent = msg; t.style.borderColor = isErr ? "var(--bad)" : "var(--accent)";
  t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3500);
}
const formatCtx = n => n >= 1000 ? Math.round(n / 1000) + 'K' : String(n);
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const run = p => p.then(d => { toast("Saved"); render(); return d; })
                  .catch(e => toast(e.message, true));

// Clear a log table (usage/events) after confirmation, then re-render the tab.
function clearLog(kind, label) {
  if (!confirm(`Permanently delete all ${label}? This cannot be undone.`)) return;
  api(kind + "/clear", { method: "POST" })
    .then(r => { toast(`Cleared ${r.removed} row(s)`); render(); })
    .catch(e => toast(e.message, true));
}

// In-page "jump to" links scroll; they never touch the tab hash.
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a[data-jump]");
  if (!a) return;
  e.preventDefault();
  const t = document.querySelector(a.getAttribute("href"));
  if (t) t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
});

/* ------------------------------------------------------------ tooltips -- */
// One global handler upgrades every title="" into the styled #tip tooltip on
// hover (the attribute moves to data-tip so the tiny native one never doubles
// up). Works for markup rendered later too — no per-tab wiring.
const _tip = document.createElement("div");
_tip.id = "tip";
document.body.appendChild(_tip);
let _tipEl = null;
function _placeTip(el) {
  const r = el.getBoundingClientRect(), tw = _tip.offsetWidth, th = _tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left), window.innerWidth - tw - 8);
  let y = r.bottom + 6;
  if (y + th > window.innerHeight - 8) y = Math.max(8, r.top - th - 6);
  _tip.style.left = x + "px"; _tip.style.top = y + "px";
}
document.addEventListener("mouseover", e => {
  const el = e.target.closest && e.target.closest("[title],[data-tip]");
  if (!el || el === _tipEl) return;
  if (el.hasAttribute("title")) {
    const t = el.getAttribute("title");
    el.removeAttribute("title");
    if (t) el.setAttribute("data-tip", t);
  }
  const txt = el.getAttribute("data-tip");
  if (!txt) return;
  _tipEl = el;
  _tip.textContent = txt;
  _tip.style.display = "block";
  _placeTip(el);
});
document.addEventListener("mouseout", e => {
  if (_tipEl && !_tipEl.contains(e.relatedTarget)) { _tip.style.display = "none"; _tipEl = null; }
});
["scroll", "mousedown", "keydown"].forEach(ev => document.addEventListener(ev, () => {
  _tip.style.display = "none"; _tipEl = null; }, true));

/* ------------------------------------------------------- multi-picker -- */
// Any list field becomes chips + a search box with a dropdown that stays open,
// so several items can be picked one after another. Mark an input with
//   data-multi="json" (value is a JSON list) or "csv" (comma-separated)
//   data-options="<key in window._pickerOptions>"   optional suggestions
//   data-ordered                                    keep/allow reordering
//   data-free="0"                                   only listed options
// The input stays the source of truth (hidden, same format as before), so
// existing load/save code is unchanged; assigning input.value re-renders.
window._pickerOptions = window._pickerOptions || {};
window._pickerOptions.evalChecks = ["code_block", "cites_source", "valid_json", "no_refusal",
  {value: "min_length:200", hint: "edit the number, Enter", template: true},
  {value: "max_length:2000", hint: "edit the number, Enter", template: true},
  {value: "mentions:", hint: "type the word, Enter", template: true}];
const _valueDesc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
function _pickParse(raw, fmt) {
  raw = (raw || "").trim();
  if (!raw) return [];
  if (fmt === "json") {
    try { const v = JSON.parse(raw); if (Array.isArray(v)) return v.map(String); } catch (e) {}
  }
  return raw.replace(/^\[|\]$/g, "").split(",").map(s => s.trim().replace(/^["']|["']$/g, "")).filter(Boolean);
}
function _pickOpts(key) {
  const o = window._pickerOptions[key];
  const list = typeof o === "function" ? o() : (o || []);
  return list.map(x => typeof x === "string" ? {value: x, label: x} : {label: x.value, ...x});
}
let _pickOpen = null;
function _pickClose() { if (_pickOpen) { _pickOpen.menu.remove(); _pickOpen = null; } }
document.addEventListener("mousedown", e => {
  if (_pickOpen && e.target.isConnected && !_pickOpen.menu.contains(e.target)
      && !_pickOpen.box.contains(e.target)) _pickClose();
});
window.addEventListener("resize", _pickClose);
document.addEventListener("scroll", e => {
  if (_pickOpen && !_pickOpen.menu.contains(e.target)) _pickOpen.place();
}, true);
function enhancePickers(root) {
  (root || document).querySelectorAll("input[data-multi]:not([data-picker])").forEach(input => {
    input.dataset.picker = "1";
    const fmt = input.dataset.multi, key = input.dataset.options || "";
    const ordered = "ordered" in input.dataset, free = input.dataset.free !== "0";
    const box = document.createElement("div");
    box.className = "mpick";
    box.title = input.title || "";
    input.style.display = "none";
    input.after(box);
    const get = () => _pickParse(_valueDesc.get.call(input), fmt);
    const set = arr => {
      arr = [...new Set(arr.map(s => String(s).trim()).filter(Boolean))];
      _valueDesc.set.call(input, fmt === "json" ? JSON.stringify(arr) : arr.join(", "));
      render();
      input.dispatchEvent(new Event("input", {bubbles: true}));
      input.dispatchEvent(new Event("change", {bubbles: true}));
    };
    Object.defineProperty(input, "value", {configurable: true,
      get() { return _valueDesc.get.call(input); },
      set(v) { _valueDesc.set.call(input, v); render(); }});
    const typer = document.createElement("input");
    typer.className = "mpick-type";
    typer.setAttribute("aria-label", "add item");
    function render() {
      const cur = get();
      box.innerHTML = "";
      cur.forEach((v, i) => {
        const chip = document.createElement("span");
        chip.className = "mpick-chip";
        chip.innerHTML = (ordered ? `<b class="mpick-n">${i + 1}</b>` : "") + `<span>${esc(v)}</span>` +
          (ordered && i > 0 ? `<button type="button" title="Move earlier" data-up>‹</button>` : "") +
          (ordered && i < cur.length - 1 ? `<button type="button" title="Move later" data-down>›</button>` : "") +
          `<button type="button" title="Remove" data-rm>×</button>`;
        chip.querySelector("[data-rm]").onclick = () => set(cur.filter((_, j) => j !== i));
        const up = chip.querySelector("[data-up]"), down = chip.querySelector("[data-down]");
        if (up) up.onclick = () => { const a = cur.slice(); [a[i - 1], a[i]] = [a[i], a[i - 1]]; set(a); };
        if (down) down.onclick = () => { const a = cur.slice(); [a[i + 1], a[i]] = [a[i], a[i + 1]]; set(a); };
        box.appendChild(chip);
      });
      typer.placeholder = cur.length ? "add more…" : (input.placeholder && !input.placeholder.startsWith("[") ? input.placeholder : "type or pick…");
      box.appendChild(typer);
    }
    function add(v) { if (v && v.trim()) set(get().concat(v.split(fmt === "json" ? /\n/ : /,/))); typer.value = ""; }
    function menu() {
      _pickClose();
      const cur = new Set(get()), q = typer.value.trim().toLowerCase();
      const opts = _pickOpts(key).filter(o => !cur.has(o.value) && (!q || (o.value + " " + o.label + " " + (o.group || "")).toLowerCase().includes(q)));
      if (!opts.length && !(free && q)) return;
      const m = document.createElement("div");
      m.className = "mpick-menu";
      let html = "", group = null;
      if (q && opts.length > 1) html += `<div class="mpick-opt mpick-all" data-all="1">add all ${opts.length} matches</div>`;
      opts.slice(0, 300).forEach(o => {
        if ((o.group || null) !== group) { group = o.group || null; if (group) html += `<div class="mpick-group">${esc(group)}</div>`; }
        html += `<div class="mpick-opt" data-v="${esc(o.value)}"${o.template ? ' data-t="1"' : ""}>${esc(o.label)}${o.hint ? ` <span class="hint">${esc(o.hint)}</span>` : ""}</div>`;
      });
      if (free && q && !opts.some(o => o.value.toLowerCase() === q))
        html += `<div class="mpick-opt mpick-free" data-v="${esc(typer.value.trim())}">add “${esc(typer.value.trim())}” as typed</div>`;
      m.innerHTML = html;
      m.querySelectorAll(".mpick-opt").forEach(el => el.onmousedown = e => {
        e.preventDefault();
        e.stopPropagation();          // the outside-click closer must not see this pick
        if (el.dataset.t) { typer.value = el.dataset.v; typer.focus(); _pickClose(); return; }
        if (el.dataset.all) set(get().concat(opts.filter(o => !o.template).map(o => o.value))); else add(el.dataset.v);
        typer.value = "";
        typer.focus();
        menu();                      // stays open: pick the next one
      });
      document.body.appendChild(m);
      const place = () => {
        const r = box.getBoundingClientRect();
        m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + "px";
        m.style.minWidth = Math.min(r.width, innerWidth - 16) + "px";
        const below = innerHeight - r.bottom;
        if (below < 200 && r.top > below) { m.style.top = ""; m.style.bottom = (innerHeight - r.top + 2) + "px"; }
        else { m.style.bottom = ""; m.style.top = (r.bottom + 2) + "px"; }
      };
      place();
      _pickOpen = {menu: m, box, place};
    }
    typer.addEventListener("focus", menu);
    typer.addEventListener("input", menu);
    typer.addEventListener("keydown", e => {
      if (e.key === "Enter" || (e.key === "," && fmt === "csv") || (e.key === "Tab" && typer.value.trim())) {
        if (!typer.value.trim()) return;
        e.preventDefault();
        // exact match, else the only match, else the typed text (or, for a
        // fixed list, the first match)
        const t = typer.value.trim(), tl = t.toLowerCase(), cur = new Set(get());
        const opts = _pickOpts(key).filter(o => !cur.has(o.value) && !o.template);
        const exact = opts.find(o => o.value.toLowerCase() === tl);
        const hits = opts.filter(o => (o.value + " " + o.label).toLowerCase().includes(tl));
        if (exact) add(exact.value);
        else if (hits.length === 1 && !(free && e.key === ",")) add(hits[0].value);
        else if (free) add(t);
        else if (hits.length) add(hits[0].value);
        menu();
      } else if (e.key === "Backspace" && !typer.value) {
        const cur = get(); if (cur.length) set(cur.slice(0, -1));
      } else if (e.key === "Escape") { _pickClose(); }
    });
    typer.addEventListener("paste", e => {
      const t = (e.clipboardData || window.clipboardData).getData("text");
      if (/[,\n]/.test(t)) { e.preventDefault(); set(get().concat(_pickParse(t, fmt).length ? _pickParse(t, fmt) : t.split(/[,\n]/))); }
    });
    box.addEventListener("mousedown", e => { if (e.target === box) { e.preventDefault(); typer.focus(); } });
    render();
  });
}

/* --------------------------------------------------------------- modal -- */
const _modal = document.createElement("div");
_modal.className = "modal"; _modal.hidden = true;
_modal.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true">
  <button class="act modal-x" title="Close (Esc)">✕</button><h3></h3><div class="modal-body"></div></div>`;
document.body.appendChild(_modal);
function closeModal() { _pickClose(); _modal.hidden = true; $(".modal-body", _modal).innerHTML = ""; }
function openModal(title, html) {
  $("h3", _modal).textContent = title;
  $(".modal-body", _modal).innerHTML = html;
  _modal.hidden = false;
  enhancePickers($(".modal-body", _modal));
  return $(".modal-body", _modal);
}
$(".modal-x", _modal).onclick = closeModal;
_modal.addEventListener("click", e => { if (e.target === _modal) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !_modal.hidden) closeModal(); });

/* ---------------------------------------------------------------- help -- */
// Longer explanations behind the small "?" buttons. Short hover text lives in
// title="" on the element itself; this is the "what does this mean and what
// should I do about it" layer.
const HELP = {
  live: ["Live activity", `
    <p>A 2-second heartbeat of the router: which models are generating right now, how fast
    they've been running, what's loaded on each GPU host, and what just finished.</p>
    <p>Rates marked <b>avg · last</b> show the rolling average over every recorded call and the most
    recent single call. Hover any column header or pill for a one-line definition.</p>
    <p>Starting fresh (e.g. after a GPU swap)? Use <b>Clear stats…</b> — and set a
    <b>run label</b> on the Performance tab so old and new numbers stay separable.</p>`],
  generating: ["Models generating now", `
    <p>Every model with a call in flight at this instant, how long it has been running, and
    <b>×N</b> when several requests share it. The ~tok/s is that model's average decode speed.</p>
    <p>A model sitting here far longer than usual usually means a cold load (weights being read
    into VRAM) or a very large prompt being prefilled.</p>`],
  perfstrip: ["Recent performance", `
    <dl>
    <dt>effective tok/s</dt><dd>Output tokens ÷ total wall time over the last N requests — includes
      prefill, queueing and tool time. This is the speed you actually feel.</dd>
    <dt>decode tok/s</dt><dd>Pure generation speed once the model is producing tokens. Always ≥ effective;
      a big gap means prefill/queue/tool time dominates.</dd>
    <dt>Ø s / req</dt><dd>Average end-to-end time per finished request.</dd>
    <dt>truncations</dt><dd>Replies cut off because they hit the output-token cap
      (<code>worker_max_tokens</code>). Each one is a turn where Cline/Kilo has to say “continue”.
      A rising count means the cap is too low or the model is looping — try a repeat/DRY penalty.</dd>
    </dl>`],
  servers: ["Inference servers (engine metrics)", `
    <p>Numbers reported by the inference <b>engine itself</b> — not per request, but server-wide.
    They answer “is the box saturated?” rather than “how fast was that call?”.</p>
    <dl>
    <dt>KV cache</dt><dd>How full the key/value cache is. Near 100% the server must queue, evict or
      (vLLM) preempt requests. More VRAM (e.g. 22 GB cards) or a smaller context / quantized
      cache (<code>-ctk q8_0 -ctv q8_0</code> on llama.cpp) buys headroom.</dd>
    <dt>running / queued</dt><dd>Requests being processed vs waiting for a free slot.
      A persistent queue means more parallel slots (<code>-np</code>) or a second GPU host would help.</dd>
    <dt>slots busy</dt><dd>llama.cpp parallel slots in use (from <code>/slots</code>).</dd>
    <dt>engine prefill / decode tok/s</dt><dd>The engine's own throughput averages (lifetime of the
      server process) — a cross-check for the per-call numbers below.</dd>
    <dt>mean TTFT / TPOT / queue</dt><dd>vLLM histogram means: time to first token, time per output
      token (1000 ÷ TPOT = decode tok/s), and time spent queued.</dd>
    <dt>prefix cache</dt><dd>Share of prompt tokens served from cache (vLLM automatic prefix caching).</dd>
    <dt>preemptions</dt><dd>vLLM paused a request because the KV cache ran out. Any non-zero, growing
      value = VRAM pressure; lower <code>--max-num-seqs</code> or <code>--max-model-len</code>.</dd>
    <dt>Meridian</dt><dd>Sign-in status and plan from <code>/health</code>, plus request counts and
      queue / time-to-first-token / upstream / total latency from its <code>/metrics</code> —
      covering every client using that Meridian, not just Foundry.</dd>
    </dl>
    <p><b>Enable it:</b> llama.cpp needs <code>--metrics</code> (and <code>/slots</code> not disabled);
    vLLM and Meridian expose <code>/metrics</code> by default.</p>`],
  loaded: ["Loaded models — per-model performance", `
    <p>One row per model resident on a backend, with everything the router has measured for it.
    <b>avg</b> = rolling average across all recorded calls; <b>last</b> = the most recent call.</p>
    <dl>
    <dt>VRAM · ctx</dt><dd>GPU memory held (Ollama reports it; llama.cpp/vLLM don't over HTTP, so “—”)
      and the serving context window below it.</dd>
    <dt>TTFT</dt><dd>Time to first token — how long you wait before anything appears. Dominated by prefill on
      big prompts; much higher than “prefill time” means the request was queued.</dd>
    <dt>decode tok/s · decode time</dt><dd>Generation speed and how long generation took.</dd>
    <dt>prefill tok/s · prefill time</dt><dd>Prompt-processing speed and duration. Only tokens actually
      processed count — prompt tokens served from the KV cache are excluded, so a cache hit doesn't
      inflate the rate.</dd>
    <dt>eff tok/s</dt><dd>Output ÷ total wall time of each call (incl. prefill + queue).</dd>

// A "?" button opening HELP[key] in the modal. Use inside headings/cards.
function help(key) {
  const h = HELP[key];
  return h ? `<button type="button" class="help" data-help="${key}" title="What is this? — ${esc(h[0])}">?</button>` : "";
}
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button.help[data-help]");
  if (!b) return;
  const h = HELP[b.getAttribute("data-help")];
  if (h) openModal(h[0], h[1]);
});

/* ------------------------------------------------- clear perf data dialog -- */
// Shared by the Live and Performance tabs. `pre` preselects {model, backend,
// run_label} from the current filters.
async function openClearDialog(pre) {
  pre = pre || {};
  let hist = {models: [], backends: [], run_labels: []};
  try { hist = await api("perf-history?hours=720"); } catch (e) {}
  const opt = (v, l, sel) => `<option value="${esc(v)}"${sel ? " selected" : ""}>${esc(l)}</option>`;
  const body = openModal("Clear performance data", `
    <p class="hint" style="margin-top:0">Start with clean numbers — e.g. after changing GPUs, a
      model, or launch flags.</p>
    <details style="margin:0 0 8px"><summary>What does each option clear?</summary>${HELP.clear[1]}</details>
    <div class="row"><label title="Everything, or just one model">Scope</label>
      <select id="clr-model">${opt("", "All models", !pre.model)}${(hist.models || []).map(m =>
        opt(m.model, m.model + " (" + m.n + " calls)", m.model === pre.model)).join("")}</select></div>
    <div class="row"><label title="History samples only: limit to one backend">Backend (history)</label>
      <select id="clr-backend">${opt("", "any", !pre.backend)}${(hist.backends || []).map(b =>
        opt(b.backend, (b.backend || "(none)") + " (" + b.n + ")", b.backend === pre.backend)).join("")}</select></div>
    <div class="row"><label title="History samples only: limit to one run label">Run (history)</label>
      <select id="clr-run">${opt("__all__", "any run", pre.run_label == null)}${(hist.run_labels || []).map(r =>
        opt(r.run_label, (r.run_label || "(unlabelled)") + " (" + r.n + ")", r.run_label === pre.run_label)).join("")}</select></div>
    <div style="margin:10px 0 4px;font-weight:600">What to clear</div>
    <label class="row" style="margin:3px 0"><input type="checkbox" id="clr-samples" checked>
      Performance history samples <span class="hint" style="margin:0">(charts + tables on the Performance tab)</span></label>
    <label class="row" style="margin:3px 0"><input type="checkbox" id="clr-live" checked>
      Live averages <span class="hint" style="margin:0">(tok/s, TTFT, prefill, load, spec, cache)</span></label>
    <label class="row" style="margin:3px 0"><input type="checkbox" id="clr-trunc" checked>
      Truncation counters <span class="hint" style="margin:0">(+ their Events warnings)</span></label>
    <label class="row" style="margin:3px 0"><input type="checkbox" id="clr-bench">
      Observed latency scores <span class="hint" style="margin:0">(routing re-learns speed)</span></label>
    <label class="row" style="margin:3px 0"><input type="checkbox" id="clr-req">
      Usage Log <span class="hint" style="margin:0">(request history — all models only)</span></label>
    <div class="row" style="margin-top:12px">
      <button class="act primary" id="clr-go">Clear selected</button>
      <button class="act" id="clr-cancel">Cancel</button>
      <span class="hint" id="clr-note"></span></div>`);
  const sync = () => {
    const all = !$("#clr-model", body).value;
    const req = $("#clr-req", body);
    req.disabled = !all; if (!all) req.checked = false;
    $("#clr-note", body).textContent = all ? "" : "Usage Log can only be cleared for all models.";
  };
  $("#clr-model", body).onchange = sync; sync();
  $("#clr-cancel", body).onclick = closeModal;
  $("#clr-go", body).onclick = async () => {
    const model = $("#clr-model", body).value, run = $("#clr-run", body).value;
    const payload = {model, backend: $("#clr-backend", body).value,
      samples: $("#clr-samples", body).checked, live: $("#clr-live", body).checked,
      truncations: $("#clr-trunc", body).checked, benchmarks: $("#clr-bench", body).checked,
      requests: $("#clr-req", body).checked};
    if (run !== "__all__") payload.run_label = run;
    if (!Object.keys(payload).some(k => payload[k] === true)) return toast("Nothing selected", true);
    if (!confirm(`Permanently clear the selected data for ${model || "ALL models"}? This cannot be undone.`)) return;
    try {
      const r = await api("perf/clear", {method: "POST", body: payload});
      const bits = [];
      if (r.samples != null) bits.push(`${r.samples} samples`);
      if (r.models_reset != null) bits.push(`${r.models_reset} model stat rows reset`);
      if (r.requests != null) bits.push(`${r.requests} requests`);
      toast("Cleared: " + (bits.join(", ") || "done"));
      closeModal(); render();
    } catch (e) { toast(e.message, true); }
  };
}

// Nudge a number input by one step within its min/max, firing input/change so

function stepValue(inp, dir) {

  const busy = calls24 ? `${_fmtK(calls24)} request${calls24 === 1 ? "" : "s"} in the last 24 h${p50 != null ? `, typically ${_fmtS(p50).join(" ")} each` : ""}.`
    : "No requests in the last 24 h.";
  const mood = !st || attn.some(a => a.sev === "bad") ? "bad" : attn.length || !backs.length ? "warn" : "ok";
  return {rows, sm, backs, down, calls24, calls5: t5.calls, t24, p50, p95, attn, mood,
          verdict: `${health} ${busy}`,
          decode: _pct(rows.map(r => r.decode_tps), 50), ttft: _pct(rows.map(r => r.ttft_ms), 50),
          capped: rows.length && sm.samples > rows.length ? rows.length : 0};
}

// Performance tab — historical charts + rich per-call table from perf_samples

const _PERF = { hours: 72, model: "", backend: "", run: "__all__" };   // filters (persisted)
try { Object.assign(_PERF, JSON.parse(localStorage.getItem("perfCtl") || "{}")); } catch (e) {}

function _css(name, fallback) {
  return (getComputedStyle(document.body).getPropertyValue(name).trim() || fallback);
}
function _tsLabel(ts) {
  let s = ts || ""; if (s.indexOf("T") < 0) s = s.replace(" ", "T");
  if (!/(Z|[+-]\d\d:?\d\d)$/.test(s)) s += "Z";
  const d = new Date(s); if (isNaN(d)) return ts || "";
  const p = n => ("" + n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function _num(v, unit) {
  if (v == null) return "—";
  if (unit === "k") return v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 0 : 1) + "k" : "" + Math.round(v);
  if (unit === "ms") return v >= 1000 ? (v / 1000).toFixed(1) + "s" : Math.round(v) + "ms";
  if (unit === "%") return (Math.round(v * 10) / 10) + "%";
  return "" + (Math.round(v * 10) / 10);
}
// Multi-series time-series line chart (SVG, responsive via viewBox). `rows` are
// chronological; each series reads one numeric key and breaks its line on nulls
// so a metric a backend didn't report shows a gap, not a fake dip.
// Drawing width for a chart: about its on-screen width, so the axis text
// renders near its real size instead of shrinking with the viewBox.
function _chartW(cols) {
  const m = document.getElementById("main"), w = (m && m.clientWidth) || 800;
  const per = cols > 1 && w > 1100 ? (w - 12) / cols : w;
  return Math.round(Math.max(320, Math.min(1100, per - 34)));
}
function lineChart(rows, seriesDefs, opts) {
  opts = opts || {};
  const W = opts.w || _chartW(2), H = 220, padL = 50, padR = 12, padT = 12, padB = 28;
  if (!rows || rows.length < 2)
    return '<div class="hint" style="padding:18px 0">Not enough data in this window yet.</div>';
  let vals = [];
  seriesDefs.forEach(s => rows.forEach(r => { if (r[s.key] != null) vals.push(r[s.key]); }));
  if (!vals.length) return '<div class="hint" style="padding:18px 0">No data for this metric.</div>';
  let lo = opts.yMin != null ? opts.yMin : Math.min(0, ...vals);
  let hi = opts.yMax != null ? opts.yMax : Math.max(...vals);
  if (hi <= lo) hi = lo + 1;
  const n = rows.length;
  const x = i => padL + i * (W - padL - padR) / (n - 1);
  const y = v => H - padB - (v - lo) / (hi - lo) * (H - padT - padB);
  const grid = _css("--line", "#333"), dim = _css("--dim", "#999");
  // horizontal gridlines + y labels
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = lo + (hi - lo) * k / 4, yy = y(v);
    g += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" stroke="${grid}" stroke-width="0.5"/>`;
    g += `<text x="${padL - 5}" y="${(yy + 3).toFixed(1)}" text-anchor="end" font-size="11" fill="${dim}">${_num(v, opts.yUnit)}</text>`;
  }
  // x labels: first / middle / last timestamps
  const xl = [0, Math.floor((n - 1) / 2), n - 1].map(i =>
    `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" font-size="11" fill="${dim}">${_tsLabel(rows[i].ts)}</text>`).join("");
  // one polyline per series, split on null gaps; a single series also gets a
  // faint area under it so its level reads at a glance
  let paths = "";
  const base = y(Math.max(lo, 0)).toFixed(1);
  seriesDefs.forEach(s => {
    let seg = [];
    const flush = () => {
      if (seg.length > 1) {
        if (seriesDefs.length === 1)
          paths += `<polygon points="${seg[0].split(",")[0]},${base} ${seg.join(" ")} ${seg[seg.length - 1].split(",")[0]},${base}" fill="${s.color}" fill-opacity="0.12" stroke="none"/>`;
        paths += `<polyline points="${seg.join(" ")}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"/>`;
      } else if (seg.length === 1) {
        const [cx, cy] = seg[0].split(",");
        paths += `<circle cx="${cx}" cy="${cy}" r="2" fill="${s.color}"/>`;
      }
      seg = [];
    };
    rows.forEach((r, i) => { if (r[s.key] == null) { flush(); } else { seg.push(`${x(i).toFixed(1)},${y(r[s.key]).toFixed(1)}`); } });
    flush();
  });
  // hover columns: each shows its time and every series' value (styled #tip)
  const step = Math.max(1, Math.ceil(n / 160));
  let hits = "";
  for (let i = 0; i < n; i += step) {
    const j = Math.min(n - 1, i + step - 1);
    const x0 = i === 0 ? padL : (x(i - 1) + x(i)) / 2, x1 = j === n - 1 ? W - padR : (x(j) + x(j + 1)) / 2;
    const r = rows[j];
    const vals = seriesDefs.map(sd => `${sd.label}: ${r[sd.key] == null ? "not reported" : _num(r[sd.key], opts.yUnit)}`).join("\n");
    const who = r.model ? `\n${r.model}${r.backend ? " on " + r.backend : ""}` : "";
    hits += `<rect class="hit" x="${x0.toFixed(1)}" y="${padT}" width="${Math.max(1, x1 - x0).toFixed(1)}" height="${H - padT - padB}" data-tip="${esc(_tsLabel(r.ts) + "\n" + vals + who)}"/>`;
  }
  const legend = seriesDefs.map(s =>
    `<span style="margin-right:14px;white-space:nowrap"><span style="display:inline-block;width:10px;height:10px;background:${s.color};border-radius:2px;vertical-align:middle;margin-right:4px"></span>${esc(s.label)}</span>`).join("");
  return `<div class="hint" style="margin:2px 0 4px">${legend}<span style="opacity:.7">· hover the chart for values</span></div>`
    + `<svg class="lc" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="${esc(seriesDefs.map(sd => sd.label).join(", "))} over time"><rect x="${padL}" y="${padT}" width="${W - padL - padR}" height="${H - padT - padB}" fill="none" stroke="${grid}" stroke-width="0.5"/>${g}${xl}${paths}${hits}</svg>`;
}
// Scatter — correlate a metric (y) against context fill / any x. Reveals e.g.
// "acceptance falls as prompt tokens climb toward the context cap".
function scatterChart(rows, xKey, yKey, opts) {
  opts = opts || {};
  const W = opts.w || _chartW(1), H = 230, padL = 50, padR = 12, padT = 12, padB = 30;
  const pts = (rows || []).filter(r => r[xKey] != null && r[yKey] != null);
  if (pts.length < 2) return '<div class="hint" style="padding:18px 0">Not enough paired data yet.</div>';
  const xs = pts.map(r => r[xKey]), ys = pts.map(r => r[yKey]);
  const xlo = 0, xhi = Math.max(...xs) * 1.02 || 1;
  const ylo = opts.yMin != null ? opts.yMin : Math.min(0, ...ys);
  let yhi = opts.yMax != null ? opts.yMax : Math.max(...ys); if (yhi <= ylo) yhi = ylo + 1;
  const x = v => padL + (v - xlo) / (xhi - xlo) * (W - padL - padR);
  const y = v => H - padB - (v - ylo) / (yhi - ylo) * (H - padT - padB);
  const grid = _css("--line", "#333"), dim = _css("--dim", "#999"), col = opts.color || _css("--accent", "#e8833a");
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = ylo + (yhi - ylo) * k / 4, yy = y(v);
    g += `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" stroke="${grid}" stroke-width="0.5"/>`;
    g += `<text x="${padL - 5}" y="${(yy + 3).toFixed(1)}" text-anchor="end" font-size="11" fill="${dim}">${_num(v, opts.yUnit)}</text>`;
  }
  let xl = "";
  for (let k = 0; k <= 4; k++) {
    const v = xlo + (xhi - xlo) * k / 4, xx = x(v);
    xl += `<text x="${xx.toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="${dim}">${_num(v, opts.xUnit)}</text>`;
  }
  // colour by recency: older points dimmer, newest brightest — so a drift over
  // the run reads as a direction, not just a cloud.
  const dots = pts.map((r, i) => {
    const op = 0.28 + 0.72 * i / (pts.length - 1);
    return `<circle cx="${x(r[xKey]).toFixed(1)}" cy="${y(r[yKey]).toFixed(1)}" r="2.4" fill="${col}" opacity="${op.toFixed(2)}"/>`;
  }).join("");
  return `<div class="hint" style="margin:2px 0 4px">${esc(opts.xlabel || xKey)} → ${esc(opts.ylabel || yKey)} <span style="opacity:.6">· ${pts.length} calls · brighter = more recent</span></div>`
    + `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><rect x="${padL}" y="${padT}" width="${W - padL - padR}" height="${H - padT - padB}" fill="none" stroke="${grid}" stroke-width="0.5"/>${g}${xl}${dots}</svg>`;
}

// Engine /metrics history (server_history.py): one card per backend, one chart per metric group.
const _SERVER_CHARTS = [
  ["KV cache used (%)", ["kv_cache_usage_pct"], "%", 0, 100],
  ["Slots and queue", ["slots_busy", "slots_total", "requests_running", "requests_waiting"], "", 0, null],
  ["Engine tokens/s", ["live_decode_tps", "avg_decode_tps", "live_prefill_tps", "avg_prompt_tps"], "", null, null],
  ["Cache and speculation (%)", ["prefix_cache_hit_pct", "spec_accept_pct", "expert_cache_hit_pct", "ram_used_pct"], "%", 0, 100],
  ["Latency (ms)", ["mean_ttft_ms", "mean_tpot_ms", "mean_e2e_ms", "mean_upstream_ms", "mean_queue_ms"], "ms", null, null],
  ["Requests", ["requests_total", "requests_failed", "preemptions_total"], "", 0, null],
];
function renderServerHistory(el, d) {
  const names = Object.keys(d.backends || {}).sort();
  if (!names.length) {
    el.innerHTML = `<div class="card"><p class="hint">No engine metrics recorded in this window yet. They are sampled every ${d.interval_s || "?"} s from each healthy llama.cpp / Strata / Meridian backend (llama.cpp needs <code>--metrics</code>); 0 turns it off.</p></div>`;
    return;
  }
  const cols = ["--ok", "--accent", "--accent-2", "--warn", "--bad"].map((v, i) => _css(v, ["#3fb950", "#e8833a", "#ffb347", "#e0a441", "#f85149"][i]));
  el.innerHTML = names.map(b => {
    const be = d.backends[b], ser = be.series || {};
    const charts = _SERVER_CHARTS.map(([title, keys, unit, lo, hi], gi) => {
      const have = keys.filter(k => (ser[k] || []).length > 1);
      if (!have.length) return "";
      const byT = {};
      have.forEach(k => ser[k].forEach(([t, v]) => { (byT[t] = byT[t] || {ts: new Date(t * 1000).toISOString()})[k] = v; }));
      const rows = Object.keys(byT).map(Number).sort((a, c) => a - c).map(t => byT[t]);
      const defs = have.map((k, i) => ({key: k, color: cols[i % cols.length], label: k.replace(/_/g, " ")}));
      return `<div class="card"><div class="card-h">${title}</div>${lineChart(rows, defs, {yMin: lo, yMax: hi, yUnit: unit})}</div>`;
    }).join("");
    return `<h3 style="margin:14px 0 4px">${esc(b)} ${be.model ? `<span class="hint">· ${esc(be.model)}</span>` : ""}</h3><div class="chart-grid">${charts || '<div class="card hint">No numeric metrics.</div>'}</div>`;
  }).join("") + `<p class="hint">${d.samples} samples in this window · every ${d.interval_s} s · kept ${d.retention_days} d</p>`;
}
function renderPerfSettings(el, st, reload) {
  if (!el) return;
  const rules = (st.subscription_rates || []).map(r => `${r.match || "*"}${r.model ? ":" + r.model : ""} = ${r.usd_per_call}`).join("\n");
  el.innerHTML = `<div class="row" style="flex-wrap:wrap;gap:6px 18px;align-items:flex-start">
      <label title="Performance samples and engine metrics older than this are deleted">keep history <input type="number" id="ps-ret" min="1" max="3650" style="width:70px" value="${st.retention_days}"> days</label>
      <label title="Seconds between engine /metrics samples; 0 = off">sample engines every <input type="number" id="ps-int" min="0" max="3600" style="width:70px" value="${st.server_sample_seconds}"> s</label>
      <label title="One rule per line: backend[:model] = USD per call. A subscription has no per-call price; this allocates the plan's cost (monthly price ÷ calls) so sprint and task figures show it. It is not added to metered spend, so dollar caps ignore it. Empty = 0.">subscription $ per call
        <textarea id="ps-rates" rows="3" cols="30" placeholder="meridian = 0.04&#10;meridian:claude-opus* = 0.20&#10;cliproxyapi* = 0.01">${esc(rules)}</textarea></label>
      <button class="act primary" id="ps-save">Save</button></div>`;
  $("#ps-save").onclick = async () => {
    const rates = [];
    for (const line of $("#ps-rates").value.split("\n")) {
      if (!line.trim()) continue;
      const m = line.match(/^\s*([^=:\s]+)(?::([^=\s]+))?\s*=\s*([0-9.]+)\s*$/);
      if (!m) { toast(`Cannot read rule: ${line}`, true); return; }
      rates.push({match: m[1], ...(m[2] ? {model: m[2]} : {}), usd_per_call: +m[3]});
    }
    try {
      await api("config/perf", {method: "POST", body: {retention_days: +$("#ps-ret").value || 14,
        server_sample_seconds: +$("#ps-int").value, subscription_rates: rates}});
      toast("Saved — live"); reload();
    } catch (e) { toast(e.message, true); }
  };
}
