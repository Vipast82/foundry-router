// Performance advisor findings -> collapsible, plain-English cards.
// Routing brain panel (Performance tab): brain_calls over the window.
function renderBrainPanel(el, b) {
  if (!b || !b.calls) { el.innerHTML = '<span class="hint">No brain calls in this window. Requests that bring their own tools (Cline, Kilo, AnythingLLM @agent) and strict personas never use the brain.</span>'; return; }
  const o = b.outcomes || {}, pct = v => v == null ? "—" : (v * 100).toFixed(1) + "%";
  const ms = v => v == null ? "—" : fmtDur(v);
  const rows = (b.series || []).map(x => ({ts: x.t, calls: x.calls, failed: x.failed + x.skipped, p50_ms: x.p50_ms}));
  const purposes = Object.entries(b.by_purpose || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.calls}</td><td>${ms(v.p50_ms)}</td><td>${ms(v.p95_ms)}</td><td>${v.failed}</td><td>${v.skipped}</td></tr>`).join("");
  el.classList.remove("hint");
  el.innerHTML = `<div class="row" style="flex-wrap:wrap;gap:6px 18px;margin:0 0 8px">
      <span class="stat"><b>${b.calls}</b> calls (${b.per_hour}/h)</span>
      <span class="stat">latency p50 <b>${ms(b.latency_ms.p50)}</b> · p95 <b>${ms(b.latency_ms.p95)}</b></span>
      <span class="stat">${b.tps_p50 != null ? `<b>${b.tps_p50}</b> tok/s` : "tok/s —"}</span>
      <span class="stat">failed <b>${o.failed || 0}</b> (${pct(b.failure_rate)} of calls)</span>
      <span class="stat">fell back to the simple rule <b>${(o.failed || 0) + (o.skipped || 0)}</b> (${pct(b.fallback_rate)})</span>
      <span class="stat">retried ok <b>${o.retried || 0}</b></span>
      <span class="hint" style="margin:0">${esc((b.models || []).join(", "))}</span></div>
    <div class="chart-grid"><div>${lineChart(rows, [{key: "calls", color: _css("--accent", "#e8833a"), label: "calls"}, {key: "failed", color: _css("--bad", "#e5484d"), label: "failed or skipped"}], {})}</div>
      <div>${lineChart(rows, [{key: "p50_ms", color: "#3b82f6", label: "median latency"}], {yUnit: "ms"})}</div></div>
    ${purposes ? `<table style="margin-top:6px"><tr><th>purpose</th><th>calls</th><th>p50</th><th>p95</th><th>failed</th><th>skipped</th></tr>${purposes}</table>` : ""}
    ${(b.top_reasons || []).length ? `<p class="hint" style="margin:6px 0 0">Why it failed or was skipped: ${b.top_reasons.map(r => `${esc(r.reason)} (${r.count})`).join(" · ")}</p>` : ""}`;
}

function renderAdvisor(el, a) {
  const f = (a && a.findings) || [];
  const sevStyle = {critical: ["bad", "🔴", "Critical"], warning: ["warn", "🟠", "Warning"], info: ["", "🔵", "Tip"]};
  if (!f.length) {
    el.innerHTML = `<span class="pill ok">✓ no problems found</span> <span class="hint">${a ? a.requests_analysed : 0} request(s) analysed over ${a ? a.hours : 24}h — nothing points to a performance issue.</span>`;
    return;
  }
  const c = a.counts || {};
  const open = window._advOpen || (window._advOpen = new Set());
  el.innerHTML = `<div class="hint" style="margin-bottom:6px">${c.critical ? `<span class="pill bad">${c.critical} critical</span> ` : ""}${c.warning ? `<span class="pill warn">${c.warning} warning</span> ` : ""}${c.info ? `<span class="pill">${c.info} tip</span> ` : ""}· ${a.requests_analysed} request(s) over ${a.hours}h</div>`
    + f.map((x, i) => {
      const [cls, icon, label] = sevStyle[x.severity] || sevStyle.info;
      const key = x.id + "|" + (x.scope || "");
      const ev = Object.entries(x.evidence || {}).map(([k, v]) => `<span class="pill" title="${esc(k)}">${esc(k)}: <b>${esc(String(v))}</b></span>`).join(" ");
      return `<details class="adv" data-k="${esc(key)}" ${open.has(key) ? "open" : ""} style="border-left:3px solid var(--${cls || "accent"});padding:4px 10px;margin:6px 0">
        <summary style="cursor:pointer"><span class="pill ${cls}">${icon} ${label}</span> <b>${esc(x.title)}</b>
          ${x.scope ? `<span class="hint">— ${esc(x.scope)}</span>` : ""}<div class="hint" style="margin:2px 0 0 4px">${esc(x.summary)}</div></summary>
        <div style="margin:6px 0 4px"><b>Why it matters:</b> ${esc(x.why)}</div>
        <div><b>What to do:</b><ol style="margin:4px 0 4px 18px">${(x.fix || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol></div>
        ${ev ? `<div class="hint">Evidence: ${ev}</div>` : ""}
      </details>`;
    }).join("");
  el.querySelectorAll("details.adv").forEach(d => d.addEventListener("toggle", () => {
    d.open ? open.add(d.dataset.k) : open.delete(d.dataset.k);
  }));
}

async function tabMcpMetrics() {
  const winOpts = [[1, "1h"], [6, "6h"], [24, "24h"], [72, "3d"], [168, "7d"], [720, "30d"]];
  const ch = (title, key, sub) =>
    `<div class="card-h">${title}${key ? help(key) : ""}${sub ? `<span class="hint">— ${sub}</span>` : ""}</div>`;
  $("#main").innerHTML = `
    <h2 style="margin-top:0;display:flex;align-items:center">MCP metrics ${help("mcpmetrics")}
      <span class="hint" id="mcpm-ts" style="margin:0 0 0 8px"></span></h2>
    <p class="hint">Every MCP tool call that passes through Foundry — from the routing brain, worker tool loops,
      persona tools in direct mode, the Foundry-MCP aggregator (AnythingLLM and other external clients), the research agent
      and gateway admin — plus how much context each set of tool definitions costs.</p>
    <div class="card" style="display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap">
      <label>Window <select id="mcpm-win">${winOpts.map(([h, l]) => `<option value="${h}"${h === _MCPM.hours ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <label title="Who made the call">Source <select id="mcpm-src"><option value="">all sources</option></select></label>
      <label>Server <select id="mcpm-srv"><option value="">all servers</option></select></label>
      <label title="Your backend's context window, to show tool-definition cost as a % of it">context window
        <input id="mcpm-ctx" type="number" min="1024" step="1024" style="width:90px" value="${_MCPM.ctx}"></label>
      <button class="act" id="mcpm-refresh">Refresh</button>
      <button class="act" id="mcpm-clear" title="Delete the recorded MCP call metrics (all, or the selected server)">Clear metrics…</button>
    </div>
    <div id="mcpm-tiles"></div>
    <div class="card">${ch("Context budget — tool definitions", "mcpcontext", "tokens every request pays just to list the tools")}<div id="mcpm-ctxt"></div></div>
    <div class="card">${ch("Per tool", "mcptools", "slowest / most-failing tools stand out here")}<div id="mcpm-tools"></div></div>
    <div class="card">${ch("Per server", "mcpservers")}<div id="mcpm-servers"></div></div>
    <div class="card">${ch("Who is calling", "mcpsources")}<div id="mcpm-sources"></div></div>
    <div class="card">${ch("Calls over time")}<div id="mcpm-chart"></div></div>
    <div class="card">${ch("Recent calls", null, "newest first")}
      <label class="hint" style="margin:0"><input type="checkbox" id="mcpm-errs"> errors only</label>
      <div id="mcpm-recent"></div></div>`;
  const dash = '<span class="hint">—</span>';
  const n = (v, u) => v == null ? dash : _num(v, u);
  const K = v => v == null ? dash : (v >= 1000 ? (v / 1000).toFixed(1) + "k" : "" + v);
  const srcPill = s => `<span class="pill" title="${esc({brain: "The routing brain called it while routing", worker: "A worker model's own tool loop", direct: "Persona tools merged into a client's direct-mode request (Cline/OpenCode)", aggregator: "An external client through the Foundry-MCP endpoint (e.g. AnythingLLM)", research: "The background Research Agent", gateway: "Gateway admin (Host → MCP)", other: "Other"}[s] || s)}">${esc(s)}</span>`;
  const load = async () => {
    _MCPM.hours = +$("#mcpm-win").value; _MCPM.source = $("#mcpm-src").value;
    _MCPM.server = $("#mcpm-srv").value; _MCPM.ctx = +$("#mcpm-ctx").value || 262144;
    try { localStorage.setItem("mcpmCtl", JSON.stringify(_MCPM)); } catch (e) {}
    let d, c, r;
    try {
      [d, c, r] = await Promise.all([
        api(`mcp-metrics?hours=${_MCPM.hours}&source=${encodeURIComponent(_MCPM.source)}&server=${encodeURIComponent(_MCPM.server)}`),
        api(`mcp-context?ctx=${_MCPM.ctx}`),
        api(`mcp-metrics/recent?limit=80&hours=${_MCPM.hours}&source=${encodeURIComponent(_MCPM.source)}&server=${encodeURIComponent(_MCPM.server)}&errors=${$("#mcpm-errs").checked ? 1 : 0}`)]);
    } catch (e) { $("#mcpm-tiles").innerHTML = `<div class="card hint">Could not load: ${esc(e.message)}</div>`; return; }
    $("#mcpm-ts").textContent = "· " + new Date().toLocaleTimeString();
    const fill = (id, first, vals, cur) => { const el = $(id); el.innerHTML = first + vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join(""); if (cur && !vals.includes(cur)) el.insertAdjacentHTML("beforeend", `<option value="${esc(cur)}">${esc(cur)}</option>`); el.value = cur || ""; };
    fill("#mcpm-src", '<option value="">all sources</option>', d.sources || [], _MCPM.source);
    fill("#mcpm-srv", '<option value="">all servers</option>', d.servers || [], _MCPM.server);
    const t = d.totals || {};
    const tile = (label, v, hint, sub) => `<div class="tile" title="${esc(hint)}"><div class="t-lbl">${label}</div><div class="t-val">${v}</div>${sub ? `<div class="t-sub">${sub}</div>` : ""}</div>`;
    const live = (d.live || {}).in_flight || [];
    $("#mcpm-tiles").innerHTML = `<div class="card"><div class="tiles">`
      + tile("calls", t.calls ?? 0, "MCP tool calls in the window")
      + tile("errors", t.errors ? `<span style="color:var(--bad)">${t.errors}</span>` : "0", "Failed calls (tool error, transport failure, timeout)", `${t.error_pct ?? 0}%`)
      + tile("p50 latency", n(t.p50_ms, "ms"), "Median end-to-end call time (incl. pacing and retries)")
      + tile("p95 latency", n(t.p95_ms, "ms"), "95th percentile — the slow-case call time", t.max_ms != null ? `max ${_num(t.max_ms, "ms")}` : "")
      + tile("timeouts", t.timeouts ?? 0, "Calls that hit the server's timeout_seconds")
      + tile("429s", t.rate_limited ?? 0, "Calls that were rate-limited at least once (backoff applied)")
      + tile("session reuse", n(t.reuse_pct, "%"), "Share of calls that reused a pooled MCP session (no connect + initialize handshake)", t.avg_connect_ms != null ? `new session ~${_num(t.avg_connect_ms, "ms")}` : "")
      + tile("avg result", t.avg_result_tokens != null ? K(t.avg_result_tokens) + " tok" : dash, "Average size of a tool result in tokens — what each call adds to the model's context", t.total_result_tokens ? `${K(t.total_result_tokens)} tok total` : "")
      + tile("running now", live.length, "Tool calls in flight right now", live.slice(0, 2).map(x => esc(x.server + "/" + x.tool) + " " + x.seconds + "s").join("<br>"))
      + `</div></div>`;
    // context budget
    const sc = c.scopes || [];
    $("#mcpm-ctxt").innerHTML = sc.length
      ? `<table><tr><th>scope</th><th title="Where this tool set is used">used by</th><th>tools</th><th title="Tokens the tool definitions add to every request">definition tokens</th><th title="Share of your context window">of context</th><th title="The biggest tool definitions in this scope">heaviest tools</th></tr>`
        + sc.map(x => `<tr><td class="nw"><b>${esc(x.name)}</b> <span class="hint">${esc(x.kind)}</span></td>
            <td class="hint">${esc(x.where)}</td><td class="nw">${x.tools}</td><td class="nw">${K(x.tokens)}</td>
            <td class="nw">${x.pct == null ? dash : `<span class="meter ${x.pct > 10 ? "bad" : x.pct > 4 ? "warn" : ""}"><span style="width:${Math.min(100, x.pct * 5)}%"></span></span> ${x.pct}%`}</td>
            <td class="hint">${(x.heaviest || []).slice(0, 3).map(h => `${esc(h.tool)} (${K(h.tokens)})`).join(", ")}</td></tr>`).join("") + `</table>`
      : '<span class="hint">No MCP tools synced yet.</span>';
    // per tool
    const bt = d.by_tool || [];
    const errCell = x => x.errors ? `<span class="pill bad" title="${esc(x.last_error || "")}">${x.errors} · ${x.error_pct}%</span>` : '<span class="hint">0</span>';
    $("#mcpm-tools").innerHTML = bt.length
      ? `<table><tr><th>tool</th><th>server</th><th>calls</th><th title="Failures · failure rate (hover for the last error)">errors</th><th>p50</th><th>p95</th><th>max</th><th title="Average / largest result, in tokens of model context">result tok</th><th title="Content returned (text, image, audio, resource, structured)">content</th><th>timeouts</th><th>429</th><th title="Who called it">sources</th><th>last used</th></tr>`
        + bt.map(x => `<tr><td class="nw mono">${esc(x.tool)}</td><td class="nw">${esc(x.server)}</td><td class="nw">${x.calls}</td><td class="nw">${errCell(x)}</td>
            <td class="nw">${n(x.p50_ms, "ms")}</td><td class="nw">${n(x.p95_ms, "ms")}</td><td class="nw">${n(x.max_ms, "ms")}</td>
            <td class="nw">${K(x.avg_result_tokens)} <span class="hint">/ ${K(x.max_result_tokens)}</span></td>
            <td class="nw hint">${esc((x.content_types || []).join(", "))}</td>
            <td class="nw">${x.timeouts || '<span class="hint">0</span>'}</td><td class="nw">${x.rate_limited || '<span class="hint">0</span>'}</td>
            <td class="nw">${(x.sources || []).map(srcPill).join(" ")}</td><td class="nw">${_tsLabel(x.last_used)}</td></tr>`).join("") + `</table>`
      : '<span class="hint">No MCP calls in this window.</span>';
    const bs = d.by_server || [];
    $("#mcpm-servers").innerHTML = bs.length
      ? `<table><tr><th>server</th><th>calls</th><th>errors</th><th>p50</th><th>p95</th><th>tools used</th><th title="Average time to open a new MCP session">new session</th><th title="Share of calls that reused a pooled session">reuse</th><th>timeouts</th><th>429</th></tr>`
        + bs.map(x => `<tr><td class="nw"><b>${esc(x.server)}</b></td><td class="nw">${x.calls}</td><td class="nw">${errCell(x)}</td>
            <td class="nw">${n(x.p50_ms, "ms")}</td><td class="nw">${n(x.p95_ms, "ms")}</td><td class="nw">${x.tools_used}</td>
            <td class="nw">${n(x.avg_connect_ms, "ms")}</td><td class="nw">${n(x.reuse_pct, "%")}</td>
            <td class="nw">${x.timeouts || '<span class="hint">0</span>'}</td><td class="nw">${x.rate_limited || '<span class="hint">0</span>'}</td></tr>`).join("") + `</table>`
      : '<span class="hint">—</span>';
    const bo = d.by_source || [];
    $("#mcpm-sources").innerHTML = bo.length
      ? `<table><tr><th>source</th><th title="Persona / aggregator scope / model that owned the loop">caller</th><th title="External client (User-Agent), for aggregator calls">client</th><th>calls</th><th>errors</th><th>p50</th><th>p95</th><th>avg result tok</th><th>last</th></tr>`
        + bo.map(x => `<tr><td class="nw">${srcPill(x.source)}</td><td class="nw">${esc(x.caller || "")}</td><td class="hint" style="max-width:220px;overflow:hidden;text-overflow:ellipsis" title="${esc(x.client || "")}">${esc(x.client || "")}</td>
            <td class="nw">${x.calls}</td><td class="nw">${errCell(x)}</td><td class="nw">${n(x.p50_ms, "ms")}</td><td class="nw">${n(x.p95_ms, "ms")}</td>
            <td class="nw">${K(x.avg_result_tokens)}</td><td class="nw">${_tsLabel(x.last_used)}</td></tr>`).join("") + `</table>`
      : '<span class="hint">—</span>';
    $("#mcpm-chart").innerHTML = lineChart(d.series || [],
      [{ key: "calls", color: _css("--accent", "#e8833a"), label: "calls / hour" },
       { key: "errors", color: _css("--bad", "#e0574f"), label: "errors / hour" }], {w: _chartW(1)})
      + lineChart(d.series || [], [{ key: "p50_ms", color: _css("--ok", "#3fb950"), label: "p50 ms" },
                                   { key: "p95_ms", color: _css("--warn", "#e0a441"), label: "p95 ms" }], { yUnit: "ms", w: _chartW(1) });
    const rc = r.calls || [];
    $("#mcpm-recent").innerHTML = rc.length
      ? `<table><tr><th>time</th><th>source</th><th>caller</th><th>tool</th><th>result</th><th>duration</th><th title="connect ms (new session) · pacing wait">conn · pace</th><th title="session: reused / new / per-call">session</th><th>tokens</th><th>content</th></tr>`
        + rc.map(x => `<tr><td class="nw">${_tsLabel(x.ts)}</td><td class="nw">${srcPill(x.source)}</td>
            <td class="nw hint" style="max-width:180px;overflow:hidden;text-overflow:ellipsis" title="${esc((x.caller || "") + (x.client ? " · " + x.client : ""))}">${esc(x.caller || "")}</td>
            <td class="nw mono">${esc(x.server)}/${esc(x.tool)}</td>
            <td>${x.ok ? '<span class="pill ok">ok</span>' : `<span class="pill bad" title="${esc(x.error || "")}">${x.timed_out ? "timeout" : "error"}</span> <span class="hint">${esc((x.error || "").slice(0, 90))}</span>`}${x.attempts > 1 ? ` <span class="hint" title="429 retries">×${x.attempts}</span>` : ""}</td>
            <td class="nw">${_num(x.duration_ms, "ms")}</td>
            <td class="nw hint">${x.connect_ms ? _num(x.connect_ms, "ms") : "0"} · ${x.pace_ms ? _num(x.pace_ms, "ms") : "0"}</td>
            <td class="nw hint">${esc(x.session || "")}</td><td class="nw">${K(x.result_tokens)}</td><td class="nw hint">${esc(x.content_types || "")}</td></tr>`).join("") + `</table>`
      : '<span class="hint">No calls.</span>';
    wrapTables();
  };
  ["#mcpm-win", "#mcpm-src", "#mcpm-srv", "#mcpm-ctx", "#mcpm-errs"].forEach(id => $(id).onchange = load);
  $("#mcpm-refresh").onclick = load;
  $("#mcpm-clear").onclick = async () => {
    const srv = $("#mcpm-srv").value;
    if (!confirm(`Delete recorded MCP call metrics for ${srv || "ALL servers"}?`)) return;
    try { const r = await api("mcp-metrics/clear", {method: "POST", body: {server: srv}}); toast(`Cleared ${r.removed} call(s)`); load(); }
    catch (e) { toast(e.message, true); }
  };
  await load();
}

async function tabAgents() {
  const [d, runs] = await Promise.all([api("agents"), api("agent-runs?hours=168&limit=60")]);
  const dash = '<span class="hint">—</span>';
  const n = (v, u) => v == null ? dash : _num(v, u);
  const list = d.agents || [];
  const healthPill = h => !h || h.healthy == null ? '<span class="hint">not probed</span>'
    : h.healthy ? `<span class="pill ok" title="${esc(JSON.stringify(h.health || {}))}">up${h.latency_ms != null ? " · " + h.latency_ms + "ms" : ""}</span>`
    : `<span class="pill bad" title="${esc(h.error || "")}">down</span> <span class="hint">${esc((h.error || "").slice(0, 60))}</span>`;
  const names = v => Array.isArray(v) ? v.map(x => typeof x === "string" ? x : (x.name || x.id || "")).filter(Boolean) : [];
  const rows = list.map(a => {
    const h = a.health || {};
    const skills = names(h.skills), toolsets = names(h.toolsets);
    return `<tr${a.enabled ? "" : ' style="opacity:.5"'}>
      <td class="nw"><b>${esc(a.name)}</b> <span class="hint">${esc(a.kind)}</span></td>
      <td class="mono">${esc(a.url)}</td>
      <td class="nw">${healthPill(h)}</td>
      <td class="nw">${esc(h.model || a.model || "")}</td>
      <td class="nw">${a.expose_as_tool ? `<span class="pill ok" title="Tools ${esc(a.name)}_run / _status / _stop on MCP server ${esc(a.server)}">tool: ${esc(a.server)}</span>` : '<span class="hint">not a tool</span>'}</td>
      <td>${(a.personas || []).map(p => `<span class="pill">${esc(p)}</span>`).join(" ") || '<span class="hint">no persona</span>'}</td>
      <td class="hint" title="${esc(skills.join(", "))}">${skills.length ? skills.length + " skills" : ""}${toolsets.length ? " · " + toolsets.length + " toolsets" : ""}</td>
      <td class="nw">${a.caller_token ? '<span class="pill ok" title="Loop protection armed">caller token</span>' : '<span class="pill warn" title="No caller token: if this agent uses Foundry as its model provider, set one so its requests are never routed back into an agent">no caller token</span>'}</td>
      <td class="nw"><button class="act" onclick='probeAgent(${JSON.stringify(a.name)})'>test</button>
        <button class="act" onclick='editAgent(${JSON.stringify(a.name)})'>edit</button>
        <button class="act" onclick='if(confirm("Remove agent ${esc(a.name)}?"))run(api("agents/delete",{method:"POST",body:{name:${JSON.stringify(a.name)}}}))'>remove</button></td></tr>`;
  }).join("");
  const g = runs.groups || [];
  const active = runs.active || d.active || [];
  const rc = runs.recent || [];
  const stPill = s => `<span class="pill ${s === "completed" ? "ok" : s === "running" || s === "handed_off" ? "" : "bad"}">${esc(s)}</span>`;
  $("#main").innerHTML = `
    <h2 style="margin-top:0;display:flex;align-items:center">Agents ${help("agents")}</h2>
    <p class="hint">External agents Foundry can hand work to — as a <b>tool</b> (grant <code>agent-&lt;name&gt;</code> to a persona or load it from the MCP aggregator in Cline / AnythingLLM) or as a persona <b>backend</b> (Personas → <i>served by agent</i>).</p>
    <div class="card"><div class="card-h">Configured agents</div>
      ${list.length ? `<table><tr><th>agent</th><th>url</th><th>health</th><th title="The model name the agent advertises">model</th><th>as tool</th><th title="Personas served by this agent">personas</th><th>skills</th><th title="Loop protection">loops</th><th></th></tr>${rows}</table>`
        : '<p class="hint">No agents yet. Enable Hermes\' API server (<code>API_SERVER_ENABLED=true</code>, <code>API_SERVER_KEY=…</code> in <code>~/.hermes/.env</code>, then <code>hermes gateway</code>) and add it below.</p>'}
    </div>
    <div class="card"><div class="card-h">Add / edit agent</div>
      <div class="row"><label>name</label><input id="ag-name" size="14" placeholder="hermes">
        <label title="Hermes API server base URL (default port 8642). For a multi-profile Hermes, include the /p/<profile> prefix.">url</label><input id="ag-url" size="26" value="http://localhost:8642">

        <label title="The API key the agent uses when IT calls Foundry (as its model provider / MCP server). Requests carrying it are never routed back into an agent. Blank = keep; '-' clears.">caller token</label><input id="ag-caller" type="password" size="14" placeholder="(unchanged)">

      ${active.length ? `<p><b>Running now:</b> ${active.map(x => `${esc(x.agent)} <span class="mono">${esc(x.run_id)}</span> ${x.seconds}s ${esc((x.tools || []).join(", "))}`).join(" · ")}</p>` : ""}
      ${g.length ? `<table><tr><th>agent</th><th>mode</th><th>runs</th><th>completed</th><th>failed</th><th>cancelled</th><th title="Tool calls handed off / still running">running</th><th>p50</th><th>p95</th><th title="Tools the agent ran per task, on average">avg agent tools</th><th>tokens in / out</th><th>top agent tools</th></tr>`
        + g.map(x => `<tr><td class="nw"><b>${esc(x.agent)}</b></td><td class="nw">${esc(x.mode)}</td><td>${x.runs}</td><td>${x.completed}</td>
          <td>${x.failed ? `<span class="pill bad">${x.failed}</span>` : "0"}</td><td>${x.cancelled}</td><td>${x.running}</td>
          <td class="nw">${n(x.p50_ms, "ms")}</td><td class="nw">${n(x.p95_ms, "ms")}</td><td>${x.avg_tool_calls}</td>
          <td class="nw">${x.prompt_tokens} / ${x.completion_tokens}</td>
          <td class="hint">${(x.top_tools || []).map(([t, c]) => `${esc(t)} ×${c}`).join(", ")}</td></tr>`).join("") + `</table>`
        : '<p class="hint">No agent runs yet.</p>'}
      ${rc.length ? `<div class="card-h" style="margin-top:12px">Recent</div><table><tr><th>time</th><th>agent</th><th>mode</th><th>caller</th><th>status</th><th>duration</th><th title="time to first output">first output</th><th>agent tools</th><th>tokens</th><th title="The model the agent itself ran on">agent model</th><th>run / session</th></tr>`
        + rc.map(x => `<tr><td class="nw">${_tsLabel(x.ts)}</td><td class="nw">${esc(x.agent)}</td><td class="nw">${esc(x.mode)}</td>
          <td class="nw hint">${esc(x.caller || "")}</td><td class="nw">${stPill(x.status)}${x.error ? ` <span class="hint" title="${esc(x.error)}">${esc(x.error.slice(0, 60))}</span>` : ""}</td>
          <td class="nw">${n(x.duration_ms, "ms")}</td><td class="nw">${n(x.ttft_ms, "ms")}</td>
          <td class="hint" title="${esc(x.tools_used || "")}">${x.tool_calls || 0}${x.tools_used ? " · " + esc(x.tools_used.split(",").slice(0, 4).join(", ")) : ""}</td>
          <td class="nw">${x.prompt_tokens ?? "—"} / ${x.completion_tokens ?? "—"}</td><td class="nw">${esc(x.model || "")}</td>
          <td class="mono hint">${esc(x.run_id || "")}${x.session_id ? " · " + esc(x.session_id.slice(0, 24)) : ""}</td></tr>`).join("") + `</table>` : ""}
    </div>`;
  window._agents = Object.fromEntries(list.map(a => [a.name, a]));
  window.editAgent = name => {
    const a = window._agents[name]; if (!a) return;
    $("#ag-name").value = a.name; $("#ag-url").value = a.url; $("#ag-model").value = a.model || "";
    $("#ag-tool").checked = !!a.expose_as_tool; $("#ag-sess").checked = !!a.session_continuity;
    $("#ag-timeout").value = a.timeout_seconds; $("#ag-wait").value = a.tool_wait_seconds;
    $("#ag-enabled").checked = !!a.enabled;
    $("#ag-key").placeholder = a.api_key ? "(set — blank keeps it)" : "(none)";
    $("#ag-caller").placeholder = a.caller_token ? "(set — blank keeps it)" : "(none)";
    $("#ag-name").scrollIntoView({behavior: "smooth", block: "center"});
  };
  window.probeAgent = async name => {
    try {
      const r = await api("agents/probe", {method: "POST", body: {name}});
      const h = (r.agents || [])[0] || {};
      toast(h.healthy ? `${name}: up (${h.latency_ms}ms)${h.model ? " · " + h.model : ""}` : `${name}: down — ${h.error || "?"}`, !h.healthy);
      render();
    } catch (e) { toast(e.message, true); }
  };
  $("#ag-save").onclick = () => run(api("agents", {method: "POST", body: {
    name: $("#ag-name").value.trim(), url: $("#ag-url").value.trim(),
    api_key: $("#ag-key").value, caller_token: $("#ag-caller").value,
    model: $("#ag-model").value.trim(), expose_as_tool: $("#ag-tool").checked,
    session_continuity: $("#ag-sess").checked, enabled: $("#ag-enabled").checked,
    timeout_seconds: +$("#ag-timeout").value || 1800, tool_wait_seconds: +$("#ag-wait").value || 600}}));
  $("#ag-clear").onclick = async () => {
    if (!confirm("Delete all recorded agent runs?")) return;
    try { const r = await api("agent-runs/clear", {method: "POST", body: {}}); toast(`Cleared ${r.deleted} run(s)`); render(); }
    catch (e) { toast(e.message, true); }
  };
  wrapTables();
}

// Turn-assist scoreboard: per conversation (sprint) tool calls, errors per 100
// calls, runaway outputs, router interventions and frontier calls; errors by
// context zone; the latest interventions. Data: /admin/api/scoreboard.
let _SB_HOURS = 168;
async function tabScoreboard() {
  const winOpts = [[24, "24h"], [72, "3d"], [168, "7d"], [336, "14d"], [720, "30d"]];
  $("#main").innerHTML = `
    <h2 style="margin-top:0">Scoreboard</h2>
    <p class="hint">What turn assist saw and did on coding conversations (personas with an <code>assist</code> setting). Errors are tool calls whose result the client marked as failed. Kinds: supervisor_* = loop / error-streak / cycling detectors, prejudge_* = blocked or rewritten commands, audit_* = completion audits, advisor = consult_senior. Observe mode logs without changing anything.</p>
    <div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <label>Window <select id="sb-win">${winOpts.map(([h, l]) => `<option value="${h}"${h === _SB_HOURS ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <button class="act" id="sb-refresh">Refresh</button>
      <a class="act" id="sb-export" href="#" title="Interventions as JSONL (trigger → intervention → what came next) for fine-tuning data">Export JSONL</a>
    </div>
    <div class="card"><div class="card-h">Subscription call budgets <span class="hint">— calls Foundry sent in the last 5 h / 24 h vs each backend's call_budget_5h / call_budget_daily</span></div><div id="sb-budgets"></div></div>
    <div class="card"><div class="card-h">Prompt-cache misses <span class="hint">— every time the model server had to re-read most of a big (&gt;20K-token) prompt instead of using its cache. On a 27B at ~430 tok/s a 120K re-read is ~4–5 minutes, so this is where Act time silently goes. Causes: guard_trim = the context guard moved its cut; think_change = the thinking level differed from the previous turn; compaction = Cline compacted; conversation_start = first turn; unknown = nothing Foundry can see (check the llama.cpp log).</span></div><div id="sb-cache"></div></div>
    <div class="card"><div class="card-h">Errors per 100 tool calls by context size</div><div id="sb-zones"></div></div>
    <div class="card"><div class="card-h">Interventions in this window</div><div id="sb-kinds"></div></div>
    <div class="card"><div class="card-h">Conversations <span class="hint">— newest first</span></div><div id="sb-convs"></div></div>
    <div class="card"><div class="card-h">Latest interventions</div><div id="sb-latest"></div></div>`;
  const load = async () => {
    _SB_HOURS = +$("#sb-win").value;
    $("#sb-export").href = `/admin/api/interventions/export?hours=${_SB_HOURS}`;
    const [d, l, bud] = await Promise.all([api(`scoreboard?hours=${_SB_HOURS}`),
                                      api(`interventions?hours=${_SB_HOURS}&limit=50`),
                                      api("subscription-budgets")]);
    const cell = x => x.budget ? `${x.used} / ${x.budget} <span class="hint">(${x.remaining} left)</span>` : `${x.used} <span class="hint">(no cap)</span>`;
    $("#sb-budgets").innerHTML = bud.backends.length ? `<table><tr><th>backend</th><th>type</th><th>last 5 h</th><th>last 24 h</th></tr>${
      bud.backends.map(b => `<tr><td>${esc(b.backend)}${b.enabled ? "" : " (parked)"}</td><td>${esc(b.type)}</td><td>${cell(b["5h"])}</td><td>${cell(b.daily)}</td></tr>`).join("")}</table>`
      : `<span class="hint">No subscription backends. Meridian is one automatically; mark others with <code>subscription: true</code> in Pool → backends.</span>`;
    const ch = d.cache || {};
    $("#sb-cache").innerHTML = ch.turns ? `<p style="margin:0 0 6px"><b>${ch.misses}</b> of ${ch.turns} requests missed the cache — <b>${ch.miss_minutes} min</b> of re-reading out of ${ch.prefill_minutes} min of total prompt processing.</p>` +
      (ch.causes.length ? `<table><tr><th>cause</th><th>requests</th><th>minutes lost</th><th>tokens re-read</th></tr>${ch.causes.map(c => `<tr><td>${esc(c.cause)}</td><td>${c.turns}</td><td>${c.minutes}</td><td>${(c.tokens_reread || 0).toLocaleString()}</td></tr>`).join("")}</table>` : "") :
      `<span class="hint">No cache data yet — it is recorded for assisted requests (personas with a turn assist setting) once they finish.</span>`;
    $("#sb-zones").innerHTML = `<table><tr><th>context</th><th>turns</th><th>tool calls</th><th>errors</th><th>per 100</th></tr>${
      d.zones.map(z => `<tr><td>${esc(z.zone)}</td><td>${z.turns}</td><td>${z.calls}</td><td>${z.errors}</td><td>${z.errors_per_100 ?? "—"}</td></tr>`).join("")}</table>`;
    const kinds = Object.entries(d.interventions || {});
    $("#sb-kinds").innerHTML = kinds.length ? kinds.map(([k, n]) => `<span class="pill">${esc(k)} ${n}</span>`).join(" ")
      : `<span class="hint">none yet</span>`;
    $("#sb-convs").innerHTML = d.conversations.length ? `<table><tr><th>last</th><th>sprint</th><th>persona</th><th>turns</th><th>calls</th><th>err/100</th><th>max ctx</th><th>runaway</th><th>cache misses</th><th>interventions</th><th>paid calls</th></tr>${
      d.conversations.map(c => `<tr><td>${esc((c.last_ts || "").slice(0, 16).replace("T", " "))}</td><td>${esc(c.sprint || "")}</td><td>${esc(c.persona)}</td><td>${c.turns}</td><td>${c.calls ?? 0}</td><td>${c.errors_per_100 ?? "—"}</td><td>${c.max_ctx ? formatCtx(c.max_ctx) : "—"}</td><td>${c.runaway || 0}</td><td>${c.cache_misses || 0}${c.miss_ms ? ` <span class="hint">(${(c.miss_ms / 60000).toFixed(0)} min)</span>` : ""}</td><td>${
        Object.entries(c.kinds || {}).map(([k, n]) => `${esc(k)}×${n}`).join(", ") || "—"}</td><td>${c.paid_calls || 0}</td></tr>`).join("")}</table>`
      : `<span class="hint">No assisted conversations in this window. Turn assist is set per persona (Routing → Personas → turn assist).</span>`;
    $("#sb-latest").innerHTML = l.interventions.length ? `<table><tr><th>time</th><th>kind</th><th>mode</th><th>detail</th><th>model</th></tr>${
      l.interventions.map(i => `<tr><td>${esc((i.ts || "").slice(11, 19))}</td><td>${esc(i.kind)}</td><td>${esc(i.mode || "")}</td><td title="${esc(i.intervention || "")}">${esc((i.detail || "").slice(0, 160))}</td><td>${esc(i.frontier_model || "")}</td></tr>`).join("")}</table>`
      : `<span class="hint">none</span>`;
  };
  $("#sb-win").onchange = () => load().catch(e => toast(e.message, true));
  $("#sb-refresh").onclick = () => load().catch(e => toast(e.message, true));
  await load();
}

    <div class="card"><div style="font-weight:600;margin-bottom:6px">Visual comparison</div><div id="cost-bars"></div></div>
    <div class="card"><div class="card-h">Where the tokens went ${help("costsplit")}<span class="hint">— per model in this window</span></div><div id="cost-split"></div></div>
    <div class="card"><div class="card-h">Automatic price updates ${help("priceupdate")}</div>
      <div class="row" style="margin:0">
        <label style="min-width:0" title="Refresh unlocked prices from OpenRouter on a schedule"><input type="checkbox" id="pu-auto"> update automatically every</label>
        <input id="pu-days" type="number" min="1" max="90" style="width:60px"> <span class="hint" style="margin:0">days</span>
        <button class="act" id="pu-save">Save schedule</button>
        <button class="act" id="pu-preview" title="Show what would change without saving anything">Preview</button>
        <button class="act primary" id="pu-run" title="Fetch current prices now and apply them to every unlocked service">Update prices now</button>
      </div>
      <div id="pu-status" class="hint" style="margin:8px 0 0"></div>
      <div id="pu-report"></div></div>
    <div class="card"><div class="card-h">Service rates <span class="hint">— USD per 1M tokens · editable · 🔒 = never auto-updated</span></div>
      <div id="cost-rates"></div></div>`;

  const loadRates = async () => {
    let d; try { d = await api("pricing"); } catch (e) { return; }
    const rows = d.services || [];
    const cell = (id, val, w) => `<input data-k="${id}" type="${id === "name" || id === "notes" ? "text" : "number"}" step="0.01" style="width:${w}" value="${val == null ? "" : esc("" + val)}">`;
    $("#cost-rates").innerHTML =
      `<table><tr><th title="Include in the comparison">on</th><th title="Locked rows are never changed by the automatic price update">🔒</th><th>service</th><th>in $/1M</th><th>out $/1M</th><th title="cached-input rate (prompt-cache hit)">cached $/1M</th><th>notes</th><th title="Where the current price came from, and when">source · updated</th><th></th></tr>`
      + rows.map(s => `<tr data-id="${s.id}">
          <td class="nw"><input data-k="enabled" type="checkbox" ${s.enabled ? "checked" : ""}></td>
          <td class="nw"><input data-k="locked" type="checkbox" ${s.locked ? "checked" : ""} title="Lock: keep your manual price"></td>
          <td>${cell("name", s.name, "150px")}</td>
          <td class="nw">${cell("input_per_1m", s.input_per_1m, "70px")}</td>
          <td class="nw">${cell("output_per_1m", s.output_per_1m, "70px")}</td>
          <td class="nw">${cell("cached_input_per_1m", s.cached_input_per_1m, "70px")}</td>
          <td>${cell("notes", s.notes || "", "160px")}</td>
          <td class="nw hint" title="${esc(s.source_id ? "matched OpenRouter model: " + s.source_id : "")}${s.last_checked ? "\nlast checked " + esc(s.last_checked) : ""}">${esc(s.source || "seed")}${s.source_id ? " · " + esc(s.source_id) : ""}<br>${esc((s.updated_at || "").slice(0, 10))}</td>
          <td class="nw"><button class="act" data-act="save">Save</button> <button class="act" data-act="del" title="delete">✕</button></td>
        </tr>`).join("")
      + `<tr data-id="">
          <td class="nw"><input data-k="enabled" type="checkbox" checked></td>
          <td class="nw"><input data-k="locked" type="checkbox"></td>
          <td>${cell("name", "", "150px")}</td>
          <td class="nw">${cell("input_per_1m", "", "70px")}</td>
          <td class="nw">${cell("output_per_1m", "", "70px")}</td>
          <td class="nw">${cell("cached_input_per_1m", "", "70px")}</td>
          <td>${cell("notes", "", "160px")}</td>
          <td></td>
          <td class="nw"><button class="act" data-act="save">Add</button></td>
        </tr></table>`;
    $("#cost-rates").querySelectorAll("button[data-act]").forEach(btn => {
      btn.onclick = async () => {
        const tr = btn.closest("tr"), id = tr.getAttribute("data-id");
        if (btn.getAttribute("data-act") === "del") {
          if (!confirm("Delete this service?")) return;
          await api("pricing/delete", { method: "POST", body: { id: +id } });
        } else {
          const g = k => tr.querySelector(`[data-k="${k}"]`);
          const body = {
            id: id ? +id : null, name: g("name").value.trim(),
            input_per_1m: g("input_per_1m").value, output_per_1m: g("output_per_1m").value,
            cached_input_per_1m: g("cached_input_per_1m").value,
            enabled: g("enabled").checked, notes: g("notes").value,
            locked: g("locked").checked,
          };
          if (!body.name) return toast("Name required");
          try { await api("pricing", { method: "POST", body }); }
          catch (e) { return toast(e.message || "Save failed", true); }
        }
        toast("Saved"); await loadRates(); await loadCosts();
      };
    });
    wrapTables();
  };

  const loadCosts = async () => {
    _COST.hours = +$("#cost-win").value; _COST.model = $("#cost-model").value;
    _COST.backend = $("#cost-backend").value; _COST.run = $("#cost-run").value;
    _COST.watts = +$("#cost-watts").value || 0; _COST.kwh = +$("#cost-kwh").value || 0;
    try { localStorage.setItem("costCtl", JSON.stringify(_COST)); } catch (e) {}
    let d;
    let cq = `cost-compare?hours=${_COST.hours}&model=${encodeURIComponent(_COST.model)}&backend=${encodeURIComponent(_COST.backend || "")}&watts=${_COST.watts}&kwh=${_COST.kwh}`;
    if (_COST.run && _COST.run !== "__all__") cq += `&run_label=${encodeURIComponent(_COST.run === "__none__" ? "" : _COST.run)}`;
    try { d = await api(cq); }
    catch (e) { $("#cost-summary").innerHTML = '<div class="card hint">Could not load.</div>'; return; }
    $("#cost-ts").textContent = "· " + new Date().toLocaleTimeString();
    // model filter options (from perf history)
    let hist; try { hist = await api(`perf-history?hours=${_COST.hours}`); } catch (e) { hist = { models: [] }; }
    const fillSel = (id, first, items, cur) => {
      const el = $(id);
      el.innerHTML = first + items.join("");
      if (cur && ![...el.options].some(o => o.value === cur))
        el.insertAdjacentHTML("beforeend", `<option value="${esc(cur)}">${esc(cur === "__none__" ? "(unlabelled)" : cur)}</option>`);
      el.value = cur || el.options[0].value;
    };
    fillSel("#cost-model", '<option value="">all models</option>',
      (hist.models || []).map(m => `<option value="${esc(m.model)}">${esc(m.model)} (${m.n})</option>`), _COST.model);
    fillSel("#cost-backend", '<option value="">all backends</option>',
      (hist.backends || []).map(b => `<option value="${esc(b.backend)}">${esc(b.backend || "(none)")} (${b.n})</option>`), _COST.backend);
    fillSel("#cost-run", '<option value="__all__">all runs</option>',
      (hist.run_labels || []).map(r => `<option value="${esc(r.run_label || "__none__")}">${esc(r.run_label || "(unlabelled)")} (${r.n})</option>`), _COST.run);
    const t = d.tokens, L = d.local;
    $("#cost-count").textContent = `${t.calls} calls · span ${d.span_hours}h`;
    const tile = (label, v, hint) => `<div style="min-width:110px" title="${hint || ""}"><div class="hint" style="margin:0">${label}</div><div style="font-size:18px;font-weight:600">${v}</div></div>`;
    const K = n => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(0) + "k" : "" + n;
    $("#cost-summary").innerHTML = `<div class="card" style="display:flex;gap:22px;flex-wrap:wrap">`
      + tile("input tokens", K(t.input), "prompt tokens sent (context re-sent each turn)")
      + tile("output tokens", K(t.output), "generated tokens")
      + tile("cached (KV hit)", K(t.cached), "prompt tokens served from cache locally")
      + tile("calls", t.calls, "model calls in window")
      + tile("self-host est.", _money(L.cost), `${L.watts}W × ${L.active_hours}h active × $${L.kwh}/kWh`)
      + `</div>`;
    // verdict
    const svcs = d.services || [];
    if (svcs.length) {
      const cheapest = svcs[0], dearest = svcs[svcs.length - 1];
      const save = cheapest.cost - L.cost;
      const banner = save > 0
        ? `<span class="pill ok">self-hosting saved ~${_money(save)}</span> vs the cheapest cloud option (${esc(cheapest.name)} ${_money(cheapest.cost)}) over this window.`
        : `<span class="pill warn">cloud would have been ~${_money(-save)} cheaper</span> — ${esc(cheapest.name)} at ${_money(cheapest.cost)} vs your ${_money(L.cost)} self-host estimate.`;
      $("#cost-verdict").innerHTML = `<div class="card">${banner}
        <div class="hint" style="margin-top:4px">Most expensive: ${esc(dearest.name)} at ${_money(dearest.cost)}${dearest.per_month != null ? ` (~${_money(dearest.per_month)}/mo at this rate)` : ""}. Self-host ≈ ${_money(L.per_month)}/mo.</div></div>`;
    } else { $("#cost-verdict").innerHTML = ""; }
    // table
    const localRow = `<tr style="font-weight:600">
        <td>🖥️ Self-hosted (electricity)</td><td class="nw">—</td><td class="nw">—</td><td class="nw">—</td>
        <td class="nw">${_money(L.cost)}</td><td class="nw">${_money(L.cost)}</td>
        <td class="nw">${_money(L.per_day)}</td><td class="nw">${_money(L.per_month)}</td></tr>`;
    $("#cost-table").innerHTML = svcs.length
      ? `<table><tr><th>service</th><th>in $/1M</th><th>out $/1M</th><th>cached $/1M</th>
          <th>est. cost</th><th title="applying your measured cache-hit tokens at the vendor's cached rate">with cache</th>
          <th>/day</th><th>/month</th></tr>`
        + localRow
        + svcs.map(s => `<tr>
            <td class="nw">${esc(s.name)}</td>
            <td class="nw">${_money(s.input_per_1m)}</td><td class="nw">${_money(s.output_per_1m)}</td>
            <td class="nw">${s.cached_input_per_1m == null ? '<span class="hint">—</span>' : _money(s.cached_input_per_1m)}</td>
            <td class="nw">${_money(s.cost)}</td>
            <td class="nw">${_money(s.cost_cached)}</td>
            <td class="nw">${_money(s.per_day)}</td><td class="nw">${_money(s.per_month)}</td></tr>`).join("")
        + `</table>`
      : '<span class="hint">No token usage recorded in this window yet.</span>';
    // bars (naive cost per service + local), scaled to the max
    const items = [{ name: "🖥️ Self-hosted", cost: L.cost, me: true }]
      .concat(svcs.map(s => ({ name: s.name, cost: s.cost })));
    const max = Math.max(...items.map(i => i.cost), 0.0001);
    const cAcc = _css("--accent", "#e8833a"), cOk = _css("--ok", "#3fb950");
    $("#cost-bars").innerHTML = items.map(i =>
      `<div style="display:flex;align-items:center;gap:8px;margin:3px 0">
        <div style="width:190px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(i.name)}">${esc(i.name)}</div>
        <div style="flex:1;background:var(--line);border-radius:3px;height:16px">
          <div style="width:${Math.max(1, i.cost / max * 100).toFixed(1)}%;height:100%;background:${i.me ? cOk : cAcc};border-radius:3px"></div></div>
        <div style="width:90px;flex:none;text-align:right">${_money(i.cost)}</div>
      </div>`).join("");
    const kindPill = k => ({local: '<span class="pill ok" title="Self-hosted — costs electricity only">local</span>',
      subscription: '<span class="pill" title="Claude via Meridian — counts against your plan window, not dollars">subscription</span>',
      metered: '<span class="pill warn" title="Pay-per-token API">metered</span>'}[k] || `<span class="hint">${esc(k)}</span>`);
    const K2 = n => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(0) + "k" : "" + n;
    const split = d.by_model || [];
    $("#cost-split").innerHTML = split.length
      ? `<table><tr><th>model</th><th>backend</th><th title="local = self-hosted; subscription = Claude plan via Meridian; metered = pay-per-token API">kind</th><th>calls</th><th>input</th><th>output</th><th title="Prompt tokens served from cache">cached</th><th title="Share of all tokens in this window">share</th></tr>`
        + split.map(r => `<tr><td class="nw" style="max-width:220px;overflow:hidden;text-overflow:ellipsis" title="${esc(r.model)}">${esc(r.model)}</td>
            <td class="nw">${esc(r.backend || "")}</td><td class="nw">${kindPill(r.kind)}</td><td class="nw">${r.calls}</td>
            <td class="nw">${K2(r.input)}</td><td class="nw">${K2(r.output)}</td><td class="nw">${K2(r.cached)}</td>
            <td class="nw"><span class="meter"><span style="width:${Math.min(100, r.share_pct)}%"></span></span> ${r.share_pct}%</td></tr>`).join("") + `</table>`
      : '<span class="hint">No calls in this window.</span>';
    wrapTables();
  };

  const renderReport = r => {
    if (!r) return "";
    if (r.error) return `<p class="hint"><span class="pill bad">failed</span> ${esc(r.error)}</p>`;
    const money = v => v == null ? "—" : "$" + (+v).toFixed(v < 1 ? 3 : 2);
    const rows = [...(r.updated || []).map(u => ({...u, st: '<span class="pill ok">updated</span>'})),
                  ...(r.suspicious || []).map(u => ({...u, st: `<span class="pill warn" title="Not applied — use force from the API if it's genuine">skipped: ${esc(u.why)}</span>`}))];
    return `<p class="hint" style="margin:8px 0 4px">${r.dry_run ? "<b>Preview</b> — nothing saved. " : ""}${(r.updated || []).length} changed · ${(r.unchanged || []).length} already current · ${(r.locked || []).length} locked · matched by ${esc(r.matcher || "—")}${(r.unmatched || []).length ? ` · <span title="${esc(r.unmatched.join(", "))}">${r.unmatched.length} not found on OpenRouter</span>` : ""}</p>`
      + (rows.length ? `<table><tr><th>service</th><th>matched</th><th>input</th><th>output</th><th>cached</th><th></th></tr>`
        + rows.map(u => `<tr><td class="nw">${esc(u.name)}</td><td class="mono nw">${esc(u.id)}</td>
            <td class="nw">${money(u.old.input_per_1m)} → <b>${money(u.new.input_per_1m)}</b></td>
            <td class="nw">${money(u.old.output_per_1m)} → <b>${money(u.new.output_per_1m)}</b></td>
            <td class="nw">${money(u.old.cached_input_per_1m)} → ${money(u.new.cached_input_per_1m)}</td><td>${u.st}</td></tr>`).join("") + `</table>` : "");
  };
  const loadPriceSettings = async () => {
    let st; try { st = await api("pricing/settings"); } catch (e) { return; }
    $("#pu-auto").checked = !!st.auto; $("#pu-days").value = st.days || 7;
    const lr = st.last_report;
    $("#pu-status").innerHTML = st.last_update
      ? `Last update ${esc(st.last_update.replace("T", " ").slice(0, 16))} UTC${lr ? ` — ${lr.updated} changed, ${lr.unmatched} not found, matched by ${esc(lr.matcher || "")}${lr.error ? ` · <span class="pill bad">${esc(lr.error)}</span>` : ""}` : ""}`
      : "Prices have never been updated automatically.";
  };
  const runUpdate = async dry => {
    $("#pu-report").innerHTML = '<p class="hint">Fetching current prices from OpenRouter…</p>';
    try {
      const r = await api("pricing/update", {method: "POST", body: {dry_run: dry}});
      $("#pu-report").innerHTML = renderReport(r);
      if (!dry) { await loadRates(); await loadCosts(); await loadPriceSettings(); }
      wrapTables();
    } catch (e) { $("#pu-report").innerHTML = `<p class="hint"><span class="pill bad">error</span> ${esc(e.message)}</p>`; }
  };
  $("#pu-save").onclick = async () => {
    try { await api("pricing/settings", {method: "POST", body: {auto: $("#pu-auto").checked, days: +$("#pu-days").value}});
          toast("Schedule saved"); await loadPriceSettings(); } catch (e) { toast(e.message, true); }
  };
  $("#pu-run").onclick = () => runUpdate(false);
  $("#pu-preview").onclick = () => runUpdate(true);

  ["cost-win", "cost-model", "cost-backend", "cost-run", "cost-watts", "cost-kwh"].forEach(id => {
    const el = $("#" + id); el.onchange = loadCosts;
  });
  $("#cost-refresh").onclick = loadCosts;
  await loadRates();
  await loadCosts();
  await loadPriceSettings();
}

async function tabLive() {
  const ch = (title, key, sub) =>
    `<div class="card-h">${title}${key ? help(key) : ""}${sub ? `<span class="hint">— ${sub}</span>` : ""}</div>`;
  $("#main").innerHTML = `
    <h2 style="margin-top:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px">Live activity ${help("live")}
      <span class="hint" id="live-ts" style="margin:0"></span>
      <span style="flex:1"></span>
      <span id="live-run"></span>
      <button class="act" id="live-clear" title="Reset performance stats (all models or one) — e.g. after a GPU or config change">Clear stats…</button></h2>
    <p class="hint">Auto-refreshing every 2s — what's generating right now, measured speed per model, engine load on each inference server, and the last few finished requests. Hover anything underlined for a definition; <b>?</b> opens a longer explanation.</p>
    <div class="card">${ch("🩺 Performance advisor", "advisor", "possible problems found in the last 24h — click one for what to do")}<div id="live-advisor" class="hint">…</div></div>
    <div class="card">${ch("▶ Models generating now", "generating")}<div id="live-models" class="hint">…</div></div>
    <div class="card">${ch("📊 Recent performance", "perfstrip", "last N finished requests")}<div id="live-perf" class="hint">…</div></div>
    <div class="card">${ch("🖥 Inference servers", "servers", "engine-level load from llama.cpp / vLLM")}<div id="live-servers" class="hint">…</div></div>
    <div class="card">${ch("Loaded models — per-model performance", "loaded")}<div id="live-loaded"></div></div>
    <div class="card">${ch("⚙ Tool calls / jobs running", null)}<div id="live-tools" class="hint">…</div>
      <div class="hint" style="margin-top:4px">A long one (e.g. <code>acestep-music/generate_music</code>) staying here for minutes means a media job is actively rendering — not hung.</div></div>
    <div class="card">${ch("🔧 Tool activity", "toolstats", "recent, by call count")}<div id="live-toolstats"></div></div>
    <div class="card">${ch("🧠 Routing brain", "brain")}<div id="live-brain" class="hint">…</div></div>
    <div class="card">${ch("Backends", null)}<div id="live-backends"></div></div>
    <div class="card">${ch("Recently finished", "recent")}<div id="live-recent"></div></div>`;
  $("#live-clear").onclick = () => openClearDialog({});
  if (window._liveTimer) clearInterval(window._liveTimer);
  const paint = async () => {
    if (!$("#live-models")) { clearInterval(window._liveTimer); return; }  // tab changed → self-clean
    let a;
    try { a = await api("activity"); } catch (e) { return; }
    if (!$("#live-models")) return;
    $("#live-ts").textContent = "· updated " + new Date().toLocaleTimeString();
    $("#live-run").innerHTML = a.run_label
      ? `<span class="pill ok" title="New samples are recorded under this run label (set on the Performance tab)">🏷 ${esc(a.run_label)}</span>` : "";
    $("#live-servers").innerHTML = renderServers(a.servers || []);
    const _el = s => { s = Math.floor(s || 0); return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s"; };
    const _tps = Object.fromEntries((a.models || []).map(m => [m.model, m.tps]));
    const calls = a.calls || [];
    $("#live-models").innerHTML = calls.length
      ? calls.map(c => {
          const pf = (c.progress || {}).prefill;
          const phase = pf && pf.total ? (() => { const n = Math.max(1, pf.total - (pf.cache || 0)), d = Math.max(0, (pf.processed || 0) - (pf.cache || 0));
              return ` · reading prompt ${Math.floor(100 * d / n)}% (${d.toLocaleString()}/${n.toLocaleString()} new tok)`; })()
            : c.phase ? " · " + esc(c.phase) : "";
          return `<span class="pill ok" title="request ${esc(c.request_id || "?")} on backend ${esc(c.backend || "?")} — the client's '⏳ … still working' line shows the same id (first thinking line) and the same clock">▶ ${esc(c.model)} · ${_el(c.seconds)}${phase}${_tps[c.model] ? " · ~" + _tps[c.model] + " tok/s" : ""} <span class="mono" style="opacity:.75">req ${esc((c.request_id || "").slice(0, 8))}</span></span>`;
        }).join(" ")
      : (a.models || []).length
      ? a.models.map(m => `<span class="pill ok">▶ ${esc(m.model)} · ${_el(m.seconds)}${m.count > 1 ? " ×" + m.count : ""}${m.tps ? " · ~" + m.tps + " tok/s" : ""}</span>`).join(" ")
      : '<span class="hint">idle — no model generating</span>';
    $("#live-tools").innerHTML = (a.tools || []).length
      ? a.tools.map(t => `<span class="pill warn">⚙ ${esc(t.server)}/${esc(t.tool)} · ${t.seconds}s</span>`).join(" ")
      : '<span class="hint">idle — no tool/job running</span>';
    // recent-performance summary strip
    const sm = a.summary || {};
    if (sm.window) {
      const errPill = sm.err
        ? `<span class="pill bad">${sm.err} error${sm.err === 1 ? "" : "s"}</span>`
        : '<span class="pill ok">0 errors</span>';
      const truncPill = sm.truncations_total
        ? `<span class="pill warn" title="Total replies ever cut off at max_tokens (each = a turn a client had to 'continue'). Rising = looping or cap too low.">⤾ ${sm.truncations_total} truncations</span>`
        : '<span class="pill ok">⤾ 0 truncations</span>';
      const decodePill = sm.decode_tps
        ? `<span class="pill" title="Pure decode rate over the same traffic — what the GPU sustains once generating, prefill/queue removed. Always ≥ effective; a big gap means prefill/queue/tool time dominates.">⚡ ${sm.decode_tps} tok/s decode</span> ` : "";
      $("#live-perf").innerHTML =
        `<span class="pill" title="Output tokens ÷ wall time across the window — end-to-end rate incl. prefill/queue, so lower than raw decode tok/s">≈ ${sm.eff_tps} tok/s effective</span> `
        + decodePill
        + `<span class="pill" title="Mean wall time per finished request">Ø ${sm.avg_s}s / req</span> `
        + `<span class="pill ok">${sm.ok} ok</span> ${errPill} ${truncPill} `
        + `<span class="hint">over last ${sm.window} · ${sm.out_tokens.toLocaleString()} out-tok</span>`
        + sparkRow(sm.series || []);
    } else {
      $("#live-perf").innerHTML = '<span class="hint">no finished requests yet</span>';
    }
    // recent tool aggregate (where tool time / failures go)
    const ts = a.tool_stats || [];
    $("#live-toolstats").innerHTML = ts.length
      ? `<table><tr><th>tool</th><th>calls</th><th title="average duration per call">avg</th><th>fails</th></tr>`
        + ts.map(t => `<tr><td class="mono">${esc(t.tool)}</td><td class="nw">${t.count}</td>
            <td class="nw">${t.avg_ms >= 1000 ? (t.avg_ms / 1000).toFixed(1) + "s" : t.avg_ms + "ms"}</td>
            <td class="nw">${t.fails ? `<span class="pill bad">${t.fails}</span>` : '<span class="hint">0</span>'}</td></tr>`).join("")
        + `</table>`
      : '<span class="hint">no tool calls in the recent window</span>';
    // brain
    const gb = b => b ? (b / 1073741824).toFixed(1) + " GB" : "";
    const br = a.brain || {}, bh = br.health || {};
    const bHealth = bh.healthy === true ? '<span class="pill ok">reachable</span>'
      : (bh.healthy === false ? '<span class="pill bad" title="' + esc(bh.error || "") + '">unreachable</span>'
         : '<span class="pill warn">unknown</span>');
    const bLoaded = br.loaded === true
      ? `<span class="pill ok">loaded${br.size_vram ? " · " + gb(br.size_vram) : ""}</span>`
      : (br.loaded === false ? '<span class="pill">not loaded</span>'
         : '<span class="hint">(load state n/a)</span>');
    const bPresent = bh.model_present === false
      ? ' <span class="pill bad" title="endpoint up but model not pulled">model missing</span>' : "";
    const bMode = br.active === false
      ? ` <span class="pill warn" title="Persona requests are served directly by policy (brain skipped)">passthrough · ${esc(br.reason || "")}</span>`
      : (br.active ? ' <span class="pill ok" title="Persona requests are routed by the brain">routing via brain</span>' : "");
    $("#live-brain").innerHTML =
      `<code>${esc(br.model || "(not configured)")}</code> <span class="hint">(${esc(br.provider || "")} · mode ${esc(br.routing_mode || "auto")})</span> `
      + bHealth + " " + bLoaded + bPresent + bMode;
    // loaded in VRAM (per-model size)
    const ld = a.loaded_detail || [];
    const perfCell = (avg, last, unit, est) => {
      if (!avg && !last) return '<span class="hint">—</span>';
      const a2 = avg ? "~" + avg + (unit || "") : "—";
      const l2 = last ? `<div class="hint" style="margin:0" title="most recent call">last ${last}${unit || ""}</div>` : "";
      const e2 = est ? ' <span class="est" title="Estimated by the router from the stream — this backend reports no per-request timings (prefill includes network/queue time)">≈</span>' : "";
      return `${a2}${e2}${l2}`;
    };
    const ttftCell = p => {
      if (!p.ttft_ms && !p.last_ttft_ms) return '<span class="hint">—</span>';
      const s = v => v >= 1000 ? (v / 1000).toFixed(1) + "s" : Math.round(v) + "ms";
      const last = p.last_ttft_ms ? `<div class="hint" style="margin:0" title="most recent call">last ${s(p.last_ttft_ms)}</div>` : "";
      return `${p.ttft_ms ? "~" + s(p.ttft_ms) : "—"}${last}`;
    };
    // A percentage stat (spec acceptance / cache hit): avg · last call, dashed
    // when the backend never reported it. `good` picks the pill colour so a low
    // acceptance or cache-hit reads red at a glance. `n` = samples (for hover).
    const pctCell = (avg, last, n, good, hint) => {
      if (avg === null || avg === undefined) return '<span class="hint">—</span>';
      const cls = good(avg) ? "ok" : "warn";
      const lastTxt = (last !== null && last !== undefined)
        ? `<div class="hint" style="margin:0" title="most recent call">last ${last}%</div>` : "";
      return `<span class="pill ${cls}" title="${hint} (${n || 0} sample${n === 1 ? "" : "s"})">${avg}%</span>${lastTxt}`;
    };
    const ms = v => v >= 1000 ? (v / 1000).toFixed(1) + "s" : Math.round(v) + "ms";
    // duration cell: avg · last, in ms/s (the "how long" beside the "how fast").
    const msCell = (avg, last) => {
      if (!avg && !last) return '<span class="hint">—</span>';
      const a2 = avg ? "~" + ms(avg) : "—";
      const l2 = last ? `<div class="hint" style="margin:0" title="most recent call">last ${ms(last)}</div>` : "";
      return `${a2}${l2}`;
    };
    // single-value rate cell (per-model effective tok/s — no last snapshot).
    const oneCell = (v, unit) => v ? "~" + v + (unit || "") : '<span class="hint">—</span>';
    // VRAM + serving context. Ollama reports VRAM bytes (incl. the KV cache for
    // its loaded context); llama.cpp reports no VRAM over HTTP but does report
    // n_ctx, so that column shows "—" for VRAM and the context beneath. Context
    // falls back to the model's trained window when the serving n_ctx is unknown.
    const kctx = n => n >= 1000 ? Math.round(n / 1000) + "k" : ("" + n);
    const vramCell = (m, p) => {
      const v = gb(m.size_vram);
      const ctx = m.context || p.context_length || 0;
      const ctxTxt = ctx ? `<div class="hint" style="margin:0" title="Serving context window (per slot on llama.cpp; max_model_len on vLLM), else the trained window">${kctx(ctx)} ctx</div>` : "";
      const w = m.size ? `<div class="hint" style="margin:0" title="Model weights file size (llama.cpp /v1/models meta) — VRAM use is this plus the KV cache">${gb(m.size)} weights</div>` : "";
      const sl = m.slots ? `<div class="hint" style="margin:0" title="Parallel slots (-np); the context is per slot">${m.slots} slots</div>` : "";
      const st = m.state ? `<div class="hint" style="margin:0" title="llama-swap state">${esc(m.state)}</div>` : "";
      return (v || '<span class="hint" title="llama.cpp / vLLM do not report VRAM over HTTP">—</span>') + ctxTxt + w + sl + st;
    };
    $("#live-loaded").innerHTML = ld.length
      ? `<table><tr><th>model</th><th title="GPU memory held (Ollama /api/ps). llama.cpp reports context, not VRAM. Second line = serving/trained context window.">VRAM · ctx</th>
          <th title="Time to first token — wall time from request to first output token, incl. any queue wait (avg · last). High vs prefill time = queuing.">TTFT</th>
          <th title="Decode speed — output tokens/sec once generating (avg · last call)">decode tok/s</th>
          <th title="Decode wall time — how long generation took (avg · last call)">decode time</th>
          <th title="Prefill speed — prompt tokens/sec processing the context (avg · last call)">prefill tok/s</th>
          <th title="Prefill wall time — how long processing the prompt took, ~= TTFT on a warm model (avg · last call)">prefill time</th>
          <th title="Effective tok/s for this model over the recent window — output tokens ÷ end-to-end wall time (incl. prefill/queue). The rate you actually feel; gap to decode tok/s = overhead.">eff tok/s</th>
          <th title="Speculative-decoding acceptance — draft tokens the target model kept, ÷ proposed (avg · last call). Low = draft model mismatched or --spec-draft-n-max too deep, so speculation is wasting compute. Blank = no draft model.">spec accept</th>
          <th title="KV prefix-cache hit rate — prompt tokens served from cache instead of re-prefilled (avg · last call). A falling rate across a session points at a chat-template/cache regression. Blank = backend doesn't report it.">cache hit</th>
          <th title="Typical cold-load time (avg)">load</th>
          <th title="Replies cut off at the max-token cap (finish_reason=length) — each one is a turn the client had to 'continue'">trunc</th>
          <th>backend</th></tr>` +
        ld.map(m => { const p = m.perf || {}; return `<tr><td class="nw" style="max-width:180px;overflow:hidden;text-overflow:ellipsis" title="${esc(m.model)}">${esc(m.model)}</td>
          <td class="nw">${vramCell(m, p)}</td>
          <td class="nw">${ttftCell(p)}</td>
          <td class="nw">${perfCell(p.decode_tps, p.last_decode_tps, "", p.timing_src === "estimated")}</td>
          <td class="nw">${msCell(p.decode_ms, p.last_decode_ms)}</td>
          <td class="nw">${perfCell(p.prompt_tps, p.last_prompt_tps, "", p.timing_src === "estimated")}</td>
          <td class="nw">${msCell(p.prefill_ms, p.last_prefill_ms)}</td>
          <td class="nw">${oneCell(p.eff_tps, "")}</td>
          <td class="nw">${pctCell(p.spec_accept_pct, p.last_spec_accept_pct, p.spec_samples, v => v >= 60, "Draft acceptance — accepted ÷ proposed draft tokens")}</td>
          <td class="nw">${pctCell(p.cache_hit_pct, p.last_cache_hit_pct, p.cache_samples, v => v >= 50, "KV prefix-cache hit — cached ÷ prompt tokens")}</td>
          <td class="nw">${p.cold_load_ms ? ms(p.cold_load_ms) : '<span class="hint">warm</span>'}</td>
          <td class="nw">${p.truncations ? `<span class="pill warn" title="${p.truncations} truncated repl${p.truncations === 1 ? "y" : "ies"} — last finish: ${esc(p.last_finish || "")}">${p.truncations}</span>` : '<span class="hint">0</span>'}</td>
          <td class="nw">${esc(m.backend || "")}</td></tr>`; }).join("") + `</table>`
      : (a.loaded || []).length
        ? (a.loaded || []).map(m => `<span class="pill">${esc(m)}</span>`).join(" ")
        : '<span class="hint">nothing loaded</span>';
    $("#live-backends").innerHTML = `<table><tr><th>name</th><th title="Wire protocol · server software (flavor)">type</th><th title="Healthy after a successful model-list probe; down after repeated failures (hover for the last error)">health</th><th title="Models this backend advertises">models</th></tr>` +
      (a.backends || []).map(b => `<tr><td>${esc(b.name)}</td><td class="nw">${esc(b.type)}${b.flavor && b.flavor !== "openai" && b.flavor !== "ollama" ? ` <span class="pill">${esc(_FLAVOR_LABEL[b.flavor] || b.flavor)}</span>` : ""}</td>
        <td>${b.enabled === false ? '<span class="pill" title="Disabled on the Backends tab">disabled</span>'
             : b.healthy ? '<span class="pill ok">healthy</span>'
             : '<span class="pill bad" title="' + esc(b.last_error) + '">down</span>'}</td>
        <td class="nw">${b.models}</td></tr>`).join("") + `</table>`;
    $("#live-recent").innerHTML = `<table><tr><th>time (UTC)</th><th>persona</th><th>mode</th><th>model(s)</th>
        <th title="prompt → output tokens for this turn">tokens</th>
        <th title="output tokens ÷ this turn's wall time (end-to-end, incl. prefill)">tok/s</th>
        <th>status</th><th>time</th></tr>` +
      (a.recent || []).map(r => {
        let models = "", inTok = 0, outTok = 0;
        try {
          const mu = JSON.parse(r.models_used || "[]") || [];
          models = mu.map(x => x.model).join(", ");
          for (const x of mu) { inTok += x.prompt_tokens || 0; outTok += x.completion_tokens || 0; }
        } catch (e) {}
        const secs = r.duration_ms != null ? r.duration_ms / 1000 : 0;
        const tps = (outTok && secs) ? (outTok / secs).toFixed(1) : "";
        const st = r.status === "ok" ? '<span class="pill ok">ok</span>'
          : (r.status === "error" ? '<span class="pill bad">error</span>'
             : '<span class="pill warn">' + esc(r.status || "") + '</span>');
        return `<tr><td class="nw">${esc((r.ts || "").replace("T", " ").slice(0, 19))}</td>
          <td>${esc(r.persona || "")}</td><td class="nw">${esc(r.mode || "")}</td>
          <td>${esc(models || r.client_model || "")}</td>
          <td class="nw">${(inTok || outTok) ? inTok.toLocaleString() + " → " + outTok.toLocaleString() : '<span class="hint">—</span>'}</td>
          <td class="nw">${tps ? "~" + tps : '<span class="hint">—</span>'}</td>
          <td>${st}</td>
          <td class="nw">${r.duration_ms != null ? secs.toFixed(1) + "s" : ""}</td></tr>`;
      }).join("") + `</table>`;
    wrapTables();
  };
  window._liveTimer = setInterval(paint, 2000);
  // Advisor: heavier (reads the history) — every 30s, self-cleaning on tab change.
  if (window._advTimer) clearInterval(window._advTimer);
  const paintAdv = async () => {
    if (!$("#live-advisor")) { clearInterval(window._advTimer); return; }
    try { renderAdvisor($("#live-advisor"), await api("perf/advisor?hours=24")); } catch (e) {}
  };
  paintAdv();
  window._advTimer = setInterval(paintAdv, 30000);
  await paint();
}

      <label>group by</label><select id="cmp-group"><option value="client">client key</option><option value="persona" ${o.group === "persona" ? "selected" : ""}>persona</option></select></div>
    ${gs.length ? `<table><tr><th>metric</th>${gs.map(g => `<th>${esc(g.group)}</th>`).join("")}</tr>${body}</table>` : '<p class="hint">No requests in this window.</p>'}

// Work (orchestration.py): a development coordinator's tasks and the coding
// sessions it bound to them, next to the model calls Foundry measured for each.
// Coordinator state is as reported by the coordinator; Foundry never decides
// whether a task is done, and doesn't see local edits or Studio operations.
window._workOpts = window._workOpts || {project: "", hours: 72};
async function tabWork() {
  const o = window._workOpts;

    api(`work?hours=${o.hours}&project=${encodeURIComponent(o.project)}`),
    api(`work/scorecard?hours=${o.hours}&project=${encodeURIComponent(o.project)}`).catch(e => { if (e.stale) throw e; return {sprints: [], totals: {}}; })]);
  const stCls = {COMPLETE: "ok", APPROVED: "ok", BLOCKED: "bad", FAILED: "bad", CANCELLED: "",
    AWAITING_HUMAN: "warn", PAUSED: "warn", CHANGES_REQUIRED: "warn"};
  const pill = st => `<span class="pill ${stCls[st] || ""}">${esc(st || "—")}</span>`;
  const sha = v => v ? `<code>${esc(String(v).slice(0, 10))}</code>` : '<span class="hint">—</span>';
  const when = ts => ts ? esc(_tsText(ts)) : "";
  const dur = sec => sec == null ? '<span class="hint">—</span>' : (sec >= 3600 ? `${Math.floor(sec / 3600)}h ${String(Math.floor(sec % 3600 / 60)).padStart(2, "0")}m` : sec >= 60 ? `${Math.floor(sec / 60)}m ${String(Math.round(sec % 60)).padStart(2, "0")}s` : `${Math.round(sec)}s`);
  const tk = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : "" + (n || 0);
  const speedCell = sp => {

      + (e ? `${m && m.decode_tps != null ? " · " : ""}<span class="est-v" title="${e.n} call(s) on a backend that reports no decode timing: tokens ÷ call time">eff ${e.eff_tps ?? "—"} tok/s</span>` : "")

  const scRows = (sc.sprints || []).map(x => {

      <td class="nw">${x.attempts ?? "—"}</td><td class="nw">${dur(x.wall_s)}</td>
      <td class="nw" title="${esc(roles)}">${x.model_calls}${x.model_errors ? ` <span class="pill warn">${x.model_errors} err</span>` : ""}</td>
      <td class="nw" title="${esc(roles)}">${tk(x.tokens.input)} / ${tk(x.tokens.output)}</td>
      <td class="nw" title="gate runs; red = studio gate went red${g.total_s != null ? "; " + dur(g.total_s).replace(/<[^>]+>/g, "") + " in gates" : ""}">${g.passed}/${g.run} passed${g.red ? ` <span class="pill warn">${g.red} red</span>` : ""}${g.avg_s != null ? ` <span class="hint">~${dur(g.avg_s)}</span>` : ""}</td>
      <td class="nw">${x.reviews.approved}/${x.reviews.total} approved</td>
      <td class="nw">${x.vision.rounds ? x.vision.rounds + " round(s)" : '<span class="hint">0</span>'}${x.vision.approved ? " ✓" : ""}</td>
      <td class="nw" title="helpers started / finished; integrated or rejected is the primary's own account">${h.used} used · ${h.integrated} integrated${h.rejected ? ` · ${h.rejected} rejected` : ""}${h.total_s != null ? ` <span class="hint">${dur(h.total_s)}</span>` : ""}</td>
      <td class="nw">${speedCell(x.speed)}</td>
      <td class="nw">${x.cost.sub_cost_usd ? "$" + x.cost.sub_cost_usd.toFixed(2) + ' <span class="hint">plan</span>' : ""}${x.cost.est_cost_usd ? " $" + x.cost.est_cost_usd.toFixed(2) : ""}${!x.cost.sub_cost_usd && !x.cost.est_cost_usd ? '<span class="hint">—</span>' : ""}</td></tr>`;
  }).join("");
  const st = sc.totals || {};
  const tasks = w.tasks.map(t => {
    const d = t.data || {};
    const note = d.blocker || d.awaiting || d.pause_reason || d.next_action || "";
    const finds = (t.state === "COMPLETE" ? [] : d.findings || []).slice(0, 3).map(f => `<div class="hint">• ${esc(f.slice(0, 200))}</div>`).join("");
    const live = `/ui/control?project=${encodeURIComponent(t.project_id)}&task=${encodeURIComponent(t.task_id)}`;
    return `<tr><td class="nw">${esc(t.project_id)}</td><td class="nw"><b>${esc(t.task_id)}</b> <a href="${esc(live)}" target="_blank" rel="noopener" title="Open the live view of this task in the control center (follows the coordinator's current session)">live view ↗</a></td>
      <td class="nw">${pill(t.state)}${d.stage === "after_close" ? ' <span class="hint">closed, awaiting approval</span>' : ""}</td>
      <td class="nw">${d.attempt ?? ""}${d.sessions ? ` <span class="hint">(${d.sessions} sessions)</span>` : ""}</td>
      <td class="nw">${sha(d.head_sha)}${d.reviewed_sha ? ` <span class="hint">reviewed</span> ${sha(d.reviewed_sha)}` : ""}</td>
      <td class="bw-wide" style="white-space:normal">${esc(note.slice(0, 300))}${finds}</td><td class="nw hint">${when(t.updated_ts)}</td></tr>`;
  }).join("");
  const sessions = w.sessions.map(s => {
    const u = s.usage || {};
    const sv = `/ui/control?project=${encodeURIComponent(s.project_id)}&task=${encodeURIComponent(s.task_id || "")}&session=${encodeURIComponent(s.session_id)}`;
    return `<tr><td class="nw"><code title="${esc(s.session_id)}">${esc(s.session_id.slice(0, 18))}</code> <a href="${esc(sv)}" target="_blank" rel="noopener" title="Open this session's transcript in the control center">open ↗</a></td>
      <td class="nw">${esc(s.project_id)} / ${esc(s.task_id || "")}</td><td class="nw">${esc(s.role || "")}</td>
      <td class="nw">${esc(s.persona || "")}</td><td class="nw hint">${esc(s.run_id || "")}</td>
      <td class="nw">${u.calls ?? 0}${u.denied ? ` <span class="pill bad">${u.denied} denied</span>` : ""}${u.inflight ? ` <span class="pill warn">${u.inflight} running</span>` : ""}</td>
      <td class="nw">${(u.tokens || 0).toLocaleString()}</td><td class="hint bw-mid" style="white-space:normal">${esc((u.routes || "").replace(/,/g, ", "))}</td>
      <td class="nw">${s.ended_ts ? '<span class="hint">ended ' + esc(s.outcome || "") + "</span>" : '<span class="pill ok">open</span>'}${s.parent_session_id ? ` <span class="hint">helper of ${esc(s.parent_session_id.slice(0, 12))}</span>` : ""}</td></tr>`;
  }).join("");
  const events = w.events.slice(0, 40).map(e => `<tr><td class="nw hint">${when(e.ts)}</td>
    <td class="nw">${esc(e.project_id)} / ${esc(e.task_id || "—")}</td><td class="nw">${esc(e.kind)}</td>
    <td class="nw">${e.state ? pill(e.state) : ""}</td>
    <td class="hint bw-wide" style="white-space:normal">${esc(Object.entries(e.detail || {}).filter(([k]) => k !== "results").map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`).join(" · ").slice(0, 260))}</td></tr>`).join("");
  $("#main").innerHTML = `
    <h2>Work</h2>
    <p><a class="act" href="/ui/control" target="_blank" rel="noopener" style="display:inline-block;padding:4px 10px;border:1px solid var(--accent);border-radius:4px;color:var(--accent);text-decoration:none">Open control center ↗</a>
      <span class="hint">live transcripts, thinking, tools, helpers, alerts, replies and coordinator commands (operator key; this table stays as it is)</span></p>
    <p class="hint">Tasks a development coordinator runs (e.g. <code>python -m foundry_coordinator</code>) and the coding sessions it bound to them, with every model call Foundry measured for each session. Task states come from the coordinator; Foundry doesn't decide completion and can't see local file edits or Studio operations.</p>
    <div class="row"><label>project</label><select id="wk-proj"><option value="">all</option>${w.projects.map(p => `<option ${p === o.project ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
      <label>window</label><select id="wk-hours">${[6, 24, 72, 168, 720].map(h => `<option value="${h}" ${h == o.hours ? "selected" : ""}>${h < 24 ? h + " h" : h / 24 + " d"}</option>`).join("")}</select></div>
    <div class="card"><h3>Sprint scorecard</h3>

      ${scRows ? `<div class="tscroll"><table><tr><th>sprint</th><th>outcome</th><th>attempts</th><th>wall time</th><th>model calls</th><th>tokens in / out</th><th>gates</th><th>reviews</th><th>vision</th><th>helpers</th><th>decode speed</th><th>cost</th></tr>${scRows}</table></div>` : '<p class="hint">No sprints reported in this window.</p>'}</div>
    <div class="card"><h3>Tasks</h3>${w.tasks.length ? `<div class="tscroll"><table><tr><th>project</th><th>task</th><th>state</th><th>attempt</th><th>commit</th><th>now / blocker / findings</th><th>updated</th></tr>${tasks}</table></div>` : '<p class="hint">No coordinator has reported tasks in this window.</p>'}</div>
    <div class="card"><h3>Sessions</h3>${w.sessions.length ? `<div class="tscroll"><table><tr><th>session</th><th>project / task</th><th>role</th><th>persona</th><th>run</th><th>calls</th><th>tokens</th><th>backend / model actually used</th><th>status</th></tr>${sessions}</table></div>` : '<p class="hint">No bound sessions.</p>'}</div>

    <p class="hint">${esc(w.note)}</p>`;
  $("#wk-proj").onchange = e => { o.project = e.target.value; render(); };

async function _downloadAdmin(path, filename) {
  const k = _adminKey();
  const r = await fetch("/admin/api/" + path, {headers: k ? {"Authorization": "Bearer " + k} : {}});
  if (!r.ok) { alert(`Download failed: HTTP ${r.status}`); return; }
  const blob = await r.blob();
  if (!blob.size) { toast("Nothing captured matches that filter yet", true); return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}
async function downloadTrainingFile(id, name) {
  const k = _adminKey();
  const r = await fetch(`/admin/api/training/datasets/${encodeURIComponent(id)}/${name}`,
                        {headers: k ? {"Authorization": "Bearer " + k} : {}});
  if (!r.ok) { alert(`Download failed: HTTP ${r.status}`); return; }
  const url = URL.createObjectURL(await r.blob());
  const a = document.createElement("a"); a.href = url; a.download = `${id}-${name}`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
}

      Base URL <code>${esc(ep.openai)}</code>, API Key = the key, Model ID = a persona name (e.g. a Foundry-Cline persona).
      Cline's <i>Ollama</i> provider can't send a key; use OpenAI Compatible.</p>`,
    kilo: `<p><b>Kilo Code</b>: in <code>kilo.jsonc</code> (or the provider settings) set the Foundry provider's key.
      Routing → Personas → <i>Kilo config</i> generates the whole provider block.</p>` +

    coordinator: `<p><b>Coordinator</b> (on the machine that runs <code>python -m foundry_coordinator</code>): the

      `<p class="hint">Open a new terminal afterwards. Linux/macOS: <code>export FOUNDRY_COORDINATOR_KEY=…</code></p>`,
    training: `<p><b>Training pipeline</b>: set <code>FOUNDRY_TRAINING_KEY</code> where <code>python -m foundry_training</code> runs.</p>` +
      pre(`setx FOUNDRY_TRAINING_KEY "${k}"`),
    admin: `<p><b>Admin key</b>: needed only if "Protect the web UI" is on. The UI asks for it once per browser.</p>`,
  }[preset] || "";
  return how + generic;
