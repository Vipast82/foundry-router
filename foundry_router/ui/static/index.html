const _COST = { hours: 72, model: "", backend: "", run: "__all__", watts: 400, kwh: 0.15 };
try { Object.assign(_COST, JSON.parse(localStorage.getItem("costCtl") || "{}")); } catch (e) {}
const _money = v => v == null ? "—"
  : "$" + (v >= 1000 ? v.toLocaleString(undefined, { maximumFractionDigits: 0 })
    : v >= 1 ? v.toFixed(2) : v >= 0.01 ? v.toFixed(3) : v.toFixed(4));

async function tabCost() {
  const winOpts = [[6, "6h"], [24, "24h"], [72, "3d"], [168, "7d"], [336, "14d"]];
  $("#main").innerHTML = `
    <h2 style="margin-top:0;display:flex;align-items:center">Cost calculator ${help("cost")} <span class="hint" id="cost-ts" style="margin:0 0 0 8px"></span></h2>
    <p class="hint">What the tokens in this window would have cost on a paid API vs self-hosting. Token counts are real (measured per call); service rates are editable list prices — a semi-close decision aid, not a bill. Paid-API cost assumes you re-send context each turn (that's how they bill); the “with cache” column applies your measured cache-hit tokens at each vendor's cached-input rate.</p>
    <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <label>Window <select id="cost-win">${winOpts.map(([h, l]) => `<option value="${h}"${h === _COST.hours ? " selected" : ""}>${l}</option>`).join("")}</select></label>
      <label>Model <select id="cost-model"><option value="">all models</option></select></label>
      <label title="Only calls served by one backend">Backend <select id="cost-backend"><option value="">all backends</option></select></label>
      <label title="Only one run label (hardware / config experiment)">Run <select id="cost-run"><option value="__all__">all runs</option></select></label>
      <label title="Approx. power draw of your inference box under load">self-host watts <input id="cost-watts" type="number" min="0" style="width:70px" value="${_COST.watts}"></label>
      <label title="Your electricity price"> $/kWh <input id="cost-kwh" type="number" min="0" step="0.01" style="width:70px" value="${_COST.kwh}"></label>
      <button class="act" id="cost-refresh">Refresh</button>
      <span class="hint" id="cost-count"></span>
    </div>
    <div id="cost-summary"></div>
    <div id="cost-verdict"></div>
    <div class="card"><div style="font-weight:600;margin-bottom:6px">Cost for this window <span class="hint" style="font-weight:normal">— cheapest first; self-host = electricity estimate</span></div><div id="cost-table"></div></div>
    <div class="card"><div style="font-weight:600;margin-bottom:6px">Visual comparison</div><div id="cost-bars"></div></div>
    <div class="card"><div class="card-h">Where the tokens went ${help("costsplit")}<span class="hint">— per model in this window</span></div><div id="cost-split"></div></div>
    <div class="card"><div class="card-h">Automatic price updates ${help("priceupdate")}</div>
      <div class="row" style="margin:0">
        <label style="min-width:0" title="Refresh unlocked prices from OpenRouter on a schedule"><input type="checkbox" id="pu-auto"> update automatically every</label>
        <input id="pu-days" type="number" min="1" max="90" style="width:60px"> <span class="hint" style="margin:0">days</span>
        <button class="act" id="pu-save">Save schedule</button>
        <button class="act" id="pu-preview" title="Show what would change without saving anything">Preview</button>
        <button class="act primary" id="pu-run" title="Fetch current prices now and apply them to every unlocked service">Update prices now</button>
      </div>
      <div id="pu-status" class="hint" style="margin:8px 0 0"></div>
      <div id="pu-report"></div></div>
    <div class="card"><div class="card-h">Service rates <span class="hint">— USD per 1M tokens · editable · 🔒 = never auto-updated</span></div>
      <div id="cost-rates"></div></div>`;

  const loadRates = async () => {
    let d; try { d = await api("pricing"); } catch (e) { return; }
    const rows = d.services || [];
    const cell = (id, val, w) => `<input data-k="${id}" type="${id === "name" || id === "notes" ? "text" : "number"}" step="0.01" style="width:${w}" value="${val == null ? "" : esc("" + val)}">`;
    $("#cost-rates").innerHTML =
      `<table><tr><th title="Include in the comparison">on</th><th title="Locked rows are never changed by the automatic price update">🔒</th><th>service</th><th>in $/1M</th><th>out $/1M</th><th title="cached-input rate (prompt-cache hit)">cached $/1M</th><th>notes</th><th title="Where the current price came from, and when">source · updated</th><th></th></tr>`
      + rows.map(s => `<tr data-id="${s.id}">
          <td class="nw"><input data-k="enabled" type="checkbox" ${s.enabled ? "checked" : ""}></td>
          <td class="nw"><input data-k="locked" type="checkbox" ${s.locked ? "checked" : ""} title="Lock: keep your manual price"></td>
          <td>${cell("name", s.name, "150px")}</td>
          <td class="nw">${cell("input_per_1m", s.input_per_1m, "70px")}</td>
          <td class="nw">${cell("output_per_1m", s.output_per_1m, "70px")}</td>
          <td class="nw">${cell("cached_input_per_1m", s.cached_input_per_1m, "70px")}</td>
          <td>${cell("notes", s.notes || "", "160px")}</td>
          <td class="nw hint" title="${esc(s.source_id ? "matched OpenRouter model: " + s.source_id : "")}${s.last_checked ? "\nlast checked " + esc(s.last_checked) : ""}">${esc(s.source || "seed")}${s.source_id ? " · " + esc(s.source_id) : ""}<br>${esc((s.updated_at || "").slice(0, 10))}</td>
          <td class="nw"><button class="act" data-act="save">Save</button> <button class="act" data-act="del" title="delete">✕</button></td>
        </tr>`).join("")
      + `<tr data-id="">
          <td class="nw"><input data-k="enabled" type="checkbox" checked></td>
          <td class="nw"><input data-k="locked" type="checkbox"></td>
          <td>${cell("name", "", "150px")}</td>
          <td class="nw">${cell("input_per_1m", "", "70px")}</td>
          <td class="nw">${cell("output_per_1m", "", "70px")}</td>
          <td class="nw">${cell("cached_input_per_1m", "", "70px")}</td>
          <td>${cell("notes", "", "160px")}</td>
          <td></td>
          <td class="nw"><button class="act" data-act="save">Add</button></td>
        </tr></table>`;
    $("#cost-rates").querySelectorAll("button[data-act]").forEach(btn => {
      btn.onclick = async () => {
        const tr = btn.closest("tr"), id = tr.getAttribute("data-id");
        if (btn.getAttribute("data-act") === "del") {
          if (!confirm("Delete this service?")) return;
          await api("pricing/delete", { method: "POST", body: { id: +id } });
        } else {
          const g = k => tr.querySelector(`[data-k="${k}"]`);
          const body = {
            id: id ? +id : null, name: g("name").value.trim(),
            input_per_1m: g("input_per_1m").value, output_per_1m: g("output_per_1m").value,
            cached_input_per_1m: g("cached_input_per_1m").value,
            enabled: g("enabled").checked, notes: g("notes").value,
            locked: g("locked").checked,
          };
          if (!body.name) return toast("Name required");
          try { await api("pricing", { method: "POST", body }); }
          catch (e) { return toast(e.message || "Save failed", true); }
        }
        toast("Saved"); await loadRates(); await loadCosts();
      };
    });
    wrapTables();
  };

  const loadCosts = async () => {
    _COST.hours = +$("#cost-win").value; _COST.model = $("#cost-model").value;
    _COST.backend = $("#cost-backend").value; _COST.run = $("#cost-run").value;
    _COST.watts = +$("#cost-watts").value || 0; _COST.kwh = +$("#cost-kwh").value || 0;
    try { localStorage.setItem("costCtl", JSON.stringify(_COST)); } catch (e) {}
    let d;
    let cq = `cost-compare?hours=${_COST.hours}&model=${encodeURIComponent(_COST.model)}&backend=${encodeURIComponent(_COST.backend || "")}&watts=${_COST.watts}&kwh=${_COST.kwh}`;
    if (_COST.run && _COST.run !== "__all__") cq += `&run_label=${encodeURIComponent(_COST.run === "__none__" ? "" : _COST.run)}`;
    try { d = await api(cq); }
    catch (e) { $("#cost-summary").innerHTML = '<div class="card hint">Could not load.</div>'; return; }
    $("#cost-ts").textContent = "· " + new Date().toLocaleTimeString();
    // model filter options (from perf history)
    let hist; try { hist = await api(`perf-history?hours=${_COST.hours}`); } catch (e) { hist = { models: [] }; }
    const fillSel = (id, first, items, cur) => {
      const el = $(id);
      el.innerHTML = first + items.join("");
      if (cur && ![...el.options].some(o => o.value === cur))
        el.insertAdjacentHTML("beforeend", `<option value="${esc(cur)}">${esc(cur === "__none__" ? "(unlabelled)" : cur)}</option>`);
      el.value = cur || el.options[0].value;
    };
    fillSel("#cost-model", '<option value="">all models</option>',
      (hist.models || []).map(m => `<option value="${esc(m.model)}">${esc(m.model)} (${m.n})</option>`), _COST.model);
    fillSel("#cost-backend", '<option value="">all backends</option>',
      (hist.backends || []).map(b => `<option value="${esc(b.backend)}">${esc(b.backend || "(none)")} (${b.n})</option>`), _COST.backend);
    fillSel("#cost-run", '<option value="__all__">all runs</option>',
      (hist.run_labels || []).map(r => `<option value="${esc(r.run_label || "__none__")}">${esc(r.run_label || "(unlabelled)")} (${r.n})</option>`), _COST.run);
    const t = d.tokens, L = d.local;
    $("#cost-count").textContent = `${t.calls} calls · span ${d.span_hours}h`;
    const tile = (label, v, hint) => `<div style="min-width:110px" title="${hint || ""}"><div class="hint" style="margin:0">${label}</div><div style="font-size:18px;font-weight:600">${v}</div></div>`;
    const K = n => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(0) + "k" : "" + n;
    $("#cost-summary").innerHTML = `<div class="card" style="display:flex;gap:22px;flex-wrap:wrap">`
      + tile("input tokens", K(t.input), "prompt tokens sent (context re-sent each turn)")
      + tile("output tokens", K(t.output), "generated tokens")
      + tile("cached (KV hit)", K(t.cached), "prompt tokens served from cache locally")
      + tile("calls", t.calls, "model calls in window")
      + tile("self-host est.", _money(L.cost), `${L.watts}W × ${L.active_hours}h active × $${L.kwh}/kWh`)
      + `</div>`;
    // verdict
    const svcs = d.services || [];
    if (svcs.length) {
      const cheapest = svcs[0], dearest = svcs[svcs.length - 1];
      const save = cheapest.cost - L.cost;
      const banner = save > 0
        ? `<span class="pill ok">self-hosting saved ~${_money(save)}</span> vs the cheapest cloud option (${esc(cheapest.name)} ${_money(cheapest.cost)}) over this window.`
        : `<span class="pill warn">cloud would have been ~${_money(-save)} cheaper</span> — ${esc(cheapest.name)} at ${_money(cheapest.cost)} vs your ${_money(L.cost)} self-host estimate.`;
      $("#cost-verdict").innerHTML = `<div class="card">${banner}
        <div class="hint" style="margin-top:4px">Most expensive: ${esc(dearest.name)} at ${_money(dearest.cost)}${dearest.per_month != null ? ` (~${_money(dearest.per_month)}/mo at this rate)` : ""}. Self-host ≈ ${_money(L.per_month)}/mo.</div></div>`;
    } else { $("#cost-verdict").innerHTML = ""; }
    // table
    const localRow = `<tr style="font-weight:600">
        <td>🖥️ Self-hosted (electricity)</td><td class="nw">—</td><td class="nw">—</td><td class="nw">—</td>
        <td class="nw">${_money(L.cost)}</td><td class="nw">${_money(L.cost)}</td>
        <td class="nw">${_money(L.per_day)}</td><td class="nw">${_money(L.per_month)}</td></tr>`;
    $("#cost-table").innerHTML = svcs.length
      ? `<table><tr><th>service</th><th>in $/1M</th><th>out $/1M</th><th>cached $/1M</th>
          <th>est. cost</th><th title="applying your measured cache-hit tokens at the vendor's cached rate">with cache</th>
          <th>/day</th><th>/month</th></tr>`
        + localRow
        + svcs.map(s => `<tr>
            <td class="nw">${esc(s.name)}</td>
            <td class="nw">${_money(s.input_per_1m)}</td><td class="nw">${_money(s.output_per_1m)}</td>
            <td class="nw">${s.cached_input_per_1m == null ? '<span class="hint">—</span>' : _money(s.cached_input_per_1m)}</td>
            <td class="nw">${_money(s.cost)}</td>
            <td class="nw">${_money(s.cost_cached)}</td>
            <td class="nw">${_money(s.per_day)}</td><td class="nw">${_money(s.per_month)}</td></tr>`).join("")
        + `</table>`
      : '<span class="hint">No token usage recorded in this window yet.</span>';
    // bars (naive cost per service + local), scaled to the max
    const items = [{ name: "🖥️ Self-hosted", cost: L.cost, me: true }]
      .concat(svcs.map(s => ({ name: s.name, cost: s.cost })));
    const max = Math.max(...items.map(i => i.cost), 0.0001);
    const cAcc = _css("--accent", "#e8833a"), cOk = _css("--ok", "#3fb950");
    $("#cost-bars").innerHTML = items.map(i =>
      `<div style="display:flex;align-items:center;gap:8px;margin:3px 0">
        <div style="width:190px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(i.name)}">${esc(i.name)}</div>
        <div style="flex:1;background:var(--line);border-radius:3px;height:16px">
          <div style="width:${Math.max(1, i.cost / max * 100).toFixed(1)}%;height:100%;background:${i.me ? cOk : cAcc};border-radius:3px"></div></div>
        <div style="width:90px;flex:none;text-align:right">${_money(i.cost)}</div>
      </div>`).join("");
    const kindPill = k => ({local: '<span class="pill ok" title="Self-hosted — costs electricity only">local</span>',
      subscription: '<span class="pill" title="Claude via Meridian — counts against your plan window, not dollars">subscription</span>',
      metered: '<span class="pill warn" title="Pay-per-token API">metered</span>'}[k] || `<span class="hint">${esc(k)}</span>`);
    const K2 = n => n >= 1e6 ? (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? (n / 1e3).toFixed(0) + "k" : "" + n;
    const split = d.by_model || [];
    $("#cost-split").innerHTML = split.length
      ? `<table><tr><th>model</th><th>backend</th><th title="local = self-hosted; subscription = Claude plan via Meridian; metered = pay-per-token API">kind</th><th>calls</th><th>input</th><th>output</th><th title="Prompt tokens served from cache">cached</th><th title="Share of all tokens in this window">share</th></tr>`
        + split.map(r => `<tr><td class="nw" style="max-width:220px;overflow:hidden;text-overflow:ellipsis" title="${esc(r.model)}">${esc(r.model)}</td>
            <td class="nw">${esc(r.backend || "")}</td><td class="nw">${kindPill(r.kind)}</td><td class="nw">${r.calls}</td>
            <td class="nw">${K2(r.input)}</td><td class="nw">${K2(r.output)}</td><td class="nw">${K2(r.cached)}</td>
            <td class="nw"><span class="meter"><span style="width:${Math.min(100, r.share_pct)}%"></span></span> ${r.share_pct}%</td></tr>`).join("") + `</table>`
      : '<span class="hint">No calls in this window.</span>';
    wrapTables();
  };

  const renderReport = r => {
    if (!r) return "";
    if (r.error) return `<p class="hint"><span class="pill bad">failed</span> ${esc(r.error)}</p>`;
    const money = v => v == null ? "—" : "$" + (+v).toFixed(v < 1 ? 3 : 2);
    const rows = [...(r.updated || []).map(u => ({...u, st: '<span class="pill ok">updated</span>'})),
                  ...(r.suspicious || []).map(u => ({...u, st: `<span class="pill warn" title="Not applied — use force from the API if it's genuine">skipped: ${esc(u.why)}</span>`}))];
    return `<p class="hint" style="margin:8px 0 4px">${r.dry_run ? "<b>Preview</b> — nothing saved. " : ""}${(r.updated || []).length} changed · ${(r.unchanged || []).length} already current · ${(r.locked || []).length} locked · matched by ${esc(r.matcher || "—")}${(r.unmatched || []).length ? ` · <span title="${esc(r.unmatched.join(", "))}">${r.unmatched.length} not found on OpenRouter</span>` : ""}</p>`
      + (rows.length ? `<table><tr><th>service</th><th>matched</th><th>input</th><th>output</th><th>cached</th><th></th></tr>`
        + rows.map(u => `<tr><td class="nw">${esc(u.name)}</td><td class="mono nw">${esc(u.id)}</td>
            <td class="nw">${money(u.old.input_per_1m)} → <b>${money(u.new.input_per_1m)}</b></td>
            <td class="nw">${money(u.old.output_per_1m)} → <b>${money(u.new.output_per_1m)}</b></td>
            <td class="nw">${money(u.old.cached_input_per_1m)} → ${money(u.new.cached_input_per_1m)}</td><td>${u.st}</td></tr>`).join("") + `</table>` : "");
  };
  const loadPriceSettings = async () => {
    let st; try { st = await api("pricing/settings"); } catch (e) { return; }
    $("#pu-auto").checked = !!st.auto; $("#pu-days").value = st.days || 7;
    const lr = st.last_report;
    $("#pu-status").innerHTML = st.last_update
      ? `Last update ${esc(st.last_update.replace("T", " ").slice(0, 16))} UTC${lr ? ` — ${lr.updated} changed, ${lr.unmatched} not found, matched by ${esc(lr.matcher || "")}${lr.error ? ` · <span class="pill bad">${esc(lr.error)}</span>` : ""}` : ""}`
      : "Prices have never been updated automatically.";
  };
  const runUpdate = async dry => {
    $("#pu-report").innerHTML = '<p class="hint">Fetching current prices from OpenRouter…</p>';
    try {
      const r = await api("pricing/update", {method: "POST", body: {dry_run: dry}});
      $("#pu-report").innerHTML = renderReport(r);
      if (!dry) { await loadRates(); await loadCosts(); await loadPriceSettings(); }
      wrapTables();
    } catch (e) { $("#pu-report").innerHTML = `<p class="hint"><span class="pill bad">error</span> ${esc(e.message)}</p>`; }
  };
  $("#pu-save").onclick = async () => {
    try { await api("pricing/settings", {method: "POST", body: {auto: $("#pu-auto").checked, days: +$("#pu-days").value}});
          toast("Schedule saved"); await loadPriceSettings(); } catch (e) { toast(e.message, true); }
  };
  $("#pu-run").onclick = () => runUpdate(false);
  $("#pu-preview").onclick = () => runUpdate(true);

  ["cost-win", "cost-model", "cost-backend", "cost-run", "cost-watts", "cost-kwh"].forEach(id => {
    const el = $("#" + id); el.onchange = loadCosts;
  });
  $("#cost-refresh").onclick = loadCosts;
  await loadRates();
  await loadCosts();
  await loadPriceSettings();
}

async function tabLive() {
  const ch = (title, key, sub) =>
    `<div class="card-h">${title}${key ? help(key) : ""}${sub ? `<span class="hint">— ${sub}</span>` : ""}</div>`;
  $("#main").innerHTML = `
    <h2 style="margin-top:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px">Live activity ${help("live")}
      <span class="hint" id="live-ts" style="margin:0"></span>
      <span style="flex:1"></span>
      <span id="live-run"></span>
      <button class="act" id="live-clear" title="Reset performance stats (all models or one) — e.g. after a GPU or config change">Clear stats…</button></h2>
    <p class="hint">Auto-refreshing every 2s — what's generating right now, measured speed per model, engine load on each inference server, and the last few finished requests. Hover anything underlined for a definition; <b>?</b> opens a longer explanation.</p>
    <div class="card">${ch("▶ Models generating now", "generating")}<div id="live-models" class="hint">…</div></div>
    <div class="card">${ch("📊 Recent performance", "perfstrip", "last N finished requests")}<div id="live-perf" class="hint">…</div></div>
    <div class="card">${ch("🖥 Inference servers", "servers", "engine-level load from llama.cpp / vLLM")}<div id="live-servers" class="hint">…</div></div>
    <div class="card">${ch("Loaded models — per-model performance", "loaded")}<div id="live-loaded"></div></div>
    <div class="card">${ch("⚙ Tool calls / jobs running", null)}<div id="live-tools" class="hint">…</div>
      <div class="hint" style="margin-top:4px">A long one (e.g. <code>acestep-music/generate_music</code>) staying here for minutes means a media job is actively rendering — not hung.</div></div>
    <div class="card">${ch("🔧 Tool activity", "toolstats", "recent, by call count")}<div id="live-toolstats"></div></div>
    <div class="card">${ch("🧠 Routing brain", "brain")}<div id="live-brain" class="hint">…</div></div>
    <div class="card">${ch("Backends", null)}<div id="live-backends"></div></div>
    <div class="card">${ch("Recently finished", "recent")}<div id="live-recent"></div></div>`;
  $("#live-clear").onclick = () => openClearDialog({});
  if (window._liveTimer) clearInterval(window._liveTimer);
  const paint = async () => {
    if (!$("#live-models")) { clearInterval(window._liveTimer); return; }  // tab changed → self-clean
    let a;
    try { a = await api("activity"); } catch (e) { return; }
    if (!$("#live-models")) return;
    $("#live-ts").textContent = "· updated " + new Date().toLocaleTimeString();
    $("#live-run").innerHTML = a.run_label
      ? `<span class="pill ok" title="New samples are recorded under this run label (set on the Performance tab)">🏷 ${esc(a.run_label)}</span>` : "";
    $("#live-servers").innerHTML = renderServers(a.servers || []);
    const _el = s => { s = Math.floor(s || 0); return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s"; };
    const _tps = Object.fromEntries((a.models || []).map(m => [m.model, m.tps]));
    const calls = a.calls || [];
    $("#live-models").innerHTML = calls.length
      ? calls.map(c => `<span class="pill ok" title="request ${esc(c.request_id || "?")} on backend ${esc(c.backend || "?")} — the client's '⏳ … still working' line shows the same id (first thinking line) and the same clock">▶ ${esc(c.model)} · ${_el(c.seconds)}${_tps[c.model] ? " · ~" + _tps[c.model] + " tok/s" : ""} <span class="mono" style="opacity:.75">req ${esc((c.request_id || "").slice(0, 8))}</span></span>`).join(" ")
      : (a.models || []).length
      ? a.models.map(m => `<span class="pill ok">▶ ${esc(m.model)} · ${_el(m.seconds)}${m.count > 1 ? " ×" + m.count : ""}${m.tps ? " · ~" + m.tps + " tok/s" : ""}</span>`).join(" ")
      : '<span class="hint">idle — no model generating</span>';
    $("#live-tools").innerHTML = (a.tools || []).length
      ? a.tools.map(t => `<span class="pill warn">⚙ ${esc(t.server)}/${esc(t.tool)} · ${t.seconds}s</span>`).join(" ")
      : '<span class="hint">idle — no tool/job running</span>';
    // recent-performance summary strip
    const sm = a.summary || {};
    if (sm.window) {
      const errPill = sm.err
        ? `<span class="pill bad">${sm.err} error${sm.err === 1 ? "" : "s"}</span>`
        : '<span class="pill ok">0 errors</span>';
      const truncPill = sm.truncations_total
        ? `<span class="pill warn" title="Total replies ever cut off at max_tokens (each = a turn a client had to 'continue'). Rising = looping or cap too low.">⤾ ${sm.truncations_total} truncations</span>`
        : '<span class="pill ok">⤾ 0 truncations</span>';
      const decodePill = sm.decode_tps
        ? `<span class="pill" title="Pure decode rate over the same traffic — what the GPU sustains once generating, prefill/queue removed. Always ≥ effective; a big gap means prefill/queue/tool time dominates.">⚡ ${sm.decode_tps} tok/s decode</span> ` : "";
      $("#live-perf").innerHTML =
        `<span class="pill" title="Output tokens ÷ wall time across the window — end-to-end rate incl. prefill/queue, so lower than raw decode tok/s">≈ ${sm.eff_tps} tok/s effective</span> `
        + decodePill
        + `<span class="pill" title="Mean wall time per finished request">Ø ${sm.avg_s}s / req</span> `
        + `<span class="pill ok">${sm.ok} ok</span> ${errPill} ${truncPill} `
        + `<span class="hint">over last ${sm.window} · ${sm.out_tokens.toLocaleString()} out-tok</span>`
        + sparkRow(sm.series || []);
    } else {
      $("#live-perf").innerHTML = '<span class="hint">no finished requests yet</span>';
    }
    // recent tool aggregate (where tool time / failures go)
    const ts = a.tool_stats || [];
    $("#live-toolstats").innerHTML = ts.length
      ? `<table><tr><th>tool</th><th>calls</th><th title="average duration per call">avg</th><th>fails</th></tr>`
        + ts.map(t => `<tr><td class="mono">${esc(t.tool)}</td><td class="nw">${t.count}</td>
            <td class="nw">${t.avg_ms >= 1000 ? (t.avg_ms / 1000).toFixed(1) + "s" : t.avg_ms + "ms"}</td>
            <td class="nw">${t.fails ? `<span class="pill bad">${t.fails}</span>` : '<span class="hint">0</span>'}</td></tr>`).join("")
        + `</table>`
      : '<span class="hint">no tool calls in the recent window</span>';
    // brain
    const gb = b => b ? (b / 1073741824).toFixed(1) + " GB" : "";
    const br = a.brain || {}, bh = br.health || {};
    const bHealth = bh.healthy === true ? '<span class="pill ok">reachable</span>'
      : (bh.healthy === false ? '<span class="pill bad" title="' + esc(bh.error || "") + '">unreachable</span>'
         : '<span class="pill warn">unknown</span>');
    const bLoaded = br.loaded === true
      ? `<span class="pill ok">loaded${br.size_vram ? " · " + gb(br.size_vram) : ""}</span>`
      : (br.loaded === false ? '<span class="pill">not loaded</span>'
         : '<span class="hint">(load state n/a)</span>');
    const bPresent = bh.model_present === false
      ? ' <span class="pill bad" title="endpoint up but model not pulled">model missing</span>' : "";
    const bMode = br.active === false
      ? ` <span class="pill warn" title="Persona requests are served directly by policy (brain skipped)">passthrough · ${esc(br.reason || "")}</span>`
      : (br.active ? ' <span class="pill ok" title="Persona requests are routed by the brain">routing via brain</span>' : "");
    $("#live-brain").innerHTML =
      `<code>${esc(br.model || "(not configured)")}</code> <span class="hint">(${esc(br.provider || "")} · mode ${esc(br.routing_mode || "auto")})</span> `
      + bHealth + " " + bLoaded + bPresent + bMode;
    // loaded in VRAM (per-model size)
    const ld = a.loaded_detail || [];
    const perfCell = (avg, last, unit, est) => {
      if (!avg && !last) return '<span class="hint">—</span>';
      const a2 = avg ? "~" + avg + (unit || "") : "—";
      const l2 = last ? `<div class="hint" style="margin:0" title="most recent call">last ${last}${unit || ""}</div>` : "";
      const e2 = est ? ' <span class="est" title="Estimated by the router from the stream — this backend reports no per-request timings (prefill includes network/queue time)">≈</span>' : "";
      return `${a2}${e2}${l2}`;
    };
    const ttftCell = p => {
      if (!p.ttft_ms && !p.last_ttft_ms) return '<span class="hint">—</span>';
      const s = v => v >= 1000 ? (v / 1000).toFixed(1) + "s" : Math.round(v) + "ms";
      const last = p.last_ttft_ms ? `<div class="hint" style="margin:0" title="most recent call">last ${s(p.last_ttft_ms)}</div>` : "";
      return `${p.ttft_ms ? "~" + s(p.ttft_ms) : "—"}${last}`;
    };
    // A percentage stat (spec acceptance / cache hit): avg · last call, dashed
    // when the backend never reported it. `good` picks the pill colour so a low
    // acceptance or cache-hit reads red at a glance. `n` = samples (for hover).
    const pctCell = (avg, last, n, good, hint) => {
      if (avg === null || avg === undefined) return '<span class="hint">—</span>';
      const cls = good(avg) ? "ok" : "warn";
      const lastTxt = (last !== null && last !== undefined)
        ? `<div class="hint" style="margin:0" title="most recent call">last ${last}%</div>` : "";
      return `<span class="pill ${cls}" title="${hint} (${n || 0} sample${n === 1 ? "" : "s"})">${avg}%</span>${lastTxt}`;
    };
    const ms = v => v >= 1000 ? (v / 1000).toFixed(1) + "s" : Math.round(v) + "ms";
    // duration cell: avg · last, in ms/s (the "how long" beside the "how fast").
    const msCell = (avg, last) => {
      if (!avg && !last) return '<span class="hint">—</span>';
      const a2 = avg ? "~" + ms(avg) : "—";
      const l2 = last ? `<div class="hint" style="margin:0" title="most recent call">last ${ms(last)}</div>` : "";
      return `${a2}${l2}`;
    };
    // single-value rate cell (per-model effective tok/s — no last snapshot).
    const oneCell = (v, unit) => v ? "~" + v + (unit || "") : '<span class="hint">—</span>';
    // VRAM + serving context. Ollama reports VRAM bytes (incl. the KV cache for
    // its loaded context); llama.cpp reports no VRAM over HTTP but does report
    // n_ctx, so that column shows "—" for VRAM and the context beneath. Context
    // falls back to the model's trained window when the serving n_ctx is unknown.
    const kctx = n => n >= 1000 ? Math.round(n / 1000) + "k" : ("" + n);
    const vramCell = (m, p) => {
      const v = gb(m.size_vram);
      const ctx = m.context || p.context_length || 0;
      const ctxTxt = ctx ? `<div class="hint" style="margin:0" title="Serving context window (per slot on llama.cpp; max_model_len on vLLM), else the trained window">${kctx(ctx)} ctx</div>` : "";
      const w = m.size ? `<div class="hint" style="margin:0" title="Model weights file size (llama.cpp /v1/models meta) — VRAM use is this plus the KV cache">${gb(m.size)} weights</div>` : "";
      const sl = m.slots ? `<div class="hint" style="margin:0" title="Parallel slots (-np); the context is per slot">${m.slots} slots</div>` : "";
      const st = m.state ? `<div class="hint" style="margin:0" title="llama-swap state">${esc(m.state)}</div>` : "";
      return (v || '<span class="hint" title="llama.cpp / vLLM do not report VRAM over HTTP">—</span>') + ctxTxt + w + sl + st;
    };
    $("#live-loaded").innerHTML = ld.length
      ? `<table><tr><th>model</th><th title="GPU memory held (Ollama /api/ps). llama.cpp reports context, not VRAM. Second line = serving/trained context window.">VRAM · ctx</th>
          <th title="Time to first token — wall time from request to first output token, incl. any queue wait (avg · last). High vs prefill time = queuing.">TTFT</th>
          <th title="Decode speed — output tokens/sec once generating (avg · last call)">decode tok/s</th>
          <th title="Decode wall time — how long generation took (avg · last call)">decode time</th>
          <th title="Prefill speed — prompt tokens/sec processing the context (avg · last call)">prefill tok/s</th>
          <th title="Prefill wall time — how long processing the prompt took, ~= TTFT on a warm model (avg · last call)">prefill time</th>
          <th title="Effective tok/s for this model over the recent window — output tokens ÷ end-to-end wall time (incl. prefill/queue). The rate you actually feel; gap to decode tok/s = overhead.">eff tok/s</th>
          <th title="Speculative-decoding acceptance — draft tokens the target model kept, ÷ proposed (avg · last call). Low = draft model mismatched or --spec-draft-n-max too deep, so speculation is wasting compute. Blank = no draft model.">spec accept</th>
          <th title="KV prefix-cache hit rate — prompt tokens served from cache instead of re-prefilled (avg · last call). A falling rate across a session points at a chat-template/cache regression. Blank = backend doesn't report it.">cache hit</th>
          <th title="Typical cold-load time (avg)">load</th>
          <th title="Replies cut off at the max-token cap (finish_reason=length) — each one is a turn the client had to 'continue'">trunc</th>
          <th>backend</th></tr>` +
        ld.map(m => { const p = m.perf || {}; return `<tr><td class="nw" style="max-width:180px;overflow:hidden;text-overflow:ellipsis" title="${esc(m.model)}">${esc(m.model)}</td>
          <td class="nw">${vramCell(m, p)}</td>
          <td class="nw">${ttftCell(p)}</td>
          <td class="nw">${perfCell(p.decode_tps, p.last_decode_tps, "", p.timing_src === "estimated")}</td>
          <td class="nw">${msCell(p.decode_ms, p.last_decode_ms)}</td>
          <td class="nw">${perfCell(p.prompt_tps, p.last_prompt_tps, "", p.timing_src === "estimated")}</td>
          <td class="nw">${msCell(p.prefill_ms, p.last_prefill_ms)}</td>
          <td class="nw">${oneCell(p.eff_tps, "")}</td>
          <td class="nw">${pctCell(p.spec_accept_pct, p.last_spec_accept_pct, p.spec_samples, v => v >= 60, "Draft acceptance — accepted ÷ proposed draft tokens")}</td>
          <td class="nw">${pctCell(p.cache_hit_pct, p.last_cache_hit_pct, p.cache_samples, v => v >= 50, "KV prefix-cache hit — cached ÷ prompt tokens")}</td>
          <td class="nw">${p.cold_load_ms ? ms(p.cold_load_ms) : '<span class="hint">warm</span>'}</td>
          <td class="nw">${p.truncations ? `<span class="pill warn" title="${p.truncations} truncated repl${p.truncations === 1 ? "y" : "ies"} — last finish: ${esc(p.last_finish || "")}">${p.truncations}</span>` : '<span class="hint">0</span>'}</td>
          <td class="nw">${esc(m.backend || "")}</td></tr>`; }).join("") + `</table>`
      : (a.loaded || []).length
        ? (a.loaded || []).map(m => `<span class="pill">${esc(m)}</span>`).join(" ")
        : '<span class="hint">nothing loaded</span>';
    $("#live-backends").innerHTML = `<table><tr><th>name</th><th title="Wire protocol · server software (flavor)">type</th><th title="Healthy after a successful model-list probe; down after repeated failures (hover for the last error)">health</th><th title="Models this backend advertises">models</th></tr>` +
      (a.backends || []).map(b => `<tr><td>${esc(b.name)}</td><td class="nw">${esc(b.type)}${b.flavor && b.flavor !== "openai" && b.flavor !== "ollama" ? ` <span class="pill">${esc(_FLAVOR_LABEL[b.flavor] || b.flavor)}</span>` : ""}</td>
        <td>${b.healthy ? '<span class="pill ok">healthy</span>'
             : '<span class="pill bad" title="' + esc(b.last_error) + '">down</span>'}</td>
        <td class="nw">${b.models}</td></tr>`).join("") + `</table>`;
    $("#live-recent").innerHTML = `<table><tr><th>time (UTC)</th><th>persona</th><th>mode</th><th>model(s)</th>
        <th title="prompt → output tokens for this turn">tokens</th>
        <th title="output tokens ÷ this turn's wall time (end-to-end, incl. prefill)">tok/s</th>
        <th>status</th><th>time</th></tr>` +
      (a.recent || []).map(r => {
        let models = "", inTok = 0, outTok = 0;
        try {
          const mu = JSON.parse(r.models_used || "[]") || [];
          models = mu.map(x => x.model).join(", ");
          for (const x of mu) { inTok += x.prompt_tokens || 0; outTok += x.completion_tokens || 0; }
        } catch (e) {}
        const secs = r.duration_ms != null ? r.duration_ms / 1000 : 0;
        const tps = (outTok && secs) ? (outTok / secs).toFixed(1) : "";
        const st = r.status === "ok" ? '<span class="pill ok">ok</span>'
          : (r.status === "error" ? '<span class="pill bad">error</span>'
             : '<span class="pill warn">' + esc(r.status || "") + '</span>');
        return `<tr><td class="nw">${esc((r.ts || "").replace("T", " ").slice(0, 19))}</td>
          <td>${esc(r.persona || "")}</td><td class="nw">${esc(r.mode || "")}</td>
          <td>${esc(models || r.client_model || "")}</td>
          <td class="nw">${(inTok || outTok) ? inTok.toLocaleString() + " → " + outTok.toLocaleString() : '<span class="hint">—</span>'}</td>
          <td class="nw">${tps ? "~" + tps : '<span class="hint">—</span>'}</td>
          <td>${st}</td>
          <td class="nw">${r.duration_ms != null ? secs.toFixed(1) + "s" : ""}</td></tr>`;
      }).join("") + `</table>`;
    wrapTables();
  };
  window._liveTimer = setInterval(paint, 2000);
  await paint();
}

            <button class="act" style="padding:0 6px;font-size:11px" id="copy-allm">copy</button></div>

    </div>`;
  const cfg = await api("config");

  // Live activity poller — self-cleans when the tab is gone (element removed).
  if (window._actTimer) clearInterval(window._actTimer);

    const el = $("#activity-now");

        `<span class="pill ok" title="model generating">▶ ${esc(m.model)} · ${m.seconds}s${m.count > 1 ? " ×" + m.count : ""}</span>`));

        `<span class="pill" title="MCP tool running">⚙ ${esc(t.server)}/${esc(t.tool)} · ${t.seconds}s</span>`));
      const loaded = (a.loaded || []).map(m => esc(m)).join(", ");
      el.innerHTML = (parts.length ? parts.join(" ") : '<span class="hint">idle — nothing running</span>')
        + (loaded ? `<div class="hint" style="margin-top:4px">loaded: ${loaded}</div>` : "");

  };
  window._actTimer = setInterval(renderActivity, 3000);
  renderActivity();
  const renderAgg = async () => {
    try {
      const s = await api("mcp-aggregator");
      const live = (s.endpoints || []).map(e =>
        `<code>${esc(e.path)}/</code> (${e.scope}${e.servers ? ": " + e.servers.join(", ") : ": all"})`);
      const planned = (s.planned_endpoints || []).map(e =>
        `<code>${esc(e.path)}/</code> (${e.scope})`);
      $("#agg-endpoints").innerHTML =
        `<b>Base URL:</b> <code>${esc(s.base_url || "")}</code><br>` +
        (live.length ? "<b>Live now:</b> " + live.join(" · ")
                     : (s.enabled ? "<b>Live now:</b> none yet — restart to mount" : "<i>disabled</i>")) +
        (planned.length ? "<br><b>After restart:</b> " + planned.join(" · ") : "");
      $("#agg-allm").textContent = s.anythingllm_config

      $("#agg-cline").textContent = s.cline_config

  };
  renderAgg();
  $("#copy-allm").onclick = () => { navigator.clipboard.writeText($("#agg-allm").textContent); toast("Copied AnythingLLM config"); };
  $("#copy-cline").onclick = () => { navigator.clipboard.writeText($("#agg-cline").textContent); toast("Copied Cline config"); };
  $("#save-agg").onclick = async () => {
    let profiles;
    try { profiles = JSON.parse($("#agg-profiles").value || "{}"); }
    catch (e) { return toast("profiles: invalid JSON", true); }
    const body = {enabled: $("#agg-en").checked,
                  token_header: $("#agg-hdr").value.trim() || "X-API-KEY",
                  base_path: $("#agg-base").value.trim() || "/mcp",
                  advertise_url: $("#agg-url").value.trim() || null,
                  progress_heartbeat_seconds: parseInt($("#agg-hb").value, 10) || 0,
                  poll_guard_threshold: parseInt($("#agg-pg").value, 10) || 0,
                  profiles};
    const tok = $("#agg-token").value;                 // blank = leave unchanged
    if (tok) body.token = tok;
    try {
      const r = await api("mcp-aggregator", {method: "POST", body});
      toast("Saved");
      $("#agg-token").value = "";
      $("#agg-restart").textContent = r.restart_required
        ? "saved — restart to (re)mount endpoints" : "saved";
      renderAgg();
    } catch (e) { toast(e.message, true); }
  };
  $("#restart-foundry").onclick = async () => {
    if (!confirm("Restart Foundry now? Active requests will drop. It comes back only if a supervisor (Docker restart policy / systemd) manages it.")) return;
    try {
      await api("restart", {method: "POST", body: {}});
      $("#agg-restart").textContent = "restarting… reload the page in a few seconds";
      toast("Restarting Foundry…");
    } catch (e) { toast(e.message, true); }
  };
  const renderBrainHealth = h => {
    const el = $("#brain-health"); h = h || {};
    if (h.healthy === true) {
      el.innerHTML = '<span class="pill ok">healthy</span> ' + esc(h.model || "")
        + (h.model_present === false
            ? ' <span class="pill warn" title="endpoint is up but the configured model is not present — pull it on the brain host">model not loaded</span>' : '')
        + (h.checked_at ? ' · checked ' + esc(String(h.checked_at).slice(11, 19)) + "Z" : '');
    } else if (h.healthy === false) {
      el.innerHTML = '<span class="pill bad">DOWN</span> ' + esc(h.error || "unreachable")
        + '<br><span class="hint">every request is degrading to the static fallback rule until this recovers</span>';
    } else {
      el.innerHTML = '<span class="hint">not probed yet — click Test brain</span>';
    }
  };
  renderBrainHealth(st.brain.health);
  $("#test-brain").onclick = async () => {
    $("#brain-health").textContent = "probing…";
    try { renderBrainHealth(await api("brain/health")); }
    catch (e) { $("#brain-health").innerHTML = '<span class="pill bad">error</span> ' + esc(e.message); }
  };
  $("#test-meridian").onclick = async () => {
    const el = $("#meridian-health");
    el.textContent = "checking…";
    try {
      const r = await api("meridian/health");
      if (!r.backends.length) {
        el.textContent = "no anthropic-compatible backend configured";
        return;
      }
      el.innerHTML = r.backends.map(b => {
        if (!b.logged_in && !b.valid && b.error) {
          return `${esc(b.backend)}: <span class="pill bad">unreachable</span> <span class="hint">${esc(b.error)}</span>`;
        }
        const who = b.email ? esc(b.email) : "identity not reported by Meridian";
        const meta = [b.subscription_type && esc(b.subscription_type),
                      b.mode && "mode " + esc(b.mode),
                      b.version && "Meridian " + esc(b.version)].filter(Boolean).join(" · ");
        const authPill = b.logged_in
          ? '<span class="pill ok">logged in</span>'
          : '<span class="pill bad">not logged in</span>';
        const usage = b.usage_reported
          ? `<span class="pill ok">usage</span> <span class="hint">${esc(b.note || "")}</span>`
          : '<span class="pill warn">usage figures unavailable</span> '
            + '<span class="hint">set a <b>usage profile</b> below to pull the real 5h/weekly window '
            + '(Anthropic /api/oauth/usage — works on Pro); Meridian\'s own quota skips non-Max</span>';
        const t = b.telemetry || {};
        const tele = t.reachable
          ? `<span class="hint">telemetry (${Math.round((t.window_ms || 0) / 60000)}m window): `
            + `${t.total_requests || 0} req · ${(t.input_tokens || 0)} in / ${(t.output_tokens || 0)} out tok`
            + `${t.cache_read_tokens ? " · " + t.cache_read_tokens + " cache-read" : ""}</span>`
          : "";
        return `${esc(b.backend)}: ${authPill} <span class="hint">${who}${meta ? " · " + meta : ""}</span>`
          + `<br>${usage}${tele ? "<br>" + tele : ""}`;
      }).join("<br><br>");
    } catch (e) { el.textContent = e.message; }
  };
  let merSession = null;
  $("#mer-refresh").onclick = async () => {
    const el = $("#mer-auth-status");
    el.textContent = "refreshing…";
    try {
      const r = await api("meridian/refresh", {method: "POST", body: {}});
      if (!(r.backends || []).length) { el.textContent = "no anthropic-compatible backend configured"; return; }
      el.innerHTML = r.backends.map(b =>
        `${esc(b.backend)}: ` + (b.ok
          ? '<span class="pill ok">refreshed</span>'
          : `<span class="pill bad">failed</span> <span class="hint">${esc(b.detail || ("HTTP " + b.status))}</span>`)).join("<br>");
    } catch (e) { el.textContent = e.message; }
  };
  $("#mer-reauth").onclick = async () => {
    const el = $("#mer-auth-status"), flow = $("#mer-reauth-flow");
    const profile = $("#mer-profile").value.trim();
    if (!profile) { el.textContent = "enter a profile name"; return; }
    el.textContent = "starting login on the host…"; flow.style.display = "none";
    try {
      const r = await api("meridian/reauth/start", {method: "POST", body: {profile}});
      if (!r.ok || !r.url) {
        el.innerHTML = '<span class="pill bad">no sign-in URL</span>';
        toast(r.output || "the login command produced no URL", true);
        return;
      }
      merSession = r.session_id;
      const a = $("#mer-auth-url"); a.href = r.url; a.textContent = r.url;
      $("#mer-code").value = ""; $("#mer-code-status").textContent = "";
      flow.style.display = "block";
      el.innerHTML = '<span class="pill warn">awaiting sign-in</span>';
    } catch (e) { el.textContent = e.message; toast(e.message, true); }
  };
  $("#mer-code-submit").onclick = async () => {
    const st2 = $("#mer-code-status"), code = $("#mer-code").value.trim();
    if (!merSession) { st2.textContent = "start Re-authenticate first"; return; }
    if (!code) { st2.textContent = "paste the code Claude gave you"; return; }
    st2.textContent = "completing…";
    try {
      const r = await api("meridian/reauth/complete", {method: "POST", body: {session_id: merSession, code}});
      if (r.ok) {
        st2.innerHTML = '<span class="pill ok">authenticated</span>';
        // Clear the outer "awaiting sign-in" pill — the sign-in is DONE. Leaving
        // it stale made a successful re-auth look like it never finished.
        $("#mer-auth-status").innerHTML = '<span class="pill ok">re-authenticated</span>';
        toast("Meridian re-authenticated"); merSession = null;
        $("#mer-reauth-flow").style.display = "none";
        $("#test-meridian").click();
      } else {
        st2.innerHTML = `<span class="pill bad">failed</span> <span class="hint">${esc((r.output || r.error || "").slice(-300))}</span>`;
        $("#mer-auth-status").innerHTML = '<span class="pill bad">sign-in failed</span>';
      }
    } catch (e) { st2.textContent = e.message; toast(e.message, true); }
  };
  $("#mer-code-cancel").onclick = () => {
    merSession = null; $("#mer-reauth-flow").style.display = "none";
    $("#mer-auth-status").textContent = "cancelled";
  };
  $("#mer-auth-save").onclick = async () => {
    try {
      const body = {url: $("#mer-auth-url-cfg").value.trim()};
      const tok = $("#mer-auth-token-cfg").value.trim();
      if (tok) body.token = tok;
      await api("meridian/auth_config", {method: "POST", body});
      await api("config/meridian", {method: "POST", body: {usage_profile: $("#mer-usage-profile").value.trim()}});
      toast("Auth companion saved"); render();
    } catch (e) { toast(e.message, true); }
  };
  $("#save-backends").onclick = () =>
    run(api("config/backends", {method: "POST", body: JSON.parse($("#backends-json").value)}));
  $("#save-mode").onclick = () =>
    run(api("config/pool_mode", {method: "POST", body: {mode: $("#pool-mode").value}}));
  $("#save-routing").onclick = () =>
    run(api("config/brain", {method: "POST", body: {routing_mode: $("#brain-routing").value}}));
  $("#save-brain-model").onclick = () =>
    run(api("config/brain", {method: "POST", body: {
      provider: $("#brain-provider").value, endpoint: $("#brain-endpoint").value,
      model: $("#brain-model").value}}));
  $("#save-global").onclick = () =>
    run(api("config/brain", {method: "POST", body: {
      tool_result_limit_chars: +$("#brain-trl").value,
      mcp_result_limit_chars: +$("#brain-mrl").value,
      worker_max_tokens: +$("#brain-wmt").value,
      user_input_preview_chars: +$("#brain-uip").value,
      heartbeat_seconds: +$("#brain-hb").value,
      worker_keep_alive: $("#brain-ka").value.trim() || null,
      direct_stream: $("#brain-ds").checked,
      direct_stream_heartbeat_seconds: parseInt($("#brain-dshb").value, 10) || 0,
      direct_stream_stall_seconds: parseInt($("#brain-dstall").value, 10) || 0,
      heartbeat_visible_seconds: parseInt($("#brain-hbvis").value, 10) || 0,
      context_guard: $("#brain-cguard").value,
      context_guard_reserve_tokens: parseInt($("#brain-creserve").value, 10) || 0,
      stream_worker_reasoning: $("#brain-swr").checked,
      reasoning_effort: $("#brain-re").value.trim() || null,
      sampling_defaults: JSON.parse($("#brain-samp").value || "{}")}}));
  $("#save-rto").onclick = async () => {
    try {
      const r = await api("config/backend-timeout", {method: "POST",
        body: {request_timeout_seconds: parseInt($("#brain-rto").value, 10) || 900}});
      toast("Saved");
      $("#rto-note").textContent = r.restart_required
        ? "saved — Restart Foundry to apply" : "saved";
    } catch (e) { toast(e.message, true); }
  };
}

/* ---------------------------------------------------------------- models -- */
const parseTags = s => { try { const t = JSON.parse(s || "[]"); return Array.isArray(t) ? t : []; } catch (e) { return []; } };
const RESEARCH_PILL = {queued: "warn", running: "warn", ok: "ok", failed: "bad"};

async function tabModels() {
  const d = await api("models");
  const isEnabled = m => m.enabled === null || m.enabled === undefined || !!m.enabled;
  const rBtn = m => d.research_ready
    ? `<button class="act" onclick='doResearch(${JSON.stringify(m.id)})'>research</button>`
    : `<button class="act" disabled title="${esc(d.research_reason)}">research</button>`;
  const perfCell = m => {
    const dt = m.eval_tps_avg ? Math.round(m.eval_tps_avg) : 0;
    const pt = m.prompt_tps_avg ? Math.round(m.prompt_tps_avg) : 0;
    const trunc = m.truncations || 0;
    if (!dt && !pt && !trunc) return '<span class="hint">—</span>';
    const load = m.cold_load_ms_avg ? ` · ${(m.cold_load_ms_avg / 1000).toFixed(1)}s cold-load` : "";
    const ttft = m.ttft_ms_avg
      ? ` · TTFT ~${m.ttft_ms_avg >= 1000 ? (m.ttft_ms_avg / 1000).toFixed(1) + "s" : Math.round(m.ttft_ms_avg) + "ms"}` : "";
    const last = m.last_eval_tps
      ? ` · last call ${Math.round(m.last_eval_tps)}/${Math.round(m.last_prompt_tps || 0)}` : "";
    const tip = `decode ${dt || "?"} · prefill ${pt || "?"} tok/s `
      + `(rolling avg, ${m.eval_samples || 0} sample(s))${ttft}${load}${last}`
      + (trunc ? ` · ${trunc} TRUNCATED repl${trunc === 1 ? "y" : "ies"} (hit max_tokens — client had to continue)` : "")
      + ` — measured from Ollama eval timing OR llama.cpp timings`;
    const truncBadge = trunc
      ? ` <span class="pill warn" title="${trunc} repl${trunc === 1 ? "y" : "ies"} cut off at max_tokens — the client had to 'continue'. Fix by raising worker_max_tokens or stopping the loop (sampling).">⤾${trunc}</span>` : "";
    return `<span title="${tip}">${dt || "—"}<span class="hint"> / ${pt || "—"}</span></span>${truncBadge}`;
  };
  const rowHtml = m => `<tr${isEnabled(m) ? "" : ' style="opacity:.45"'}>
    <td class="mono">${esc(m.id)} ${m.reachable ? '<span class="pill ok">live</span>' : ""}${m.embedding ? ' <span class="pill warn" title="embedding-only model — excluded from chat routing (can\'t serve /api/chat)">embedding</span>' : ""}</td>
    <td class="nw">${esc(m.relative_cost_tier ?? "")}</td>
    <td class="nw">${perfCell(m)}</td>
    <td>${esc(parseTags(m.tags).join(", "))}${m.content_policy === "permissive" ? ' <span class="pill warn">permissive</span>' : ""}</td>
    <td>${esc(m.good_for ?? "")}</td>
    <td class="nw">${m.research_status
      ? `<span class="pill ${RESEARCH_PILL[m.research_status] || "warn"}" title="${esc(m.research_note || "")}">${esc(m.research_status)}</span>` : ""}</td>
    <td class="mono nw">${esc(m.source ?? "")}</td>
    <td class="nw"><button class="act" onclick='toggleModel(${JSON.stringify(m.id)}, ${isEnabled(m) ? "false" : "true"})'>
        ${isEnabled(m) ? "disable" : "enable"}</button>
        <button class="act" onclick='editModel(${JSON.stringify(m.id)})'>edit</button>
        ${rBtn(m)}</td>
    </tr>`;
  const header = "<tr><th>model</th><th>tier</th><th title=\"decode / prefill tokens per second — rolling average measured from real calls, backend-agnostic (Ollama eval timing OR llama.cpp timings)\">tok/s (dec/pre)</th><th>tags</th><th>good for</th><th>research</th><th>source</th><th></th></tr>";
  const renderTables = () => {
    const q = ($("#model-search")?.value || "").toLowerCase();
    const match = m => !q ||
      (m.id + " " + (m.tags || "") + " " + (m.good_for || "") + " " +
       (m.relative_cost_tier || "")).toLowerCase().includes(q);
    const live = d.models.filter(m => m.reachable && match(m));
    const known = d.models.filter(m => !m.reachable && match(m));
    $("#live-count").textContent = live.length;
    $("#known-count").textContent = known.length;
    $("#live-table").innerHTML = header + live.map(rowHtml).join("");
    $("#known-table").innerHTML = header + known.map(rowHtml).join("");
  };
  $("#main").innerHTML = `
    <h2>Model Registry</h2>
    <p class="hint">Edits made here are pinned as manual_override — automatic refreshes
    supplement but never replace them (§4.4). Local models are tagged tier
    <b>free</b> automatically at discovery; tags/policy are name-seeded,
    reference-seeded, and research-refined. Disabling a model excludes it from
    the brain's candidates and tools entirely (governance, not capability).${d.research_ready ? "" :
      ` <b>Research is unavailable:</b> ${esc(d.research_reason)}.`}</p>
    <div class="row">
      <input id="model-search" size="34" placeholder="filter by id, tag, tier, good_for…">
      <button class="act primary" onclick="run(api('models/refresh',{method:'POST'}))">Poll OpenRouter now</button>
      <button class="act" title="Fill tags/good_for/estimated scores for known model families (never overwrites manual edits or real research)"
        onclick="api('models/seed',{method:'POST'}).then(r=>{toast('Reference seed applied to '+r.applied+' models');render()}).catch(e=>toast(e.message,true))">Apply reference seed</button>
    </div>
    <h2>Live / Available (<span id="live-count"></span>) — reachable through a configured backend right now</h2>
    <table id="live-table"></table>
    <h2>Known catalog (<span id="known-count"></span>) — discovered but not currently reachable; reference material</h2>
    <table id="known-table"></table>
    <div class="card" id="model-editor" style="display:none">
      <h2 style="margin-top:0">Edit <span id="me-id" class="mono"></span></h2>
      <div class="row"><label>relative_cost_tier</label>
        <select id="me-tier"><option value="">-</option><option>free</option>
        <option>low</option><option>medium</option><option>high</option><option>very_high</option></select>
        <label>content_policy</label>
        <select id="me-policy"><option value="">-</option>
        <option>standard</option><option>permissive</option></select></div>
      <div class="row"><label>tags (comma-separated)</label><input id="me-tags" size="60"
        placeholder="coding, vision, tool-calling, reasoning, creative-writing, long-context"></div>
      <div class="row"><label>good_for</label><input id="me-good" size="60"></div>
      <div class="row"><label>reasoning_style</label><input id="me-style" size="60"></div>
      <div class="row"><label>benefits_from_explicit_prompting</label>
        <input type="checkbox" id="me-refine"></div>
      <div class="row"><label>tool-calling reliability</label>
        <span id="me-reliability" class="hint"></span></div>
      <div class="row"><label title="Live benchmark rows. A ⚠ marks two categories sharing the exact same score — the signature of an extractor conflating them; reset to clear it.">benchmark rows</label>
        <span id="me-benchmarks" class="hint">…</span></div>
      <p class="hint" style="margin:0 0 6px">
        Unflagged = passed integrity checks. <span class="pill bad" style="border:1px solid var(--line)">red ⚠</span>
        = demoted by the conflation guard: the same score was written to two or more
        categories in one research pass, so it's treated as synthesized (not a real
        per-category measurement) and its confidence is cut. Hover a pill for its
        source/type/confidence, timestamp, and which category it collided with.</p>
      <div class="row"><label title="Real, named, independently-verifiable benchmarks (SWE-Bench, MMLU, BFCL, ...). Kept separate from the composite; used as an explicit tiebreaker when composite scores are near-equal. percent-scale rows break ties; elo/count/score scales are stored but flagged out of naive comparison. ✎ = manually entered (never overwritten by research); ✕ removes a row.">named benchmarks</label>
        <span id="me-named" class="hint">…</span></div>
      <div class="row"><label title="Add real vendor data the research pipeline hasn't captured yet (e.g. a brand-new source page). Stored as source=manual so a later research pass never clobbers it.">add named benchmark</label>
        <input id="nb-name" placeholder="SWE-Bench Verified" size="18">
        <select id="nb-cat"><option>coding</option><option>reasoning</option><option>general_chat</option><option>tool_calling</option><option>agentic</option></select>
        <input id="nb-score" placeholder="75.6" size="6">
        <select id="nb-scale"><option>percent</option><option>elo</option><option>count</option><option>score</option></select>
        <input id="nb-url" placeholder="https://source" size="16">
        <button class="act" id="nb-add">Add</button></div>
      <div class="row"><button class="act primary" id="me-save">Save (manual override)</button>
        <button class="act" id="me-reset-bench" title="Delete this model's automatic benchmark rows (research/seed/observed; manual overrides kept) and re-apply reference-seed defaults — the fix for a row with a wrong number">Reset scores to seed</button></div>
    </div>`;
  window._models = Object.fromEntries(d.models.map(m => [m.id, m]));
  $("#model-search").addEventListener("input", renderTables);

}
window.toggleModel = async (id, enable) => {
  try {
    await api("models/toggle", {method: "POST", body: {id, enabled: enable}});
    toast((enable ? "Enabled " : "Disabled ") + id);
    render();
  } catch (e) { toast(e.message, true); }
};
window.doResearch = async id => {
  try {
    const r = await api("models/research", {method: "POST", body: {model_id: id}});
    toast(r.queued ? "Research queued for " + id : (r.note || "Not queued"));
    render();
  } catch (e) { toast(e.message, true); }
};
window.editModel = id => {
  const m = window._models[id] || {};
  const panel = $("#model-editor");
  panel.style.display = "block";
  $("#me-id").textContent = id;
  $("#me-tier").value = m.relative_cost_tier || "";
  $("#me-policy").value = m.content_policy || "";
  $("#me-tags").value = parseTags(m.tags).join(", ");
  $("#me-good").value = m.good_for || "";
  $("#me-style").value = m.reasoning_style || "";
  $("#me-refine").checked = !!m.benefits_from_explicit_prompting;
  const ok = m.tool_calls_ok || 0, fail = m.tool_calls_failed || 0;
  $("#me-reliability").textContent = (ok + fail) >= 3
    ? `${Math.round(100 * ok / (ok + fail))}% ok over ${ok + fail} observed calls (empirical, from live traffic)`
    : `not enough observed calls yet (${ok + fail}/3 minimum)`;
  // Live benchmark rows, with cross-category score-collision flagging (the
  // corruption signature: two categories sharing one exact score).
  const renderBench = rows => {
    if (!rows || !rows.length) { $("#me-benchmarks").textContent = "none"; return; }
    const byScore = {};
    rows.forEach(b => { (byScore[b.score] = byScore[b.score] || []).push(b.category); });
    $("#me-benchmarks").innerHTML = rows.map(b => {
      const sharing = (byScore[b.score] || []).filter(c => c !== b.category);
      const dup = sharing.length > 0;
      // seed = reference-seed ESTIMATE, not a measured/researched number: shown
      // muted + tagged so it's never mistaken for observed data (spec #1).
      const seed = b.score_source === "seed";
      let tip = `source: ${b.score_source || b.source_type} · ${b.source_type} · ${b.score_type} · conf ${b.confidence}`;
      if (b.last_updated) tip += " · " + String(b.last_updated).slice(0, 19);
      if (seed) tip += " — reference-seed ESTIMATE (knowledge-based placeholder, not a measured/researched score; run research to replace)";
      if (dup) tip += " — COLLISION with " + sharing.join(", ")
                      + "; same score across categories, demoted as synthetic";
      const cls = dup ? " bad" : (seed ? " warn" : "");
      const style = seed ? "border:1px dashed var(--line);opacity:.75" : "border:1px solid var(--line)";
      const shown = b.score == null ? "?" : +(+b.score).toFixed(1);   // no 99.153092… floats
      return `<span class="pill${cls}" style="${style}" title="${esc(tip)}">${esc(b.category)} ${shown}${seed ? " ~seed" : ""}${dup ? " ⚠" : ""}</span>`;
    }).join(" ");
  };
  let crossFlags = {};   // benchmark_name -> [unrelated model ids] (set on load)
  const renderNamed = rows => {
    if (!rows || !rows.length) { $("#me-named").textContent = "none"; return; }
    $("#me-named").innerHTML = rows.map(b => {
      const off = b.scale !== "percent";   // elo/count/score: shown, not tiebroken
      const manual = b.source === "manual";
      // cross-model duplicate: this exact (benchmark, score) also sits on an
      // unrelated model — the mis-attribution signature (spec #2). Red ⚠ for
      // review, NOT auto-removed.
      const dupOn = crossFlags[b.benchmark_name];
      const dup = Array.isArray(dupOn) && dupOn.length > 0;
      let tip = `${b.category} · ${b.scale}${off ? " (not used in tiebreak — non-percent scale)" : ""}${manual ? " · manual (never auto-overwritten)" : ""}${b.source_url ? " · " + b.source_url : ""}`;
      if (dup) tip += ` — ⚠ SAME value on unrelated model(s): ${dupOn.join(", ")}. Likely a leaderboard number scraped onto the wrong model — verify or remove.`;
      const shown = b.score == null ? "?" : +(+b.score).toFixed(1);
      return `<span class="pill${dup ? " bad" : off ? " warn" : ""}" style="border:1px solid var(--line)" title="${esc(tip)}">${esc(b.benchmark_name)} ${shown}${off ? " " + esc(b.scale) : ""}${manual ? " ✎" : ""}${dup ? " ⚠" : ""} <a href="#" data-nb="${esc(b.benchmark_name)}" title="remove" style="text-decoration:none">✕</a></span>`;
    }).join(" ");
    $("#me-named").querySelectorAll("a[data-nb]").forEach(a => {
      a.onclick = async ev => {
        ev.preventDefault();
        try {
          const r = await api("models/named_benchmark/delete",
                              {method: "POST", body: {model_id: id, benchmark_name: a.dataset.nb}});
          renderNamed(r.named);
        } catch (e) { toast(e.message, true); }
      };
    });
  };
  $("#nb-add").onclick = async () => {
    const name = $("#nb-name").value.trim(), score = $("#nb-score").value.trim();
    if (!name || score === "") { toast("name and score required", true); return; }
    try {
      const r = await api("models/named_benchmark/add", {method: "POST", body: {
        model_id: id, benchmark_name: name, category: $("#nb-cat").value,
        score: score, scale: $("#nb-scale").value, source_url: $("#nb-url").value.trim()}});
      toast("Added " + name);
      $("#nb-name").value = ""; $("#nb-score").value = ""; $("#nb-url").value = "";
      renderNamed(r.named);
    } catch (e) { toast(e.message, true); }
  };
  $("#me-benchmarks").textContent = "…";
  $("#me-named").textContent = "…";
  api("models/benchmarks?model_id=" + encodeURIComponent(id))
    .then(r => { crossFlags = r.cross_model_flags || {}; renderBench(r.benchmarks); renderNamed(r.named); })
    .catch(() => { $("#me-benchmarks").textContent = "—"; $("#me-named").textContent = "—"; });
  $("#me-reset-bench").onclick = async () => {
    if (!confirm("Reset " + id + "'s automatic benchmark rows to reference-seed "
                 + "defaults? (manual overrides are kept)")) return;
    try {
      const r = await api("models/reset_benchmarks", {method: "POST", body: {model_id: id}});
      toast("Removed " + r.removed + ", reseeded " + r.reseeded);
      renderBench(r.benchmarks);
    } catch (e) { toast(e.message, true); }
  };
  // The panel lives below a potentially very long table — without this,
  // clicking "edit" appears to do nothing (confirmed deployment bug).
  panel.scrollIntoView({behavior: "smooth", block: "start"});
  $("#me-save").onclick = () => {
    const tags = $("#me-tags").value.split(",").map(s => s.trim()).filter(Boolean);
    run(api("models/update", {method: "POST", body: {
      id, relative_cost_tier: $("#me-tier").value || null,
      content_policy: $("#me-policy").value || null,
      tags: tags.length ? JSON.stringify(tags) : null,
      good_for: $("#me-good").value || null,
      reasoning_style: $("#me-style").value || null,
      benefits_from_explicit_prompting: $("#me-refine").checked ? 1 : 0}}));
  };
};

/* -------------------------------------------------------------- personas -- */
async function tabPersonas() {
  const [d, td, md, sd] = await Promise.all([
    api("personas"), api("tools"), api("models"), api("mcp_servers")]);
  // Servers that execute code — a persona preferring any of them is
  // code-execution-enabled and gets flagged distinctly from read-only personas.
  const codeExecServers = new Set(
    (sd.servers || []).filter(s => s.executes_code).map(s => s.name));
  const personaExecutesCode = p => {
    let pref = [];
    try { pref = JSON.parse(p.preferred_mcp_tools || "[]"); } catch (e) {}
    // entries are bare server strings OR {server, tools} objects — check both
    return pref.some(x => codeExecServers.has(typeof x === "string" ? x : (x && x.server)));
  };
  // Review-model choices: any reachable chat-capable model, local or paid —
  // same selection pattern as elsewhere, never hardcoded to a specific model.
  const reviewChoices = (md.models || [])
    .filter(m => m.reachable && !m.embedding)
    .map(m => m.id).sort();
  const reviewOpts = ['<option value="">— choose a model —</option>']
    .concat(reviewChoices.map(id => `<option>${esc(id)}</option>`)).join("");
  // model_allowlist datalist: every known model id (paid ones included even if
  // momentarily unreachable, so Claude ids are always pickable). Just typing
  // suggestions — the field stays a free JSON list.
  const allowOpts = (md.models || []).map(m => m.id).sort()
    .map(id => `<option value="${esc(id)}">`).join("");
  // Quick-fill sets for the allow-list buttons: paid (Claude ladder, cheapest
  // tier first so Sonnet leads Opus) and local (free). Detected from cost tier —
  // never hardcoded to specific model names.
  const tierRank = t => ({free: 0, low: 1, medium: 2, high: 3}[t] ?? 4);
  window._allowFill = {
    claude: (md.models || [])
      .filter(m => m.reachable && m.relative_cost_tier && m.relative_cost_tier !== "free")
      .sort((a, b) => tierRank(a.relative_cost_tier) - tierRank(b.relative_cost_tier)
                      || a.id.localeCompare(b.id))
      .map(m => m.id),
    local: (md.models || [])
      .filter(m => m.reachable && (!m.relative_cost_tier || m.relative_cost_tier === "free"))
      .map(m => m.id).sort(),
  };
  // Same discovered set the Tools tab reads — no second source, no drift.
  // Grouped by SERVER, now with each server's individual tools so a persona can
  // grant a whole server (one click) OR scope to hand-picked tools within it.
  const servers = {};
  for (const t of (td.tools || []).filter(x => x.kind === "mcp")) {
    // Gateway root-admin tools (mcp-add/mcp-remove/…) are never a selectable
    // grant — they reconfigure the whole gateway. Managed on MCP > Gateway
    // Servers instead, and excluded from persona resolution in the backend too.
    if (t.is_admin) continue;
    const s = t.server || t.name;
    // tool-name-prefix (server__bare, or server:bare on future builds) groups
    // tools by originating server behind a gateway connection; keep the FULL
    // name for grants, show the bare name.
    const full = t.mcp_tool || t.name;
    let prefix = "", bare = full;
    for (const sep of ["__", ":"]) {
      const idx = full.indexOf(sep);
      if (idx > 0 && idx + sep.length < full.length) {
        prefix = full.slice(0, idx); bare = full.slice(idx + sep.length); break;
      }
    }
    (servers[s] ||= {tools: [], disabled: 0}).tools.push(
      {tool: full, prefix, bare, is_write: !!t.is_write,
       is_destructive: !!t.is_destructive, write_kind: t.write_kind,
       badge_source: t.badge_source, disabled: !!t.disabled});
    if (t.disabled) servers[s].disabled++;
  }
  // Per-tool access badge: real when it comes from the server's MCP annotation
  // (readOnlyHint/destructiveHint), a dashed guess when only the name heuristic
  // is available (structured-inspect spec Part 1).
  const toolAccessBadge = t => t.is_destructive
    ? '<span class="pill bad" title="destructiveHint: true (tool annotation)">destructive</span>'
    : (t.write_kind === "write" && t.badge_source === "annotation")
      ? '<span class="pill warn" title="readOnlyHint: false (tool annotation)">write</span>'
    : t.is_write
      ? '<span class="pill warn" style="border:1px dashed;opacity:.8" title="guessed from the tool name — no read/write annotation from this server">write?</span>'
      : "";
  // total tool count per server — used by the Personas table's scoped badge.
  window._mcpServerToolCounts = Object.fromEntries(

          ? info.tools.map(toolBox).join("")

                   <b class="mono">${esc(pfx)}</b> <span class="hint">${byPrefix[pfx].length} tool${byPrefix[pfx].length === 1 ? "" : "s"}</span></summary>

        return `<div class="mcp-item" data-server="${esc(s)}"${allDisabled
            ? ' title="Every tool on this server is disabled on the Tools tab"' : ""}>
          <label>
            <input type="checkbox" class="mcp-srv" value="${esc(s)}"
              data-tools="${esc(info.tools.map(t => t.tool).join(","))}">
            <span class="mono">${esc(s)}</span>
            <span class="hint">mcp · ${info.tools.length} tool${info.tools.length === 1 ? "" : "s"} — select whole server${info.disabled ? ", " + info.disabled + " disabled" : ""}</span>
            ${allDisabled ? '<span class="pill bad">disabled</span>' : ""}
          </label>
          <a href="#" class="mcp-expand" data-server="${esc(s)}" style="margin-left:22px;font-size:12px">customize tools ▸</a>
          <div class="mcp-tools" data-server="${esc(s)}" style="display:none">
            <div class="hint" style="margin-left:22px">Check individual tools to scope this persona to just those; leave the whole-server box for all current & future tools.
              ${info.tools.some(t => t.is_write) ? '<a href="#" class="mcp-readonly" data-server="' + esc(s) + '">select read-only only</a>' : ""}</div>
            ${toolBoxes}
          </div>
        </div>`;
      }).join("")
    : `<span class="hint">No MCP servers discovered yet — add one on the MCP tab.
       Any existing entries on a persona are preserved.</span>`;
  // Client-compat badges (Phase 5): documentation metadata — which clients a

  const mcpGrantCell = p => {

      if (e && e.server) {

      }

    }).join(" ");
  };
  const rows = d.personas.map(p => `<tr>
    <td class="nw"><b>${esc(p.virtual_name)}</b> ${p.enabled ? "" : '<span class="pill warn">disabled</span>'}
      ${p.context_window ? '<span class="pill ok" title="admin-set context override">ctx: ' + esc(formatCtx(p.context_window)) + '</span>' : ''}
      ${p.review_enabled ? '<span class="pill ' + (p.review_model ? 'ok' : 'warn') + '" title="tiered review pass: ' + esc(p.review_model || 'NO MODEL SELECTED — review will be skipped') + '">🔎 review</span>' : ''}
      ${personaExecutesCode(p) ? '<span class="pill bad" title="This persona can EXECUTE CODE — it prefers a code-sandbox MCP server. Every execution is audited in tool_call_log.">⚠ code exec</span>' : ''}</td>
    <td class="nw">${esc(p.benchmark_category)}</td><td class="nw">${esc(p.local_bias_strength)}</td>
    <td>${mcpGrantCell(p)}</td>

        <div id="pe-mcp" class="mcp-checklist">${checklist}</div></div>
      <div class="row"><label>guardrail_overrides (JSON obj)</label>

          <option>local_large</option><option>brain</option></select>
        <label title="OFF (default) = the selected WORKER owns the MCP tool loop for this persona (search/crawl/etc. run on the bigger, longer-context worker; falls back to the brain on any tool failure). ON = the old behavior where the routing brain runs the tool loop itself.">brain_handles_tools</label>

/* Read the MCP checklist back into a preferred_mcp_tools list (per-tool-grant
   spec — mixed shapes). Per listed server: all tools checked => bare server
   string (whole server, incl. future tools); some checked => {server, tools:[…]}
   scoped grant; none => omitted. Prior entries for servers NOT currently shown
   (offline) are preserved verbatim so editing never drops config the UI can't
   display. */
function readPreferredMcp(prevList) {
  const items = [...document.querySelectorAll("#pe-mcp .mcp-item")];
  const listedServers = new Set(items.map(i => i.dataset.server));
  const listedTools = new Set();
  const out = [];
  for (const item of items) {
    const s = item.dataset.server;
    const boxes = [...item.querySelectorAll(".mcp-tool")];
    boxes.forEach(b => listedTools.add(b.dataset.tool));
    const checked = boxes.filter(b => b.checked).map(b => b.dataset.tool);
    if (!checked.length) continue;
    if (checked.length === boxes.length) out.push(s);              // whole server
    else out.push({server: s, tools: checked});                   // scoped
  }
  // Preserve entries whose server isn't shown right now (offline server, etc.).
  for (const e of (prevList || [])) {
    if (typeof e === "string") {
      if (!listedServers.has(e) && !listedTools.has(e)) out.push(e);
    } else if (e && e.server && !listedServers.has(e.server)) {
      out.push(e);
    }
  }
  return out;
}

/* Parse a stored preferred_mcp_tools value into grant sets (mirror of the
   backend parse_preferred_mcp): {whole, bare, scoped{server->Set}}. */
function parsePreferredMcp(raw) {
  let entries = [];
  try { entries = JSON.parse(raw || "[]"); } catch (e) {}
  if (!Array.isArray(entries)) entries = [];
  const whole = new Set(), bare = new Set(), scoped = {};
  for (const e of entries) {
    if (typeof e === "string") bare.add(e);
    else if (e && e.server) {
      if (e.tools == null) whole.add(e.server);
      else (scoped[e.server] ||= new Set(), (e.tools || []).forEach(t => scoped[e.server].add(t)));
    }
  }
  return {whole, bare, scoped};
}

/* Recompute a server-level checkbox from its individual tool boxes: all =>
   checked, none => unchecked, some => indeterminate (the "mixed"/scoped look). */
function refreshServerBox(item) {
  const srv = item.querySelector(".mcp-srv");
  const boxes = [...item.querySelectorAll(".mcp-tool")];
  const n = boxes.filter(b => b.checked).length;
  srv.indeterminate = n > 0 && n < boxes.length;
  srv.checked = boxes.length > 0 && n === boxes.length;
}

/* Wire the checklist interactions once the form is rendered. */
function wireMcpChecklist() {
  document.querySelectorAll("#pe-mcp .mcp-item").forEach(item => {
    const srv = item.querySelector(".mcp-srv");
    const toolBoxes = [...item.querySelectorAll(".mcp-tool")];
    // whole-server box drives all tool boxes (and collapses to the summary).
    srv.addEventListener("change", () => {
      toolBoxes.forEach(b => { b.checked = srv.checked; });
      srv.indeterminate = false;
    });
    // any tool box flips the server box to checked / mixed / unchecked.
    toolBoxes.forEach(b => b.addEventListener("change", () => refreshServerBox(item)));
    const expand = item.querySelector(".mcp-expand");
    const tools = item.querySelector(".mcp-tools");
    if (expand) expand.onclick = ev => {
      ev.preventDefault();
      const open = tools.style.display === "none";
      tools.style.display = open ? "" : "none";
      expand.textContent = open ? "customize tools ▾" : "customize tools ▸";
    };
    const ro = item.querySelector(".mcp-readonly");
    if (ro) ro.onclick = ev => {
      ev.preventDefault();
      toolBoxes.forEach(b => { b.checked = b.dataset.write !== "1"; });
      refreshServerBox(item);
      tools.style.display = "";
      if (expand) expand.textContent = "customize tools ▾";
    };
  });
}

        <input id="m-poll" type="number" value="${cfg.meridian.quota_poll_seconds}"></div>
      <button class="act primary" id="m-save">Save window policy</button>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Semantic cache (repeated-question shortcut)</h2>
      <p class="hint">A sufficiently-similar repeated question serves the stored answer — with a
        visible ⚡ badge — instead of re-routing. Only fresh single-turn questions on non-agent
        personas; agent/tool workloads always bypass. Live-applied, no restart.
        <b>${sc.entries}</b> entries, <b>${sc.total_hits}</b> lifetime hits,
        vector search: <b>${sc.sqlite_vec ? "sqlite-vec" : "python fallback"}</b>.</p>
      <div class="row"><label>enabled</label>
        <input type="checkbox" id="sc-on" ${scCfg.enabled ? "checked" : ""}>

        <input id="sc-url" size="28" value="${esc(scCfg.embed_url || "")}" placeholder="http://truenas:11434">
        <label>embed_model</label>
        <input id="sc-model" size="20" value="${esc(scCfg.embed_model || "")}" placeholder="nomic-embed-text"></div>
      <div class="row"><label title="Cosine similarity a stored answer must clear to count as a hit. Higher = stricter (fewer, safer hits).">min_similarity</label>
        <input id="sc-sim" type="number" step="0.01" min="0.5" max="1" value="${scCfg.min_similarity ?? 0.92}">
        <label title="Fallback TTL for categories not listed in category_ttls">default_ttl_seconds</label>
        <input id="sc-ttl" type="number" value="${scCfg.default_ttl_seconds ?? 604800}">
        <label>max_entries</label>
        <input id="sc-max" type="number" value="${scCfg.max_entries ?? 2000}"></div>
      <div class="row"><label title="JSON: persona benchmark_category → TTL seconds. 0 = bypass the cache for that category (agentic/tool_calling default to 0 — freshness and side effects beat latency there).">category_ttls (JSON obj)</label>
        <input id="sc-cats" size="70" value='${esc(JSON.stringify(scCfg.category_ttls || {}))}'></div>
      <div class="row">
        <button class="act primary" id="sc-save">Save cache settings</button>
        <button class="act" id="sc-test">Test embedding ▶</button>
        <button class="act" id="sc-clear" ${sc.entries ? "" : "disabled"}>Clear cache (${sc.entries})</button>
      </div>
      <div id="sc-test-out" class="hint" style="margin-top:8px"></div>
    </div>`;
  $("#sc-save").onclick = () => run(api("config/semantic_cache", {method: "POST", body: {
    enabled: $("#sc-on").checked,

  // Live probe of the endpoint currently typed in the form — verify before Save.
  $("#sc-test").onclick = async () => {
    const out = $("#sc-test-out"), btn = $("#sc-test");
    btn.disabled = true; out.innerHTML = "testing embedding endpoint…";
    try {

  $("#m-save").onclick = () => run(api("config/meridian", {method: "POST", body: {
    conserve_premium_at: +$("#m-prem").value,
    conserve_strong_at: +$("#m-strong").value,

}
