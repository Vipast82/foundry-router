      Keys made here are shown <b>once</b>; Foundry keeps only a hash. Changes save to config.yaml and appear in config history.</p>
    <div class="card"><h3>Access</h3>
      <div class="row"><label title="optional: a program that sends no key still works (as 'anonymous'). required: every chat/media request needs a valid key.">requests without a key</label>
        <select id="ca-mode"><option value="optional" ${a.mode === "optional" ? "selected" : ""}>allowed (anonymous)</option><option value="required" ${a.mode === "required" ? "selected" : ""}>refused (key required)</option></select>
        <label title="A key that matches no client. Refuse is safer (a typo doesn't silently become anonymous). 'Let through' helps while you hand out keys: programs that always send something in their API-key field keep working. Only in 'allowed' mode.">keys that match no client</label>
        <select id="ca-unknown"><option value="refuse" ${a.unknown_keys === "refuse" ? "selected" : ""}>refuse</option><option value="anonymous" ${a.unknown_keys === "anonymous" ? "selected" : ""}>let through as anonymous</option></select>
        <label title="Require an admin-scoped key for this web UI and its API. Make an admin client first; the UI asks for its key once per browser."><input type="checkbox" id="ca-protect" ${a.protect_admin ? "checked" : ""}> protect the web UI</label>
        <button class="act primary" id="ca-save">Save access</button></div>
      <div class="row"><label title="For requests WITHOUT a key (shown as untracked, e.g. an AnythingLLM with no API key set): which persona MCP tools ride along when the program sends its own tools. Same choices as on a client key; follow the persona = the persona's own setting.">keyless clients: MCP tools with client tools</label>${_mcpPolicyHTML("ca-mcp", a.keyless_mcp_with_client_tools, "follow the persona")}</div>
      <p class="hint">Last 24 h: ${(d.anonymous.calls_24h || 0)} request(s) with no key (anonymous).</p></div>
    <div class="card"><h3>Clients</h3>${rows ? `<div class="tscroll"><table><tr><th>client (identifier)</th><th>scopes</th><th>personas</th><th>key</th><th>calls 24 h</th><th>last seen</th><th>enabled</th><th></th></tr>${rows}</table></div>` : '<p class="hint">No clients yet: every program is anonymous. Add one below.</p>'}</div>
    <div class="card"><h3>Add a client</h3>
      <div class="row"><label>for</label><select id="nc-preset">${Object.entries(d.presets).map(([k, v]) => `<option value="${k}" ${k === o.preset ? "selected" : ""}>${esc(k)} — ${esc(v.note)}</option>`).join("")}<option value="custom" ${o.preset === "custom" ? "selected" : ""}>custom</option></select></div>
      <div class="row"><label title="The client's identifier in logs, budgets (match: client) and the Work view. Letters, digits, . _ : -">name</label><input id="nc-name" value="${esc(o.preset === "custom" ? "" : o.preset)}" placeholder="e.g. cline-laptop">
        <label>note</label><input id="nc-note" value="${esc(ps.note || "")}" style="min-width:260px"></div>
      <div class="row"><label>scopes</label>${d.scopes.map(s => `<label style="min-width:0"><input type="checkbox" class="nc-scope" value="${s}" ${(ps.scopes || []).includes(s) ? "checked" : ""}> ${s}</label>`).join(" ")}</div>
      <div class="row"><label title="Leave empty for all personas. Otherwise only these are listed and usable for this client.">only personas</label><input id="nc-personas" data-multi="csv" data-options="personas" data-free="0" placeholder="all personas (pick to restrict)" value="${esc((ps.personas || []).join(", "))}">
        <button class="act primary" id="nc-create">Create client and key</button></div>
      ${ps.roles ? `<p class="hint">Persona allowlist by coordinator role: ${Object.entries(ps.roles).map(([r, n]) => `<b>${esc(r)}</b> → <code>${esc(n)}</code>`).join(" · ")}. ${esc(ps.roles_note || "")} Legacy aliases (Foundry-Kilo-Sonnet, -Opus…) don't authorize these ids.</p>` : ""}
      <p class="hint">Scopes: <b>inference</b> chat/models · <b>media</b> image jobs · <b>orchestration</b> coordinator bindings, training capture and control-center actions · <b>telemetry</b> the workstation bridge · <b>operator</b> a person using the control center · <b>admin</b> this web UI's API.</p></div>
    <div class="card"><h3>Keys that matched no client</h3>
      <p class="hint">A program sending a key Foundry doesn't know (since restart; only a fingerprint is kept, never the key). Usually a placeholder or an old key in that program's API-key field: make a client above and paste its key there.</p>
      ${rej ? `<div class="tscroll"><table><tr><th>fingerprint</th><th>looks like</th><th>requests</th><th>result</th><th>last path</th><th>from</th><th>last</th></tr>${rej}</table></div><div class="row"><button class="act" id="rej-clear">Clear list</button></div>` : '<p class="hint">None.</p>'}</div>`;
  const scopesOf = sel => [...document.querySelectorAll(sel)].filter(x => x.checked).map(x => x.value);
  const list = v => v.split(",").map(x => x.trim()).filter(Boolean);
  const showKey = (title, name, key, preset) => {
    const body = openModal(title, `<p>Copy this key now — Foundry stores only its hash and can't show it again.</p>
      <div class="row"><code id="new-key" style="font-size:14px;overflow-wrap:anywhere">${esc(key)}</code> <button class="act primary" id="copy-key">Copy</button></div>
      ${preset === "admin" ? '<div class="row"><button class="act" id="use-key">Use this key in this browser</button></div>' : ""}
      <h4>Connect ${esc(name)}</h4>${_connectHelp(preset, name, key, d.endpoints)}`);
    $("#copy-key", body).onclick = () => { navigator.clipboard.writeText(key).then(() => toast("Key copied"), () => toast("Select the key and copy it", true)); };
    const use = $("#use-key", body);
    if (use) use.onclick = () => { try { localStorage.setItem("foundryAdminKey", key); } catch (e) {} toast("This browser now uses the admin key"); };
  };
  $("#ca-save").onclick = () => api("setup/client_auth", {method: "POST", body: {mode: $("#ca-mode").value,
    unknown_keys: $("#ca-unknown").value, protect_admin: $("#ca-protect").checked,
    keyless_mcp_with_client_tools: _mcpPolicyRead("ca-mcp")}})
    .then(r => { toast((r.warnings || []).join(" ") || "Saved", !!(r.warnings || []).length); render(); })
    .catch(e => toast(e.message, true));
  $("#nc-preset").onchange = e => { o.preset = e.target.value; render(); };
  $("#nc-create").onclick = () => api("setup/clients", {method: "POST", body: {name: $("#nc-name").value.trim(),
    note: $("#nc-note").value, scopes: scopesOf(".nc-scope"), personas: list($("#nc-personas").value)}})
    .then(r => { render(); showKey(`Client ${r.client.name} created`, r.client.name, r.key, o.preset); })
    .catch(e => toast(e.message, true));
  document.querySelectorAll("[data-rotate]").forEach(b => b.onclick = () => {
    const n = b.dataset.rotate;
    if (!confirm(`Make a new key for ${n}? The current key stops working immediately.`)) return;
    api(`setup/clients/${encodeURIComponent(n)}/rotate`, {method: "POST"})
      .then(r => { render(); showKey(`New key for ${n}`, n, r.key, presetOf({name: n})); }).catch(e => toast(e.message, true));
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const n = b.dataset.del;
    if (!confirm(`Delete client ${n}? Its key stops working immediately.`)) return;
    run(api(`setup/clients/${encodeURIComponent(n)}`, {method: "DELETE"}));
  });
  document.querySelectorAll("[data-connect]").forEach(b => b.onclick = () =>
    openModal(`Connect ${b.dataset.connect}`, _connectHelp(b.dataset.preset, b.dataset.connect, "", d.endpoints) +
      '<p class="hint">The key itself isn\'t stored here. Lost it? Use "New key".</p>'));
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => {
    const c = d.clients.find(x => x.name === b.dataset.edit);
    const body = openModal(`Edit ${c.name}`, `
      <div class="row"><label>scopes</label>${d.scopes.map(s => `<label style="min-width:0"><input type="checkbox" class="ed-scope" value="${s}" ${c.scopes.includes(s) ? "checked" : ""}> ${s}</label>`).join(" ")}</div>
      <div class="row"><label>only personas</label><input id="ed-personas" data-multi="csv" data-options="personas" data-free="0" value="${esc(c.personas.join(", "))}" placeholder="all personas (pick to restrict)"></div>
      <div class="row"><label>note</label><input id="ed-note" value="${esc(c.note || "")}" style="min-width:300px"></div>
      <div class="row"><label title="Add '— via <model> @ <backend>' under every answer this client gets (and the route line in buffered replies' reasoning). For AnythingLLM / Open WebUI, which hide reasoning."><input type="checkbox" id="ed-footer" ${c.route_footer ? "checked" : ""}> show which model and backend answered</label></div>
      <div class="row"><label title="When this client sends its own tools (AnythingLLM @agent, Cline, Kilo, Open WebUI tools), which of the persona's MCP tools ride along. Wins over the persona's own setting; never adds a tool the persona isn't granted. e.g. Cline/Kilo: off · AnythingLLM: acestep-music, stable-audio, kokoro-tts, chatterbox-tts, searxng · Open WebUI: all.">MCP tools with client tools</label>${_mcpPolicyHTML("ed-mcp", c.mcp_with_client_tools, "follow the persona")}</div>
      <div class="row"><label><input type="checkbox" id="ed-enabled" ${c.enabled ? "checked" : ""}> enabled</label>
        <button class="act primary" id="ed-save">Save</button></div>
      <p class="hint">The name is this client's identifier in logs and budget rules, so it isn't renamed; make a new client instead.</p>`);
    $("#ed-save", body).onclick = () => api(`setup/clients/${encodeURIComponent(c.name)}`, {method: "PATCH", body: {
      scopes: scopesOf(".ed-scope"), personas: list($("#ed-personas", body).value), note: $("#ed-note", body).value,
      enabled: $("#ed-enabled", body).checked, route_footer: $("#ed-footer", body).checked,
      mcp_with_client_tools: _mcpPolicyRead("ed-mcp", body)}}).then(r => { closeModal(); toast((r.warnings || []).join(" ") || "Saved", !!(r.warnings || []).length); render(); }).catch(e => toast(e.message, true));
  });
  const rc = $("#rej-clear");
  if (rc) rc.onclick = () => run(api("setup/rejected", {method: "DELETE"}));
}

// Setup → Helpers & Limits: per-backend concurrency and helper streams,
// edited as a form (stored on each backend in config.yaml).
async function tabLimits() {
  const d = await api("setup/limits");
  const num = (v, ph) => `value="${v == null ? "" : esc(v)}" placeholder="${ph}"`;
  const rows = d.backends.map(b => {
    const s = d.streams[b.name];
    const active = s ? (s.active || []).map(a => `${a.persona || a.client} (${a.idle_s}s idle)`).join(", ") : "";
    return `<tr><td class="nw"><b>${esc(b.name)}</b><div class="hint">${esc(b.type)}${b.flavor ? " · " + esc(b.flavor) : ""}${b.subscription ? " · subscription" : ""}${b.enabled === false ? " · disabled" : ""}</div></td>
      <td class="nw"><input type="number" min="0" max="64" style="width:80px" data-f="helpers_allowed" data-b="${esc(b.name)}" ${num(b.helpers_allowed, "no limit")}></td>
      <td class="nw"><input type="number" min="1" max="256" style="width:80px" data-f="max_concurrent" data-b="${esc(b.name)}" ${num(b.max_concurrent, "no limit")}></td>
      <td class="nw"><input type="number" min="1" max="3600" style="width:90px" data-f="queue_timeout_seconds" data-b="${esc(b.name)}" ${num(b.queue_timeout_seconds, "300")}></td>
      <td class="hint" style="white-space:normal">${s ? `${(s.active || []).length}${s.streams_allowed != null ? "/" + s.streams_allowed : ""} ${esc(active)}` : "—"}</td>
      <td class="nw"><button class="act primary" data-save="${esc(b.name)}">Save</button></td></tr>`;
  }).join("");
  $("#main").innerHTML = `
    <h2>Helpers &amp; limits</h2>
    <p class="hint">Per backend. <b>Helpers allowed</b>: how many helper streams (sub-agents, e.g. Kilo's task tool or
      parallel coordinator sessions) the backend serves next to your main one: <code>0</code> = main stream only,
      <code>1</code> = main + one helper, empty = no limit. A session over the limit waits up to the queue timeout for a slot,
      then is refused; a session holds its slot until 60 s after its last call.
      <b>Max concurrent</b>: calls running at once (e.g. llama.cpp <code>-np</code> slots); more wait in a fair queue.
      Call/token caps per account, client or task are budget rules (Logs → Usage Log).</p>
    <div class="card">${rows ? `<div class="tscroll"><table><tr><th>backend</th><th>helpers allowed</th><th>max concurrent</th><th>queue timeout s</th><th>sessions now</th><th></th></tr>${rows}</table></div>` : '<p class="hint">No backends configured (Backends → Pool).</p>'}</div>`;
  document.querySelectorAll("[data-save]").forEach(b => b.onclick = () => {
    const name = b.dataset.save, body = {name};
    document.querySelectorAll(`input[data-b="${CSS.escape(name)}"]`).forEach(i => { body[i.dataset.f] = i.value; });
    if (body.queue_timeout_seconds === "") delete body.queue_timeout_seconds;
    run(api("setup/limits", {method: "POST", body}));
  });
}

// Route view (routes_view.py): the routing graph generated from the live
// configuration, overlaid with traffic, budget denials, failures and image jobs.
window._routeOpts = window._routeOpts || {hours: 24, all: false, active: false};
async function tabRoutes() {
  const o = window._routeOpts;
  const g = await api(`routes?hours=${o.hours}&all=${o.all ? 1 : 0}&active=${o.active ? 1 : 0}`);
  const cols = ["client", "persona", "model", "backend"];
  const colName = {client: "clients (key name, or untracked · IP)", persona: "personas · route · budget gate", model: "models · routing brain", backend: "backends"};
  const colOf = n => n.kind === "brain" ? "model" : n.kind;
  const byCol = Object.fromEntries(cols.map(c => [c, g.nodes.filter(n => colOf(n) === c)
    .sort((a, b) => (b.count - a.count) || a.label.localeCompare(b.label))]));
  const W = 1180, NW = 220, NH = 46, GAP = 14, TOP = 34;
  const colX = i => 10 + i * ((W - NW - 20) / 3);
  const pos = {};
  cols.forEach((c, i) => byCol[c].forEach((n, j) => { pos[n.id] = {x: colX(i), y: TOP + j * (NH + GAP)}; }));
  const H = TOP + Math.max(1, ...cols.map(c => byCol[c].length)) * (NH + GAP) + 10;
  const style = {
    traffic: "stroke:#3b82f6;opacity:.8", failed: "stroke:var(--bad)", denied: "stroke:var(--bad);stroke-dasharray:6 4",
    config: "stroke:var(--dim);stroke-dasharray:3 4;opacity:.6", fallback: "stroke:var(--dim);stroke-dasharray:1 4;opacity:.8",
    image: "stroke:#a855f7;stroke-dasharray:8 3", brain: "stroke:#f59e0b;stroke-dasharray:4 3",
    live: "stroke:#22c55e;stroke-dasharray:7 4;animation:rt-flow 1s linear infinite"};
  const width = e => ["config", "fallback"].includes(e.kind) ? 1.3 : 1.6 + Math.log2((e.count || 0) + 1) * 1.4;
  const edgesSvg = g.edges.filter(e => pos[e.from] && pos[e.to]).map((e, i) => {
    const a = pos[e.from], b = pos[e.to];
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2, mx = (x1 + x2) / 2;
    const d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
    const clickable = !["config", "fallback"].includes(e.kind);
    const lbl = e.kind === "fallback" ? `#${e.order}` : clickable ? `${e.count}${e.errors ? " (" + e.errors + "✗)" : ""}` : "";
    const tip = `${e.kind}: ${e.from} → ${e.to}` + (e.count ? ` · ${e.count}` : "") + (e.avg_ms ? ` · avg ${fmtDur(e.avg_ms)}` : "") + (e.rules ? " · " + Object.keys(e.rules).join(", ") : "");
    return `<g class="redge${clickable ? " click" : ""}" ${clickable ? `onclick='showRouteEdge(${JSON.stringify(e.kind)}, ${JSON.stringify(e.from)}, ${JSON.stringify(e.to)})'` : ""}>
      <title>${esc(tip)}</title>
      <path d="${d}" fill="none" style="${style[e.kind]};stroke-width:${width(e)}"/>
      ${clickable ? `<path d="${d}" fill="none" stroke="transparent" stroke-width="14"/>` : ""}
      ${lbl ? `<text x="${mx}" y="${(y1 + y2) / 2 - 4}" class="rlbl">${esc(lbl)}</text>` : ""}</g>`;
  }).join("");
  const healthCls = {serving: "ok", failing: "bad", down: "bad", unverified: "warn", disabled: ""};
  const nodesSvg = g.nodes.filter(n => pos[n.id]).map(n => {
    const p = pos[n.id];
    let sub = "", dot = "";
    if (n.kind === "persona") {
      const bk = n.backend && n.backend.startsWith("<") ? "no " + n.backend.slice(1, -1) + " backend" : n.backend;
      sub = [n.strict ? "strict" + (bk ? " · " + bk : "") : (n.mode ? "flexible" : ""), n.mode].filter(Boolean).join(" · ");
      dot = n.validation ? ({passed: "ok", failed: "bad"}[n.validation] || "warn") : "";
    } else if (n.kind === "backend") {
      sub = [n.flavor, n.health, n.missing ? "not configured" : ""].filter(Boolean).join(" · ");
      dot = healthCls[n.health] || "";
    } else if (n.kind === "client") {
      sub = n.configured ? `${(n.scopes || []).join("+")}${n.restricted ? " · restricted" : ""}` : n.tracked === false ? "no key — make one" : "no key";
      if (n.live) dot = "ok";
    } else if (n.kind === "brain") {
      sub = "routing brain";
      dot = n.live ? "ok" : "";
    } else if (n.kind === "model") {
      sub = n.image ? "image model" : n.raw ? "raw model (no persona)" : "";
    }
    const dim = n.enabled === false || n.disabled ? "opacity:.45" : "";
    const gates = n.gates || [];
    const label = n.kind === "backend" && n.label.startsWith("<") ? `no ${n.label.slice(1, -1)} backend` : n.label;
    return `<g class="rnode" style="${dim}"><title>${esc(label)}${n.count ? " · " + n.count + " requests" : ""}${n.errors ? " · " + n.errors + " failed" : ""}${n.live ? " · " + n.live + " running now" : ""}${gates.length ? "\nbudget rules: " + gates.join(", ") : ""}${(n.agents || []).length ? "\n" + n.agents.join("\n") : ""}</title>
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="7" class="rnode-box ${n.errors ? "has-err" : ""}"/>
      ${dot ? `<circle cx="${p.x + NW - 11}" cy="${p.y + 11}" r="4.5" class="rdot ${dot}"/>` : ""}
      <text x="${p.x + 9}" y="${p.y + 18}" class="rname">${esc(label.length > 27 ? label.slice(0, 26) + "…" : label)}${n.enabled === false ? " (off)" : ""}</text>
      ${gates.length ? `<text x="${p.x + NW - (dot ? 22 : 9)}" y="${p.y + 18}" class="rgate" text-anchor="end">⛁${gates.length}</text>` : ""}
      <text x="${p.x + 9}" y="${p.y + 35}" class="rsub">${esc((sub || "").slice(0, 38))}${n.count ? (sub ? " · " : "") + n.count : ""}</text></g>`;
  }).join("");
  const heads = cols.map((c, i) => `<text x="${colX(i)}" y="18" class="rhead">${colName[c]}</text>`).join("");
  $("#main").innerHTML = `
    <h2>Routes — generated from the live configuration</h2>
    <style>@keyframes rt-flow { to { stroke-dashoffset: -22; } }</style>
    <p class="hint"><b style="color:#22c55e">Green moving</b> = running right now · <b style="color:#f59e0b">amber dashed</b> = requests whose persona used the routing brain · a client without a key shows as <b>untracked · its IP</b> (make it a key in Access → Clients &amp; Keys to see it by name). Dotted grey = what the config allows (persona allowlists in pinned order: #2, #3 are the explicit fallback chain; client persona restrictions; the backend each model is served by — the pinned backend for strict routes). <b style="color:#3b82f6">Blue</b> = requests in the window (thicker = more), <b style="color:var(--bad)">red</b> = failed, red dashed = denied by a budget rule, <b style="color:#a855f7">purple dashed</b> = image jobs. ⛁N = budget rules that gate a client or persona (hover for names); the dot = validation (personas) or serving health (backends). Click a coloured edge for its requests, then a request for its full trace.</p>
    <div class="row"><label>window</label><select id="rt-hours">${[[1 / 6, "10 min"], [0.5, "30 min"], [2, "2 h"], [6, "6 h"], [24, "1 d"], [168, "7 d"]].map(([h, l]) => `<option value="${h}" ${Math.abs(h - o.hours) < 1e-6 ? "selected" : ""}>${l}</option>`).join("")}</select>
      <label for="rt-all">all personas</label><input type="checkbox" id="rt-all" ${o.all ? "checked" : ""}>
      <label for="rt-active" title="Only what was observed (traffic, denials, calls running now), no configuration; refreshes every 5 s">active only (live)</label><input type="checkbox" id="rt-active" ${o.active ? "checked" : ""}>
      <span class="stat">${g.requests} requests · ${g.denials} denials · ${g.image_jobs} image jobs · ${g.live || 0} running now</span></div>
    <div class="tscroll"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="routes-svg">${heads}${edgesSvg}${nodesSvg}</svg></div>
    <div id="rt-detail"></div><div id="rt-trace"></div>`;
  $("#rt-hours").onchange = e => { o.hours = +e.target.value; render(); };
  $("#rt-all").onchange = e => { o.all = e.target.checked; render(); };
  $("#rt-active").onchange = e => { o.active = e.target.checked; if (o.active && o.hours > 2) o.hours = 0.5; render(); };
  clearTimeout(window._routeTimer);
  if (o.active) window._routeTimer = setTimeout(() => { if (current === "Routes" && window._routeOpts.active && !$("#rt-detail").innerHTML) render(); }, 5000);
}

// Monitor → Active Use: who uses the router (client keys and untracked IPs),
// what each runs right now, and its traffic over time. Refreshes every 10 s.
window._auOpts = window._auOpts || {hours: 24};
async function tabActiveUse() {
  const o = window._auOpts;

// Functional health (health.py): HTTP-reachable is not the same as able to
// generate. Evidence comes from real calls; idle local backends get a tiny probe.
function functionalCard(fh) {
  if (!fh) return "";
  const age = s => s == null ? "" : s < 90 ? `${s}s ago` : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 172800 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
  const pill = {serving: ["ok", "serving"], failing: ["bad", "failing"], unverified: ["warn", "reachable, not verified"],
                down: ["bad", "down"], disabled: ["", "disabled"]};
  const queues = Object.fromEntries((fh.queues || []).map(q => [q.backend, q]));
  const breakers = Object.fromEntries((fh.breakers || []).map(x => [x.backend, x]));
  const load = q => !q ? "" : q.limited
    ? `${q.active}/${q.capacity}${q.waiting_total ? ` <span class="pill warn" title="${esc(Object.entries(q.waiting).map(([c, n]) => c + ": " + n).join(", "))}">${q.waiting_total} waiting · ${q.oldest_wait_s}s</span>` : ""}${q.timeouts ? ` <span class="hint" style="margin:0">${q.timeouts} timed out</span>` : ""}`
    : `${q.busy} <span class="hint" style="margin:0" title="no max_concurrent: the backend queues internally">· no limit</span>`;
  // Sessions on the backend vs helpers_allowed (main stream + N helpers).
  const streams = x => {
    if (!x) return "";
    const who = (x.active || []).map(a => `${a.persona || a.client} (${a.idle_s}s idle)`).join("\n");
    const n = (x.active || []).length;
    return x.streams_allowed == null
      ? `<span class="hint" style="margin:0" title="${esc(who || "no active sessions")}
helpers_allowed not set">${n} · no limit</span>`
      : `<span class="${n >= x.streams_allowed ? "pill warn" : ""}" title="${esc(who || "no active sessions")}">${n}/${x.streams_allowed}</span> <span class="hint" style="margin:0">main + ${x.helpers_allowed}</span>`;
  };
  const breaker = x => !x ? "" : x.state === "closed"
    ? `<span class="hint" style="margin:0">closed</span>`
    : `<span class="pill ${x.state === "open" ? "bad" : "warn"}" title="${esc(x.last_error || "")}">${x.state}${x.retry_in_s ? " · " + x.retry_in_s + "s" : ""}</span> <button class="act" title="Close the breaker now (after fixing the backend)" onclick='resetBreaker(${JSON.stringify(x.backend)})'>reset</button>`;
  const rows = fh.backends.map(b => {
    const [cls, label] = pill[b.status] || ["", b.status];
    const ok = b.last_ok ? `${esc(age(b.last_ok.age_s))} · <span class="mono">${esc(b.last_ok.model || "")}</span> <span class="hint" style="margin:0">(${esc(b.last_ok.source)})</span>` : '<span class="hint">none in 24 h</span>';
    const err = b.last_error ? `<span title="${esc(b.last_error.detail || "")}">${esc(age(b.last_error.age_s))} · ${esc((b.last_error.detail || "").slice(0, 70))}</span>` : '<span class="hint">—</span>';
    return `<tr><td class="nw"><b>${esc(b.backend)}</b> <span class="hint" style="margin:0">${esc(b.flavor || b.type)}${b.paid ? " · paid" : ""}</span></td>
      <td class="nw"><span class="pill ${cls}">${label}</span></td>
      <td class="nw">${b.reachable === true ? "yes" : b.reachable === false ? '<span style="color:var(--bad)">no</span>' : '<span class="hint">not checked</span>'}</td>
      <td class="bw-mid">${ok}</td><td class="bw-wide">${err}</td>
      <td class="nw">${b.calls_1h}${b.errors_1h ? ` <span class="hint" style="margin:0">(${b.errors_1h} failed)</span>` : ""}</td>
      <td class="nw">${load(queues[b.backend])}</td><td class="nw">${streams(b.streams)}</td><td class="nw">${breaker(breakers[b.backend])}</td>
      <td class="nw">${b.status === "disabled" ? "" : `<button class="act" title="One tiny real generation (reply OK, 16 tokens) on exactly this backend${b.paid ? " — spends a little subscription quota" : ""}" onclick='probeBackend(${JSON.stringify(b.backend)}, ${b.paid})'>probe</button>`}${b.auto_probe ? ' <span class="hint" style="margin:0" title="probed automatically when idle with no recent success">auto</span>' : ""}</td></tr>`;
  }).join("");
  const br = fh.brain || {};
  return `<div class="card">
    <h2 style="margin-top:0">Can it serve?</h2>
    <p class="hint">"Reachable" is the pool's HTTP check. <b>Serving</b> means a generation actually succeeded in the last ${fh.fresh_minutes} min — from real traffic, or a tiny probe when a backend sits idle (${fh.probe_minutes ? `local backends every ${fh.probe_minutes} min${fh.probe_paid ? ", paid too" : ""}` : "auto-probes off"}).</p>
    <table><tr><th>backend</th><th>status</th><th>reachable</th><th>last success</th><th>last failure</th><th>calls 1 h</th><th title="calls running / max_concurrent, and the fair queue">load</th><th title="client sessions active on the backend / allowed (main stream + helpers_allowed). Set helpers_allowed in Backends → Pool.">streams</th><th title="closed = in use; open = failing, skipped until the cooldown ends; half-open = the next call is a trial">breaker</th><th></th></tr>${rows}</table>
    <div class="row"><label>brain</label>${br.healthy === true ? '<span class="pill ok">reachable</span>' : br.healthy === false ? `<span class="pill bad" title="${esc(br.error || "")}">down</span>` : '<span class="hint">not checked</span>'}
      <label>image jobs</label>${fh.media && fh.media.backend ? `<b>${fh.media.active}</b>&nbsp;queued/running · ${fh.media.failed_24h} failed (24 h)` : `<span class="hint">${esc((fh.media || {}).backend_error || "no image backend")}</span>`}</div>
  </div>`;
}

};

// Header line under the title: version, pool mode, brain health, routing and
// backends up, refreshed by the Overview and Backend pool tabs and at load.
function renderHeaderInfo(st) {
  const bh = st.brain.health || {};
  const bhCls = bh.healthy === true ? (bh.model_present === false ? "warn" : "ok")
              : bh.healthy === false ? "bad" : "";
  const bhTxt = bh.healthy === true ? (bh.model_present === false ? "model missing" : "healthy")
              : bh.healthy === false ? "down" : "not checked";
  const backs = (st.backends || []).filter(b => b.enabled !== false), down = backs.filter(b => b.healthy === false).length;
  $("#hdr-info").innerHTML =
    `v${esc(st.version)} · ${esc(st.pool_mode)} pool · brain ${esc(st.brain.model)} (${esc(st.brain.provider)}) `
    + `<span class="pill ${backs.length && !down ? "ok" : down ? "bad" : ""}" title="Backends answering their health check">${backs.length - down}/${backs.length} backends up</span>`
    + ` <span class="pill ${bhCls}" title="${esc(bh.error || "The routing brain picks a model per persona request")}">brain ${bhTxt}</span>`
    + ` <span class="pill ${st.brain.active ? "" : "warn"}" title="${esc(st.brain.active ? "Persona requests are routed by the brain" : "Brain skipped: " + (st.brain.reason || ""))}">routing: ${st.brain.active ? "brain" : "passthrough"}${st.brain.routing_mode && st.brain.routing_mode !== "auto" ? "" : " (auto)"}</span>`
    + ` · ${st.tool_count} tools`;
}

    <div class="card">
      <h2 style="margin-top:0">Edit backend list (internal mode)</h2>
      <p class="hint">JSON list. Each backend needs <code>name</code>, <code>type</code>
      (<code>ollama</code> / <code>openai-compatible</code> / <code>anthropic-compatible</code>),
      and <code>url</code>. Use <code>\${MERIDIAN_API_KEY}</code>-style references for api_key —
      the value is written into config.yaml verbatim. Saving rebuilds the pool live.</p>
      <p class="hint">Optional <code>flavor</code> on an <code>openai-compatible</code> backend names the
      server software so <b>Host Admin</b> shows the right panel:
      <code>llamacpp</code>, <code>unsloth</code>, <code>vllm</code>, <code>cliproxyapi</code>
      or <code>openai</code> (default). <code>cliproxyapi</code> =
      <a href="https://github.com/router-for-me/CLIProxyAPI" target="_blank">CLIProxyAPI</a>
      (ChatGPT/Codex, Claude Code, Gemini sign-ins behind one endpoint): its models count as
      <b>paid subscription</b> models (persona paid cascades, max_paid_calls, cost report) and
      get the full reasoning scale (Xhigh → <code>xhigh</code>). Any other subscription proxy:
      add <code>"subscription": true</code>. Ollama backends always get full model CRUD; the openai-dialect flavors get
      read-only diagnostics. The flavor also unlocks that server's extra sampling knobs
      (llama.cpp DRY/XTC/top-n-sigma…, vLLM repetition_penalty/min_tokens/guided decoding…),
      thinking on/off, engine metrics on the Live tab and context auto-detection.
      Examples: <code>{"name":"llamacpp-1","type":"openai-compatible",
      "url":"http://192.168.30.206:8080","flavor":"llamacpp"}</code> ·
      <code>{"name":"vllm-1","type":"openai-compatible","url":"http://192.168.30.207:8000",
      "flavor":"vllm"}</code>.</p>
      <p class="hint"><code>helpers_allowed</code>: how many helper streams (sub-agents) a backend serves next to
      your main one, counted as client sessions active on it: <code>0</code> = main stream only, <code>1</code> = main + one
      helper, … <code>null</code> = no limit. Each backend has its own. A session over the limit waits up to
      <code>queue_timeout_seconds</code> for a slot, then is refused. A session holds its slot until 60 s after its last
      call. Dashboard → <i>Can it serve?</i> shows who holds each one.</p>
      <textarea id="backends-json" rows="12"></textarea>
      <div class="row"><button class="act primary" id="save-backends">Save backends</button>
      <select id="pool-mode">
        ${["internal","olla","litellm"].map(m =>
          `<option ${m === st.pool_mode ? "selected" : ""}>${m}</option>`).join("")}
      </select>
      <button class="act" id="save-mode">Switch pool mode</button></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0;display:flex;align-items:center">Routing mode ${help("routing")}
        <span style="margin-left:10px">${st.brain.active
          ? '<span class="pill ok" title="Persona requests are routed by the brain">brain routing active</span>'
          : `<span class="pill warn" title="${esc(st.brain.reason || "")}">passthrough — ${esc(st.brain.reason || "")}</span>`}</span></h2>
      <p class="hint">How persona requests are served. <b>Auto</b> uses the brain while it's configured and
        healthy and switches to passthrough the moment it isn't — no waiting on timeouts. <b>Passthrough</b>
        never calls the brain: Foundry becomes a smart proxy that picks a model per persona policy, forwards the
        request as-is, fails over between backends and still manages MCP servers. <b>Brain</b> always routes
        through the brain (per-request fallback if it fails).</p>
      <div class="row"><label>routing mode</label>
        <select id="brain-routing">${[["auto", "auto — brain when available, else passthrough"],
            ["brain", "brain — always route through the brain"],
            ["passthrough", "passthrough — no brain, direct routing"]].map(([v, l]) =>
          `<option value="${v}" ${v === (st.brain.routing_mode || "auto") ? "selected" : ""}>${l}</option>`).join("")}</select>
        <button class="act primary" id="save-routing">Save routing mode</button></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Agent Brain — routing model</h2>
      <p class="hint">JUST the routing brain's own model/endpoint — the small LLM that makes routing
      decisions on every request (design doc §4.2). Backend-specific. The global knobs that apply
      to <b>every</b> request live in the next section.</p>
      <div class="row tight"><label>provider</label>
        <select id="brain-provider">${["ollama","meridian","openrouter"].map(p =>
          `<option ${p === st.brain.provider ? "selected" : ""}>${p}</option>`).join("")}</select>
        <label>endpoint</label><input id="brain-endpoint" size="34" value="${esc(st.brain.endpoint)}">
        <label>model</label><input id="brain-model" size="24" value="${esc(st.brain.model)}"></div>
      <div class="row"><button class="act" id="test-brain"
        title="Free reachability probe of the brain endpoint (GET its model list — no generation). The brain runs on EVERY request; if it's down, routing silently degrades to the static fallback rule.">Test brain</button>
        <span id="brain-health" class="hint"></span>
        <button class="act primary" id="save-brain-model">Save brain model</button></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0">Global settings <span class="hint" style="font-weight:normal">— apply to EVERY request, across all backends (not brain-specific)</span></h2>
      <p class="hint">These govern worker dispatch, streaming, keep-alive and reasoning for all
      requests regardless of which backend answers. Applies live. (Context/limit budgets: a 6GB
      local brain with num_ctx ~6144 has ~1500 tokens free after system prompt + tool schemas;
      tool-result limits only cap the preview the brain sees — the full output still reaches the
      user via use_last_result.)</p>
      <div class="hint" style="font-weight:600;margin:2px 0">Limits / budget</div>
      <div class="row tight">
        <label>tool_result_limit_chars</label><input id="brain-trl" type="number" size="8">
        <label>mcp_result_limit_chars</label><input id="brain-mrl" type="number" size="8">
        <label title="Ollama output cap (num_predict) + Claude/OpenAI max_tokens — the ceiling on a worker's generated tokens. Prevents a runaway (esp. with heavy reasoning).">worker_max_tokens</label><input id="brain-wmt" type="number" size="8">
        <label title="Caps what the brain sees of a large pasted user message before routing — the worker still receives the complete original (include_full_user_message)">user_input_preview_chars</label>
        <input id="brain-uip" type="number" size="8"></div>
      <div class="hint" style="font-weight:600;margin:6px 0 2px">Keep-alive / streaming</div>
      <div class="row tight">
        <label title="While a worker/brain/MCP call is in flight, emit a 'still working' narration line every N seconds so reverse proxies and clients never mistake a slow request (failover + cold model load) for a dead one. 0 disables. (AGENT-mode narration.)">heartbeat_seconds (agent)</label>
        <input id="brain-hb" type="number" size="6">
        <label title="keep_alive sent to Ollama workers so a heavy model (e.g. a 27B at 131K ctx ≈ 22GB) stays RESIDENT between turns instead of cold-loading ~22GB every request — the main cause of multi-minute latency / proxy 504s for Cline. Blank = backend default (~5min). Try 30m, 24h, or -1 (never unload).">worker_keep_alive</label>
        <input id="brain-ka" size="7" placeholder="30m">
        <label title="Stream direct-dispatch (Cline/coding clients) live: forward the worker's tokens as they generate — each chunk proves the backend is working, resets the read timeout (no total-time wall), and the client shows it typing in real time. Ollama backends only; Claude falls back to blocking. OFF = one blocking call, full answer at the end. (DIRECT/Cline path.)">direct_stream</label>
        <input type="checkbox" id="brain-ds">
        <label title="Direct-stream keep-alive (seconds). While streaming to Cline, if the backend sends no chunk for this long (silent prompt-eval, or a model buffering its reasoning), Foundry injects a small 'still working… Ns' thinking chunk — so the client shows live progress instead of a frozen 'Thinking…', and the bytes reset idle timers (client read timeout, proxy) so long generations aren't killed. 0 = off. Needs direct_stream on. (DIRECT/Cline path.)">ds heartbeat (s)</label>
        <input id="brain-dshb" type="number" min="0" step="5" value="0" style="width:70px">
        <label title="Stall watchdog (direct_stream): if a model sends NO output — no token, thinking or tool call — for this many seconds, Foundry abandons the call (closing the upstream request so it stops using the GPU / Claude session) and, if nothing reached the client yet, hands the turn to the next model the persona allows. Heartbeats and backend keep-alive pings don't count as output. Set it above your slowest real prefill (a 27B model reading a 150k-token Cline context can take minutes). 0 = off.">stall timeout s</label>
        <input id="brain-dstall" type="number" min="0" step="30" value="900" style="width:70px">
        <label title="How often a VISIBLE '⏳ … still working · 2m 05s' line appears while a model is busy. Every heartbeat still sends invisible keep-alive bytes (so proxies and clients never time out), but each visible line is a new line in the client's thinking panel — so they're shown only at ~30s, ~60s, then every N seconds. 0 = never show, keep-alive bytes only.">status line every s</label>
        <input id="brain-hbvis" type="number" min="0" step="15" value="60" style="width:70px">
        <label title="Context guard: before sending a request to a model, Foundry estimates its size (messages + tool definitions). If it would overflow the model's context window (persona context_window, or the engine's n_ctx / max_model_len) minus the output reserve, Foundry trims the copy it sends — oversized old tool results first, then the oldest turns after your task (the system prompt and the task are always kept, tool calls stay paired with their results). Your client keeps its full history; the turn shows what was cut. Protects Cline when its own auto-compact doesn't fire in time.">context guard</label>
        <select id="brain-cguard"><option value="trim">trim</option><option value="off">off</option></select>
        <label title="Sticky guard (recommended): once the guard has collapsed part of a conversation it keeps exactly that cut on every later turn and only collapses MORE when the prompt is over budget again (down to ~72% of it). Without this the cut moved or switched on and off turn to turn, and every change forced a minutes-long re-read of the whole prompt on the GPU.">sticky guard</label>
        <input type="checkbox" id="brain-csticky" checked>
        <label title="Output tokens kept free for the answer when the context guard sizes a request. 0 = auto: the request's max tokens (client num_predict, else worker_max_tokens), capped at a quarter of the window.">answer reserve</label>
        <input id="brain-creserve" type="number" min="0" step="1024" value="0" style="width:80px">
        <label title="AGENT mode (Foundry-Chat etc.): stream the worker's REASONING (its thinking tokens) live as narration while it generates, but BUFFER the answer so the brain still reviews it (refusal/permissive fallback, outcome-judge) before showing it. Watch the model reason in real time; the final answer stays gated. Ollama workers only. (AGENT path.)">stream_worker_reasoning</label>
        <input type="checkbox" id="brain-swr"></div>
      <div class="row tight">
        <label title="Backend read timeout (seconds): the MAX gap Foundry waits for the next streamed token from a backend (Ollama/Claude) before failing with ReadTimeout. Too low + heavy prompt-eval or reasoning = dropped streams. Old installs default to 300; try 1800. Baked into the HTTP client at startup, so a change needs a Restart (button below the aggregator).">backend read timeout (s)</label>
        <input id="brain-rto" type="number" min="30" step="60" style="width:90px">
        <button class="act" id="save-rto" title="Save the backend read timeout (requires a restart to apply)">Save timeout</button>
        <span id="rto-note" class="hint"></span></div>
      <div class="hint" style="font-weight:600;margin:6px 0 2px">Reasoning</div>
      <div class="row tight">
        <label title="Reasoning effort sent to every thinking-capable worker as Ollama's think field (low/medium/high/max). Applied ONLY to models that report a thinking capability — non-reasoning locals are untouched. Blank = leave each model at its own default; off = disable thinking where supported. Per-persona reasoning_effort overrides this.">reasoning_effort (default)</label>
        <select id="brain-re">
          <option value="">(model default)</option>
          <option value="off">off</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
          <option value="max">max</option>
        </select></div>
      <div class="hint" style="font-weight:600;margin:6px 0 2px">Sampling defaults (Ollama options)</div>
      <div class="row"><label title="Global default generation options merged into every worker call, e.g. {&quot;temperature&quot;:0.7,&quot;top_p&quot;:0.9,&quot;top_k&quot;:40}. A persona's sampling_options override these; a client's explicit options override both. Empty {} = send nothing (each model's own defaults).">sampling_defaults (JSON obj)</label>
        <input id="brain-samp" size="70" value="{}" placeholder='{"temperature": 0.7, "top_p": 0.9, "top_k": 40, "repeat_penalty": 1.1}'>
        <button class="act primary" id="save-global">Save global settings</button></div>
    </div>
    <div class="card">
      <h2 style="margin-top:0" title="Foundry-MCP: re-expose Foundry's own connected MCP tools as a single Streamable-HTTP MCP server. Point AnythingLLM (or any MCP client) at it so it gains ALL of Foundry's tools alongside its own local MCP servers. The client owns the tool loop; Foundry executes the calls.">Foundry-MCP aggregator</h2>
      <div class="hint">Expose Foundry's MCP tools to an external MCP client (AnythingLLM, Cline). The endpoints live on Foundry's own server port (path-based) — no separate port to open. Changing these requires a restart to (re)mount endpoints.</div>
      <div class="row"><label>enabled</label><input type="checkbox" id="agg-en">
        <label title="Shared secret the client must send in the header below. Empty = no auth (trusted LAN only).">token</label>
        <input id="agg-token" size="20" placeholder="(unchanged)">
        <label title="Header the client sends the token in. AnythingLLM & Cline support custom headers.">header</label>
        <input id="agg-hdr" size="12" value="X-API-KEY"></div>
      <div class="row"><label title="Base path of the all-tools endpoint on Foundry's server port. Profiles are served under {base}/p/{name}. Default /mcp.">base_path</label>
        <input id="agg-base" size="12" value="/mcp">
        <label title="Externally reachable base URL of THIS Foundry, used to fill in the example client configs below (e.g. http://192.168.1.50:8080 or https://foundry.mydomain). Leave blank to use the configured server host:port.">public base URL</label>
        <input id="agg-url" size="34" placeholder="http://192.168.1.50:8080 (blank = server host:port)"></div>
      <div class="row"><label title="Profiles = curated tool subsets ('MCP personas'), each served at {base}/p/{name}. JSON object: profile name -> list of MCP server names. The base endpoint always exposes them all.">profiles (JSON obj)</label>
        <input id="agg-profiles" size="60" value="{}" placeholder='{"music": ["acestep-music"], "voice": ["kokoro-tts","chatterbox-tts"]}'>
        <label title="Keep-alive for long tool calls (music/audio generation). 0 = off (single JSON reply). >0 = endpoints stream (SSE) and emit a progress notification every N seconds while a tool runs, so the client sees 'still working…' and the connection never idles out. Needs a client that sends a progressToken (e.g. 20). Changing this needs a restart.">heartbeat (s)</label>
        <input id="agg-hb" type="number" min="0" step="5" size="6" value="0" style="width:70px">
        <label title="Poll guard: after this many identical (same tool + same args) calls within ~2 minutes, the aggregator stops executing them and returns a 'stop polling' message to the client. Defends against a client agent (AnythingLLM/Cline) tight-polling a status tool (e.g. check_music_job) to its own tool-call limit while a job is still running. 0 = off. Applies immediately, no restart.">poll guard</label>
        <input id="agg-pg" type="number" min="0" step="1" value="4" style="width:60px"></div>
      <div class="row"><button class="act primary" id="save-agg">Save aggregator</button>
        <button class="act" id="restart-foundry" title="Terminate and restart Foundry so endpoint changes take effect. Requires a supervisor (Docker restart policy / systemd) to bring it back.">↻ Restart Foundry</button>
        <span id="agg-restart" class="hint"></span></div>
      <div id="agg-endpoints" class="hint" style="margin-top:8px"></div>
      <div class="hint" style="margin-top:8px"><b>Active now</b> (models generating · tools running · loaded in VRAM):</div>
      <div id="activity-now" class="hint">…</div>
      <div class="row" style="gap:16px;align-items:flex-start;margin-top:6px">
        <div style="flex:1;min-width:0">
          <div class="hint">AnythingLLM — paste into <code>anythingllm_mcp_servers.json</code> (storage <code>plugins/</code> dir):
            <button class="act" style="padding:0 6px;font-size:11px" id="copy-allm">copy</button></div>
          <pre id="agg-allm" style="white-space:pre-wrap;font-size:11px;overflow-x:auto"></pre>
        </div>
        <div style="flex:1;min-width:0">
          <div class="hint">Cline — paste into <code>cline_mcp_settings.json</code> (or use "Add Remote Server"):
            <button class="act" style="padding:0 6px;font-size:11px" id="copy-cline">copy</button></div>
          <pre id="agg-cline" style="white-space:pre-wrap;font-size:11px;overflow-x:auto"></pre>
        </div>
      </div>
    </div>`;
  const cfg = await api("config");
  $("#backends-json").value =
    JSON.stringify(cfg.backend_pool.internal.backends, null, 2);
  $("#brain-trl").value = cfg.agent_brain.tool_result_limit_chars;
  $("#brain-mrl").value = cfg.agent_brain.mcp_result_limit_chars;
  $("#brain-wmt").value = cfg.agent_brain.worker_max_tokens;
  $("#brain-uip").value = cfg.agent_brain.user_input_preview_chars;
  $("#brain-hb").value = cfg.agent_brain.heartbeat_seconds;
  $("#brain-ka").value = cfg.agent_brain.worker_keep_alive || "";
  $("#brain-ds").checked = !!cfg.agent_brain.direct_stream;
  $("#brain-dshb").value = cfg.agent_brain.direct_stream_heartbeat_seconds || 0;
  $("#brain-dstall").value = cfg.agent_brain.direct_stream_stall_seconds ?? 900;
  $("#brain-hbvis").value = cfg.agent_brain.heartbeat_visible_seconds ?? 60;
  $("#brain-cguard").value = cfg.agent_brain.context_guard || "trim";
  $("#brain-creserve").value = cfg.agent_brain.context_guard_reserve_tokens || 0;
  $("#brain-csticky").checked = cfg.agent_brain.context_guard_sticky !== false;
  $("#brain-swr").checked = !!cfg.agent_brain.stream_worker_reasoning;
  $("#brain-re").value = (cfg.agent_brain.reasoning_effort === "xhigh" ? "max"
    : cfg.agent_brain.reasoning_effort) || "";
  $("#brain-samp").value = JSON.stringify(cfg.agent_brain.sampling_defaults || {});
  $("#brain-rto").value = (cfg.backend_pool && cfg.backend_pool.request_timeout_seconds) || 900;
  // Foundry-MCP aggregator
  const agg = cfg.mcp_aggregator || {};
  $("#agg-en").checked = !!agg.enabled;
  $("#agg-hdr").value = agg.token_header || "X-API-KEY";
  $("#agg-base").value = agg.base_path || "/mcp";
  $("#agg-url").value = agg.advertise_url || "";
  $("#agg-hb").value = agg.progress_heartbeat_seconds || 0;
  $("#agg-pg").value = agg.poll_guard_threshold != null ? agg.poll_guard_threshold : 4;
  $("#agg-profiles").value = JSON.stringify(agg.profiles || {});
  // Live activity poller — self-cleans when the tab is gone (element removed).
  if (window._actTimer) clearInterval(window._actTimer);
  const renderActivity = async () => {
    const el = $("#activity-now");
    if (!el) { clearInterval(window._actTimer); return; }
    try {
      const a = await api("activity");
      const parts = [];
      (a.models || []).forEach(m => parts.push(
        `<span class="pill ok" title="model generating">▶ ${esc(m.model)} · ${m.seconds}s${m.count > 1 ? " ×" + m.count : ""}</span>`));
      (a.tools || []).forEach(t => parts.push(
        `<span class="pill" title="MCP tool running">⚙ ${esc(t.server)}/${esc(t.tool)} · ${t.seconds}s</span>`));
      const loaded = (a.loaded || []).map(m => esc(m)).join(", ");
      el.innerHTML = (parts.length ? parts.join(" ") : '<span class="hint">idle — nothing running</span>')
        + (loaded ? `<div class="hint" style="margin-top:4px">loaded: ${loaded}</div>` : "");
    } catch (e) { /* tab changed or transient */ }
  };
  window._actTimer = setInterval(renderActivity, 3000);
  renderActivity();
  const renderAgg = async () => {
    try {
      const s = await api("mcp-aggregator");
      const live = (s.endpoints || []).map(e =>
        `<code>${esc(e.path)}/</code> (${e.scope}${e.servers ? ": " + e.servers.join(", ") : ": all"})`);
      const planned = (s.planned_endpoints || []).map(e =>
        `<code>${esc(e.path)}/</code> (${e.scope})`);
      $("#agg-endpoints").innerHTML =
        `<b>Base URL:</b> <code>${esc(s.base_url || "")}</code><br>` +
        (live.length ? "<b>Live now:</b> " + live.join(" · ")
                     : (s.enabled ? "<b>Live now:</b> none yet — restart to mount" : "<i>disabled</i>")) +
        (planned.length ? "<br><b>After restart:</b> " + planned.join(" · ") : "");
      $("#agg-allm").textContent = s.anythingllm_config
        ? JSON.stringify(s.anythingllm_config, null, 2) : "(enable + save first)";
      $("#agg-cline").textContent = s.cline_config
        ? JSON.stringify(s.cline_config, null, 2) : "(enable + save first)";
    } catch (e) { $("#agg-endpoints").textContent = e.message; }
  };
  renderAgg();
  $("#copy-allm").onclick = () => { navigator.clipboard.writeText($("#agg-allm").textContent); toast("Copied AnythingLLM config"); };
  $("#copy-cline").onclick = () => { navigator.clipboard.writeText($("#agg-cline").textContent); toast("Copied Cline config"); };
  $("#save-agg").onclick = async () => {
    let profiles;
    try { profiles = JSON.parse($("#agg-profiles").value || "{}"); }
    catch (e) { return toast("profiles: invalid JSON", true); }
    const body = {enabled: $("#agg-en").checked,
                  token_header: $("#agg-hdr").value.trim() || "X-API-KEY",
                  base_path: $("#agg-base").value.trim() || "/mcp",
                  advertise_url: $("#agg-url").value.trim() || null,
                  progress_heartbeat_seconds: parseInt($("#agg-hb").value, 10) || 0,
                  poll_guard_threshold: parseInt($("#agg-pg").value, 10) || 0,

/* ---------------------------------------------------------------- models -- */
const parseTags = s => { try { const t = JSON.parse(s || "[]"); return Array.isArray(t) ? t : []; } catch (e) { return []; } };
const RESEARCH_PILL = {queued: "warn", running: "warn", ok: "ok", failed: "bad"};

async function tabModels() {
  const d = await api("models");
  window._pickerOptions.tags = [...new Set(["coding", "vision", "tool-calling", "reasoning", "creative-writing",
    "long-context", "embedding"].concat((d.models || []).flatMap(m => parseTags(m.tags))))].sort();
  const isEnabled = m => m.enabled === null || m.enabled === undefined || !!m.enabled;
  const rBtn = m => d.research_ready
    ? `<button class="act" onclick='doResearch(${JSON.stringify(m.id)})'>research</button>`
    : `<button class="act" disabled title="${esc(d.research_reason)}">research</button>`;
  const perfCell = m => {
    const dt = m.eval_tps_avg ? Math.round(m.eval_tps_avg) : 0;
    const pt = m.prompt_tps_avg ? Math.round(m.prompt_tps_avg) : 0;

    if (!dt && !pt && !trunc) return '<span class="hint">—</span>';
    const load = m.cold_load_ms_avg ? ` · ${(m.cold_load_ms_avg / 1000).toFixed(1)}s cold-load` : "";
    const ttft = m.ttft_ms_avg
      ? ` · TTFT ~${m.ttft_ms_avg >= 1000 ? (m.ttft_ms_avg / 1000).toFixed(1) + "s" : Math.round(m.ttft_ms_avg) + "ms"}` : "";
    const last = m.last_eval_tps
      ? ` · last call ${Math.round(m.last_eval_tps)}/${Math.round(m.last_prompt_tps || 0)}` : "";
    const tip = `decode ${dt || "?"} · prefill ${pt || "?"} tok/s `
      + `(rolling avg, ${m.eval_samples || 0} sample(s))${ttft}${load}${last}`
      + (trunc ? ` · ${trunc} TRUNCATED repl${trunc === 1 ? "y" : "ies"} (hit max_tokens — client had to continue)` : "")
      + ` — measured from Ollama eval timing OR llama.cpp timings`;
    const truncBadge = trunc
      ? ` <span class="pill warn" title="${trunc} repl${trunc === 1 ? "y" : "ies"} cut off at max_tokens — the client had to 'continue'. Fix by raising worker_max_tokens or stopping the loop (sampling).">⤾${trunc}</span>` : "";

    <td class="nw">${esc(m.relative_cost_tier ?? "")}</td>
    <td class="nw">${perfCell(m)}</td>
    <td>${esc(parseTags(m.tags).join(", "))}${m.content_policy === "permissive" ? ' <span class="pill warn">permissive</span>' : ""}</td>
    <td>${esc(m.good_for ?? "")}</td>
    <td class="nw">${m.research_status
      ? `<span class="pill ${RESEARCH_PILL[m.research_status] || "warn"}" title="${esc(m.research_note || "")}">${esc(m.research_status)}</span>` : ""}</td>
    <td class="mono nw">${esc(m.source ?? "")}</td>
    <td class="nw"><button class="act" onclick='toggleModel(${JSON.stringify(m.id)}, ${isEnabled(m) ? "false" : "true"})'>
        ${isEnabled(m) ? "disable" : "enable"}</button>
        <button class="act" onclick='editModel(${JSON.stringify(m.id)})'>edit</button>
        ${rBtn(m)}</td>
    </tr>`;
  const header = "<tr><th>model</th><th>tier</th><th title=\"decode / prefill tokens per second — rolling average measured from real calls, backend-agnostic (Ollama eval timing OR llama.cpp timings)\">tok/s (dec/pre)</th><th>tags</th><th>good for</th><th>research</th><th>source</th><th></th></tr>";
  const renderTables = () => {
    const q = ($("#model-search")?.value || "").toLowerCase();
    const match = m => !q ||
      (m.id + " " + (m.tags || "") + " " + (m.good_for || "") + " " +
       (m.relative_cost_tier || "")).toLowerCase().includes(q);
    const live = d.models.filter(m => m.reachable && match(m));
    const known = d.models.filter(m => !m.reachable && match(m));
    $("#live-count").textContent = live.length;
    $("#known-count").textContent = known.length;
    $("#live-table").innerHTML = header + live.map(rowHtml).join("");
    $("#known-table").innerHTML = header + known.map(rowHtml).join("");
  };
  $("#main").innerHTML = `
    <h2>Model Registry</h2>
    <p class="hint">Edits made here are pinned as manual_override — automatic refreshes
    supplement but never replace them (§4.4). Local models are tagged tier
    <b>free</b> automatically at discovery; tags/policy are name-seeded,
    reference-seeded, and research-refined. Disabling a model excludes it from
    the brain's candidates and tools entirely (governance, not capability).${d.research_ready ? "" :
      ` <b>Research is unavailable:</b> ${esc(d.research_reason)}.`}</p>
    <div class="row">
      <input id="model-search" size="34" placeholder="filter by id, tag, tier, good_for…">
      <button class="act primary" onclick="run(api('models/refresh',{method:'POST'}))">Poll OpenRouter now</button>
      <button class="act" title="Fill tags/good_for/estimated scores for known model families (never overwrites manual edits or real research)"
        onclick="api('models/seed',{method:'POST'}).then(r=>{toast('Reference seed applied to '+r.applied+' models');render()}).catch(e=>toast(e.message,true))">Apply reference seed</button>
    </div>
    <h2>Live / Available (<span id="live-count"></span>) — reachable through a configured backend right now</h2>
    <table id="live-table"></table>
    <h2>Known catalog (<span id="known-count"></span>) — discovered but not currently reachable; reference material</h2>
    <table id="known-table"></table>
    <div class="card" id="model-editor" style="display:none">
      <h2 style="margin-top:0">Edit <span id="me-id" class="mono"></span></h2>
      <div class="row"><label>relative_cost_tier</label>
        <select id="me-tier"><option value="">-</option><option>free</option>
        <option>low</option><option>medium</option><option>high</option><option>very_high</option></select>
        <label>content_policy</label>
        <select id="me-policy"><option value="">-</option>
        <option>standard</option><option>permissive</option></select></div>
      <div class="row"><label>tags</label><input id="me-tags" data-multi="csv" data-options="tags"
        placeholder="coding, vision, tool-calling…"></div>
      <div class="row"><label>good_for</label><input id="me-good" size="60"></div>
      <div class="row"><label>reasoning_style</label><input id="me-style" size="60"></div>
      <div class="row"><label>benefits_from_explicit_prompting</label>
        <input type="checkbox" id="me-refine"></div>
      <div class="row"><label>tool-calling reliability</label>
        <span id="me-reliability" class="hint"></span></div>
      <div class="row"><label title="Live benchmark rows. A ⚠ marks two categories sharing the exact same score — the signature of an extractor conflating them; reset to clear it.">benchmark rows</label>
        <span id="me-benchmarks" class="hint">…</span></div>
      <p class="hint" style="margin:0 0 6px">
        Unflagged = passed integrity checks. <span class="pill bad" style="border:1px solid var(--line)">red ⚠</span>
        = demoted by the conflation guard: the same score was written to two or more
        categories in one research pass, so it's treated as synthesized (not a real
        per-category measurement) and its confidence is cut. Hover a pill for its
        source/type/confidence, timestamp, and which category it collided with.</p>
      <div class="row"><label title="Real, named, independently-verifiable benchmarks (SWE-Bench, MMLU, BFCL, ...). Kept separate from the composite; used as an explicit tiebreaker when composite scores are near-equal. percent-scale rows break ties; elo/count/score scales are stored but flagged out of naive comparison. ✎ = manually entered (never overwritten by research); ✕ removes a row.">named benchmarks</label>
        <span id="me-named" class="hint">…</span></div>
      <div class="row"><label title="Add real vendor data the research pipeline hasn't captured yet (e.g. a brand-new source page). Stored as source=manual so a later research pass never clobbers it.">add named benchmark</label>
        <input id="nb-name" placeholder="SWE-Bench Verified" size="18">
        <select id="nb-cat"><option>coding</option><option>reasoning</option><option>general_chat</option><option>tool_calling</option><option>agentic</option></select>
        <input id="nb-score" placeholder="75.6" size="6">
        <select id="nb-scale"><option>percent</option><option>elo</option><option>count</option><option>score</option></select>
        <input id="nb-url" placeholder="https://source" size="16">
        <button class="act" id="nb-add">Add</button></div>
      <div class="row"><button class="act primary" id="me-save">Save (manual override)</button>
        <button class="act" id="me-reset-bench" title="Delete this model's automatic benchmark rows (research/seed/observed; manual overrides kept) and re-apply reference-seed defaults — the fix for a row with a wrong number">Reset scores to seed</button></div>
    </div>`;
  window._models = Object.fromEntries(d.models.map(m => [m.id, m]));
  $("#model-search").addEventListener("input", renderTables);

window.toggleModel = async (id, enable) => {
