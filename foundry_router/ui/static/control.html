<!doctype html>
<!--
  Foundry coordinator control center (/ui/control).
  One static page, vanilla JS, no CDN (works on the LAN without internet).
  Data: /control/api/* behind an HttpOnly operator session (control_api.py).
  Viewing is read-only. Every change goes out as a typed operator action that
  the coordinator process re-validates and applies itself.
  Browser storage holds display preferences and alert ids only: no keys,
  transcripts, drafts or answers.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control center · Foundry</title>
<style>
:root {
  color-scheme: dark;
  --bg:#1e1e1e; --panel:#252526; --panel-2:#2d2d30; --line:#3c3c3c; --line-2:#474747;
  --fg:#d4d4d4; --fg-2:#cccccc; --dim:#9d9d9d; --accent:#3794ff; --focus:#007fd4;
  --ok:#89d185; --bad:#f14c4c; --warn:#cca700; --think:#d7ba7d; --info:#75beff;
  --ok-bg:#1e3a1e; --bad-bg:#4b1818; --warn-bg:#3d3414; --think-bg:#2b2618; --info-bg:#1b2b3d;
  --sel:#264f78; --code-bg:#1a1a1a;
  --syn-kw:#569cd6; --syn-ctl:#c586c0; --syn-str:#ce9178; --syn-num:#b5cea8; --syn-com:#6a9955;
  --syn-fn:#dcdcaa; --syn-type:#4ec9b0; --syn-var:#9cdcfe; --syn-punc:#d4d4d4;
  --ui-font: system-ui, "Segoe UI", -apple-system, sans-serif;
  --code-font: "Cascadia Code", "Cascadia Mono", Consolas, "Courier New", monospace;
  --fs: 13px; --lh: 1.5; --pad: 8px;
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg:#ffffff; --panel:#f3f3f3; --panel-2:#e8e8e8; --line:#d4d4d4; --line-2:#c4c4c4;
  --fg:#1f1f1f; --fg-2:#333; --dim:#616161; --accent:#005fb8; --focus:#0066bf;
  --ok:#2e7d32; --bad:#c62828; --warn:#8a6d00; --think:#795e26; --info:#0b62a8;
  --ok-bg:#e6f4e6; --bad-bg:#fde7e7; --warn-bg:#fff6d5; --think-bg:#faf3e3; --info-bg:#e5f0fb;
  --sel:#add6ff; --code-bg:#f7f7f7;
  --syn-kw:#0000ff; --syn-ctl:#af00db; --syn-str:#a31515; --syn-num:#098658; --syn-com:#008000;
  --syn-fn:#795e26; --syn-type:#267f99; --syn-var:#001080; --syn-punc:#1f1f1f;
}
:root[data-theme="hc"] {
  color-scheme: dark;
  --bg:#000; --panel:#0a0a0a; --panel-2:#111; --line:#6fc3df; --line-2:#6fc3df;
  --fg:#fff; --fg-2:#fff; --dim:#d0d0d0; --accent:#f38518; --focus:#f38518;
  --ok:#7cfc00; --bad:#ff5f5f; --warn:#ffd700; --think:#ffd27f; --info:#7fd7ff;
  --ok-bg:#002200; --bad-bg:#330000; --warn-bg:#332b00; --think-bg:#2b2000; --info-bg:#001a33;
  --sel:#f38518; --code-bg:#000;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:var(--fs)/var(--lh) var(--ui-font);
       display:flex; flex-direction:column; overflow:hidden; }
body.compact { --pad: 5px; }
::selection { background:var(--sel); }
button, select, input, textarea { font:inherit; color:inherit; }
button { background:var(--panel-2); border:1px solid var(--line-2); border-radius:3px; padding:3px 9px;
         cursor:pointer; color:var(--fg); }
button:hover { border-color:var(--accent); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.danger { border-color:var(--bad); color:var(--bad); }
button.ghost { background:none; border-color:transparent; }
button.ghost:hover { border-color:var(--line-2); }
button:disabled { opacity:.5; cursor:not-allowed; }
:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
select, input[type=text], input[type=search], input[type=number], input[type=password], input[type=time], textarea {
  background:var(--bg); border:1px solid var(--line-2); border-radius:3px; padding:3px 6px; }
textarea { resize:vertical; width:100%; font-family:var(--code-font); font-size:calc(var(--fs) - 0.5px); }
code, pre, .mono { font-family:var(--code-font); font-size:calc(var(--fs) - 1px); }
a { color:var(--accent); }
.dim { color:var(--dim); } .nw { white-space:nowrap; } .spacer { flex:1; }
.pill { display:inline-block; padding:0 7px; border-radius:9px; font-size:11px; line-height:18px;
        border:1px solid var(--line-2); white-space:nowrap; vertical-align:middle; }
.pill.ok { color:var(--ok); border-color:var(--ok); background:var(--ok-bg); }
.pill.bad { color:var(--bad); border-color:var(--bad); background:var(--bad-bg); }
.pill.warn { color:var(--warn); border-color:var(--warn); background:var(--warn-bg); }
.pill.info { color:var(--info); border-color:var(--info); background:var(--info-bg); }
.pill.think { color:var(--think); border-color:var(--think); background:var(--think-bg); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------------------------------------------------------------- header */
header { display:flex; align-items:center; gap:8px; padding:5px 10px; background:var(--panel);
         border-bottom:1px solid var(--line); flex-wrap:wrap; min-height:38px; }
header .brand { font-weight:600; color:var(--accent); white-space:nowrap; }
header .grp { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
#conn { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
#bell { position:relative; }
#bell .count { position:absolute; top:-6px; right:-6px; min-width:16px; height:16px; border-radius:8px;
               background:var(--bad); color:#fff; font-size:10px; line-height:16px; text-align:center; padding:0 3px; }
#bell.critical { border-color:var(--bad); animation:pulse 1.6s infinite; }
@keyframes pulse { 50% { box-shadow:0 0 0 3px var(--bad-bg); } }
body.chrome-hidden header, body.chrome-hidden #banner, body.chrome-hidden #composer { display:none; }

#banner { display:none; padding:5px 10px; background:var(--info-bg); border-bottom:1px solid var(--line);
          gap:8px; align-items:center; flex-wrap:wrap; }
#banner.show { display:flex; }
#banner.warn { background:var(--warn-bg); }

/* ---------------------------------------------------------------- workspace */
#workspace { flex:1; min-height:0; display:grid; overflow:hidden; }
.resizer { background:var(--line); touch-action:none; position:relative; z-index:2; }
.resizer.col { cursor:col-resize; width:5px; }
.resizer.row { cursor:row-resize; height:5px; }
.resizer:hover, .resizer:focus-visible, .resizer.drag { background:var(--accent); }
.pane { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg);
        border-right:1px solid var(--line); }
.pane.focused .pane-head { box-shadow:inset 0 -2px 0 var(--accent); }
.pane-head { display:flex; align-items:center; gap:6px; padding:4px 8px; background:var(--panel);
             border-bottom:1px solid var(--line); flex-wrap:wrap; min-height:32px; }
.pane-head .title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40ch; }
.pane-head .sid { color:var(--dim); }
.live-ind { font-size:11px; font-weight:600; letter-spacing:.04em; }
.live-ind.live { color:var(--ok); } .live-ind.pinned { color:var(--warn); }
.transcript { flex:1; overflow:auto; padding:6px 10px 40px; overflow-anchor:none; position:relative; }
.resume-live { position:absolute; right:18px; bottom:14px; z-index:5; display:none;
               box-shadow:0 2px 8px rgba(0,0,0,.5); }
.resume-live.show { display:block; }
.pane-body { position:relative; flex:1; min-height:0; display:flex; flex-direction:column; }
.pane-note { padding:4px 10px; background:var(--info-bg); border-bottom:1px solid var(--line); font-size:12px; display:none; }
.pane-note.show { display:block; }

.msg { margin:8px 0 12px; }
.msg-head { display:flex; gap:8px; align-items:baseline; color:var(--dim); font-size:11.5px;
            border-bottom:1px solid var(--line); padding-bottom:2px; margin-bottom:4px; flex-wrap:wrap; }
.msg-head .who { color:var(--fg-2); font-weight:600; text-transform:uppercase; letter-spacing:.04em; font-size:11px; }
.msg.user .msg-head .who { color:var(--info); }
.msg.assistant .msg-head .who { color:var(--ok); }
.md { overflow-wrap:anywhere; }
.md p { margin:4px 0; } .md h1,.md h2,.md h3,.md h4 { margin:8px 0 4px; font-size:1.05em; }
.md ul, .md ol { margin:4px 0; padding-left:22px; }
.md blockquote { margin:4px 0; padding-left:10px; border-left:3px solid var(--line-2); color:var(--dim); }
.md table { border-collapse:collapse; margin:4px 0; display:block; overflow-x:auto; }
.md td, .md th { border:1px solid var(--line-2); padding:2px 6px; }
.md code { background:var(--panel-2); padding:0 3px; border-radius:3px; }
pre.code { background:var(--code-bg); border:1px solid var(--line); border-radius:4px; padding:6px 8px;
           margin:4px 0; overflow:auto; white-space:pre; tab-size:4; max-width:100%; }
body.wrap pre.code { white-space:pre-wrap; overflow-wrap:anywhere; }
pre.code.clip { max-height:calc(var(--long-lines, 14) * 1.45em + 12px); overflow:hidden; position:relative; }
.syn-kw { color:var(--syn-kw); } .syn-ctl { color:var(--syn-ctl); } .syn-str { color:var(--syn-str); }
.syn-num { color:var(--syn-num); } .syn-com { color:var(--syn-com); font-style:italic; }
.syn-fn { color:var(--syn-fn); } .syn-type { color:var(--syn-type); } .syn-key { color:var(--syn-var); }

.card { border:1px solid var(--line); border-left:3px solid var(--line-2); border-radius:4px; margin:5px 0;
        background:var(--panel); min-width:0; }
.card-head { display:flex; gap:6px; align-items:center; padding:3px 8px; cursor:pointer; flex-wrap:wrap;
             user-select:none; }
.card-head .chev { width:12px; display:inline-block; transition:transform .1s; color:var(--dim); }
.card.open > .card-head .chev { transform:rotate(90deg); }
.card-body { display:none; padding:4px 8px 6px; border-top:1px solid var(--line); min-width:0; }
.card.open > .card-body { display:block; }
.card .sub { color:var(--dim); font-size:11px; margin-top:4px; text-transform:uppercase; letter-spacing:.05em; }
.card.tool { border-left-color:var(--info); }
.card.tool.st-running, .card.tool.st-pending { border-left-color:var(--warn); }
.card.tool.st-completed { border-left-color:var(--ok); }
.card.tool.st-error { border-left-color:var(--bad); }
.card.think { border-left-color:var(--think); background:var(--think-bg); }
.card.think .card-head { color:var(--think); }
.card.think .md { color:var(--fg-2); }
.card.err { border-left-color:var(--bad); background:var(--bad-bg); }
.card.warnc { border-left-color:var(--warn); background:var(--warn-bg); }
.tool-name { font-family:var(--code-font); font-weight:600; color:var(--syn-fn); }
.tool-title { color:var(--fg-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60ch; }
.ts { color:var(--dim); font-size:11px; }
.divider { text-align:center; color:var(--dim); font-size:11px; margin:8px 0; border-top:1px dashed var(--line-2); }
.diag { color:var(--dim); font-size:11px; font-family:var(--code-font); }
.chip { display:inline-block; border:1px solid var(--line-2); border-radius:3px; padding:0 5px; margin:2px; font-size:11px; }
.notprov { color:var(--dim); font-size:11px; font-style:italic; margin:2px 0; }
.hit { outline:2px solid var(--warn); }

/* ---------------------------------------------------------------- inspector */
#inspector { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--panel); overflow:auto; }
#inspector .ihead { display:flex; gap:6px; align-items:center; padding:5px 8px; border-bottom:1px solid var(--line);
                    position:sticky; top:0; background:var(--panel); z-index:3; }
.sec { border-bottom:1px solid var(--line); }
.sec-head { display:flex; align-items:center; gap:4px; padding:4px 8px; cursor:pointer; user-select:none;
            font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--fg-2); }
.sec-head .chev { width:12px; color:var(--dim); transition:transform .1s; display:inline-block; }
.sec:not(.collapsed) .sec-head .chev { transform:rotate(90deg); }
.sec-head .tools { margin-left:auto; display:flex; gap:2px; }
.sec-head .tools button { padding:0 5px; font-size:11px; }
.sec-body { padding:4px 10px 8px; font-size:12.5px; }
.sec.collapsed .sec-body { display:none; }
.kv { display:grid; grid-template-columns:minmax(90px, max-content) 1fr; gap:1px 8px; }
.kv > div:nth-child(odd) { color:var(--dim); }
.kv > div { min-width:0; overflow-wrap:anywhere; }
.src { color:var(--dim); font-size:10.5px; font-style:italic; }
.bar { height:10px; background:var(--panel-2); border:1px solid var(--line-2); border-radius:3px; position:relative; overflow:hidden; margin:3px 0; }
.bar > i { position:absolute; left:0; top:0; bottom:0; background:var(--accent); }
.bar > i.reserve { background:var(--warn); opacity:.55; }
.bar > b { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--think); }
.warnbox { border:1px solid var(--warn); background:var(--warn-bg); padding:3px 6px; border-radius:3px; margin:4px 0; font-size:12px; }
.errbox { border:1px solid var(--bad); background:var(--bad-bg); padding:3px 6px; border-radius:3px; margin:4px 0; font-size:12px; }
.list { list-style:none; margin:0; padding:0; }
.list li { padding:3px 0; border-bottom:1px solid var(--line); }
.tree li { padding:2px 0; }
.tree .node { display:flex; gap:5px; align-items:center; flex-wrap:wrap; cursor:pointer; }
.tree .node:hover { background:var(--panel-2); }
.tree .node.cur { background:var(--sel); }
.tree ul { list-style:none; margin:0 0 0 14px; padding:0; border-left:1px dashed var(--line-2); }
table.t { border-collapse:collapse; width:100%; font-size:12px; }
table.t td, table.t th { border-bottom:1px solid var(--line); padding:2px 4px; text-align:left; vertical-align:top; }
table.t th { color:var(--dim); font-weight:normal; }

/* ---------------------------------------------------------------- composer */
#composer { border-top:1px solid var(--line); background:var(--panel); padding:5px 10px 7px; max-height:34vh;
            overflow:auto; flex:none; }
#composer.collapsed .cbody { display:none; }
#composer .ctabs { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
#composer .ctabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
#composer .target { font-size:12px; margin:4px 0; }
#composer textarea { min-height:64px; }
#composer .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:4px 0; }
.qcard { border:1px solid var(--warn); background:var(--warn-bg); border-radius:4px; padding:6px 8px; margin:4px 0; }
.qcard .qtext { font-weight:600; white-space:pre-wrap; margin:2px 0 4px; }
.opts label { display:block; padding:1px 0; }
.timeline { display:flex; gap:4px; flex-wrap:wrap; align-items:center; font-size:11.5px; margin-top:4px; }
.timeline .step { opacity:.4; } .timeline .step.done { opacity:1; }
.palette li { padding:4px 6px; cursor:pointer; border-radius:3px; }
.palette li.sel, .palette li:hover { background:var(--sel); }

/* ---------------------------------------------------------------- graph */
#graphPanel { background:var(--panel); border-top:1px solid var(--line); min-height:0; display:flex; flex-direction:column; }
#graphPanel .ghead { display:flex; gap:6px; align-items:center; padding:3px 8px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
#graphPanel .gbody { flex:1; min-height:0; overflow:auto; position:relative; }
#graph svg { width:100%; height:100%; display:block; cursor:grab; }
.gnode rect { fill:var(--panel-2); stroke:var(--line-2); rx:4; }
.gnode text { fill:var(--fg); font-size:11px; font-family:var(--ui-font); }
.gnode.k-coordinator rect { stroke:var(--accent); } .gnode.k-session rect { stroke:var(--info); }
.gnode.k-mcp rect { stroke:var(--syn-ctl); } .gnode.k-media_job rect { stroke:var(--syn-type); }
.gnode.k-model rect { stroke:var(--ok); }
.gedge { fill:none; stroke-width:1.6; stroke:var(--line-2); cursor:pointer; }
.gedge.completed { stroke:var(--dim); } .gedge.failed { stroke:var(--bad); stroke-dasharray:4 3; }
.gedge.fallback { stroke:var(--warn); } .gedge.queued { stroke:var(--info); stroke-dasharray:2 3; }
.gedge.stale { stroke:var(--line); stroke-dasharray:1 4; }
.gedge.active { stroke:var(--ok); stroke-width:2.6; stroke-dasharray:6 4; }
body.anim .gedge.active { animation:flow 0.9s linear infinite; }
.gedge.kind-tool { stroke-dasharray:3 2; }
@keyframes flow { to { stroke-dashoffset:-20; } }

/* ---------------------------------------------------------------- drawers & dialogs */
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px, 100vw); background:var(--panel);
          border-left:1px solid var(--line-2); z-index:40; display:none; flex-direction:column;
          box-shadow:-4px 0 18px rgba(0,0,0,.45); }
.drawer.open { display:flex; }
.drawer .dhead { display:flex; gap:6px; align-items:center; padding:7px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.drawer .dbody { flex:1; overflow:auto; padding:8px 10px; }
.alert { border:1px solid var(--line-2); border-left:4px solid var(--line-2); border-radius:4px; padding:5px 8px; margin:6px 0; }
.alert.sev-critical { border-left-color:var(--bad); } .alert.sev-high { border-left-color:var(--warn); }
.alert.sev-info { border-left-color:var(--info); } .alert.sev-warning { border-left-color:var(--warn); }
.alert.st-new { background:var(--panel-2); }
.alert .atitle { font-weight:600; }
dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line-2); border-radius:6px; padding:0;
         width:min(880px, 96vw); max-height:92vh; }
dialog::backdrop { background:rgba(0,0,0,.55); }
dialog .dlg-head { display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); }
dialog .dlg-body { padding:8px 12px 14px; overflow:auto; max-height:calc(92vh - 50px); }
fieldset { border:1px solid var(--line); border-radius:4px; margin:8px 0; padding:4px 10px 8px; }
legend { color:var(--accent); font-weight:600; padding:0 4px; }
.setting { display:grid; grid-template-columns:minmax(150px, 230px) 1fr; gap:8px; align-items:center; padding:3px 0; }
.setting .help { grid-column:2; color:var(--dim); font-size:11.5px; margin-top:-2px; }
#toasts { position:fixed; right:12px; bottom:12px; z-index:60; display:flex; flex-direction:column; gap:6px; max-width:min(420px, 92vw); }
.toast { background:var(--panel-2); border:1px solid var(--line-2); border-left:4px solid var(--accent); border-radius:4px;
         padding:6px 10px; box-shadow:0 2px 10px rgba(0,0,0,.5); }
.toast.bad { border-left-color:var(--bad); } .toast.warn { border-left-color:var(--warn); }
#login { position:fixed; inset:0; background:var(--bg); z-index:80; display:none; align-items:center; justify-content:center; padding:16px; }
#login.show { display:flex; }
#login .box { background:var(--panel); border:1px solid var(--line-2); border-radius:6px; padding:18px; width:min(460px, 100%); }
#narrowTabs { display:none; }

/* ---------------------------------------------------------------- narrow */
@media (max-width: 760px) {
  #narrowTabs { display:flex; gap:2px; border-top:1px solid var(--line); background:var(--panel); flex:none; }
  #narrowTabs button { flex:1; border-radius:0; }
  #narrowTabs button.on { background:var(--accent); color:#fff; }
  header .hide-narrow { display:none; }
  .pane-head .title { max-width:22ch; }
}
@media (prefers-reduced-motion: reduce) { body.anim-auto .gedge.active { animation:none; } #bell.critical { animation:none; } }
body.noanim * { animation:none !important; transition:none !important; }
</style>
</head>
<body class="anim">
<div id="login" role="dialog" aria-modal="true" aria-labelledby="login-h">
  <div class="box">
    <h2 id="login-h" style="margin-top:0;color:var(--accent)">Coordinator control center</h2>
    <p class="dim">Sign in with a Foundry client key that has the <b>operator</b> (or admin) scope.
      Foundry turns it into a short HttpOnly session; this page never stores the key.</p>
    <form id="login-form" autocomplete="off">
      <label for="login-key">Operator key</label>
      <input id="login-key" type="password" style="width:100%;margin:6px 0" autocomplete="off" spellcheck="false">
      <div style="display:flex;gap:8px;align-items:center"><button class="primary" type="submit">Sign in</button>
        <span id="login-msg" class="dim"></span></div>
    </form>
    <p class="dim" style="font-size:11.5px">Make one in Foundry → Setup → Clients &amp; keys (preset “operator”).</p>
  </div>
</div>

<header>
  <span class="brand">Control center</span>
  <div class="grp">
    <label class="sr" for="sel-project">Project</label><select id="sel-project" title="Project"></select>
    <label class="sr" for="sel-task">Task</label><select id="sel-task" title="Task"></select>
    <span id="task-state"></span>
  </div>
  <div class="grp">
    <label title="Follow the coordinator: the main pane switches to the task's current implementation, repair or closeout session when it changes (unless you pinned a session)"><input type="checkbox" id="follow"> Follow coordinator</label>
  </div>
  <span class="spacer"></span>
  <div id="conn" aria-live="polite"></div>
  <div class="grp">
    <button id="bell" title="Action required (inbox)" aria-label="Action required inbox">🔔 <span class="count" id="bell-count" hidden>0</span></button>
    <button id="sound-btn" title="Sound alerts"></button>
    <select id="layout-preset" title="Layout preset" class="hide-narrow">

<script>
"use strict";
/* ======================================================================== basics */
const $ = (s, r = document) => r.querySelector(s);

/* ======================================================================== preferences */
// Display preferences only (per browser, per layout preset). Never keys,
// transcripts, drafts or answers. Version-migrated; Reset restores defaults.
const PREF_KEY = "fr.cc.prefs";
const PREF_VERSION = 2;
const SECTIONS = ["identity", "context", "tokens", "speed", "routes", "mcp", "todo", "helpers",

const SECTION_TITLES = {identity: "Identity & state", context: "Context", tokens: "Tokens", speed: "Speed & latency",
  routes: "Models & routes", mcp: "MCP servers", todo: "To-do", helpers: "Helpers", verification: "Verification",
  capabilities: "Other capabilities", sessions: "Sessions & history", search: "Search", actions: "Operator actions"};
const DEFAULT_PREFS = {
  v: PREF_VERSION,
  theme: "dark", fontSize: 13, lineHeight: 1.5, codeWrap: false, density: "comfortable",
  tz: "America/Chicago", tsFormat: "time", showTimestamps: true,
  showThinking: true, thinkingDefault: "collapsed", showToolArgs: true, showToolResults: true,
  showAssistantText: true, showApprovals: true, showDiagnostics: false, collapseCompleted: true,
  collapseLong: true, longLines: 14, exportThinking: false,
  followCoordinator: true, followScroll: true, historyPageSize: 200,
  events: {text: true, reasoning: true, tool: true, retry: true, compaction: true, file: true, step: false, agent: true},
  sidebar: {order: SECTIONS.slice(), hidden: [], collapsed: ["search", "capabilities", "actions"]},
  showDisabledMcp: true, showTokenDetails: true, showTiming: true, showTodo: true, showCapabilities: true, showHelpers: true,
  graph: true, graphVertical: "auto", routeAnimation: true, reducedMotion: "system",

          quiet: false, quietStart: "22:00", quietEnd: "07:00"},
  layout: {preset: "auto",
           presets: {portrait: {inspectorW: 330, inspectorPos: "side", graphH: 200, helperW: 420, helpers: 0},
                     landscape: {inspectorW: 380, inspectorPos: "side", graphH: 170, helperW: 520, helpers: 1},
                     focus: {inspectorW: 0, inspectorPos: "hidden", graphH: 0, helperW: 0, helpers: 0},
                     helpers: {inspectorW: 330, inspectorPos: "side", graphH: 0, helperW: 520, helpers: 2},

function deepMerge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over.slice() : base.slice();

    return out;

}
function migratePrefs(raw) {

           layout: {presets: {landscape: {inspectorW: raw.inspectorWidth || 380}}}};
  }
  const out = deepMerge(DEFAULT_PREFS, raw);
  const known = new Set(SECTIONS);
  out.sidebar.order = out.sidebar.order.filter(s => known.has(s));
  for (const s of SECTIONS) if (!out.sidebar.order.includes(s)) out.sidebar.order.push(s);

}
function loadPrefs() {
  try { return migratePrefs(JSON.parse(localStorage.getItem(PREF_KEY) || "null")); }
  catch (e) { return migratePrefs(null); }
}
let P = loadPrefs();
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(P)); } catch (e) {} }
function getPath(o, path) { return path.split(".").reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, path, v) { const ks = path.split("."); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; }

/* ======================================================================== time */
function tsText(ts, mode) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  mode = mode || P.tsFormat;
  if (mode === "relative") return relAge(Date.now() / 1000 - ts) + " ago";
  const o = {timeZone: P.tz || undefined, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false};
  if (mode === "datetime") Object.assign(o, {year: "numeric", month: "2-digit", day: "2-digit"});

function fullTs(ts) { return ts ? tsText(ts, "datetime") + " " + tzLabel() : ""; }
function tzLabel() {

  catch (e) { return ""; }
}
function relAge(s) { s = Math.max(0, s); if (s < 60) return Math.round(s) + "s"; if (s < 3600) return Math.round(s / 60) + "m"; if (s < 86400) return (s / 3600).toFixed(1) + "h"; return (s / 86400).toFixed(1) + "d"; }
function nowS() { return Date.now() / 1000; }

/*md-start*/
/* ======================================================================== markdown + highlight */
// Safe by construction: every input character is HTML-escaped first; markup
// is produced only by these rules. Links: http(s)/mailto only, opened with
// noopener. No raw HTML from the model or a tool is ever interpreted.
const KW = {
  common: "if else elif for while do return break continue function def class const let var local then end in not and or is new import from export as try catch except finally throw raise with yield await async switch case default nil null None true false True False self this typeof instanceof repeat until goto pass lambda struct enum interface type public private protected static fn mut use match where impl trait pub mod",
};
const KWSET = new Set(KW.common.split(" "));
const CTL = new Set("if else elif for while do return break continue then end try catch except finally throw raise switch case default repeat until goto match yield await".split(" "));
function highlight(code, lang) {
  lang = (lang || "").toLowerCase();
  const e = esc(code);
  if (lang === "json" || (!lang && /^\s*[\[{]/.test(code) && code.length < 200000)) {
    return e.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|(-?\b\d+(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|\b(true|false|null)\b/g,
      (m, s, colon, n, lit) => s ? (colon ? `<span class="syn-key">${s}</span>${colon}` : `<span class="syn-str">${s}</span>`)
        : n ? `<span class="syn-num">${n}</span>` : `<span class="syn-kw">${lit}</span>`);
  }
  if (["", "text", "txt", "log", "output", "diff"].includes(lang) && lang !== "diff") return e;
  const comment = ["lua", "luau", "sql"].includes(lang) ? "--[^\\n]*" : ["py", "python", "sh", "bash", "shell", "ps1", "powershell", "toml", "yaml", "yml", "rb", "ruby"].includes(lang) ? "#[^\\n]*" : "\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/";
  if (lang === "diff") return e.split("\n").map(l => l.startsWith("+") ? `<span class="syn-str" style="color:var(--ok)">${l}</span>` : l.startsWith("-") ? `<span style="color:var(--bad)">${l}</span>` : l.startsWith("@@") ? `<span class="syn-type">${l}</span>` : l).join("\n");
  const re = new RegExp(`(${comment})|(&quot;(?:\\\\.|[^&\\\\]|&(?!quot;))*?&quot;|&#39;(?:\\\\.|[^&\\\\]|&(?!#39;))*?&#39;|\`[^\`]*\`)|(\\b\\d+(?:\\.\\d+)?\\b)|(\\b[A-Za-z_][A-Za-z0-9_]*\\b)(\\s*\\()?`, "g");
  return e.replace(re, (m, com, str, n, word, paren) => {
    if (com) return `<span class="syn-com">${com}</span>`;
    if (str) return `<span class="syn-str">${str}</span>`;
    if (n) return `<span class="syn-num">${n}</span>`;

  });
}
function mdInline(s) {

  s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>").replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");

function md(text) {
  const src = String(text ?? "").replace(/\r\n?/g, "\n");

  const flushPara = () => { if (para.length) { out.push("<p>" + mdInline(esc(para.join("\n"))).replace(/\n/g, "<br>") + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.t}>` + list.items.map(x => "<li>" + mdInline(esc(x)) + "</li>").join("") + `</${list.t}>`); list = null; } };

    const l = lines[i];
    const fence = l.match(/^\s*(```+|~~~+)\s*([\w+#.-]*)/);

      i++;

    }

/*md-end*/

/* ======================================================================== state */
const S = {

  tasks: new Map(),       // "p/t" -> task row
  sessions: new Map(),    // sid -> session row
  details: new Map(),     // sid -> detail (foundry facts, persona, config) fetched on demand
  messages: new Map(),    // sid -> Map(mid -> msg)
  parts: new Map(),       // sid -> Map(pid -> part)
  older: new Map(),       // sid -> has older pages
  pending: new Map(), alerts: new Map(), actions: new Map(), transitions: new Map(), snapshots: new Map(),
  sources: [], project: "", task: "", panes: [], focused: "main",
  conn: {stream: "connecting", lastEvent: 0, attempt: 0}, unseen: 0, idem: {}, lastAction: null,
  composerMode: "instruction", selectedRequest: "", narrow: "transcript", graph: null,
};
function taskKey(p, t) { return `${p}/${t}`; }
function curTask() { return S.tasks.get(taskKey(S.project, S.task)); }
function tdata(t) { return (t && t.data) || {}; }

/* ======================================================================== api */
async function api(path, opts = {}) {
  const o = {method: opts.method || "GET", credentials: "same-origin", headers: {"accept": "application/json"}};
  if (opts.body !== undefined) { o.body = JSON.stringify(opts.body); o.headers["content-type"] = "application/json"; }
  if (o.method !== "GET") o.headers["x-foundry-csrf"] = S.csrf;
  let r;
  try { r = await fetch("/control/api/" + path, o); }
  catch (e) { setConn("foundry", "unreachable"); const err = new Error("Foundry unreachable (network)"); err.network = true; throw err; }
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && data.code === "login_required") { showLogin(); }
  if (!r.ok) { const err = new Error(data.error || ("HTTP " + r.status)); err.status = r.status; err.code = data.code; err.data = data; throw err; }
  return data;
}

/* ======================================================================== login */
function showLogin(msg) { $("#login").classList.add("show"); $("#login-msg").textContent = msg || ""; $("#login-key").focus(); }
$("#login-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const key = $("#login-key").value.trim();
  $("#login-key").value = "";
  try {
    const r = await fetch("/control/api/login", {method: "POST", credentials: "same-origin",
      headers: {"content-type": "application/json"}, body: JSON.stringify({key})});
    const d = await r.json();
    if (!r.ok) return showLogin(d.error || "refused");
    S.csrf = d.csrf; S.me = d;
    $("#login").classList.remove("show");
    boot();
  } catch (e) { showLogin("Foundry unreachable"); }
});
$("#btn-logout").onclick = async () => { try { await api("logout", {method: "POST", body: {}}); } catch (e) {} location.reload(); };

/* ======================================================================== toasts */
function toast(html, cls = "", ms = 6000) {
  const d = document.createElement("div");
  d.className = "toast " + cls; d.innerHTML = html; d.setAttribute("role", "status");
  $("#toasts").appendChild(d);
  if (ms) setTimeout(() => d.remove(), ms);
  return d;
}

/* ======================================================================== apply display prefs */
function applyDisplay() {
  const root = document.documentElement;
  root.dataset.theme = P.theme;
  root.style.setProperty("--fs", P.fontSize + "px");
  root.style.setProperty("--lh", P.lineHeight);
  root.style.setProperty("--long-lines", P.longLines);
  document.body.classList.toggle("compact", P.density === "compact");
  document.body.classList.toggle("wrap", !!P.codeWrap);
  const reduce = P.reducedMotion === "on" || (P.reducedMotion === "system" && matchMedia("(prefers-reduced-motion: reduce)").matches);
  document.body.classList.toggle("anim", !!P.routeAnimation && !reduce);
  document.body.classList.toggle("noanim", reduce);

/* ======================================================================== connection */
const CONN = {foundry: "ok"};
function setConn(k, v) { CONN[k] = v; renderConn(); }
function sourceState() {
  const src = S.sources || [];
  const bridge = src.filter(s => s.kind === "bridge");
  const coord = src.filter(s => s.kind === "coordinator");
  return {bridge, coord};
}
function renderConn() {
  const parts = [];
  const st = S.conn.stream;
  const age = S.conn.lastEvent ? nowS() - S.conn.lastEvent : null;
  let cls = st === "live" ? "ok" : st === "reconnecting" ? "warn" : "bad";
  let label = st === "live" ? "Live" : st === "reconnecting" ? `Reconnecting (try ${S.conn.attempt})` : st === "offline" ? "Foundry unreachable" : st;
  if (st === "live" && age !== null && age > P.staleAfterS) { cls = "warn"; label = "Stream quiet " + relAge(age); }
  parts.push(`<span class="pill ${cls}" title="Browser ↔ Foundry event stream. Last event ${S.conn.lastEvent ? fullTs(S.conn.lastEvent) : "never"}">${esc(label)}</span>`);
  const {bridge, coord} = sourceState();
  if (!bridge.length) parts.push(`<span class="pill warn" title="No workstation telemetry bridge has reported to Foundry yet (python -m foundry_coordinator bridge)">bridge: never seen</span>`);
  for (const b of bridge) {
    const k = (b.detail || {}).kilo || {};
    parts.push(`<span class="pill ${b.fresh ? "ok" : "bad"}" title="${esc(b.source_id)} last heartbeat ${esc(fullTs(b.last_seen))} (expiry ${b.expiry_s}s). Event stream: ${esc(JSON.stringify((b.detail || {}).event_stream || {}))}">bridge ${b.fresh ? relAge(b.age_s) : "STALE " + relAge(b.age_s)}</span>`);
    parts.push(`<span class="pill ${k.ok === false ? "bad" : k.ok ? "ok" : ""}" title="Kilo API as seen by the bridge${k.error ? ": " + esc(k.error) : ""}${k.version ? " · version " + esc(k.version) : ""}">kilo ${k.ok === false ? "down" : k.ok ? "ok" : "?"}</span>`);
    const own = (b.detail || {}).coordinator_owner || {};
    if (own.present) {
      const oa = own.beat_ts ? nowS() - own.beat_ts : null;
      parts.push(`<span class="pill ${oa !== null && oa < 120 ? "ok" : "bad"}" title="The coordinator engine's own heartbeat in its store (${esc(own.id || "?")}), read by the bridge">engine ${oa === null ? "?" : relAge(oa)}</span>`);
    }
  }
  for (const c of coord) parts.push(`<span class="pill ${c.fresh ? "ok" : "bad"}" title="${esc(c.source_id)}: control channel heartbeat (run --control)">control ${c.fresh ? "ok" : "STALE " + relAge(c.age_s)}</span>`);
  if (!coord.length) parts.push(`<span class="pill" title="No coordinator has heart-beated with --control: operator actions will wait as 'accepted' until one does">control: off</span>`);
  if (S.unseen) parts.push(`<button class="pill info" id="unseen" title="New activity you haven't looked at">${S.unseen} new</button>`);
  $("#conn").innerHTML = parts.join(" ");
  const u = $("#unseen"); if (u) u.onclick = () => { S.unseen = 0; goLive(paneById("main")); renderConn(); };
}

/* ======================================================================== stream */
let ES = null, esTimer = null;
function subscribedSessions() { return [...new Set(S.panes.map(p => p.sid).filter(Boolean))].slice(0, 12); }

  const subs = subscribedSessions().join(",");
  ES = new EventSource(`/control/api/stream?after=${S.seq}&sessions=${encodeURIComponent(subs)}`);
  S.conn.subs = subs;
  ES.addEventListener("hello", () => { S.conn.stream = "live"; S.conn.attempt = 0; S.conn.lastEvent = nowS(); setConn("foundry", "ok"); renderConn(); });
  ES.addEventListener("batch", ev => { S.conn.lastEvent = nowS(); S.conn.stream = "live"; onBatch(JSON.parse(ev.data)); });
  ES.addEventListener("heartbeat", ev => { S.conn.lastEvent = nowS(); const d = JSON.parse(ev.data); S.sources = d.sources || S.sources; renderConn(); });
  ES.addEventListener("expired", () => { ES.close(); showLogin("Session expired: sign in again"); });
  ES.onerror = () => {

  applyDisplay();
  try { const s = await api("session"); S.csrf = s.csrf; S.me = s; }
  catch (e) { if (e.network) { S.conn.stream = "offline"; renderConn(); setTimeout(boot, 5000); } return; }
  $("#login").classList.remove("show");
  try {
    S.ov = await api("overview");
    for (const t of S.ov.tasks) S.tasks.set(taskKey(t.project_id, t.task_id), t);
    for (const s of S.ov.sessions) S.sessions.set(s.session_id, s);
    for (const p of S.ov.pending) S.pending.set(p.request_id, p);
    S.sources = S.ov.sources || [];
    S.seq = S.ov.seq || 0;
    const al = await api("alerts?status=open&limit=200"); for (const a of al.alerts) S.alerts.set(a.alert_id, a);
    const ac = await api("actions?limit=100"); for (const a of ac.actions) S.actions.set(a.action_id, a);
    try { const d = await api("drafts"); S.drafts = Object.fromEntries(d.drafts.map(x => [x.target, x.text])); } catch (e) { S.drafts = {}; }
    for (const kind of ["mcp", "capabilities", "config"]) for (const p of S.ov.projects) {
      try { const r = await api(`snapshots?kind=${kind}&project=${encodeURIComponent(p)}`); if (r.snapshot) S.snapshots.set(`${kind}|${p}|`, r.snapshot); } catch (e) {}
    }
  } catch (e) { toast(esc(e.message), "bad"); }
  S.project = QS.get("project") || S.project; S.task = QS.get("task") || S.task;
  renderTaskSelect();
  S.panes = [newPane("main", "worker")];
  if (POPOUT === "pane" || POPOUT.startsWith("section:")) document.body.classList.add("popout");
  layout();
  const sid = QS.get("session");
  if (sid) await openInPane(paneById("main"), sid, {pin: POPOUT === "pane" || sid !== tdata(curTask()).session_id});
  else applyFollow();
  if (!paneById("main").sid) { connectStream(); renderPane(paneById("main")); }
  renderBell(); renderSoundBtn(); renderConn(); renderComposer(true);
  if (POPOUT) { $("#composer").hidden = true; }
  S.booted = true;
  setupGraphTimer();
  setInterval(() => { renderConn(); for (const p of S.panes) renderPaneHead(p); }, 5000);
  setInterval(() => { scheduleInspector(); }, 15000);
  if (P.sound.enabled) { try { AUDIO.ctx = new (window.AudioContext || window.webkitAudioContext)(); AUDIO.blocked = AUDIO.ctx.state !== "running"; } catch (e) { AUDIO.blocked = true; } renderSoundBtn(); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderConn(); refreshGraph(); } });
electAudioOwner();
applyDisplay();
boot();
</script>
</body>
</html>
