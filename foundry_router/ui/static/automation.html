<!doctype html>
<!--
  Foundry automation (/ui/automation): one place to manage the coordinator's
  roles, routes, backends, settings, role rules and queue, plus the operator
  chat (Chat tab, /control/api/chat/*): the same work in plain language, with
  confirm cards for anything that changes live behaviour.
  One static page, vanilla JS, no build step. The one external script is
  SortableJS (pinned, SRI) for drag handles; without it the arrow keys and the
  move buttons still reorder everything.
  Sign-in: the control center's operator session (HttpOnly cookie, CSRF
  header) for /control/api/*. Settings and role rules live in the config store
  (/admin/api/automation/*, versioned, draft -> deploy -> rollback); persona
  route order and backend on/off are written live through the persona and
  backend APIs on Deploy, after a state snapshot.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Automation · Foundry</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"
        integrity="sha384-HZZ/fukV+9G8gwTNjN7zQDG0Sp7MsZy5DDN6VfY3Be7V9dvQpEpR2jF2HlyFUUjU"
        crossorigin="anonymous" referrerpolicy="no-referrer" async
        onload="window.__sortableReady && window.__sortableReady()"></script>
<style>
  /* Foundry palette, shared with /ui and /ui/control: "cast iron" dark, cool
     "mill scale" light, molten orange accent, steel blue for information. */
  :root {
    color-scheme: dark;
    --bg:#14110e; --panel:#1c1814; --panel-2:#26201a; --line:#352c23; --line-2:#4a3e31; --fg:#ebe5db; --dim:#a39684;
    --accent:#ff8a1e; --on-accent:#1a1206; --info:#7db4d8;
    --ok:#6cc47c; --bad:#ef5d50; --warn:#e8aa3c;
    --ok-bg:#183020; --bad-bg:#3c1a17; --warn-bg:#382c14; --info-bg:#172a37;
    --claude:#e08a5b; --chatgpt:#5fb89a; --local:#8fa4d6; --other:#a39684;
    --ui-font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --num-font: Bahnschrift, "DIN Alternate", "Barlow Semi Condensed", "Arial Narrow", var(--ui-font);
    --code-font: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    --shadow: 0 1px 0 rgba(0,0,0,.25);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:#eef0ed; --panel:#ffffff; --panel-2:#e4e7e3; --line:#d3d7d1; --line-2:#b9bfb7; --fg:#1d211e; --dim:#5a625b;
    --accent:#b8560a; --on-accent:#ffffff; --info:#2b6890;
    --ok:#25803d; --bad:#bf3328; --warn:#946200;
    --ok-bg:#e1f1e4; --bad-bg:#fbe3e0; --warn-bg:#f8edd2; --info-bg:#e1edf5;
    --claude:#b4572a; --chatgpt:#1f7a5c; --local:#3d5a9e; --other:#5a625b;
    --shadow: 0 1px 2px rgba(30,40,30,.08);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 var(--ui-font); font-variant-numeric:tabular-nums; }
  button, select, input, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a { color:var(--accent); }
  code, .mono { font-family:var(--code-font); font-size:12px; }
  .hint { color:var(--dim); font-size:12px; margin:4px 0 8px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  header { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; padding:9px clamp(12px, 1.8vw, 44px);
           background:var(--panel); border-bottom:1px solid var(--line); }
  header .brand { display:flex; flex-direction:column; min-width:0; text-decoration:none; }
  header h1 { font:600 18px/1.1 var(--num-font); margin:0; color:var(--accent); letter-spacing:.01em; }
  header .sub { color:var(--dim); font-size:12px; }
  .hdr-tools { margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
  nav { display:flex; gap:2px; padding:0 clamp(6px, 1.8vw, 40px); background:var(--panel); border-bottom:1px solid var(--line);
        overflow-x:auto; position:sticky; top:0; z-index:8; box-shadow:var(--shadow); }
  nav button { background:none; border:none; color:var(--dim); padding:9px 14px 8px; cursor:pointer;
               font:500 14px/1.2 var(--num-font); letter-spacing:.02em; border-bottom:3px solid transparent; white-space:nowrap; }
  nav button:hover { color:var(--fg); }
  nav button[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--accent); }
  main { padding:14px clamp(12px, 1.8vw, 44px) 80px; width:100%; }
  h2 { font:600 17px/1.25 var(--num-font); margin:18px 0 4px; letter-spacing:.01em; }
  h3 { font:600 15px/1.25 var(--num-font); margin:0; letter-spacing:.01em; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin:8px 0; box-shadow:var(--shadow); min-width:0; }
  .act, .btn { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:5px 11px;
               cursor:pointer; font-size:12.5px; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
  .act:hover, .btn:hover { border-color:var(--accent); }
  .act:disabled, .btn:disabled { opacity:.4; cursor:not-allowed; }
  .act.primary { border-color:var(--accent); background:var(--accent); color:var(--on-accent); font-weight:600; }
  .act.danger:hover { border-color:var(--bad); color:var(--bad); }
  .ic { background:none; border:1px solid transparent; border-radius:4px; color:var(--dim); cursor:pointer; padding:2px 6px; font-size:12px; line-height:1.2; }
  .ic:hover:not(:disabled) { border-color:var(--line-2); color:var(--fg); }
  .ic:disabled { opacity:.25; cursor:default; }
  .ic.danger:hover:not(:disabled) { color:var(--bad); border-color:var(--bad); }
  input, select, textarea { background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:5px 8px; font-size:13px; max-width:100%; }
  input[aria-invalid="true"], textarea[aria-invalid="true"] { border-color:var(--bad); }
  textarea { width:100%; font-family:var(--code-font); font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .fld { display:inline-flex; align-items:center; gap:6px; color:var(--dim); font-size:12.5px; }
  .grow { flex:1; }
  .pill { display:inline-block; padding:0 8px; border-radius:9px; font-size:11px; line-height:18px; white-space:nowrap;
          border:1px solid var(--line-2); color:var(--dim); vertical-align:middle; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); border-color:transparent; }
  .pill.bad { background:var(--bad-bg); color:var(--bad); border-color:transparent; }
  .pill.warn { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
  .pill.info { background:var(--info-bg); color:var(--info); border-color:transparent; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); } .dot.warn { background:var(--warn); }
  /* switch: a checkbox that reads as on/off, text included (not colour alone) */
  .sw { display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:12px; color:var(--fg); user-select:none; }
  .sw input { appearance:none; -webkit-appearance:none; width:30px; height:17px; border-radius:9px; background:var(--line-2);
              position:relative; cursor:pointer; margin:0; padding:0; border:0; flex:none; transition:background .12s; }
  .sw input::after { content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:var(--fg); transition:left .12s; }
  .sw input:checked { background:var(--ok); }
  .sw input:checked::after { left:15px; }
  .sw input:disabled { opacity:.4; cursor:not-allowed; }
  @media (prefers-reduced-motion: reduce) { .sw input, .sw input::after { transition:none; } }
  /* family chip: Claude / ChatGPT / Local */
  .fam { font:600 10.5px/1 var(--num-font); letter-spacing:.06em; text-transform:uppercase; padding:4px 6px; border-radius:4px;
         border:1px solid currentColor; white-space:nowrap; flex:none; }
  .fam-claude { color:var(--claude); } .fam-chatgpt { color:var(--chatgpt); } .fam-local { color:var(--local); } .fam-other { color:var(--other); }
  /* banners */
  .banner { border:1px solid var(--line); border-left:4px solid var(--info); background:var(--panel); border-radius:5px; padding:8px 12px; margin:8px 0; font-size:13px; }
  .banner.warn { border-left-color:var(--warn); } .banner.bad { border-left-color:var(--bad); }
  .banner b { font-weight:600; }
  /* draft bar */
  #draftbar { display:flex; align-items:center; gap:8px 12px; flex-wrap:wrap; padding:7px clamp(12px, 1.8vw, 44px);
              background:var(--panel-2); border-bottom:1px solid var(--line); position:sticky; top:41px; z-index:7; font-size:13px; }
  #draftbar[hidden] { display:none; }
  #draftbar .state { display:flex; align-items:center; gap:8px; min-width:0; }
  #draftbar.dirty { border-bottom-color:var(--accent); }
  /* usage bars: fill = used, tick = cutoff, hatched = unknown (never 0%) */
  .ub { display:grid; grid-template-columns:3.6em minmax(60px, 1fr) 4.6em; gap:6px; align-items:center; font-size:11.5px; }
  .ub-l { color:var(--dim); white-space:nowrap; }
  .ub-t { position:relative; height:8px; border-radius:4px; background:var(--panel-2); overflow:visible; }
  .ub-t i { position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:var(--ok); }
  .ub.near .ub-t i { background:var(--warn); } .ub.over .ub-t i { background:var(--bad); }
  .ub.unknown .ub-t { background:repeating-linear-gradient(135deg, var(--line-2) 0 4px, transparent 4px 8px); }
  .ub-t .tick { position:absolute; top:-3px; bottom:-3px; width:2px; margin-left:-1px; background:var(--fg); border-radius:1px; }
  .ub-v { font-family:var(--num-font); text-align:right; white-space:nowrap; }
  .ub.over .ub-v { color:var(--bad); font-weight:600; } .ub.unknown .ub-v { color:var(--dim); font-style:italic; }
  .stale { color:var(--warn); font-size:10.5px; font-style:normal; }
  .bars { display:grid; gap:3px; min-width:0; }
  /* backends */
  .be-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap:10px; }
  .be-grid .card { margin:0; display:grid; gap:8px; }
  .be-h { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .be-h h3 { flex:1; min-width:0; overflow-wrap:anywhere; }
  .be.off { opacity:.62; }
  .cut { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12.5px; color:var(--dim); }
  .cut input[type=range] { flex:1; min-width:100px; accent-color:var(--accent); padding:0; border:0; background:none; }
  .cut input[type=number] { width:4.6em; }
  /* roles */
  .role-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap:10px; align-items:start; }
  .role-grid .card { margin:0; }
  .role-h { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .now { font-size:12.5px; margin:6px 0; padding:5px 8px; border-radius:4px; background:var(--bg); border:1px solid var(--line); }
  .now b { font-weight:600; }
  .now.bad { border-color:var(--bad); color:var(--bad); }
  ol.routes { list-style:none; margin:6px 0; padding:0; display:grid; gap:4px; }
  li.route { display:grid; grid-template-columns:auto auto minmax(0, 1fr) auto; grid-template-areas:"drag fam name ctl" "drag bars bars bars";
             gap:4px 8px; align-items:center; padding:6px 8px; border:1px solid var(--line); border-radius:5px; background:var(--bg); }
  li.route.off { opacity:.55; } li.route.off .rname b { text-decoration:line-through; }
  li.route.over { border-color:color-mix(in srgb, var(--bad) 55%, var(--line)); }
  li.route.sortable-ghost { opacity:.35; border-style:dashed; }
  li.route.sortable-chosen { border-color:var(--accent); }
  .drag { grid-area:drag; align-self:stretch; cursor:grab; background:none; border:1px solid transparent; border-radius:4px; color:var(--dim);
          font-size:15px; padding:0 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; touch-action:none; }
  .drag:hover, .drag:focus-visible { color:var(--accent); border-color:var(--line-2); }
  .drag .pos { font:600 11px var(--num-font); color:var(--dim); }
  li.route .fam { grid-area:fam; justify-self:start; }
  .rname { grid-area:name; min-width:0; display:flex; flex-direction:column; }
  .rname b { font:600 13px var(--code-font); overflow-wrap:anywhere; }
  .rname .hint { margin:0; }
  .rctl { grid-area:ctl; display:flex; align-items:center; gap:2px; }
  li.route .bars { grid-area:bars; }
  .addroute { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .addroute select { flex:1; min-width:120px; }
  .warns { list-style:none; margin:6px 0 0; padding:0; display:grid; gap:3px; font-size:12px; }
  .warns li { padding-left:16px; position:relative; }
  .warns li::before { content:"!"; position:absolute; left:3px; font-weight:700; color:var(--warn); }
  .warns li.bad::before { color:var(--bad); }
  /* graph */
  .graph-wrap { overflow-x:auto; }
  svg.graph { display:block; min-width:760px; width:100%; font:12px var(--ui-font); }
  svg.graph .col { fill:var(--dim); font:600 11px var(--num-font); letter-spacing:.08em; text-transform:uppercase; }
  svg.graph .nb { fill:var(--panel-2); stroke:var(--line-2); }
  svg.graph .nt { fill:var(--fg); }
  svg.graph .ns { fill:var(--dim); font-size:10.5px; }
  svg.graph .e { fill:none; stroke:var(--info); stroke-width:1.6; }
  svg.graph .e.fb { stroke-dasharray:5 4; stroke:var(--dim); }
  svg.graph .off .nb { stroke-dasharray:3 3; } svg.graph .off { opacity:.38; }
  svg.graph .e.off { opacity:.25; stroke:var(--dim); }
  svg.graph .over .nb { stroke:var(--bad); }
  svg.graph .famb { stroke-width:3; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin-top:6px; }
  .legend svg { vertical-align:middle; }
  /* dry run */
  .dr-res { display:grid; gap:8px; margin-top:8px; }
  .dr-res .r { border:1px solid var(--line); border-radius:5px; padding:8px 10px; background:var(--bg); }
  .dr-res ol { margin:6px 0 0; padding-left:20px; font-size:12.5px; }
  .dr-res li { margin:2px 0; }
  .whatif { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap:8px; margin:8px 0; }
  .whatif .card { margin:0; padding:8px 10px; }
  .whatif input { width:5em; }
  /* settings */
  .set-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap:10px; align-items:start; }
  .set-grid .card { margin:0; }
  .sf { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:2px 10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .sf:last-child { border-bottom:0; }
  .sf label.k { font-weight:600; font-size:13px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .sf .ctl { grid-row:span 2; display:flex; align-items:center; gap:6px; align-self:start; }
  .sf .d { color:var(--dim); font-size:12px; }
  .sf .err { grid-column:1 / -1; color:var(--bad); font-size:12px; }
  .sf.mod label.k::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); }
  .sf input[type=number] { width:7em; } .sf input[type=text] { width:min(260px, 52vw); }
  .sf textarea { width:min(300px, 60vw); min-height:58px; }
  /* role rules */
  .matrix-wrap { overflow-x:auto; }
  table.matrix { border-collapse:collapse; width:100%; min-width:640px; font-size:13px; }
  table.matrix th, table.matrix td { border-bottom:1px solid var(--line); padding:4px; text-align:left; }
  table.matrix thead th { color:var(--dim); font-weight:500; font-size:12px; white-space:nowrap; padding:6px 4px; }
  table.matrix tbody th { font-weight:600; white-space:nowrap; padding-right:10px; }
  .cell { width:100%; min-width:76px; display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:5px 8px; border-radius:5px;
          border:1px solid var(--line); background:var(--bg); cursor:pointer; text-align:left; }
  .cell:hover { border-color:var(--accent); }
  .cell .st { font-weight:600; font-size:12.5px; }
  .cell .sc { font-size:10.5px; color:var(--dim); }
  .cell.allow .st { color:var(--ok); } .cell.ask .st { color:var(--warn); } .cell.deny .st { color:var(--bad); }
  .cell.allow { background:var(--ok-bg); } .cell.ask { background:var(--warn-bg); }
  .cell[aria-current="true"] { outline:2px solid var(--accent); }
  .tester { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .tester input { flex:1; min-width:220px; font-family:var(--code-font); }
  .verdict { margin-top:6px; font-size:13px; }
  .verdict b { font:600 14px var(--num-font); letter-spacing:.03em; text-transform:uppercase; }
  .verdict.allow b { color:var(--ok); } .verdict.ask b { color:var(--warn); } .verdict.deny b { color:var(--bad); }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .chip { display:inline-flex; align-items:center; gap:3px; border:1px solid var(--line-2); border-radius:12px; padding:1px 3px 1px 9px;
          font:12px var(--code-font); background:var(--bg); max-width:100%; }
  .chip span { overflow-wrap:anywhere; }
  .chip.locked { padding-right:9px; border-style:dashed; color:var(--dim); }
  .chip.deny { border-color:color-mix(in srgb, var(--bad) 60%, var(--line)); }
  /* drawer */
  #drawer { position:fixed; top:0; right:0; bottom:0; width:min(480px, 100vw); background:var(--panel); border-left:1px solid var(--line-2);
            z-index:30; overflow-y:auto; padding:14px 16px 24px; box-shadow:-10px 0 30px rgba(0,0,0,.35); }
  #drawer[hidden] { display:none; }
  #drawer h3 { color:var(--accent); margin-right:30px; }
  #drawer .x { position:absolute; top:10px; right:10px; }
  #drawer fieldset { border:1px solid var(--line); border-radius:5px; margin:10px 0; padding:8px 10px; }
  #drawer legend { color:var(--dim); font-size:12px; padding:0 4px; }
  .seg { display:flex; gap:0; border:1px solid var(--line-2); border-radius:5px; overflow:hidden; width:max-content; max-width:100%; }
  .seg label { padding:5px 12px; cursor:pointer; font-size:13px; border-right:1px solid var(--line-2); display:flex; gap:5px; align-items:center; }
  .seg label:last-child { border-right:0; }
  .seg input { position:absolute; opacity:0; width:1px; height:1px; }
  .seg label:has(input:checked) { background:var(--accent); color:var(--on-accent); font-weight:600; }
  .seg label:has(input:focus-visible) { outline:2px solid var(--accent); outline-offset:-2px; }
  /* queue */
  table.q { border-collapse:collapse; width:100%; font-size:13px; }
  table.q th, table.q td { border-bottom:1px solid var(--line); padding:6px 6px; text-align:left; vertical-align:middle; }
  table.q th { color:var(--dim); font-weight:500; font-size:12px; white-space:nowrap; }
  table.q td.acts { white-space:nowrap; text-align:right; }
  .muted { color:var(--dim); } td.bad { color:var(--bad); }
  table.q tr.sortable-ghost { opacity:.35; }
  .qwrap { overflow-x:auto; }
  .deps { display:flex; flex-wrap:wrap; gap:3px; align-items:center; }
  .deps code { border:1px solid var(--line-2); border-radius:9px; padding:0 6px; }
  .dec { border:1px solid var(--line); border-left:4px solid var(--warn); border-radius:5px; padding:10px 12px; background:var(--panel); margin:8px 0; }
  .dec .opts { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .countdown { font:600 13px var(--num-font); color:var(--warn); }
  /* modal */
  .modal { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.55); display:flex; align-items:flex-start; justify-content:center; padding:6vh 12px; overflow-y:auto; }
  .modal[hidden] { display:none; }
  .modal-box { background:var(--panel); border:1px solid var(--line-2); border-radius:8px; padding:16px 18px; width:min(760px, 100%); position:relative; box-shadow:0 12px 40px rgba(0,0,0,.45); }
  .modal-box h3 { color:var(--accent); margin:0 30px 10px 0; }
  .modal-box .x { position:absolute; top:10px; right:10px; }
  .diff { list-style:none; margin:0; padding:0; display:grid; gap:6px; max-height:56vh; overflow:auto; }
  .diff li { border:1px solid var(--line); border-radius:5px; padding:6px 9px; background:var(--bg); font-size:12.5px; }
  .diff .p { font:600 12px var(--code-font); overflow-wrap:anywhere; }
  .diff .b { color:var(--bad); overflow-wrap:anywhere; } .diff .a { color:var(--ok); overflow-wrap:anywhere; }
  /* login + toasts */
  #login { position:fixed; inset:0; background:var(--bg); z-index:80; display:none; align-items:center; justify-content:center; padding:16px; }
  #login.show { display:flex; }
  #login .box { background:var(--panel); border:1px solid var(--line-2); border-radius:6px; padding:18px; width:min(460px, 100%); }

<script>
"use strict";
/* ======================================================================== basics */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const ESC_MAP = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ESC_MAP[c]);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clone = o => JSON.parse(JSON.stringify(o));
const fmt = n => (Math.round(n * 10) / 10).toString();
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function toast(text, bad = false, ms = 5000) {
  const d = document.createElement("div");
  d.className = "toast" + (bad ? " bad" : ""); d.textContent = text; d.setAttribute("role", bad ? "alert" : "status");
  $("#toasts").appendChild(d); setTimeout(() => d.remove(), ms);
}
function announce(text) { const s = $("#sr"); s.textContent = ""; setTimeout(() => { s.textContent = text; }, 30); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
function idem() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)); }

const ROLE_HELP = {
  implementer: "Writes the code for a task (one warm session per sprint).",
  lead: "Last-resort recovery: diagnoses blockers, returns typed actions or fixes with write access.",
  reviewer: "Reviews each change at its exact commit.",
  deep_reviewer: "Reviews high-risk changes.",
  visual_reviewer: "Judges Studio captures for visual regressions.",
  planner: "Plans and replans tasks on request.",
  researcher: "Looks things up (docs, web) for other roles.",
  coordinator: "The coordinator's own model calls (retry guidance, closeout notes).",
};
const FAM_LABEL = {claude: "Claude", chatgpt: "ChatGPT", local: "Local", other: "Other"};
// role -> the settings field naming its persona (foundry_automation role_binding);
// helper personas are per backend (Settings), the coordinator runs none
const ROLE_BINDING = {implementer: "roles.implementer", planner: "roles.planner", researcher: "roles.researcher",
  reviewer: "roles.reviewer", deep_reviewer: "roles.deep_reviewer", visual_reviewer: "roles.visual_reviewer",
  lead: "lead_manager.persona"};
function getPath(o, path) { let c = o; for (const k of path.split(".")) { if (c === null || typeof c !== "object") return undefined; c = c[k]; } return c; }
function setPath(o, path, v) { const ks = path.split("."); let c = o; for (const k of ks.slice(0, -1)) { if (!c[k] || typeof c[k] !== "object" || Array.isArray(c[k])) c[k] = {}; c = c[k]; } c[ks[ks.length - 1]] = v; }
function delPath(o, path) { const ks = path.split("."); let c = o; for (const k of ks.slice(0, -1)) { if (!c || typeof c !== "object") return; c = c[k]; } if (c && typeof c === "object") delete c[ks[ks.length - 1]]; }
const STATE_ICON = {allow: "✓", ask: "?", deny: "✕"};

/* ======================================================================== state */
const S = {
  me: null, csrf: "", view: "routing",
  deployed: null, draft: null, live: null, revision: null, deployedRevision: null, routerRevision: null,
  usage: {}, usageTs: 0, dry: {}, changes: [], draftErrors: [], warnings: [], schema: null,
  cfgProject: store("fr.auto.project") || "", c1: null, projects: [], ovProjects: [],
  queue: null, ov: null, project: "", qStub: false, qOps: false, workspace: store("fr.auto.ws") || "",
  ruleSel: null, decTick: null,
};
const doc = () => S.draft || S.deployed;

/* ======================================================================== api */
async function api(path, opts = {}) {
  const o = {method: opts.method || "GET", credentials: "same-origin", headers: {"accept": "application/json"}};
  if (opts.body !== undefined) { o.body = JSON.stringify(opts.body); o.headers["content-type"] = "application/json"; }
  if (o.method !== "GET") o.headers["x-foundry-csrf"] = S.csrf;
  let r;
  try { r = await fetch("/control/api/" + path, o); }
  catch (e) { const err = new Error("Foundry unreachable"); err.network = true; throw err; }
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && data.code === "login_required") showLogin();
  if (!r.ok) {
    const err = new Error((data && (data.error && (data.error.message || data.error))) || data.detail || ("HTTP " + r.status));
    err.status = r.status; err.code = data.code; err.data = data; throw err;
  }
  return data;
}

/* ======================================================================== C1 adapter
   The config store (foundry_router/automation_api.py, contract v1.2 in the
   revamp notes) keeps one versioned document per project ({format, project,
   settings, role_rules}) and a router-wide one, "_router" (per-backend
   cutoff_pct). Persona route order and backend on/off are live router state,
   not versioned: Deploy writes them through the persona and backend APIs after
   taking a state snapshot (restorable from History). The page shows all of it
   as one view: compose() builds it, split() turns it back into the documents. */
const ADMIN_KEY = "foundryAdminKey";      // shared with the dashboard (/ui), same origin
async function adminApi(path, opts = {}) {
  const o = {method: opts.method || "GET", credentials: "same-origin", headers: {"accept": "application/json"}};
  if (opts.body !== undefined) { o.body = JSON.stringify(opts.body); o.headers["content-type"] = "application/json"; }
  if (o.method !== "GET") o.headers["x-foundry-automation"] = "1";      // the store's CSRF guard
  if (S.me && S.me.actor) o.headers["x-foundry-actor"] = S.me.actor;    // who, in history and audit
  const k = store(ADMIN_KEY);
  if (k) o.headers["authorization"] = "Bearer " + k;
  let r;
  try { r = await fetch("/admin/api/" + path, o); }
  catch (e) { const err = new Error("Foundry unreachable"); err.network = true; throw err; }
  let data = {};
  try { data = await r.json(); } catch (e) {}
  const code = data.code || (data.error && data.error.code);
  if ((r.status === 401 || (r.status === 403 && code === "admin_key_required")) && !opts._retried) {
    // client_auth.protect_admin is on: the same admin key the dashboard asks for
    const entered = prompt("Saving settings needs this Foundry's admin client key (a key with the 'admin' scope):");
    if (entered && entered.trim()) { store(ADMIN_KEY, entered.trim()); return adminApi(path, {...opts, _retried: true}); }
  }
  if (!r.ok) {
    const msg = (data.error && (data.error.message || data.error)) || data.detail || ("HTTP " + r.status);
    const err = new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
    err.status = r.status; err.code = code; err.data = data; throw err;
  }
  return data;
}
const AP = p => "automation/projects/" + encodeURIComponent(p);
function compose(live, proj, router) {
  const d = clone(live);
  d.settings = clone((proj || {}).settings || {});
  d.role_rules = clone((proj || {}).role_rules || {});
  for (const [n, v] of Object.entries(((router || {}).settings || {}).backends || {}))
    d.backends[n] = {...(d.backends[n] || {}), cutoff_pct: (v || {}).cutoff_pct ?? (d.backends[n] || {}).cutoff_pct};
  return d;
}
function split(d) {
  const p = S.c1.proj.draft.doc, r = S.c1.router.draft.doc;
  const proj = {...clone(p), settings: clone(d.settings || {}), role_rules: clone(d.role_rules || {})};
  // a cutoff goes into the router document when it was there already or the
  // operator changed it; live values stay where they are
  const had = ((r.settings || {}).backends) || {}, live = S.live.backends || {};
  const backends = clone(had);
  for (const [n, v] of Object.entries(d.backends || {})) {
    if (v.cutoff_pct === null || v.cutoff_pct === undefined) continue;
    if (had[n] || (live[n] || {}).cutoff_pct !== v.cutoff_pct) backends[n] = {...(had[n] || {}), cutoff_pct: v.cutoff_pct};
  }
  const rs = clone(r.settings || {});
  if (Object.keys(backends).length || "backends" in rs) rs.backends = backends;   // never add an empty table
  const router = {...clone(r), settings: rs};
  return {proj, router};
}
// live routing changes: persona route lists and backend on/off that differ from the router
function liveChanges(d) {
  const out = [];
  if (!d) return out;
  for (const [n, p] of Object.entries(d.personas || {})) {
    const before = ((S.live.personas || {})[n] || {}).routes || [];
    if (JSON.stringify(before) !== JSON.stringify(p.routes || [])) out.push({path: `personas.${n}.routes`, before, after: p.routes || [], live: true, persona: n});
  }
  for (const [n, b] of Object.entries(d.backends || {})) {
    const was = ((S.live.backends || {})[n] || {}).enabled !== false, now = b.enabled !== false;
    if (was !== now) out.push({path: `backends.${n}.enabled`, before: was, after: now, live: true, backend: n});
  }
  return out;
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// route order and backend on/off edits exist only in this page until Deploy
window.addEventListener("beforeunload", e => { if (S.live && liveChanges(S.draft).length) { e.preventDefault(); e.returnValue = ""; } });
const C1 = {
  async load() {
    const [seed, pl] = await Promise.all([api("automation/seed"), adminApi("automation/projects")]);
    const stored = (pl.projects || []).map(x => x.project).filter(p => p && p !== "_router");
    S.projects = [...new Set([...stored, ...(S.ovProjects || [])])].sort();
    if (!S.cfgProject || !S.projects.includes(S.cfgProject)) S.cfgProject = S.projects[0] || "";
    if (!S.cfgProject) throw new Error("No project yet: import a coordinator profile (POST /admin/api/automation/projects/<id>/import) or let the coordinator report one.");
    const info = Object.fromEntries((pl.projects || []).map(x => [x.project, x]));
    const deployedDoc = async p => ((info[p] || {}).deployed_rev ? (await adminApi(`${AP(p)}/revisions/${info[p].deployed_rev}`)).doc : null);
    const [pd, rd, pdep, rdep] = await Promise.all([adminApi(AP(S.cfgProject) + "/draft"), adminApi(AP("_router") + "/draft"),
                                                   deployedDoc(S.cfgProject), deployedDoc("_router")]);
    S.live = seed.doc;
    S.c1 = {proj: {draft: pd, rev: (info[S.cfgProject] || {}).deployed_rev || 0},
            router: {draft: rd, rev: (info._router || {}).deployed_rev || 0}};
    // no revision yet: the draft is the starting point (its changes still show in the diff)
    S.deployed = compose(seed.doc, pdep || {settings: {}, role_rules: {}}, rdep || {settings: {}});
    S.draft = (pd.dirty || rd.dirty) ? compose(seed.doc, pd.doc, rd.doc) : null;
    S.revision = S.deployedRevision = S.c1.proj.rev;
    S.routerRevision = S.c1.router.rev;
  },
  async saveDraft(d) {
    const {proj, router} = split(d);
    const errors = [];
    for (const [k, p, doc] of [["proj", S.cfgProject, proj], ["router", "_router", router]]) {
      const cur = S.c1[k].draft;
      if (same(cur.doc, doc)) continue;
      try {
        const r = await adminApi(AP(p) + "/draft", {method: "PUT", body: {doc, etag: cur.etag}});
        cur.etag = r.etag; cur.doc = doc; cur.dirty = true;
        errors.push(...(((r.validation || {}).errors) || []));
      } catch (e) {
        if (e.code === "etag_mismatch") { toast("Someone else changed this draft. Reloading it.", true); await reload(); return {errors: []}; }
        if (e.status === 422) { errors.push(...((((e.data || {}).validation || {}).errors) || [{path: "", message: e.message}])); continue; }
        throw e;
      }
    }
    return {ok: !errors.length, errors};
  },
  async diff() {
    if (!S.draft) return [];
    const map = (r, kind) => (r.changes || []).map(c => ({path: kind === "router" ? `_router.${c.path}` : c.path,
      before: c.from, after: c.to, apply: c.apply, op: c.op, kind}));
    const [pc, rc] = await Promise.all([adminApi(AP(S.cfgProject) + "/diff"), adminApi(AP("_router") + "/diff")]);
    return [...map(pc, "project"), ...map(rc, "router"), ...liveChanges(S.draft)];
  },
  async deploy(note) {
    const out = {notes: []};
    const live = liveChanges(S.draft);
    for (const c of live.filter(c => c.persona)) if (!c.after.some(x => x.enabled !== false))
      throw new Error(`${c.persona} needs at least one route turned on (an empty list would allow every model).`);
    // versioned documents first: the store validates and refuses a bad draft
    for (const [k, p] of [["proj", S.cfgProject], ["router", "_router"]]) {
      const cur = S.c1[k].draft;
      if (!S.changes.some(c => c.kind === (k === "proj" ? "project" : "router"))) continue;
      const r = await adminApi(AP(p) + "/deploy", {method: "POST", body: {etag: cur.etag, note}});

function cutoffOf(be) {

}

function graphSvg() {

  const models = [], mIdx = {}, bes = [];

  roles.forEach((r, i) => {

    const pi = personas.indexOf(r.persona);

    nodes += node(xs[1], ys[1](i), p, `${rs.length} route${rs.length === 1 ? "" : "s"}`, (d.personas || {})[p] ? "" : "off");
    rs.forEach((rt, k) => {
      const mi = mIdx[rt.backend + "|" + rt.model];

      edges += edge(xs[1] + NW, ys[1](i) + NH / 2, xs[2], ys[2](mi) + NH / 2, (k === primary ? "" : "fb") + (dead ? " off" : ""), `${p} route #${k + 1}: ${rt.model}${dead ? " (unavailable)" : k === primary ? " (first choice now)" : " (fallback)"}`);

  });

    const sub = beOff(b) ? "off" : u.subscription ? `5h ${pct("5h")} · wk ${pct("weekly")} · stop ${cutoffOf(b) ?? "?"}%` : "local";
    nodes += node(xs[3], ys[3](i), b, sub, (beOff(b) ? "off " : "") + (isOver(b) ? "over" : ""), fam);

  <div class="legend"><span><svg width="34" height="8"><path d="M0,4 H34" stroke="var(--info)" stroke-width="2"/></svg> first choice</span><span><svg width="34" height="8"><path d="M0,4 H34" stroke="var(--dim)" stroke-width="2" stroke-dasharray="5 4"/></svg> fallback</span><span><svg width="34" height="8"><path d="M0,4 H34" stroke="var(--dim)" stroke-width="2" opacity=".3"/></svg> off / over cutoff</span></div>`;

    .map(t => ({task_id: t.task_id, state: t.state, deps: (t.data || {}).deps || [], approved_by: (t.data || {}).approved_by || "", note: (t.data || {}).next_action || "", live: t}));

  });
  else if (a === "q-requeue") formModal(`Re-queue ${x.task_id}`, `<label class="fld" for="f-why">Why (kept in the log)</label><input id="f-why" name="reason" style="width:100%" required>`, "Re-queue", f => C1.queueOp("queue_requeue", x, {reason: f.get("reason")}));
  else if (a === "q-unblock") formModal(`Re-queue ${x.task_id}`, `<label class="fld" for="f-res">What was fixed?</label><input id="f-res" name="resolution" style="width:100%" required><label class="sw" style="margin-top:8px"><input type="checkbox" name="reset">Start a fresh attempt budget</label>`, "Re-queue", f => action("unblock", x, {resolution: f.get("resolution"), reset_attempts: !!f.get("reset")}));
  else if (a === "q-pause") formModal(`Pause ${x.task_id}`, `<label class="fld" for="f-why">Reason</label><input id="f-why" name="reason" style="width:100%" required>`, "Pause", f => action("pause", x, {reason: f.get("reason")}));
  else if (a === "q-resume") action("resume", x).then(() => { S.queue = null; renderQueue(); }).catch(e => toast(e.message, true));
  else if (a === "q-cancel") formModal(`Cancel ${x.task_id} for good?`, `<label class="fld" for="f-why">Reason</label><input id="f-why" name="reason" style="width:100%" required><label class="fld" for="f-conf" style="margin-top:8px">Type <code>cancel ${esc(x.task_id)}</code> to confirm</label><input id="f-conf" name="confirm" style="width:100%" autocomplete="off" required>`, "Cancel task", f => {
    if (f.get("confirm") !== `cancel ${x.task_id}`) throw new Error(`Type: cancel ${x.task_id}`);
    return action("cancel", x, {reason: f.get("reason"), confirm: f.get("confirm")});
  }, true);
  else if (a === "q-decide") {
    const {d} = decisionsOf().find(o => o.t.task_id === x.task_id && o.d.decision_id === b.dataset.dec) || {};
    if (!d) return toast("That decision is no longer open", true);
    if (!confirm(`Answer ${x.task_id}'s decision with:\n${b.dataset.opt}`)) return;
    try {
      await action("decision_answer", x, {decision_id: d.decision_id, option: (d.options || []).includes(b.dataset.opt) ? b.dataset.opt : "", answer: b.dataset.opt, note: "", question_hash: d.question_hash || ""});
      S.queue = null; renderQueue();
    } catch (e) { toast(e.message, true); }
  }
}
$("#main").addEventListener("keydown", e => {
  const b = e.target.closest && e.target.closest("[data-act=q-key]");
  if (!b || !["ArrowUp", "ArrowDown"].includes(e.key)) return;
  e.preventDefault();
  const i = +b.dataset.i, to = i + (e.key === "ArrowUp" ? -1 : 1);
  if (to < 0 || to >= S.queue.length) return;
  queueMove(i, to).then(() => { const h = $$("[data-act=q-key]")[to]; if (h) h.focus(); });
  announce(`${S.queue[to] ? S.queue[to].task_id : ""} moved to position ${to + 1}`);
});

/* ======================================================================== memory view (Team Lead piece 4) */
S.mem = {project: store("fr.auto.memproject") || "", data: null, file: "", q: "", open: {}, edit: null, busy: false};
const MEM_FIXED = ["DECISIONS.md", "CONVENTIONS.md", "KNOWN_ISSUES.md", "ASSETS.md"];
const MEM_FILE_RE = /^(?:(?:DECISIONS|CONVENTIONS|ASSETS|KNOWN_ISSUES)\.md|(?:tracks|sprints)\/[A-Za-z0-9][A-Za-z0-9._-]{0,59}(?:\.md)?)$/i;
async function loadMemory() {
  if (!S.ov) S.ov = await api("overview?hours=720");
  const projects = S.ov.projects || [];
  if (!S.mem.project || !projects.includes(S.mem.project)) S.mem.project = S.project || projects[0] || "";
  S.mem.data = S.mem.project ? await api("memory?project=" + encodeURIComponent(S.mem.project)) : {snapshot: null, note: "No project has been reported by the coordinator yet."};
}
function memData() { const s = S.mem.data && S.mem.data.snapshot; return (s && s.data) || null; }
function memSearch(entries, q) {
  const ws = (q.toLowerCase().match(/[a-z0-9_.\/-]{2,}/g) || []).slice(0, 12);
  if (!ws.length) return entries;
  const out = [];
  for (const e of entries) {
    const head = (e.heading || "").toLowerCase(), text = (e.text || "").toLowerCase(), tags = (e.tags || []).map(t => String(t).toLowerCase());
    let score = 0, hits = 0;
    for (const w of ws) { const s = (head.includes(w) ? 3 : 0) + (tags.some(t => t === w || t.includes(w)) ? 2 : 0) + (text.includes(w) ? 1 : 0); if (s) hits++; score += s; }
    if (score) out.push([score + (hits === ws.length ? 2 : 0), e]);
  }
  out.sort((a, b) => b[0] - a[0] || String(a[1].file).localeCompare(String(b[1].file)) || (a[1].ord || 0) - (b[1].ord || 0));
  return out.map(x => x[1]);
}
function memGroups(entries) {
  const groups = [], idx = {};
  for (const e of entries) {
    const k = e.file + "\n" + (e.heading || "");
    if (!(k in idx)) { idx[k] = groups.length; groups.push({file: e.file, heading: e.heading || "", entries: []}); }
    groups[idx[k]].entries.push(e);
  }
  return groups;
}
function memEntriesHtml() {
  const d = memData();
  if (!d) return "";
  const q = S.mem.q.trim();
  let entries = d.entries || [];
  if (S.mem.file) entries = entries.filter(e => e.file === S.mem.file);
  if (q) entries = memSearch(entries, q);
  const groups = memGroups(entries);
  if (!groups.length) return `<p class="hint">${q ? "Nothing matches." : "No entries in this file yet."}</p>`;
  return groups.slice(0, 200).map(g => {
    const key = g.file + "\n" + g.heading, editing = S.mem.edit === key;
    return `<section class="mem-group" aria-label="${esc(g.file)} ${esc(g.heading)}">
      <div class="row" style="margin:0"><code class="mem-file">${esc(g.file)}</code>${g.heading ? `<b class="mem-head">${esc(g.heading)}</b>` : ""}<span class="grow"></span>
        <span class="hint" style="margin:0">${g.entries.length} entr${g.entries.length === 1 ? "y" : "ies"}</span>
        ${g.heading ? `<button class="act" type="button" data-act="m-edit" data-file="${esc(g.file)}" data-heading="${esc(g.heading)}" title="Replace this heading's body (a coordinator commit)">Edit</button>` : ""}</div>
      ${editing ? `<form class="mem-editform" data-file="${esc(g.file)}" data-heading="${esc(g.heading)}">
          <textarea name="text" rows="${clamp(g.entries.length + 2, 3, 14)}" maxlength="4000" required>${esc(g.entries.map(e => e.text).join("\n"))}</textarea>
          <div class="row" style="margin:6px 0 0"><button class="act primary" type="submit">Save (commit)</button><button class="act" type="button" data-act="m-edit-cancel">Cancel</button>
          <span class="hint" style="margin:0">Replaces everything under <b>${esc(g.heading)}</b> in ${esc(g.file)}.</span></div></form>`
        : `<ul class="mem-list">${g.entries.map(e => `<li>${e.text && e.text.startsWith("|") ? `<code>${esc(e.text)}</code>` : esc(String(e.text || "").replace(/^(?:[-*+]|\d+[.)])\s+/, ""))}${(e.tags || []).length ? `<span class="mem-tags">${e.tags.slice(0, 8).map(t => `<span>${esc(t)}</span>`).join("")}</span>` : ""}</li>`).join("")}</ul>`}
    </section>`;
  }).join("") + (groups.length > 200 ? `<p class="hint">${groups.length - 200} more headings; narrow the search.</p>` : "");
}
function memSlicesHtml(d) {
  const slices = (d && d.slices) || [];
  if (!slices.length) return `<p class="hint">No session has received a slice yet.</p>`;
  return `<table class="mem-table"><thead><tr><th>Session</th><th>Task</th><th>Role · track</th><th>State</th><th>Entries</th><th>Tokens</th><th>Prompts</th><th>Last sent</th></tr></thead><tbody>
    ${slices.map(s => { const open = !!S.mem.open[s.session_id]; return `<tr class="${s.live ? "live" : ""}">
      <td><button class="act" type="button" data-act="m-slice" data-sid="${esc(s.session_id)}" aria-expanded="${open}" title="Show the entries this session got"><code>${esc((s.session_id || "").slice(0, 12))}</code> ${open ? "▴" : "▾"}</button></td>
      <td>${esc(s.task_id)}</td><td>${esc(s.role)}${s.track ? ` · ${esc(s.track)}` : ""}</td>
      <td>${s.live ? `<span class="pill info">live</span>` : `<span class="pill">${esc(s.status || "ended")}</span>`}</td>
      <td>${(s.entries || []).length}</td><td>${s.tokens} / ${s.budget}</td><td>${s.prompts}</td><td class="hint">${esc(when(s.ts))}</td></tr>
      ${open ? `<tr><td colspan="8"><ul class="mem-list small">${(s.entries || []).map(e => `<li><code>${esc(e.file)}</code> ${esc(e.heading)} <span class="hint" style="margin:0">${esc(e.why || "")}</span></li>`).join("") || "<li class='hint'>empty slice</li>"}</ul></td></tr>` : ""}`; }).join("")}
  </tbody></table>`;
}
function memNotesHtml(d) {
  const notes = (d && d.notes) || [];
  if (!notes.length) return `<p class="hint">No MEMORY_NOTE lines or chat edits recorded yet.</p>`;
  return `<ul class="mem-list">${notes.map(n => `<li><span class="pill ${n.status === "committed" ? "ok" : n.status === "rejected" ? "bad" : ""}">${esc(n.status)}</span> <code>${esc(n.file)}</code> ${esc(n.heading)} <span class="hint" style="margin:0">${esc(n.task_id || "")} ${esc(n.actor || "")} ${esc(when(n.ts))}${n.detail ? " · " + esc(n.detail) : ""}${n.sha ? " · " + esc(String(n.sha).slice(0, 12)) : ""}</span></li>`).join("")}</ul>`;
}
async function renderMemory() {
  const el = $("#v-memory");
  if (!S.mem.data) {
    el.innerHTML = `<p class="hint">Loading the project memory…</p>`;
    try { await loadMemory(); } catch (e) { el.innerHTML = `<p class="hint">${esc(e.message)}</p>`; return; }
  }
  const projects = (S.ov && S.ov.projects) || [];
  const snap = S.mem.data.snapshot, d = memData();
  const files = (d && d.files) || [];
  const known = files.map(f => f.file);
  const fileOptions = [...MEM_FIXED, ...known.filter(f => !MEM_FIXED.includes(f))];
  el.innerHTML = `
    <div class="row" style="margin-top:12px"><label class="fld" for="m-project">Project</label>
      <select id="m-project" data-act="m-project">${projects.map(p => `<option ${p === S.mem.project ? "selected" : ""}>${esc(p)}</option>`).join("") || "<option value=''>none reported</option>"}</select>
      ${d ? `<span class="hint" style="margin:0"><code>${esc(d.dir || "docs/memory")}</code> · ${(d.entries || []).length} entries in ${files.length} files · reported ${esc(when(snap.source_ts))}${d.enabled === false ? " · <b>memory is off</b>" : ""}</span>` : ""}
      <span class="grow"></span><button class="act" type="button" data-act="m-refresh">Refresh</button></div>
    ${!d ? `<div class="banner"><b>No memory reported for ${esc(S.mem.project || "this project")}.</b> ${esc(S.mem.data.note || "")} Create the layout on the workstation with <code>python -m foundry_coordinator memory init ${esc(S.mem.project)}</code> (and <code>memory import-state</code> once to fold STATE.md in); the coordinator reports it at its next tick.</div>` : ""}
    <div class="mem-wrap">
      <aside class="mem-side">
        <ul class="mem-files" role="listbox" aria-label="Memory files">
          <li><button type="button" role="option" class="chat-th${!S.mem.file ? " on" : ""}" aria-selected="${!S.mem.file}" data-act="m-file" data-file=""><span class="t">All files</span><span class="hint" style="margin:0">${(d && d.entries || []).length} entries</span></button></li>
          ${files.map(f => `<li><button type="button" role="option" class="chat-th${f.file === S.mem.file ? " on" : ""}" aria-selected="${f.file === S.mem.file}" data-act="m-file" data-file="${esc(f.file)}"><span class="t">${esc(f.file)}</span><span class="hint" style="margin:0">${f.entries} entr${f.entries === 1 ? "y" : "ies"}</span></button></li>`).join("")}
        </ul>
        <form id="mem-add" class="mem-add" autocomplete="off">
          <h3 style="margin:0 0 6px">Add a fact</h3>
          <label class="fld" for="mem-add-file">File</label>
          <select id="mem-add-file" name="file">${fileOptions.map(f => `<option ${f === (S.mem.file || "DECISIONS.md") ? "selected" : ""}>${esc(f)}</option>`).join("")}<option value="__other">sprints/&lt;ID&gt;.md or tracks/&lt;name&gt;.md…</option></select>
          <input id="mem-add-custom" name="custom" placeholder="sprints/UI-02b.md" hidden spellcheck="false">
          <label class="fld" for="mem-add-heading">Heading</label>
          <input id="mem-add-heading" name="heading" maxlength="120" required placeholder="Studio: gate order" spellcheck="false">
          <label class="fld" for="mem-add-text">Text</label>
          <textarea id="mem-add-text" name="text" rows="4" maxlength="4000" required placeholder="One or two sentences, or a | table | row | for ASSETS.md"></textarea>
          <div class="row" style="margin:6px 0 0"><button class="act primary" type="submit" ${!d || S.mem.busy ? "disabled" : ""}>Add (commit)</button><span class="hint" id="mem-add-msg" style="margin:0"></span></div>
          <p class="hint">The coordinator validates it (known file, size, no secrets), appends it under the heading and commits it to the game repo; a new heading goes at the end of the file.</p>
        </form>
      </aside>
      <section class="mem-main">
        <div class="row" style="margin:0 0 8px"><label class="sr-only" for="mem-q">Search memory</label><input id="mem-q" type="search" placeholder="Search memory (words in headings, tags and text)…" value="${esc(S.mem.q)}" style="flex:1;min-width:160px" ${!d ? "disabled" : ""}><span class="hint" id="mem-count" style="margin:0"></span></div>
        <div id="mem-entries">${memEntriesHtml()}</div>
        <h3>Slices sent to sessions</h3>
        <p class="hint" style="margin-top:0">What each session got in its prompt: the entries matching its sprint's files, needs and track plus the latest decisions, within the token budget. A later prompt to the same session carries only entries that changed.</p>
        ${memSlicesHtml(d)}
        <h3>Recent notes</h3>
        ${memNotesHtml(d)}
      </section>
    </div>`;
  memCount();
}
function memCount() { const c = $("#mem-count"); if (c) c.textContent = $$("#mem-entries .mem-group").length + " heading(s) shown"; }
const memSearchSoon = debounce(() => { const i = $("#mem-q"); if (!i) return; S.mem.q = i.value; const box = $("#mem-entries"); if (box) box.innerHTML = memEntriesHtml(); memCount(); }, 200);
async function memAction(kind, file, heading, text, msgEl) {
  if (S.mem.busy) return;
  S.mem.busy = true;
  const say = t => { if (msgEl) msgEl.textContent = t; };
  try {
    say("Sending to the coordinator…");
    const r = await api("actions", {method: "POST", body: {kind, project_id: S.mem.project, file, heading, text, idempotency_key: idem()}});
    let a = r;
    for (let i = 0; i < 12 && !["applied", "rejected", "failed", "expired", "cancelled"].includes(a.status); i++) {
      say(`${r.summary}: ${a.status}…`);
      await new Promise(res => setTimeout(res, 1500));
      a = await api("actions/" + encodeURIComponent(r.action_id));
    }
    const ok = a.status === "applied";
    toast(`${r.summary}: ${a.status}${a.status_detail ? " — " + a.status_detail : ""}`, !ok && a.status !== "accepted" && a.status !== "claimed", ok ? 5000 : 9000);
    if (!["applied", "rejected", "failed"].includes(a.status)) toast("The coordinator has not applied it yet (is it running with --control?). The Memory tab refreshes when it does.", true, 9000);
    return ok;
  } catch (e) { toast(e.message, true); return false; }
  finally { S.mem.busy = false; S.mem.edit = null; S.mem.data = null; renderMemory(); }
}
$("#v-memory").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "m-refresh") { S.mem.data = null; S.ov = null; renderMemory(); }
  else if (a === "m-file") { S.mem.file = b.dataset.file || ""; S.mem.edit = null; renderMemory(); }
  else if (a === "m-edit") { S.mem.edit = b.dataset.file + "\n" + b.dataset.heading; const box = $("#mem-entries"); box.innerHTML = memEntriesHtml(); const t = $(".mem-editform textarea", box); if (t) t.focus(); }
  else if (a === "m-edit-cancel") { S.mem.edit = null; $("#mem-entries").innerHTML = memEntriesHtml(); }
  else if (a === "m-slice") { S.mem.open[b.dataset.sid] = !S.mem.open[b.dataset.sid]; renderMemory(); }
});
$("#v-memory").addEventListener("change", e => {
  if (e.target.id === "m-project") { S.mem.project = e.target.value; store("fr.auto.memproject", S.mem.project); S.mem.file = ""; S.mem.data = null; renderMemory(); }
  else if (e.target.id === "mem-add-file") { const c = $("#mem-add-custom"); c.hidden = e.target.value !== "__other"; if (!c.hidden) c.focus(); }
});
$("#v-memory").addEventListener("input", e => { if (e.target.id === "mem-q") memSearchSoon(); });
$("#v-memory").addEventListener("submit", async e => {
  const f = e.target; e.preventDefault();
  if (f.id === "mem-add") {
    const fd = new FormData(f);
    let file = fd.get("file") === "__other" ? String(fd.get("custom") || "").trim() : String(fd.get("file"));
    if (!MEM_FILE_RE.test(file)) { toast("File must be DECISIONS.md, CONVENTIONS.md, KNOWN_ISSUES.md, ASSETS.md, sprints/<ID>.md or tracks/<name>.md", true); return; }
    const ok = await memAction("memory_add", file, String(fd.get("heading")).trim(), String(fd.get("text")).trim(), $("#mem-add-msg"));
    if (ok) f.reset();
  } else if (f.classList.contains("mem-editform")) {
    await memAction("memory_edit", f.dataset.file, f.dataset.heading, String(new FormData(f).get("text")).trim(), null);
  }
});

/* ======================================================================== boot */
async function reload() {
  S.loadError = "";
  try { await C1.load(); }
  catch (e) { S.loadError = e.message; renderNotes(); throw e; }
  S.schema = null; S._fields = null;
  try { await ensureSchema(); } catch (e) { toast("Settings schema not readable: " + e.message, true); }
  const hd = ((S.schema || {}).role_rules || {}).hard_denies;
  if (hd) for (const d of [S.deployed, S.draft]) if (d) d.hard_denies = clone(hd);
  S.draftErrors = [];
  if (S.draft) {   // the stored draft's own validation, so problems show before the next edit
    try { S.draftErrors = ((await adminApi(AP(S.cfgProject) + "/validate", {method: "POST", body: {}})).errors) || []; } catch (e) {}
  }
  await refreshChanges();
  renderView();
  refreshDry(); refreshWarnings();
}
async function boot() {
  try { const s = await api("session"); S.csrf = s.csrf; S.me = s; }
  catch (e) { if (e.status === 401) return showLogin(); toast(e.message, true); return; }
  $("#who").textContent = "Signed in as " + (S.me.actor || "?");
  $("#login").classList.remove("show");
  await refreshUsage();
  // settings and rules are per project: the first reported one unless picked
  try { const ov = await api("overview?hours=720"); S.ovProjects = ov.projects || []; } catch (e) { S.ovProjects = []; }
  try { await reload(); } catch (e) { $("#v-" + S.view).innerHTML = `<p class="hint">Could not load the settings: ${esc(e.message)}</p>`; }
  setView(location.hash.slice(1) || "routing", false);
  // background refreshes never repaint a view the operator is typing or tabbing in
  const busy = id => $("#" + id).contains(document.activeElement) || !$("#modal").hidden;
  setInterval(async () => { if (document.hidden) return; await refreshUsage(); if (S.view === "routing" && !busy("v-routing")) { renderRouting(); refreshDry(); } }, 60000);
  setInterval(() => { if (!document.hidden && S.view === "queue" && !busy("v-queue")) { S.queue = null; renderQueue(); } }, 20000);
  setInterval(() => { if (!document.hidden && S.view === "services" && !busy("v-services")) { S.svc = null; renderServices(); } }, 20000);
  setInterval(() => { if (!document.hidden && S.view === "memory" && !busy("v-memory") && !S.mem.busy && !S.mem.edit) { S.mem.data = null; renderMemory(); } }, 30000);
}
boot();
</script>
