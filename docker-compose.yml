# Foundry Router — primary way to run this service.
#
# SECURITY POSTURE (design doc §1/§2): built for internal/private-network use.
# The port mapping below binds to all host interfaces by default because most
# homelab hosts sit entirely on a LAN. If this host has ANY internet-facing
# interface, pin the mapping to the LAN IP instead, e.g.:
#     - "192.168.1.50:11435:11435"
# There is no auth on the API or admin UI — do not expose it to the internet.

services:
  foundry-router:
    build: .
    image: foundry-router:latest
    container_name: foundry-router
    restart: unless-stopped
    ports:
      - "${FOUNDRY_PORT:-11435}:11435"
      # the HTTPS listener for secret traffic (Access → Secrets → Transport; off until you
      # turn it on there and restart). Nothing listens here while it is off.
      - "${FOUNDRY_TLS_PORT:-11436}:11436"
    volumes:
      # Both mounts are load-bearing: config.yaml and the SQLite DB must
      # survive `docker compose down && up` and image rebuilds.
      # The router installer (install/router.sh) keeps them outside the checkout:
      # FOUNDRY_CONFIG_DIR / FOUNDRY_DATA_DIR_HOST in .env (default: next to this file).
      - ${FOUNDRY_CONFIG_DIR:-./config}:/config
      - ${FOUNDRY_DATA_DIR_HOST:-./data}:/data
    environment:
      - MERIDIAN_API_KEY=${MERIDIAN_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LITELLM_KEY=${LITELLM_KEY:-}
    # The container needs LAN access to your Ollama instances and Meridian;
    # default bridge networking is fine as long as those are reachable by IP
    # or resolvable hostname from inside the container.

  # Embeddings on CPU (v0.181.121). A small Ollama that only serves an embedding
  # model, for /v1/embeddings and /api/embed (document search, Open WebUI knowledge,
  # the semantic cache). No GPU is requested, so it runs on the CPU; move it to a GPU
  # host later by changing the backend's URL in Backends -> Pool.
  #   1. docker compose up -d            (starts this next to the router)
  #   2. Backends -> Pool: add  {"name": "embeddings", "type": "ollama",
  #                              "url": "http://embeddings:11434", "priority": 50}
  #   3. Backends -> Host Admin: pull  nomic-embed-text  on "embeddings" (about 275 MB)
  embeddings:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    container_name: foundry-embeddings
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ${FOUNDRY_EMBEDDINGS_DIR:-./embeddings}:/root/.ollama
