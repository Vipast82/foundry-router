[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-router"
dynamic = ["version"]
description = "Self-hosted agentic LLM routing middleware: Ollama-compatible facade, local-first routing brain, Claude via Meridian, dynamic tool sync."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
    "PyYAML>=6.0,<7.0",
    "langgraph>=0.2",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# Foundry Client (tray + stack manager, docs/CLIENT_MANAGER.md)
client = ["keyring>=25", "pystray>=0.19", "pillow>=10", "tomli-w>=1.0", "msgpack>=1.0", "psutil>=5.9"]

[tool.setuptools.dynamic]
version = { attr = "foundry_router.__version__" }

[tool.setuptools.packages.find]
include = ["foundry_router*", "foundry_coordinator*", "foundry_training*", "foundry_automation*"]

[project.scripts]
foundry-coordinator = "foundry_coordinator.cli:main"
foundry-training = "foundry_training.cli:main"
foundry-client = "foundry_client.__main__:main"

[tool.setuptools.package-data]
"foundry_router" = ["schema.sql", "ui/static/*"]
"foundry_client" = ["static/*"]
"foundry_coordinator" = ["projects/*/*.toml", "projects/*/*.md", "projects/*/kilo_skills/*/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
