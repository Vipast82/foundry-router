# The test suite on Linux (docs/plans/LINUX_WORKSTATION_PLAN.md W1): Foundry is developed on
# Windows, and this keeps the router, coordinator and client working on Linux too, for a Linux
# main workstation. Weekly and on demand (Actions → Tests on Linux → Run workflow), not on every
# push: the suite takes ~10 minutes.
name: Tests on Linux

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 6 * * 1"          # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ".[client]"
      - name: Tests
        run: python -m pytest -q -n auto tests
