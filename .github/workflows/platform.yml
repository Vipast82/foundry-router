# The platform layer on both OSes (docs/DISTRIBUTED_FOUNDRY.md §7.1, phase a): foundry_platform,
# `foundry-client doctor --platform`, and the two coding clients the slot image pins (Kilo and
# OpenCode, the same versions and integrity as contrib/studio-slot/Dockerfile). Fast (~3 min a
# job), so it runs on every push that touches these files. The whole suite on Linux stays in
# tests-linux.yml (weekly).
name: Platform (Linux + Windows)

on:
  workflow_dispatch: {}
  push:
    branches: [main, cline]
    paths:
      - "foundry_platform/**"
      - "foundry_client/**"
      - "foundry_coordinator/**"
      - "tests/platform_layer/**"
      - "tests/client/test_doctor_platform.py"
      - "tests/client/test_lane_agent.py"
      - "tests/coordinator/test_remote_workspace.py"
      - "tests/coordinator/test_lane_tunnel.py"
      - "tests/coordinator/test_lane_clients.py"
      - "tests/test_lane_keys.py"
      - "tests/coordinator/test_lane_fetch.py"
      - "tests/coordinator/test_lane_b3.py"
      - "tests/coordinator/test_lane_track.py"
      - "contrib/studio-slot/**"
      - "foundry_training/**"
      - "foundry_router/lane_keys.py"
      - "foundry_router/machines.py"
      - "foundry_router/secrets_api.py"
      - "contrib/studio-slot/Dockerfile"
      - ".github/workflows/platform.yml"
  pull_request:
    paths:
      - "foundry_platform/**"
      - "foundry_client/**"
      - "foundry_coordinator/**"
      - "tests/platform_layer/**"
      - "contrib/studio-slot/Dockerfile"
      - ".github/workflows/platform.yml"

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # the router's data folder defaults to /data (its Docker volume), which a Linux runner may
    # not create; Windows made C:\data. The router's own tests need it writable.
    env:
      FOUNDRY_DATA_DIR: ${{ runner.temp }}/foundry-data
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.0"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ".[client]"
      - name: Platform tests
        run: python -m pytest -q tests/platform_layer tests/client/test_doctor_platform.py
      # Distributed Foundry phase b: the lane agent, RemoteWorkspace, the tunnel, slot clients
      # and the router's lane keys, on both OSes (paths, locks, git and processes differ)
      - name: Lane tests
        run: >-
          python -m pytest -q --junitxml=lane-junit.xml tests/client/test_lane_agent.py
          tests/coordinator/test_remote_workspace.py tests/coordinator/test_lane_tunnel.py
          tests/coordinator/test_lane_clients.py tests/test_lane_keys.py
          tests/coordinator/test_lane_fetch.py tests/coordinator/test_lane_b3.py
          tests/coordinator/test_lane_track.py
      # each failing test as an annotation: readable from the public checks API without a
      # sign-in (job logs need one), so a failure on one OS can be read from the workstation
      - name: Failures as annotations
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse("lane-junit.xml").iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  text = (bad.get("message") or "") + " | " + (bad.text or "")[-1500:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
          PY
      - name: Both coding clients (versions and integrity from the slot Dockerfile)
        run: |
          df=contrib/studio-slot/Dockerfile
          arg() { sed -n "s/^ARG $1=//p" "$df" | tr -d '\r'; }    # CRLF on the Windows checkout
          kv=$(arg KILO_VERSION); ki=$(arg KILO_INTEGRITY)
          ov=$(arg OPENCODE_VERSION); oi=$(arg OPENCODE_INTEGRITY)
          test "$(npm view "@kilocode/cli@$kv" dist.integrity)" = "$ki"
          test "$(npm view "@opencode/cli@$ov" dist.integrity)" = "$oi"
          npm install -g "@kilocode/cli@$kv" "@opencode/cli@$ov"
          kilo --version | grep -F "$kv"
          opencode --version | grep -F "$ov"
      - name: doctor --platform
        run: python -m foundry_client doctor --platform
